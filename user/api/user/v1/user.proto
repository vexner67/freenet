  int64 votes = 1;
  // What the vouchers promise.
  int64 outstanding = 5;
  // The daily bonus.
  int64 bonus = 6;
  // The votes on the accounts of the pages.
  int64 held = 8;
  // The fee of a transfer, the tax of a sale of a sticker pack and the
  // same with Prime, in percent.
  int32 transfer_fee = 9;
  int32 sticker_tax = 10;
  int32 prime_sticker_tax = 11;
}

