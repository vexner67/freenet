  string ore = 1;
}

message DigOreResponse {
  // The units of ore dug.
  int64 units = 1;
  // "", "nugget", "chest", "collapse" or "drink".
  string event = 2;
  // The votes of a chest and the balance after them; 0 without one.
  int64 votes = 3;
  int64 balance = 4;
  // The experience the dig gave.
  int64 experience = 5;
  MineState mine = 6;
}

message SellOreRequest {
  // Empty: every ore.
  string ore = 1;
}

message SellOreResponse {
  int64 units = 1;
  int64 votes = 2;
  int64 balance = 3;
  MineState mine = 4;
}

