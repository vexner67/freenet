}

// How the site is dressed for the New Year.
enum Decor {
  DECOR_UNSPECIFIED = 0;
  // By the calendar: from December 15 to January 14.
  DECOR_AUTO = 1;
  DECOR_ON = 2;
  DECOR_OFF = 3;
}

message GetDecorRequest {}

message GetDecorResponse {
  Decor decor = 1;
  // Whether the site wears the decoration now.
