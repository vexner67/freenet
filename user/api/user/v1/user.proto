  int64 kopecks = 1;
}

message GetTreasuryRequest {}

message GetTreasuryResponse {
  reserved 2, 3, 4, 7;
  reserved "reserve", "free", "minted", "max_win";

  // What the treasury has taken more than paid since it was made: it has
