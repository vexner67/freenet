// How the site is dressed for the New Year.
enum Decor {
  DECOR_UNSPECIFIED = 0;
  // By the calendar: from December 15 to January 14.
  DECOR_AUTO = 1;
  DECOR_ON = 2;
  DECOR_OFF = 3;
}

message GetDecorRequest {}

message GetDecorResponse {
  Decor decor = 1;
  // Whether the site wears the decoration now.
  bool festive = 2;
}

message SetDecorRequest {
  Decor decor = 1;
}

// A prize of the casino, in votes (0 — nothing), and its weight among the
// weights of all prizes: how likely it is.
message CasinoPrize {
  int64 votes = 1;
  int32 weight = 2;
}

message GetCasinoRequest {}

message GetCasinoResponse {
  // What a spin costs, in votes.
  int64 price = 1;
  // The votes of each prize, in the order of the prizes.
  repeated int64 prizes = 2;
  // The bets: from bet_least to bet_most votes on one of the multipliers,
  // each with its chance of 10000.
  int64 bet_least = 3;
  int64 bet_most = 4;
  reserved 5, 6;
  reserved "bet_return", "multipliers";
  repeated AimMultiplier aim = 7;
  // "Ракетка": its limits and its top, without the return.
  CasinoRocket rocket = 8;
}

// AimMultiplier is a multiplier of the bets, in hundredths (200 — ×2), and
// the chance of 10000 it wins with.
message AimMultiplier {
  int32 multiplier = 1;
  int32 chance = 2;
}

message GetCasinoSettingsRequest {}

message GetCasinoSettingsResponse {
  int64 price = 1;
  repeated CasinoPrize prizes = 2;
  // How the casino does: spins made, votes spent on them and won.
  int64 spins = 3;
  int64 spent = 4;
  int64 won = 5;
  int64 bet_least = 6;
  int64 bet_most = 7;
  reserved 8, 12;
  reserved "bet_return", "multipliers";
  // How the bets do: bets made, votes bet and won.
  int64 bets = 9;
  int64 bet_spent = 10;
  int64 bet_won = 11;
  // The multipliers a bet may take, with their chances.
  repeated AimMultiplier aim = 13;
  // "Ракетка" with its return, and how its rounds do: rounds launched,
  // votes bet and won.
  CasinoRocket rocket = 14;
  int64 rockets = 15;
  int64 rocket_spent = 16;
  int64 rocket_won = 17;
}

// CasinoRocket is "Ракетка": bets from least to most votes, the return in
// hundredths of a percent (9500 — 95%; 0 in GetCasino, which does not tell
// it) and the top multiplier in hundredths (100000 — ×1000).
message CasinoRocket {
  int64 least = 1;
  int64 most = 2;
  int32 return = 3;
  int32 top = 4;
}

message SetCasinoRocketRequest {
  CasinoRocket rocket = 1;
}

message LaunchRocketRequest {
  int64 amount = 1;
  // The multiplier to cash at by itself, in hundredths; 0 — by hand.
  int32 auto = 2;
}

message RocketRequest {
  string rocket_id = 1;
}

enum RocketState {
  ROCKET_STATE_UNSPECIFIED = 0;
  ROCKET_STATE_FLYING = 1;
  ROCKET_STATE_CASHED = 2;
  ROCKET_STATE_CRASHED = 3;
}

// RocketRound is a round of "Ракетка" as its player sees it.
message RocketRound {
  string id = 1;
  int64 amount = 2;
  // The multiplier the round cashes at by itself, 0 — by hand.
  int32 auto = 3;
  RocketState state = 4;
  // The multiplier the round was cashed at and what it paid; 0 — nothing.
  int32 cashed = 5;
  int64 payout = 6;
  // The crash point, in hundredths, once the round is over; 0 while it
  // flies.
  int32 crash = 7;
  // How long the rocket has flown, by the clock of the server.
  int64 elapsed_ms = 8;
  // The balance after the launch or the cash; 0 from GetRocket.
  int64 balance = 9;
}

message SetCasinoRequest {
  int64 price = 1;
  repeated CasinoPrize prizes = 2;
}

message SpinCasinoRequest {}

message SpinCasinoResponse {
  // The index of the prize won.
  int32 prize = 1;
  // The votes it won.
  int64 votes = 2;
  // The balance after the spin.
  int64 balance = 3;
}

message SetCasinoBetsRequest {
  int64 least = 1;
  int64 most = 2;
  reserved 3;
  reserved "return";
  // 1 to 10 multipliers, each once.
  repeated AimMultiplier aim = 4;
}

message BetCasinoRequest {
  int64 amount = 1;
  // In hundredths: 200 — ×2.
  int32 multiplier = 2;
}

message BetCasinoResponse {
  bool won = 1;
  // The roll and the chance, both of 10000: the bet wins when the roll
  // falls in the middle, chance wide — from (10000 - chance) / 2.
  int32 roll = 2;
  int32 chance = 3;
  // The votes it won: the bet multiplied, or 0.
  int64 votes = 4;
  // The balance after the bet.
  int64 balance = 5;
}

message BetOutcome {
  string name = 1;
  // The votes staked on it and how many people staked.
  int64 staked = 2;
  int32 bettors = 3;
  // The votes the caller staked on it.
  int64 mine = 4;
  // The odds of the outcome, in hundredths (250 — ×2.5); 0 for an event
  // without odds, where those who guessed share the stakes.
  int32 odds = 5;
  // What the stakes of the caller on it pay if it wins.
  int64 potential = 6;
}

message BetEvent {
  string id = 1;
  string question = 2;
  repeated BetOutcome outcomes = 3;
  // "open", "closed", "resolved" or "cancelled".
  string state = 4;
  // When the stakes close by themselves; unset for never.
  google.protobuf.Timestamp closes_at = 5;
  // The index of the winning outcome of a resolved event, -1 otherwise.
  int32 winner = 6;
  google.protobuf.Timestamp created_at = 7;
  // Whether the event takes stakes now.
  bool open = 8;
  // How many people staked on any outcome.
  int32 people = 9;
  // What the stakes of the caller paid back once the event was over.
  int64 payout = 10;
}

message ListBetEventsRequest {
  // The events taking stakes, the most staked on first; otherwise all of
  // them, those not over first, then the newest.
  bool popular = 1;
}

message ListBetEventsResponse {
  repeated BetEvent events = 1;
}

message CreateBetEventRequest {
  string question = 1;
  repeated string outcomes = 2;
  // Unset for stakes until the administrators close them.
  google.protobuf.Timestamp closes_at = 3;
  // The odds of each outcome, in hundredths, 101 to 100000.
  repeated int32 odds = 4;
}

message SetBetEventOddsRequest {
  string event_id = 1;
