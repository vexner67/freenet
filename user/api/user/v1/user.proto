// A prize of the casino, in votes (0 — nothing), and its weight among the
// weights of all prizes: how likely it is.
message CasinoPrize {
  int64 votes = 1;
  int32 weight = 2;
}

message GetCasinoRequest {}

message GetCasinoResponse {
  // What a spin costs, in votes.
  int64 price = 1;
  // The votes of each prize, in the order of the prizes.
  repeated int64 prizes = 2;
  // The bets: from bet_least to bet_most votes on one of the multipliers,
  // each with its chance of 10000.
  int64 bet_least = 3;
  int64 bet_most = 4;
  reserved 5, 6;
  reserved "bet_return", "multipliers";
  repeated AimMultiplier aim = 7;
  // "Ракетка": its limits and its top, without the return.
  CasinoRocket rocket = 8;
  // The least win shown as a jackpot.
  int64 jackpot = 9;
}

// AimMultiplier is a multiplier of the bets, in hundredths (200 — ×2), and
// the chance of 10000 it wins with.
message AimMultiplier {
  int32 multiplier = 1;
  int32 chance = 2;
}

message GetCasinoSettingsRequest {}

message GetCasinoSettingsResponse {
  int64 price = 1;
  repeated CasinoPrize prizes = 2;
  // How the casino does: spins made, votes spent on them and won.
  int64 spins = 3;
  int64 spent = 4;
  int64 won = 5;
  int64 bet_least = 6;
  int64 bet_most = 7;
  reserved 8, 12;
  reserved "bet_return", "multipliers";
  // How the bets do: bets made, votes bet and won.
  int64 bets = 9;
  int64 bet_spent = 10;
  int64 bet_won = 11;
  // The multipliers a bet may take, with their chances.
  repeated AimMultiplier aim = 13;
  // "Ракетка" with its return, and how its rounds do: rounds launched,
  // votes bet and won.
  CasinoRocket rocket = 14;
  int64 rockets = 15;
  int64 rocket_spent = 16;
  int64 rocket_won = 17;
  int64 jackpot = 18;
}

// CasinoRocket is "Ракетка": bets from least to most votes, the return in
// hundredths of a percent (9500 — 95%; 0 in GetCasino, which does not tell
// it) and the top multiplier in hundredths (100000 — ×1000).
message CasinoRocket {
  int64 least = 1;
  int64 most = 2;
  int32 return = 3;
  int32 top = 4;
}

message SetCasinoRocketRequest {
  CasinoRocket rocket = 1;
}

message SetCasinoJackpotRequest {
  // 1-1000 votes.
  int64 jackpot = 1;
}

message LaunchRocketRequest {
  int64 amount = 1;
  // The multiplier to cash at by itself, in hundredths; 0 — by hand.
  int32 auto = 2;
}

message RocketRequest {
  string rocket_id = 1;
}

enum RocketState {
  ROCKET_STATE_UNSPECIFIED = 0;
  ROCKET_STATE_FLYING = 1;
  ROCKET_STATE_CASHED = 2;
  ROCKET_STATE_CRASHED = 3;
}

// RocketRound is a round of "Ракетка" as its player sees it.
message RocketRound {
  string id = 1;
  int64 amount = 2;
  // The multiplier the round cashes at by itself, 0 — by hand.
  int32 auto = 3;
  RocketState state = 4;
  // The multiplier the round was cashed at and what it paid; 0 — nothing.
  int32 cashed = 5;
  int64 payout = 6;
  // The crash point, in hundredths, once the round is over; 0 while it
  // flies.
  int32 crash = 7;
  // How long the rocket has flown, by the clock of the server.
  int64 elapsed_ms = 8;
  // The balance after the launch or the cash; 0 from GetRocket.
  int64 balance = 9;
}

// Poker is the table of "Покер": antes from least to most votes and the
// pays of the ante to one by the hand of the player — straight, flush, full
// house, four of a kind, straight flush, royal flush.
message Poker {
  int64 least = 1;
  int64 most = 2;
  repeated int32 pays = 3;
}

message GetPokerRequest {}

message PokerTable {
  Poker poker = 1;
  // The hand of the caller waiting for the call or the fold; none without.
  PokerHand dealt = 2;
}

message DealPokerRequest {
  int64 ante = 1;
}

message PokerHandRequest {
  string hand_id = 1;
}

enum PokerState {
  POKER_STATE_UNSPECIFIED = 0;
  POKER_STATE_DEALT = 1;
  POKER_STATE_FOLDED = 2;
  POKER_STATE_WON = 3;
  POKER_STATE_LOST = 4;
  POKER_STATE_TIED = 5;
  // Won as the dealer did not qualify: the ante paid, the call back.
  POKER_STATE_UNQUALIFIED = 6;
}

// PokerHand is a hand of "Покер" as its player sees it; cards are "As",
// "Td" — the rank of 23456789TJQKA and the suit of shdc.
message PokerHand {
  string id = 1;
  int64 ante = 2;
  PokerState state = 3;
  repeated string player = 4;
  // The flop until the call, all five after.
  repeated string board = 5;
  // Empty until the call.
  repeated string dealer = 6;
  // What the hand paid back, the bets included; 0 — nothing.
  int64 payout = 7;
  // The best hands: "high_card", "pair", "two_pair", "three", "straight",
  // "flush", "full_house", "four", "straight_flush", "royal_flush"; the
  // dealer's once open.
  string player_hand = 8;
  string dealer_hand = 9;
  // The five cards of the best hand of the player and of the dealer.
  repeated string player_best = 10;
  repeated string dealer_best = 11;
  // The balance after the deal, the fold or the call.
  int64 balance = 12;
}

message GetPokerSettingsRequest {}

message GetPokerSettingsResponse {
  Poker poker = 1;
  int64 hands = 2;
  int64 spent = 3;
  int64 won = 4;
}

message SetPokerSettingsRequest {
  Poker poker = 1;
}

