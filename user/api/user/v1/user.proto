  // How many accounts have used it.
  int32 activations = 6;
}

message CreateVoucherRequest {
  // Empty for a generated serial number.
  string token = 1;
  // 0-100000000 votes and 0-1000 of rating, not both zero.
  int64 votes = 2;
  int32 rating = 3;
  // How many accounts may use it: 1-1000000, or -1 for any number.
  int32 usages = 4;
}

message CreateVoucherResponse {
  Voucher voucher = 1;
}

message ListVouchersRequest {
  // Empty for the newest vouchers, else next_cursor of the previous page.
