  string attacker_id = 2;
  string defender_id = 3;
  google.protobuf.Timestamp fought_at = 4;
  PetFighter attacker = 5;
  PetFighter defender = 6;
  repeated PetHit hits = 7;
  bool won = 8;
  // The rating the attacker won (above zero) or lost.
  int32 rating = 9;
}

message FightPetRequest {
  // Empty: a pet of a near rating.
  string nickname = 1;
  // The pet of the caller that fights.
  string pet_id = 2;
}

message FightPetResponse {
  PetFight fight = 1;
  Pet pet = 2;
  // The votes after a won fight, 0 after a lost one.
  int64 balance = 3;
}

message ListPetFightsRequest {}

message ListPetFightsResponse {
  repeated PetFight fights = 1;
}

message GetPetSettingsRequest {}

message GetPetSettingsResponse {
  PetShop shop = 1;
  int64 pets = 2;
  int64 fights = 3;
  int64 spent = 4;
  int64 won = 5;
}

message SetPetSettingsRequest {
  PetShop shop = 1;
}

message GetUserFirmsRequest {
  string nickname = 1;
}

// UserFirm is an enterprise as the profile of a shareholder shows it: the
// shares of the page of all, and whether it directs it.
message UserFirm {
  string id = 1;
  string name = 2;
  string kind = 3;
  int32 level = 4;
  int64 shares = 5;
  int64 total = 6;
  bool director = 7;
}

message GetUserFirmsResponse {
  repeated UserFirm firms = 1;
}

message Title {
  string id = 1;
  string name = 2;
  string icon = 3;
  google.protobuf.Timestamp granted_at = 4;
}

message GetUserTitlesRequest {
  string nickname = 1;
}

message GetUserTitlesResponse {
  repeated Title titles = 1;
}

message GrantTitleRequest {
  string nickname = 1;
  string name = 2;
  string icon = 3;
}

message GrantTitleResponse {
  Title title = 1;
}

message RevokeTitleRequest {
  string title_id = 1;
}
