  int64 balance = 1;
}

message GetCollectibleRequest {
  string gift_id = 1;
}

message GetCollectibleResponse {
  Collectible collectible = 1;
}

// A collectible gift as the caller sees it: who has it, what it is at
// and where it has been.
message Collectible {
  Gift gift = 1;
  // Unset when the site holds it or the page of the owner is gone.
  PublicProfile owner = 2;
  // The site holds it: an edition of the site at an auction.
  bool site = 3;
  // The caller owns it.
  bool mine = 4;
  GiftAuction auction = 5;
  // Newest first, up to 50; only on GetCollectible.
  repeated GiftHistoryLine history = 6;
}

message GiftAuction {
  int64 start = 1;
  // 0 while nobody has bid.
  int64 top_bid = 2;
  // The least bid taken now.
  int64 min_bid = 3;
  int32 bids = 4;
  google.protobuf.Timestamp ends_at = 5;
  // The site sells: an edition of the site.
  bool site = 6;
  PublicProfile seller = 7;
  // Whose bid is on top, unset while nobody has bid.
  PublicProfile bidder = 8;
  // The caller's bid is on top.
  bool mine = 9;
}

message GiftHistoryLine {
  // "upgrade", "mint", "transfer", "sale" or "auction".
  string kind = 1;
  google.protobuf.Timestamp at = 2;
  int64 price = 3;
  // Unset for the site and for erased pages.
  PublicProfile from = 4;
  PublicProfile to = 5;
}

message ListGiftMarketRequest {
