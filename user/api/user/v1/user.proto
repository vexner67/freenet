  // The daily bonus, at least 1 vote.
  int64 bonus = 1;
  // The fees, from 0 to 100 percent.
  int32 transfer_fee = 2;
  int32 sticker_tax = 3;
  int32 prime_sticker_tax = 4;
}

message GetBonusRequest {}

message GetBonusResponse {
  // What the bonus gives now.
  int64 votes = 1;
  // The caller has taken it today.
  bool taken = 2;
  // The caller may take it: a page a week old with a filled profile.
  bool eligible = 3;
}

message ClaimBonusRequest {}

message ClaimBonusResponse {
  int64 votes = 1;
