  repeated GiftTrait symbols = 4;
  // What upgrading a gift and giving a collectible away cost, in votes.
  int64 upgrade_price = 5;
  int64 transfer_price = 6;
}

// A model, a backdrop or a symbol of collectibles.
message GiftTrait {
  string name = 1;
  // The chance of it in tenths of a percent.
  int32 weight = 2;
}

// A shelf of the catalogue ("Коллекции").
message GiftCollection {
  string id = 1;
  // The names of its gifts, in the order they are shown.
  repeated string gifts = 2;
  // What each of them costs the sender, in votes, unless priced
  // otherwise; 0 for a free one.
  int64 price = 3;
  // What each of gifts costs now, in their order: the administrators
  // price a gift apart from its collection.
  repeated int64 prices = 4;
  // Only those with Freenet Prime send its gifts.
  bool prime = 5;
  // How many of each of gifts may ever be sent, 0 for no end, and how
  // many have been, in their order.
  repeated int32 supplies = 6;
  repeated int32 sold = 7;
}

message SendGiftRequest {
  // The recipient; it may be the caller.
  string user_id = 1;
  // A gift of the catalogue.
  string gift = 2;
  // "Ваше сообщение": up to 250 characters, may be empty.
  string caption = 3;
  // "Анонимно": only the recipient is told who sent the gift and what
  // was said with it.
  bool anonymous = 4;
}

message SendGiftResponse {
  Gift gift = 1;
}

// A gift sent to a page, as the caller sees it.
message Gift {
  string id = 1;
  // Its name in the catalogue.
  string gift = 2;
  // Empty when the caller is not told the words of an anonymous gift.
  string caption = 3;
  // Told to those who are told the sender.
  bool anonymous = 4;
  google.protobuf.Timestamp sent_at = 5;
  // Unset when the caller is not told who sent the gift: it is
  // anonymous, or the page of the sender is deleted.
  PublicProfile sender = 6;
  // Above zero for a collectible: its number of the kind, with its
  // traits.
  int32 number = 7;
  string model = 8;
  string backdrop = 9;
  string symbol = 10;
  // Above zero while it is on sale.
  int64 sale_price = 11;
  // While it is at an auction.
  bool auctioned = 12;
}

message ListGiftsRequest {
