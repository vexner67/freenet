  // The names of its stickers, in the order they are shown.
  repeated string stickers = 3;
  // The caller has taken it, free or for votes.
  bool bought = 4;
  // It is among the caller's stickers.
  bool added = 5;
  // Who made it of their photos; empty for a pack of the site, whose name
  // and pictures the site knows.
  string author_id = 6;
  string name = 7;
  string about = 8;
  // The shop shows it; a pack of the site always.
  bool published = 9;
  // How many people have taken it, its author left out.
  int32 holders = 10;
}

message AddStickerPackRequest {
  string pack_id = 1;
}

message RemoveStickerPackRequest {
  string pack_id = 1;
}

message ListMyStickerPacksRequest {}

message ListMyStickerPacksResponse {
  // Newest first.
  repeated StickerPack packs = 1;
}

message CreateStickerPackRequest {
  string name = 1;
  string about = 2;
  // In votes, 0 for a free one.
  int64 price = 3;
  bool published = 4;
  // The caller's photos, in the order the stickers are shown.
  repeated string photo_ids = 5;
}

message CreateStickerPackResponse {
  StickerPack pack = 1;
}

message EditStickerPackRequest {
  string pack_id = 1;
  string name = 2;
  string about = 3;
  int64 price = 4;
  bool published = 5;
  // Photos of the caller to add after the stickers.
  repeated string add_photo_ids = 6;
  // Stickers to take out, by their photos.
  repeated string remove_photo_ids = 7;
}

message EditStickerPackResponse {
  StickerPack pack = 1;
  // The photos the pack no longer has, whose files go.
  repeated string removed_photo_ids = 2;
}

message DeleteStickerPackRequest {
  string pack_id = 1;
}

message DeleteStickerPackResponse {
  // The photos of the pack, whose files go.
  repeated string removed_photo_ids = 1;
}

message GetStickerAuthorsRequest {
  // Up to 100 sticker names.
  repeated string stickers = 1;
}

message GetStickerAuthorsResponse {
  // Sticker → the author whose photo it is; stickers of the site and
  // unknown ones are left out.
  map<string, string> authors = 1;
}
