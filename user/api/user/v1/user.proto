  int32 staff = 5;
  // The improvement an "improve" buys the next tier of.
  string perk = 6;
}

message RunBusinessResponse {
  // The votes the action spent and got, the tax of a collect, and the
  // balance after them (0 when no votes moved).
  int64 spent = 1;
  int64 got = 2;
  int64 tax = 3;
  int64 balance = 4;
  BusinessesState businesses = 5;
}

