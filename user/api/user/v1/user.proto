  repeated AimMultiplier aim = 4;
}

message BetCasinoRequest {
  int64 amount = 1;
  // In hundredths: 200 — ×2.
  int32 multiplier = 2;
}

message BetCasinoResponse {
  bool won = 1;
  // The roll and the chance, both of 10000: the bet wins when the roll
  // falls in the middle, chance wide — from (10000 - chance) / 2.
  int32 roll = 2;
  int32 chance = 3;
  // The votes it won: the bet multiplied, or 0.
  int64 votes = 4;
