syntax = "proto3";

package user.v1;

option go_package = "github.com/vexner67/freenet/user/api/user/v1;userv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service UserService {
  rpc GetOrCreateByEmail(GetOrCreateByEmailRequest) returns (GetOrCreateByEmailResponse);

  // Requires an access token; works on the caller's own account.
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // The status alone, as openvk edits it on the page.
  rpc UpdateStatus(UpdateStatusRequest) returns (UpdateStatusResponse);
  rpc UpdatePrivacy(UpdatePrivacyRequest) returns (UpdatePrivacyResponse);
  // "Интерфейс" of the settings: how the site looks to the caller alone.
  rpc UpdateInterface(UpdateInterfaceRequest) returns (UpdateInterfaceResponse);
  // openvk's "Контакты", "Интересы" and "Дополнительно" of the page; each
  // replaces its part at once.
  rpc UpdateContacts(UpdateContactsRequest) returns (UpdateContactsResponse);
  rpc UpdateInterests(UpdateInterestsRequest) returns (UpdateInterestsResponse);
  rpc UpdateExtraFields(UpdateExtraFieldsRequest) returns (UpdateExtraFieldsResponse);
  // Points the caller's profile to a photo uploaded to the media service;
  // an empty avatar_id removes the photo.
  rpc SetAvatar(SetAvatarRequest) returns (SetAvatarResponse);
  // Shows a photo the media service keeps under the caller on one side of
  // their page ("Фон страницы"), the other side as it is; an empty
  // photo_id clears the side. Tells which photo the side showed before,
  // for the caller to delete.
  rpc SetBackdrop(SetBackdropRequest) returns (SetBackdropResponse);

  // Public: returns only what other users may see.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  // Public: several profiles at once, e.g. the authors of a news feed.
  rpc GetProfiles(GetProfilesRequest) returns (GetProfilesResponse);
  // Public: people with a filled-in profile by name, surname or nickname.
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);

  // Require an access token; the follower is the caller. Idempotent.
  rpc Follow(FollowRequest) returns (google.protobuf.Empty);
  rpc Unfollow(UnfollowRequest) returns (google.protobuf.Empty);
  // Requires an access token: whom the caller follows, for the news feed.
  rpc ListFollowingIDs(ListFollowingIDsRequest) returns (ListFollowingIDsResponse);

  // Public. With an access token GetFollowStats also tells whether the
  // caller follows the user.
  rpc GetFollowStats(GetFollowStatsRequest) returns (GetFollowStatsResponse);
  rpc ListFollowers(ListFollowsRequest) returns (ListFollowsResponse);
  rpc ListFollowing(ListFollowsRequest) returns (ListFollowsResponse);

  // Requires an access token: the caller is on the site now ("Онлайн").
  rpc MarkOnline(MarkOnlineRequest) returns (google.protobuf.Empty);
  // Public: how many people the site has and how many are on it now, for
  // its page "о сайте".
  rpc GetStatistics(GetStatisticsRequest) returns (GetStatisticsResponse);

  // Requires an access token: whether the caller may write on the user's
  // wall, as the user's privacy and blacklists allow.
  rpc CanPostOnWall(CanPostOnWallRequest) returns (CanPostOnWallResponse);
  // Requires an access token: whether the caller may write private
  // messages to the user, as the user's privacy and blacklists allow.
  rpc CanMessage(CanMessageRequest) returns (CanMessageResponse);
  // Public: what of the user's page the caller, anonymous without a token,
  // may see, as the user's privacy allows.
  rpc GetAccess(GetAccessRequest) returns (GetAccessResponse);

  // Require an access token: the caller's blacklist ("Чёрный список"). A
  // block shuts messages, wall posts and follows between the two, both
  // ways, and drops their follows. Block and Unblock are idempotent.
  rpc Block(BlockRequest) returns (google.protobuf.Empty);
  rpc Unblock(UnblockRequest) returns (google.protobuf.Empty);
  rpc ListBlocked(ListBlockedRequest) returns (ListBlockedResponse);
  // Requires an access token: who of the caller and the user blacklisted
  // the other.
  rpc GetRelation(GetRelationRequest) returns (GetRelationResponse);

  // Require an access token: deleting the caller's page ("Удаление
  // страницы" on openvk) and restoring it. A deleted page is hidden: others
  // see only its name and photo, nobody may follow it, write on its wall
  // or to it. Its owner may restore it until purge_at, when its data is
  // erased in every service. The access tokens of a deleted page work only
  // for GetMe and ReactivateAccount; on public methods they are anonymous.
  rpc DeactivateAccount(DeactivateAccountRequest) returns (DeactivateAccountResponse);
  rpc ReactivateAccount(ReactivateAccountRequest) returns (ReactivateAccountResponse);
  // Internal (auth): whether the page is deleted, for the access tokens
  // it issues; NotFound once its data is erased.
  rpc GetAccountState(GetAccountStateRequest) returns (GetAccountStateResponse);
}

message User {
  string id = 1;
  string name = 2;
  string surname = 3;
  string nickname = 4;
  string status = 5;
  Gender gender = 6;
  Relationship relationship = 7;
  Worldview worldview = 8;
  PoliticalViews political_views = 9;
  google.protobuf.Timestamp birthday = 10;
  string email = 11;
  // False right after the first sign-in, until UpdateProfile succeeds.
  bool profile_completed = 12;
  PrivacySettings privacy = 13;
  // Empty without a photo.
  string avatar_id = 14;
  // The owner deleted the page; it can be restored until purge_at.
  bool deactivated = 15;
  google.protobuf.Timestamp purge_at = 16;
  string hometown = 17;
  // Whom the relationship names; empty for nobody.
  string relationship_partner_id = 18;
  // Show the birthday without its year ("Показывать только день и месяц").
  bool hide_birth_year = 19;
  Contacts contacts = 20;
  Interests interests = 21;
  repeated ExtraField extra_fields = 22;
  google.protobuf.Timestamp registered_at = 23;
  // "Фон страницы": photos of the media service under the user, empty for
  // a side without one.
  string backdrop_left = 24;
  string backdrop_right = 25;
  // "Заполненность страницы" of openvk, in percent, and the parts missing
  // ("interests", "email", "telegram", "status", "city").
  int32 completeness = 26;
  repeated string unfilled = 27;
  InterfaceSettings interface = 28;
}

// InterfaceSettings are how the site looks to its owner ("Интерфейс").
message InterfaceSettings {
  // "square" (the default) or "round": how everyone's photos are shown.
  string avatar_style = 1;
  // "page" (the default) or "feed": where the site opens.
  string main_page = 2;
  // The links taken out of the left menu: "photos", "messages", "groups",
  // "events", "feed", "notifications".
  repeated string hidden_menu = 3;
}

message UpdateInterfaceRequest {
  InterfaceSettings interface = 1;
}

message UpdateInterfaceResponse {
  User user = 1;
}

// openvk's "Контактная информация"; every field optional.
message Contacts {
  string email = 1;
  // A Telegram username without "@".
  string telegram = 2;
  string website = 3;
  string city = 4;
  string address = 5;
}

// openvk's "Личная информация"; every field optional.
message Interests {
  string interests = 1;
  string music = 2;
  string films = 3;
  string shows = 4;
  string books = 5;
  string quotes = 6;
  string games = 7;
  string about = 8;
}

// A field of the page its owner names ("Дополнительно").
message ExtraField {
  string name = 1;
  string text = 2;
  FieldPlace place = 3;
}

// Where an additional field shows.
enum FieldPlace {
  FIELD_PLACE_UNSPECIFIED = 0;
  FIELD_PLACE_CONTACTS = 1;
  FIELD_PLACE_INTERESTS = 2;
}

// Which sensitive fields other users see in PublicProfile, all false
// (hidden) by default, and who may write on the wall.
message PrivacySettings {
  bool show_birthday = 1;
  bool show_relationship = 2;
  bool show_worldview = 3;
  bool show_political_views = 4;
  // Required in UpdatePrivacy; WALL_WRITE_FOLLOWING by default.
  WallWrite wall_write = 5;
  // Required in UpdatePrivacy; MESSAGES_WRITE_EVERYONE by default.
  MessagesWrite messages_write = 6;
  // Required in UpdatePrivacy; CLUBS_READ_EVERYONE by default.
  ClubsRead clubs_read = 7;
  // Required in UpdatePrivacy, everyone by default: who sees the page
  // ("Кому в интернете видно мою страницу", everyone or users), its
  // information, its albums and its follows.
  Audience page_read = 8;
  Audience info_read = 9;
  Audience photos_read = 10;
  Audience friends_read = 11;
  // Required in UpdatePrivacy, everyone by default: who sees when the
  // owner was last online after a long absence ("Кто видит мою
  // неактивность"); anyone sees a short one, as on openvk.
  Audience online_read = 12;
}

// Who sees a part of a page.
enum Audience {
  AUDIENCE_UNSPECIFIED = 0;
  AUDIENCE_EVERYONE = 1;
  // Signed-in people.
  AUDIENCE_USERS = 2;
  // The people the user follows.
  AUDIENCE_FOLLOWING = 3;
  AUDIENCE_ONLY_ME = 4;
}

// Who sees which communities a user is in besides the user.
enum ClubsRead {
  CLUBS_READ_UNSPECIFIED = 0;
  CLUBS_READ_EVERYONE = 1;
  // The people the user follows.
  CLUBS_READ_FOLLOWING = 2;
  CLUBS_READ_ONLY_ME = 3;
  // Signed-in people.
  CLUBS_READ_USERS = 4;
}

// Who may write private messages to a user. Whoever the user wrote to may
// answer whatever the setting.
enum MessagesWrite {
  MESSAGES_WRITE_UNSPECIFIED = 0;
  MESSAGES_WRITE_EVERYONE = 1;
  // The people the user follows.
  MESSAGES_WRITE_FOLLOWING = 2;
  MESSAGES_WRITE_NOBODY = 3;
}

// Who may write on a user's wall besides the user.
enum WallWrite {
  WALL_WRITE_UNSPECIFIED = 0;
  WALL_WRITE_EVERYONE = 1;
  // The people the user follows.
  WALL_WRITE_FOLLOWING = 2;
  WALL_WRITE_ONLY_ME = 3;
}

// Fields 7-10 are empty both when not set and when hidden by the owner.
message PublicProfile {
  string id = 1;
  string name = 2;
  string surname = 3;
  string nickname = 4;
  string status = 5;
  Gender gender = 6;
  Relationship relationship = 7;
  Worldview worldview = 8;
  PoliticalViews political_views = 9;
  google.protobuf.Timestamp birthday = 10;
  // Empty without a photo.
  string avatar_id = 11;
  // The owner deleted the page: only names and the photo are left.
  bool deactivated = 12;
  // The birthday is told without its year, which is then 2000.
  bool birth_year_hidden = 13;
  string hometown = 14;
  // Whom the relationship names; empty for nobody and when hidden.
  string relationship_partner_id = 15;
  Contacts contacts = 16;
  Interests interests = 17;
  repeated ExtraField extra_fields = 18;
  google.protobuf.Timestamp registered_at = 19;
  // The caller may not see the page: only the names, the pronouns and the
  // photo are told.
  bool page_hidden = 20;
  // The caller may not see its information, left empty (registered_at
  // too).
  bool info_hidden = 21;
  // When the user last visited the site ("был в сети"); unset if never
  // or hidden from the caller. Only GetProfile tells it.
  google.protobuf.Timestamp last_seen_at = 22;
  // The user visited within the last minutes ("Онлайн").
  bool online = 23;
  // "Фон страницы", as in User; none on a deleted or hidden page.
  string backdrop_left = 24;
  string backdrop_right = 25;
  // "Заполненность страницы", in percent; 0 on a deleted or hidden page.
  // Only GetProfile tells it.
  int32 completeness = 26;
}

enum Gender {
  GENDER_NONE = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
  // openvk's "они/их".
  GENDER_NEUTRAL = 3;
}

enum Relationship {
  RELATIONSHIP_NONE = 0;
  RELATIONSHIP_SINGLE = 1;
  RELATIONSHIP_DATING = 2;
  RELATIONSHIP_MARRIED = 3;
  RELATIONSHIP_IN_LOVE = 4;
  RELATIONSHIP_LOOKING = 5;
  RELATIONSHIP_ENGAGED = 6;
  RELATIONSHIP_CIVIL_UNION = 7;
  RELATIONSHIP_COMPLICATED = 8;
}

enum Worldview {
  WORLDVIEW_NONE = 0;
  WORLDVIEW_ISLAM = 1;
  WORLDVIEW_ORTHODOX = 2;
  WORLDVIEW_CATHOLICISM = 3;
  WORLDVIEW_JUDAISM = 4;
  WORLDVIEW_PROTESTANTISM = 5;
  WORLDVIEW_BUDDHISM = 6;
  WORLDVIEW_CONFUCIANISM = 7;
  WORLDVIEW_SECULAR_HUMANISM = 8;
}

enum PoliticalViews {
  POLITICAL_VIEWS_NONE = 0;
  POLITICAL_VIEWS_COMMUNIST = 1;
  POLITICAL_VIEWS_SOCIALIST = 2;
  POLITICAL_VIEWS_MODERATE = 3;
  POLITICAL_VIEWS_LIBERAL = 4;
  POLITICAL_VIEWS_CONSERVATIVE = 5;
  POLITICAL_VIEWS_MONARCHIST = 6;
  POLITICAL_VIEWS_ULTRACONSERVATIVE = 7;
  POLITICAL_VIEWS_INDIFFERENT = 8;
  POLITICAL_VIEWS_LIBERTARIAN = 9;
}

message GetOrCreateByEmailRequest {
  string email = 1;
}

message GetOrCreateByEmailResponse {
  string user_id = 1;
  // The page is deleted (see DeactivateAccount).
  bool deactivated = 2;
}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}

// Replaces the whole profile: fields left empty are cleared.
// name and nickname are required.
message UpdateProfileRequest {
  string name = 1;
  string surname = 2;
  string nickname = 3;
  string status = 4;
  Gender gender = 5;
  Relationship relationship = 6;
  Worldview worldview = 7;
  PoliticalViews political_views = 8;
  google.protobuf.Timestamp birthday = 9;
  string hometown = 10;
  // The nickname of whom the relationship names; empty for nobody.
  string relationship_partner = 11;
  bool hide_birth_year = 12;
}

message UpdateProfileResponse {
  User user = 1;
}

message UpdateContactsRequest {
  Contacts contacts = 1;
}

message UpdateContactsResponse {
  User user = 1;
}

message UpdateInterestsRequest {
  Interests interests = 1;
}

message UpdateInterestsResponse {
  User user = 1;
}

message UpdateExtraFieldsRequest {
  // At most 7.
  repeated ExtraField fields = 1;
}

message UpdateExtraFieldsResponse {
  User user = 1;
}

message GetProfileRequest {
  string nickname = 1;
}

message GetProfileResponse {
  PublicProfile profile = 1;
}

message UpdatePrivacyRequest {
  PrivacySettings privacy = 1;
}

message UpdatePrivacyResponse {
  User user = 1;
}

message GetProfilesRequest {
  // At most 100.
  repeated string user_ids = 1;
}

message GetProfilesResponse {
  // Unknown IDs are skipped; the order is not kept.
  repeated PublicProfile profiles = 1;
}

message FollowRequest {
  string user_id = 1;
}

message UnfollowRequest {
  string user_id = 1;
}

message ListFollowingIDsRequest {}

message ListFollowingIDsResponse {
  // Newest follows first, at most 1000.
  repeated string user_ids = 1;
}

message GetFollowStatsRequest {
  string user_id = 1;
}

message GetFollowStatsResponse {
  int32 followers_count = 1;
  int32 following_count = 2;
  // The caller follows the user; false without an access token.
  bool is_following = 3;
}

message ListFollowsRequest {
  string user_id = 1;
  // Empty for the newest follows, else next_cursor of the previous page.
  string cursor = 2;
  // 1-50; anything else means 20.
  int32 limit = 3;
  // Only the people online now ("Друзья онлайн"); total counts them.
  bool online = 4;
  // Only whom the caller follows too ("Общие друзья"); requires an
  // access token.
  bool common = 5;
}

message MarkOnlineRequest {}

message GetStatisticsRequest {}

message GetStatisticsResponse {
  // Pages that are not deleted.
  int32 users = 1;
  // Those of them whose owners are on the site now.
  int32 online = 2;
}

message ListFollowsResponse {
  repeated PublicProfile users = 1;
  // Empty on the last page.
  string next_cursor = 2;
  int32 total = 3;
}

message SetAvatarRequest {
  string avatar_id = 1;
}

message UpdateStatusRequest {
  string status = 1;
}

message UpdateStatusResponse {
  User user = 1;
}

message SetAvatarResponse {
  User user = 1;
}

enum BackdropSide {
  BACKDROP_SIDE_UNSPECIFIED = 0;
  BACKDROP_SIDE_LEFT = 1;
  BACKDROP_SIDE_RIGHT = 2;
}

message SetBackdropRequest {
  BackdropSide side = 1;
  string photo_id = 2;
}

message SetBackdropResponse {
  User user = 1;
  // The photo the side showed before; empty if none.
  string previous_photo_id = 2;
}

message SearchUsersRequest {
  // Words in any order, each found in the name, surname or nickname;
  // may be empty with a filter.
  string query = 1;
  string cursor = 2;
  // 1-50; anything else means 20.
  int32 limit = 3;
  // Filters, as openvk's page links: a hometown or a city, whatever the
  // case; a film, a show or a book among the favourites.
  string hometown = 4;
  string city = 5;
  string film = 6;
  string show = 7;
  string book = 8;
}

message SearchUsersResponse {
  repeated PublicProfile users = 1;
  // Empty on the last page.
  string next_cursor = 2;
}

message CanPostOnWallRequest {
  // The owner of the wall.
  string user_id = 1;
}

message CanPostOnWallResponse {
  bool allowed = 1;
}

message GetAccessRequest {
  string user_id = 1;
}

// What of a page the caller may see.
message GetAccessResponse {
  // The page itself: the names and the photo are told anyway.
  bool page = 1;
  // Its information: all but the names, the photo, the status and the
  // pronouns.
  bool info = 2;
  // Its albums.
  bool photos = 3;
  // Whom the user follows and who follows the user.
  bool friends = 4;
  // The communities the user is in.
  bool clubs = 5;
}

message CanMessageRequest {
  // The recipient.
  string user_id = 1;
  // The recipient has written to the caller, which the message service
  // knows: they may then answer whatever the setting.
  bool wrote_first = 2;
}

message CanMessageResponse {
  bool allowed = 1;
}

message BlockRequest {
  string user_id = 1;
}

message UnblockRequest {
  string user_id = 1;
}

message ListBlockedRequest {
  // Empty for the newest blocks, else next_cursor of the previous page.
  string cursor = 1;
  // 1-50; anything else means 20.
  int32 limit = 2;
}

message ListBlockedResponse {
  repeated PublicProfile users = 1;
  // Empty on the last page.
  string next_cursor = 2;
  int32 total = 3;
}

message GetRelationRequest {
  string user_id = 1;
}

message GetRelationResponse {
  // The caller blacklisted the user.
  bool blocked_by_me = 1;
  // The user blacklisted the caller.
  bool blocked_me = 2;
}

message DeactivateAccountRequest {
  // Why, in the owner's words or one of openvk's reasons; may be empty.
  string reason = 1;
}

message DeactivateAccountResponse {
  User user = 1;
}

message ReactivateAccountRequest {}

message ReactivateAccountResponse {
  User user = 1;
}

message GetAccountStateRequest {
  string user_id = 1;
}

message GetAccountStateResponse {
  bool deactivated = 1;
}
