  // 1-50; anything else means 20.
  int32 limit = 2;
  // "in" for what came in, "out" for what went out, empty for both.
  string flow = 3;
}

// A line of the statement of votes.
message VoteOperation {
  string id = 1;
  // transfer, voucher, gift, stickers, casino, aim, stake, rocket, bonus,
  // denomination, fee, tax, rating or prime (the note is the period).
  string kind = 2;
  // What came in (above zero) or went out (below).
  int64 amount = 3;
  // The votes after it.
