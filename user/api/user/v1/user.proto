  PublicProfile seller = 7;
  // Whose bid is on top, unset while nobody has bid.
  PublicProfile bidder = 8;
  // The caller's bid is on top.
  bool mine = 9;
}

message GiftHistoryLine {
  // "upgrade", "mint", "transfer", "sale" or "auction".
