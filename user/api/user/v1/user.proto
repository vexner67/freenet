  int64 level_experience = 9;
  int64 next_level_experience = 10;
  int32 rating = 11;
  int32 wins = 12;
  int32 losses = 13;
  int32 fights = 14;
  int32 attack = 15;
  int32 defense = 16;
  int32 health = 17;
  int32 speed = 18;
