  // Empty for the newest gifts, else next_cursor of the previous page.
  string cursor = 2;
  // 1-50; anything else means 20.
  int32 limit = 3;
}

message ListGiftsResponse {
  repeated Gift gifts = 1;
  // Empty on the last page.
  string next_cursor = 2;
  int32 total = 3;
}

message DeleteGiftRequest {
  string gift_id = 1;
}

message SetGiftPriceRequest {
  // A gift of the catalogue.
  string gift = 1;
  // In votes, 0-1000000; 0 makes it free.
