syntax = "proto3";

package user.v1;

option go_package = "github.com/vexner67/freenet/user/api/user/v1;userv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service UserService {
  rpc GetOrCreateByEmail(GetOrCreateByEmailRequest) returns (GetOrCreateByEmailResponse);

  // Requires an access token; works on the caller's own account.
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // The status alone, as openvk edits it on the page.
  rpc UpdateStatus(UpdateStatusRequest) returns (UpdateStatusResponse);
  // The address of the page alone ("Адрес страницы" of the settings); the
  // profile has to be filled first.
  rpc UpdateNickname(UpdateNicknameRequest) returns (UpdateNicknameResponse);
  rpc UpdatePrivacy(UpdatePrivacyRequest) returns (UpdatePrivacyResponse);
  // "Интерфейс" of the settings: how the site looks to the caller alone.
  rpc UpdateInterface(UpdateInterfaceRequest) returns (UpdateInterfaceResponse);
  // openvk's "Контакты", "Интересы" and "Дополнительно" of the page; each
  // replaces its part at once.
  rpc UpdateContacts(UpdateContactsRequest) returns (UpdateContactsResponse);
  rpc UpdateInterests(UpdateInterestsRequest) returns (UpdateInterestsResponse);
  rpc UpdateExtraFields(UpdateExtraFieldsRequest) returns (UpdateExtraFieldsResponse);
  // Points the caller's profile to a photo uploaded to the media service;
  // an empty avatar_id removes the photo.
  rpc SetAvatar(SetAvatarRequest) returns (SetAvatarResponse);
  // Shows a photo the media service keeps under the caller on one side of
  // their page ("Фон страницы"), the other side as it is; an empty
  // photo_id clears the side. Tells which photo the side showed before,
  // for the caller to delete.
  rpc SetBackdrop(SetBackdropRequest) returns (SetBackdropResponse);

  // Public: returns only what other users may see.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  // Public: several profiles at once, e.g. the authors of a news feed.
  rpc GetProfiles(GetProfilesRequest) returns (GetProfilesResponse);
  // Public: people with a filled-in profile by name, surname or nickname.
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);

  // Require an access token; the follower is the caller. Idempotent.
  rpc Follow(FollowRequest) returns (google.protobuf.Empty);
  rpc Unfollow(UnfollowRequest) returns (google.protobuf.Empty);
  // AcceptInvite follows the user whose invitation link the caller signed
  // up by ("Пригласить" of openvk), and notifies them of the invitation:
  // once and only while the caller's page is new (FailedPrecondition),
  // as Follow would.
  rpc AcceptInvite(AcceptInviteRequest) returns (google.protobuf.Empty);

  // Public. With an access token GetFollowStats also tells whether the
  // caller follows the user.
  rpc GetFollowStats(GetFollowStatsRequest) returns (GetFollowStatsResponse);
  rpc ListFollowers(ListFollowsRequest) returns (ListFollowsResponse);
  rpc ListFollowing(ListFollowsRequest) returns (ListFollowsResponse);

  // Requires an access token: the caller is on the site now ("Онлайн").
  rpc MarkOnline(MarkOnlineRequest) returns (google.protobuf.Empty);
  // Public: how many people the site has and how many are on it now, for
  // its page "о сайте".
  rpc GetStatistics(GetStatisticsRequest) returns (GetStatisticsResponse);

  // Requires an access token: whether the caller may write on the user's
  // wall, as the user's privacy and blacklists allow.
  rpc CanPostOnWall(CanPostOnWallRequest) returns (CanPostOnWallResponse);
  // Requires an access token: whether the caller may write private
  // messages to the user, as the user's privacy and blacklists allow.
  rpc CanMessage(CanMessageRequest) returns (CanMessageResponse);
  // Requires an access token: which of the paid posts the caller opened.
  rpc GetBoughtPosts(GetBoughtPostsRequest) returns (GetBoughtPostsResponse);
  // Internal, for the gateway, with the caller's token: opens the photos
  // and documents of a paid post to the caller, paying its author
  // ("Открыть за N голосов"); opened before, it costs nothing.
  // FailedPrecondition "not enough votes".
  rpc BuyPost(BuyPostRequest) returns (BuyPostResponse);
  // Requires an access token: pays for a message to a user who asks votes
  // for messages, before it is sent; RefundMessage gives the votes back
  // when it is not. PermissionDenied "you cannot write to this user".
  rpc PayMessage(PayMessageRequest) returns (PayMessageResponse);
  rpc RefundMessage(RefundMessageRequest) returns (google.protobuf.Empty);
  // Requires an access token: who of the people a text of the caller
  // names by nickname hears of it ("Вас упомянул пользователь" of
  // openvk): not the caller, not across a blacklist, not a deleted page.
  rpc ResolveMentions(ResolveMentionsRequest) returns (ResolveMentionsResponse);
  // Requires an access token: the people the caller names by nickname to
  // add to a group chat, and whether each lets the caller do it, as their
  // privacy and blacklists allow.
  rpc ResolveInvites(ResolveInvitesRequest) returns (ResolveInvitesResponse);
  // Public: which of the nicknames are someone's, so that a text saying
  // "@word" links to a page only when there is one.
  rpc FindNicknames(FindNicknamesRequest) returns (FindNicknamesResponse);
  // Public: what of the user's page the caller, anonymous without a token,
  // may see, as the user's privacy allows.
  rpc GetAccess(GetAccessRequest) returns (GetAccessResponse);

  // Require an access token: the caller's blacklist ("Чёрный список"). A
  // block shuts messages, wall posts and follows between the two, both
  // ways, and drops their follows. Block and Unblock are idempotent.
  rpc Block(BlockRequest) returns (google.protobuf.Empty);
  rpc Unblock(UnblockRequest) returns (google.protobuf.Empty);
  rpc ListBlocked(ListBlockedRequest) returns (ListBlockedResponse);
  // Requires an access token: whom the caller blacklisted, for the news
  // feed, which leaves their posts out.
  rpc ListBlockedIDs(ListBlockedIDsRequest) returns (ListBlockedIDsResponse);
  // Requires an access token. "Игнорируемые источники" of openvk: the
  // walls whose posts the caller's news feeds leave out. A source is a
  // user or a community — the caller checks that it is there. Both are
  // idempotent.
  rpc IgnoreSource(IgnoreSourceRequest) returns (google.protobuf.Empty);
  rpc UnignoreSources(UnignoreSourcesRequest) returns (google.protobuf.Empty);
  rpc ListIgnoredSources(ListIgnoredSourcesRequest) returns (ListIgnoredSourcesResponse);
  // Requires an access token: who of the caller and the user blacklisted
  // the other.
  rpc GetRelation(GetRelationRequest) returns (GetRelationResponse);

  // Gifts ("Подарки" on openvk). GetGiftCatalog is public: what there is
  // to send. SendGift sends one to a user: PermissionDenied if the page
  // is deleted, does not show itself to the caller or the two are
  // blacklisted either way. ListGifts is public: the gifts sent to a
  // user, newest first; PermissionDenied if the page or its gifts are
  // hidden from the caller. DeleteGift is for the one the gift was sent
  // to. SetGiftPrice is for the administrators of the site
  // (PermissionDenied for others): what a gift costs from now on.
  rpc GetGiftCatalog(GetGiftCatalogRequest) returns (GetGiftCatalogResponse);
  rpc SendGift(SendGiftRequest) returns (SendGiftResponse);
  rpc ListGifts(ListGiftsRequest) returns (ListGiftsResponse);
  rpc DeleteGift(DeleteGiftRequest) returns (google.protobuf.Empty);
  rpc SetGiftPrice(SetGiftPriceRequest) returns (google.protobuf.Empty);

  // Collectible gifts, as Telegram's. UpgradeGift turns the caller's own
  // gift into a collectible for votes: a number of its kind and three
  // traits rolled by rarity. TransferGift gives one away (votes to the
  // treasury; PermissionDenied as SendGift), SetGiftSale puts it up for a
  // price (0 takes it off) and BuyGift buys one for the price the buyer
  // was shown (FailedPrecondition when it changed). GetCollectible,
  // ListGiftMarket and ListGiftAuctions are public. StartGiftAuction puts
  // the caller's collectible up for the highest bid, BidGift holds the
  // votes of a bid until someone bids more, CancelGiftAuction takes back
  // an auction nobody bid on. MintGiftAuction and SetGiftSupply are for
  // the administrators of the site: an edition the site auctions, and how
  // many of a gift may ever be sent.
  rpc UpgradeGift(UpgradeGiftRequest) returns (UpgradeGiftResponse);
  rpc TransferGift(TransferGiftRequest) returns (google.protobuf.Empty);
  rpc SetGiftSale(SetGiftSaleRequest) returns (SetGiftSaleResponse);
  rpc BuyGift(BuyGiftRequest) returns (BuyGiftResponse);
  rpc GetCollectible(GetCollectibleRequest) returns (GetCollectibleResponse);
  rpc ListGiftMarket(ListGiftMarketRequest) returns (ListGiftMarketResponse);
  rpc StartGiftAuction(StartGiftAuctionRequest) returns (google.protobuf.Empty);
  rpc MintGiftAuction(MintGiftAuctionRequest) returns (MintGiftAuctionResponse);
  rpc CancelGiftAuction(CancelGiftAuctionRequest) returns (google.protobuf.Empty);
  rpc BidGift(BidGiftRequest) returns (BidGiftResponse);
  rpc ListGiftAuctions(ListGiftAuctionsRequest) returns (ListGiftAuctionsResponse);
  rpc SetGiftSupply(SetGiftSupplyRequest) returns (google.protobuf.Empty);

  // Stickers ("Стикеры" on openvk). GetStickerCatalog is public: the
  // packs there are, and with a token which of them the caller has taken
  // and keeps among their stickers. AddStickerPack takes a pack, paying
  // its price in votes the first time (FailedPrecondition "not enough
  // votes"), or adds back one put away; RemoveStickerPack puts it away.
  rpc GetStickerCatalog(GetStickerCatalogRequest) returns (GetStickerCatalogResponse);
  rpc AddStickerPack(AddStickerPackRequest) returns (google.protobuf.Empty);
  rpc RemoveStickerPack(RemoveStickerPackRequest) returns (google.protobuf.Empty);
  // "Студия стикеров": packs people make of their photos and put in the
  // shop, free or for votes that go to the author. The photos are the
  // author's in media: the gateway checks it and keeps and deletes the
  // files. A pack others have taken keeps its stickers and is not deleted.
  // GetStickerAuthors is public: whose photos the stickers of such packs
  // are, which the site shows.
  rpc ListMyStickerPacks(ListMyStickerPacksRequest) returns (ListMyStickerPacksResponse);
  rpc CreateStickerPack(CreateStickerPackRequest) returns (CreateStickerPackResponse);
  rpc EditStickerPack(EditStickerPackRequest) returns (EditStickerPackResponse);
  rpc DeleteStickerPack(DeleteStickerPackRequest) returns (DeleteStickerPackResponse);
  rpc GetStickerAuthors(GetStickerAuthorsRequest) returns (GetStickerAuthorsResponse);

  // Votes ("голоса" on openvk) pay for the gifts that have a price.
  // TransferVotes hands some of the caller's to a user ("Перевод
  // голосов"): PermissionDenied to a deleted page and across a blacklist,
  // FailedPrecondition when the caller has fewer. RedeemVoucher gives the
  // caller what a voucher carries, once: FailedPrecondition whatever is
  // wrong with the voucher.
  rpc TransferVotes(TransferVotesRequest) returns (TransferVotesResponse);
  rpc RedeemVoucher(RedeemVoucherRequest) returns (RedeemVoucherResponse);
  // ListVoteOperations is the statement of the caller's votes ("Голоса"):
  // every change of them, newest first, and the totals of 30 days.
  rpc ListVoteOperations(ListVoteOperationsRequest) returns (ListVoteOperationsResponse);

  // Vouchers are made by the administrators of the site (ADMIN_EMAILS):
  // PermissionDenied to anyone else.
  rpc CreateVoucher(CreateVoucherRequest) returns (CreateVoucherResponse);
  rpc ListVouchers(ListVouchersRequest) returns (ListVouchersResponse);
  rpc DeleteVoucher(DeleteVoucherRequest) returns (google.protobuf.Empty);

  // The rate of a vote: what one is worth in rubles. GetVoteRate is
  // public; SetVoteRate is for the administrators (PermissionDenied for
  // others).
  rpc GetVoteRate(GetVoteRateRequest) returns (GetVoteRateResponse);
  rpc SetVoteRate(SetVoteRateRequest) returns (google.protobuf.Empty);

  // The treasury pays every vote given and takes every vote spent;
  // GetTreasury is public. The daily bonus comes out of it: GetBonus says
  // it to the caller, ClaimBonus gives it once a Moscow day to a page a
  // week old with a filled profile (FailedPrecondition otherwise).
  // SetEconomy sets the bonus and the fees, for the administrators
  // (PermissionDenied for others).
  rpc GetTreasury(GetTreasuryRequest) returns (GetTreasuryResponse);
  rpc GetBonus(GetBonusRequest) returns (GetBonusResponse);
  rpc ClaimBonus(ClaimBonusRequest) returns (ClaimBonusResponse);
  rpc SetEconomy(SetEconomyRequest) returns (google.protobuf.Empty);
  // RaiseRating sells the caller rating ("Повысить рейтинг" of openvk) for
  // 3 votes a percent, into the treasury: FailedPrecondition "not enough
  // votes" and "the rating cannot go above 1000 percent".
  rpc RaiseRating(RaiseRatingRequest) returns (RaiseRatingResponse);

  // Freenet Prime, the subscription of the site. GetPrime is public: what
  // its periods cost. BuyPrime sells the caller a period, for themself or
  // for user_id as a present, into the treasury: FailedPrecondition "not
  // enough votes", PermissionDenied as SendGift for a refused recipient.
  // SetPrimePrices is for the administrators (PermissionDenied for
  // others). SetPrimeInvisible hides when the caller is online, with
  // Prime only (FailedPrecondition "this is for freenet prime only");
  // SetPrimeStyle dresses the caller's page, any style but the default
  // one with Prime only too (InvalidArgument for an unknown choice).
  rpc GetPrime(GetPrimeRequest) returns (GetPrimeResponse);
  rpc BuyPrime(BuyPrimeRequest) returns (BuyPrimeResponse);
  rpc SetPrimePrices(SetPrimePricesRequest) returns (google.protobuf.Empty);
  rpc SetPrimeInvisible(SetPrimeInvisibleRequest) returns (google.protobuf.Empty);
  rpc SetPrimeStyle(SetPrimeStyleRequest) returns (google.protobuf.Empty);

  // The New Year decoration of the site. GetDecor is public and says
  // whether to wear it now; SetDecor is for the administrators
  // (PermissionDenied for others).
  rpc GetDecor(GetDecorRequest) returns (GetDecorResponse);
  rpc SetDecor(SetDecorRequest) returns (google.protobuf.Empty);

  // The casino of the site: a spin costs votes and wins votes back.
  // GetCasino is public and does not tell the odds; GetCasinoSettings and
  // SetCasino are for the administrators (PermissionDenied for others);
  // SpinCasino spends the price and pays the prize in one transaction
  // (FailedPrecondition "not enough votes").
  rpc GetCasino(GetCasinoRequest) returns (GetCasinoResponse);
  rpc GetCasinoSettings(GetCasinoSettingsRequest) returns (GetCasinoSettingsResponse);
  rpc SetCasino(SetCasinoRequest) returns (google.protobuf.Empty);
  rpc SpinCasino(SpinCasinoRequest) returns (SpinCasinoResponse);
  // The bets of the casino: a player bets votes on a multiplier and either
  // gets them multiplied or loses them. GetCasino tells their limits and
  // the multipliers with their chances; SetCasinoBets is for the
  // administrators; BetCasino takes the bet and
  // pays the win in one transaction (InvalidArgument for a bet out of the
  // limits or an unknown multiplier, FailedPrecondition "not enough
  // votes").
  rpc SetCasinoBets(SetCasinoBetsRequest) returns (google.protobuf.Empty);
  rpc BetCasino(BetCasinoRequest) returns (BetCasinoResponse);
  // The bets on events: the administrators ask a question with outcomes
  // and their odds, people stake votes on them, and a stake on the winner
  // pays its votes times the odds it was made at (events made before the
  // odds share the stakes among those who guessed); a cancelled event
  // gives them back. SetBetEventOdds changes the odds of an event not over
  // (FailedPrecondition for an event without odds). ListBetEvents
  // is public, with the stakes of the caller if a token came; StakeBet
  // takes the votes (FailedPrecondition when the event takes no stakes or
  // the balance is short); the rest are for the administrators.
  rpc ListBetEvents(ListBetEventsRequest) returns (ListBetEventsResponse);
  rpc CreateBetEvent(CreateBetEventRequest) returns (BetEvent);
  rpc CloseBetEvent(BetEventRequest) returns (google.protobuf.Empty);
  rpc ResolveBetEvent(ResolveBetEventRequest) returns (google.protobuf.Empty);
  rpc CancelBetEvent(BetEventRequest) returns (google.protobuf.Empty);
  rpc DeleteBetEvent(BetEventRequest) returns (google.protobuf.Empty);
  rpc SetBetEventOdds(SetBetEventOddsRequest) returns (google.protobuf.Empty);
  rpc StakeBet(StakeBetRequest) returns (StakeBetResponse);
  // "Ракетка" of the casino: a bet launches a rocket with a multiplier
  // growing from ×1, and the bet cashed before the rocket explodes comes
  // back multiplied. GetCasino tells the limits and the top, not the
  // return; SetCasinoRocket is for the administrators. LaunchRocket takes
  // the bet and, cashing by itself (auto), pays it at once (InvalidArgument
  // for a bet out of the limits or an auto out of 1.01 to the top,
  // FailedPrecondition "not enough votes"); GetRocket tells where a round
  // of the caller is, CashRocket takes it back at the multiplier of now —
  // nothing when the rocket has exploded (NotFound for a round not of the
  // caller, FailedPrecondition "the rocket is over" for one cashed or
  // cashing by itself). The crash point is told once a round is over.
  rpc SetCasinoRocket(SetCasinoRocketRequest) returns (google.protobuf.Empty);
  // SetCasinoJackpot changes the least win the site shows as a jackpot;
  // for the administrators (PermissionDenied for others).
  rpc SetCasinoJackpot(SetCasinoJackpotRequest) returns (google.protobuf.Empty);
  rpc LaunchRocket(LaunchRocketRequest) returns (RocketRound);
  rpc GetRocket(RocketRequest) returns (RocketRound);
  rpc CashRocket(RocketRequest) returns (RocketRound);
  // "Покер" of the casino: Casino Hold'em against the dealer. GetPoker
  // tells the limits of the ante and the pays and, with a token, the hand
  // of the caller still waiting. DealPoker takes the ante and deals two
  // cards to the player and the flop (InvalidArgument for an ante out of
  // the limits, FailedPrecondition "not enough votes", "a poker hand is
  // under way"); FoldPoker gives the hand up, CallPoker pays twice the ante
  // and opens the dealer and the board (NotFound for a hand not of the
  // caller, FailedPrecondition "the poker hand is over"). The dealer plays
  // with a pair of fours or better; when he does not, the ante is paid by
  // its pay and the call comes back.
  rpc GetPoker(GetPokerRequest) returns (PokerTable);
  rpc DealPoker(DealPokerRequest) returns (PokerHand);
  rpc FoldPoker(PokerHandRequest) returns (PokerHand);
  rpc CallPoker(PokerHandRequest) returns (PokerHand);
  // For the administrators (PermissionDenied for others).
  rpc GetPokerSettings(GetPokerSettingsRequest) returns (GetPokerSettingsResponse);
  rpc SetPokerSettings(SetPokerSettingsRequest) returns (google.protobuf.Empty);

  // Tables of "Покер": no-limit Texas Hold'em of people. ListHoldemTables
  // tells the open tables, the caller's and those they are invited to;
  // CreateHoldemTable opens a table and seats the caller, QuickHoldem seats
  // them at the fullest open table of the stake or opens one. The buy-in
  // goes to the treasury, chips come back as votes on leaving. The table
  // moves on when read: turns pass after 30 s, hands are dealt by
  // themselves.
  rpc ListHoldemTables(ListHoldemTablesRequest) returns (ListHoldemTablesResponse);
  rpc CreateHoldemTable(CreateHoldemTableRequest) returns (HoldemTableResponse);
  rpc QuickHoldem(QuickHoldemRequest) returns (HoldemTableResponse);
  rpc GetHoldemTable(HoldemTableRequest) returns (HoldemTable);
  rpc SitHoldemTable(SitHoldemTableRequest) returns (HoldemTableResponse);
  rpc LeaveHoldemTable(HoldemTableRequest) returns (HoldemTableResponse);
  rpc ActHoldemTable(ActHoldemTableRequest) returns (HoldemTable);
  rpc BackHoldemTable(HoldemTableRequest) returns (HoldemTable);
  rpc InviteHoldemTable(InviteHoldemTableRequest) returns (HoldemTable);

  // Requires an access token of an administrator of the site
  // (PermissionDenied otherwise): gives a page the checkmark of a
  // confirmed one ("Верификация" of openvk) or takes it.
  rpc SetVerified(SetVerifiedRequest) returns (google.protobuf.Empty);
  // Requires an access token of an administrator of the site
  // (PermissionDenied otherwise): puts on a page the orange label of
  // openvk ("user-alert") with the words given, or takes it with "".
  rpc SetAlert(SetAlertRequest) returns (google.protobuf.Empty);
  // The ads of the global feed: ListAds is public and gives the shown
  // ones; ListAds with all, CreateAd, EditAd and DeleteAd require an
  // access token of an administrator of the site (PermissionDenied
  // otherwise). A cover is a photo in media the administrator uploaded.
  rpc ListAds(ListAdsRequest) returns (ListAdsResponse);
  rpc CreateAd(CreateAdRequest) returns (CreateAdResponse);
  rpc EditAd(EditAdRequest) returns (EditAdResponse);
  rpc DeleteAd(DeleteAdRequest) returns (DeleteAdResponse);
  // Require an access token: count that the caller saw a shown ad in the
  // feed or followed its link (NotFound when it is not shown). ListAds
  // with all gives the counts to the administrators.
  rpc ViewAd(ViewAdRequest) returns (ViewAdResponse);
  rpc ClickAd(ClickAdRequest) returns (ClickAdResponse);
  // Require an access token of an administrator of the site
  // (PermissionDenied otherwise): blocks a page for a while or for good
  // and lifts the block ("Заблокировать пользователя" of openvk). A
  // blocked page shows others only its names, its photo and the block;
  // its access tokens work only for GetMe, which tells its owner why and
  // until when. An administrator is not blocked (FailedPrecondition).
  rpc BanUser(BanUserRequest) returns (google.protobuf.Empty);
  rpc UnbanUser(UnbanUserRequest) returns (google.protobuf.Empty);

  // Require an access token: deleting the caller's page ("Удаление
  // страницы" on openvk) and restoring it. A deleted page is hidden: others
  // see only its name and photo, nobody may follow it, write on its wall
  // or to it. Its owner may restore it until purge_at, when its data is
  // erased in every service. The access tokens of a deleted page work only
  // for GetMe and ReactivateAccount; on public methods they are anonymous.
  rpc DeactivateAccount(DeactivateAccountRequest) returns (DeactivateAccountResponse);
  rpc ReactivateAccount(ReactivateAccountRequest) returns (ReactivateAccountResponse);
  // Internal (auth): whether the page is deleted, for the access tokens
  // it issues; NotFound once its data is erased.
  rpc GetAccountState(GetAccountStateRequest) returns (GetAccountStateResponse);

  // Require an access token: the mine of the site. A dig of an ore takes
  // energy, which comes back with time, and gives ore and experience;
  // higher ores open with experience (FailedPrecondition "this ore needs
  // more experience", "not enough energy"; InvalidArgument "unknown ore").
  // A dig may meet an event: a nugget, a chest of votes paid at once, a
  // collapse or a drink of energy. SellOre sells all of an ore, or of every
  // ore without one, for votes out of the treasury — for pages a week old
  // with a filled profile (FailedPrecondition "ore is sold by pages a week
  // old with a filled profile", "not enough ore to sell").
  rpc GetMine(GetMineRequest) returns (MineState);
  rpc DigOre(DigOreRequest) returns (DigOreResponse);
  rpc SellOre(SellOreRequest) returns (SellOreResponse);
  // For the administrators (PermissionDenied for others): the ores, the
  // energy and the events of the mine, and how it does.
  rpc GetMineSettings(GetMineSettingsRequest) returns (GetMineSettingsResponse);
  rpc SetMine(SetMineRequest) returns (google.protobuf.Empty);

  // Require an access token: "Бизнес", the economy of the enterprises.
  // GetFirms is the whole city: the rules and the catalog, the quotes of
  // the goods, every enterprise with its storage, hours and shareholders,
  // the orders of the exchange, the orders of the city and its news. The
  // city counts itself hour by hour: each enterprise pays wages and upkeep
  // out of its cash, buys what it works with and sells what it makes by
  // itself as set, its machines wear, and things happen. RunFirms does an
  // action: "found" (kind, name — for votes into the treasury,
  // FailedPrecondition "not enough votes"), and for the director of
  // firm_id "rename" (name), "upgrade" (from its cash), "staff" (workers,
  // wage), "deposit" (votes), "dividend" (votes — to the shareholders by
  // their shares), "liquidate" (its worth to them), "auto" (good,
  // auto_buy, buy_max, auto_sell, sell_min), "order" (good, buy, price,
  // units — on the exchange), "cancel" (order_id), "state_buy" and
  // "state_sell" (good, units), "issue" (shares — put up on the stock
  // exchange), "repair", "improve" (improvement), "take_contract"
  // (contract_id) and "deliver" (contract_id, units). Taking votes out is
  // for pages a week old with a filled profile. Money of the enterprises
  // is in hundredths of a vote, of people — in votes.
  rpc GetFirms(GetFirmsRequest) returns (FirmsState);
  rpc RunFirms(RunFirmsRequest) returns (RunFirmsResponse);
  // Public: the enterprises nickname holds shares of, as its profile shows
  // them (NotFound for a page deleted or banned).
  rpc GetUserFirms(GetUserFirmsRequest) returns (GetUserFirmsResponse);
  // For the administrators (PermissionDenied for others): the prices of
  // the enterprises and the goods, and how they do.
  rpc GetFirmSettings(GetFirmSettingsRequest) returns (GetFirmSettingsResponse);
  rpc SetFirmSettings(SetFirmSettingsRequest) returns (google.protobuf.Empty);
  // Require an access token: "Акции", the stock exchange of the
  // enterprises. GetStocks is every company with its quote, the index,
  // the news and the account, shares and orders of the caller; firm_id is
  // the company looked at — its candles of the week and its order book.
  // RunStocks does an action of the caller: "account_deposit" and
  // "account_withdraw" (votes — the broker account; withdrawing is for
  // pages a week old with a filled profile), "stock_order" (firm_id, buy,
  // price in hundredths a share — 0 at any, shares) and "stock_cancel"
  // (order_id).
  rpc GetStocks(GetStocksRequest) returns (StocksState);
  rpc RunStocks(RunStocksRequest) returns (RunStocksResponse);

  // Require an access token: the bank of the caller. A deposit takes votes
  // into the treasury and grows by a percent a day up to the most a
  // deposit may be (FailedPrecondition "the deposit cannot be larger",
  // "not enough votes"); TakeDeposit gives back whole votes, all of them
  // with amount 0 ("there are not so many votes on the deposit"). A loan
  // lends votes out of the treasury, one at a time and up to a most
  // ("pay back the loan you have first", "the loan cannot be larger"), to
  // pages a week old with a filled profile ("loans are for pages a week
  // old with a filled profile"); it grows by a percent a day, and past its
  // term by a larger one, and the site takes it back of the balance and
  // the deposit itself. RepayLoan pays back amount, all of it with 0
  // ("you have no loan", "not enough votes"). Amounts below 1 —
  // InvalidArgument.
  rpc GetBank(GetBankRequest) returns (BankState);
  rpc PutDeposit(BankAmountRequest) returns (BankMoveResponse);
  rpc TakeDeposit(BankAmountRequest) returns (BankMoveResponse);
  rpc TakeLoan(BankAmountRequest) returns (BankMoveResponse);
  rpc RepayLoan(BankAmountRequest) returns (BankMoveResponse);
  // For the administrators (PermissionDenied for others): the rates and
  // limits of the bank, and how it does.
  rpc GetBankSettings(GetBankSettingsRequest) returns (GetBankSettingsResponse);
  rpc SetBankSettings(SetBankSettingsRequest) returns (google.protobuf.Empty);

  // "Гости страницы". VisitPage (access token) notes that the caller opened
  // the page of nickname: their last visit there, once a guest; own,
  // deleted pages and a guest with "Невидимка" of Prime leave none
  // (NotFound "user not found" for nobody). ListGuests (access token) are
  // the guests of the caller in the last 30 days, the last visit first;
  // its first page marks them seen, and GetMe tells how many came since.
  rpc VisitPage(VisitPageRequest) returns (google.protobuf.Empty);
  rpc ListGuests(ListGuestsRequest) returns (ListGuestsResponse);

  // "Рейтинги", public: a board of up to 50 pages — "rich" (the votes they
  // have), "miners", "business" and "casino" (the votes they earned so in
  // the last 7 days, less what they lost) and "pets" (the rating of their
  // pets). Deleted and banned pages are left out; an unknown board —
  // InvalidArgument.
  rpc ListTop(ListTopRequest) returns (ListTopResponse);

  // "Питомец": the pets of the caller (access token), up to ten a page,
  // each named by pet_id. AdoptPet takes the price of its kind into the
  // treasury (FailedPrecondition "you have too many pets", "not enough
  // votes"); FeedPet a meal
  // ("the pet is not hungry"); PlayPet is free, once in 30 minutes ("the
  // pet has played recently"). FightPet sets the pet on the pet of
  // nickname, or on one of a near rating without it ("there is nobody to
  // fight", "a pet does not fight itself"; the best pet of nickname
  // defends): a pet that is hungry or sad
  // does not fight ("the pet is too hungry to fight", "the pet is too sad
  // to fight"), nor more times a day than the shop says ("the pet has
  // fought enough today"); a win brings votes. Without a pet —
  // NotFound "pet not found". GetUserPet is public: the pets of nickname.
  rpc GetPet(GetPetRequest) returns (PetState);
  rpc GetUserPet(GetUserPetRequest) returns (GetUserPetResponse);
  rpc AdoptPet(AdoptPetRequest) returns (PetCareResponse);
  rpc FeedPet(FeedPetRequest) returns (PetCareResponse);
  rpc PlayPet(PlayPetRequest) returns (PetCareResponse);
  rpc RenamePet(RenamePetRequest) returns (PetCareResponse);
  rpc ReleasePet(ReleasePetRequest) returns (google.protobuf.Empty);
  rpc FightPet(FightPetRequest) returns (FightPetResponse);
  rpc ListPetFights(ListPetFightsRequest) returns (ListPetFightsResponse);
  // For the administrators (PermissionDenied for others): the shop of
  // pets and how they do.
  rpc GetPetSettings(GetPetSettingsRequest) returns (GetPetSettingsResponse);
  rpc SetPetSettings(SetPetSettingsRequest) returns (google.protobuf.Empty);

  // Titles: awards with a name and a picture the administrators give a
  // page, the same one as many times as they like. GetUserTitles is
  // public: the titles of nickname, the newest first (NotFound for a page
  // deleted or banned). GrantTitle and RevokeTitle are for the
  // administrators (PermissionDenied for others); the name is one line of
  // up to 40 characters, the icon one of "crown", "cup", "star", "laurel",
  // "shield", "flame", "diamond", "lightning" (InvalidArgument otherwise).
  rpc GetUserTitles(GetUserTitlesRequest) returns (GetUserTitlesResponse);
  rpc GrantTitle(GrantTitleRequest) returns (GrantTitleResponse);
  rpc RevokeTitle(RevokeTitleRequest) returns (google.protobuf.Empty);
}

message User {
  string id = 1;
  string name = 2;
  string surname = 3;
  string nickname = 4;
  string status = 5;
  Gender gender = 6;
  Relationship relationship = 7;
  Worldview worldview = 8;
  PoliticalViews political_views = 9;
  google.protobuf.Timestamp birthday = 10;
  string email = 11;
  // False right after the first sign-in, until UpdateProfile succeeds.
  bool profile_completed = 12;
  PrivacySettings privacy = 13;
  // Empty without a photo.
  string avatar_id = 14;
  // The owner deleted the page; it can be restored until purge_at.
  bool deactivated = 15;
  google.protobuf.Timestamp purge_at = 16;
  string hometown = 17;
  // Whom the relationship names; empty for nobody.
  string relationship_partner_id = 18;
  // Show the birthday without its year ("Показывать только день и месяц").
  bool hide_birth_year = 19;
  Contacts contacts = 20;
  Interests interests = 21;
  repeated ExtraField extra_fields = 22;
  google.protobuf.Timestamp registered_at = 23;
  // "Фон страницы": photos of the media service under the user, empty for
  // a side without one.
  string backdrop_left = 24;
  string backdrop_right = 25;
  // "Заполненность страницы" of openvk, in percent, and the parts missing
  // ("interests", "email", "telegram", "status", "city"). The percent
  // counts the rating vouchers gave and may pass 100.
  int32 completeness = 26;
  repeated string unfilled = 27;
  InterfaceSettings interface = 28;
  // "Баланс": the votes the user has.
  int64 votes = 29;
  // The user makes the vouchers.
  bool admin = 30;
  // The page is confirmed by the administrators: a checkmark by the name.
  bool verified = 31;
  // The administrators blocked the page: why and until when; unset when
  // it is not blocked.
  Ban ban = 32;
  reserved 33;
  reserved "foreign_agent";
  // The label the administrators put on the page; "" for none.
  string alert = 34;
  // Until when Freenet Prime lasts; unset without it.
  google.protobuf.Timestamp prime_until = 35;
  // "Невидимка" of Prime: others are not told when the user is online.
  bool prime_invisible = 36;
  // How the page is dressed with Prime; kept after Prime ends.
  PrimeStyle prime_style = 37;
  // The rating the user has, in percent: vouchers and "Повысить рейтинг"
  // give it.
  int32 rating = 38;
}

// Ban is a block of a page by the administrators of the site.
message Ban {
  string reason = 1;
  google.protobuf.Timestamp banned_at = 2;
  // Unset: for good.
  google.protobuf.Timestamp until = 3;
}

// InterfaceSettings are how the site looks to its owner ("Интерфейс").
message InterfaceSettings {
  // "square" (the default) or "round": how everyone's photos are shown.
  string avatar_style = 1;
  // "page" (the default) or "feed": where the site opens.
  string main_page = 2;
  // The links taken out of the left menu: "photos", "messages", "groups",
  // "feed", "notifications".
  repeated string hidden_menu = 3;
  // "default", "blue", "dark" or "gold" (the theme of Freenet Prime, set
  // with Prime only): the look of the whole site.
  string theme = 4;
  // Takes "Заполненность страницы" off the pages the owner reads.
  bool hide_rating = 5;
  // "blur" (the default), "hide" (blurred, and left out of the news) or
  // "show": posts marked as adult.
  string nsfw = 6;
  // "old" (the default) or "microblog": how posts are laid out.
  string post_view = 7;
  // The clock dates are read by, minutes east of UTC; unset for the
  // browser's own.
  optional int32 timezone_offset = 8;
}

message UpdateInterfaceRequest {
  InterfaceSettings interface = 1;
}

message UpdateInterfaceResponse {
  User user = 1;
}

// openvk's "Контактная информация"; every field optional.
message Contacts {
  string email = 1;
  // A Telegram username without "@".
  string telegram = 2;
  string website = 3;
  string city = 4;
  string address = 5;
}

// openvk's "Личная информация"; every field optional.
message Interests {
  string interests = 1;
  string music = 2;
  string films = 3;
  string shows = 4;
  string books = 5;
  string quotes = 6;
  string games = 7;
  string about = 8;
}

// A field of the page its owner names ("Дополнительно").
message ExtraField {
  string name = 1;
  string text = 2;
  FieldPlace place = 3;
}

// Where an additional field shows.
enum FieldPlace {
  FIELD_PLACE_UNSPECIFIED = 0;
  FIELD_PLACE_CONTACTS = 1;
  FIELD_PLACE_INTERESTS = 2;
}

// Which sensitive fields other users see in PublicProfile, all false
// (hidden) by default, and who may write on the wall.
message PrivacySettings {
  bool show_birthday = 1;
  bool show_relationship = 2;
  bool show_worldview = 3;
  bool show_political_views = 4;
  // Required in UpdatePrivacy; WALL_WRITE_FOLLOWING by default.
  WallWrite wall_write = 5;
  // Required in UpdatePrivacy; MESSAGES_WRITE_EVERYONE by default.
  MessagesWrite messages_write = 6;
  // Required in UpdatePrivacy; CLUBS_READ_EVERYONE by default.
  ClubsRead clubs_read = 7;
  // Required in UpdatePrivacy, everyone by default: who sees the page
  // ("Кому в интернете видно мою страницу", everyone or users), its
  // information, its albums and its follows.
  Audience page_read = 8;
  Audience info_read = 9;
  Audience photos_read = 10;
  Audience friends_read = 11;
  // Required in UpdatePrivacy, everyone by default: who sees when the
  // owner was last online after a long absence ("Кто видит мою
  // неактивность"); anyone sees a short one, as on openvk.
  Audience online_read = 12;
  // Notes are gone from the site.
  reserved 13;
  reserved "notes_read";
  // Who may add the owner to group chats ("Кто может добавлять меня в
  // чаты"); unspecified, as from a client that does not know it, is the
  // people the owner follows.
  MessagesWrite chats_invite = 14;
  // "Тип профиля: закрытый": only the owner and the people the owner
  // follows see the page.
  bool closed = 15;
  // Who sees the gifts ("Кому видны мои подарки"); unspecified, as from
  // a client that does not know it, is everyone.
  Audience gifts_read = 16;
  // Only people with Freenet Prime write to the user (but whom the user
  // wrote to first).
  bool messages_prime = 17;
  // Votes each message to the user costs, 0 for free, up to 1 000 000;
  // the user gets them (less the tax of sticker packs).
  int64 message_price = 18;
}

// Who sees a part of a page.
enum Audience {
  AUDIENCE_UNSPECIFIED = 0;
  AUDIENCE_EVERYONE = 1;
  // Signed-in people.
  AUDIENCE_USERS = 2;
  // The people the user follows.
  AUDIENCE_FOLLOWING = 3;
  AUDIENCE_ONLY_ME = 4;
}

// Who sees which communities a user is in besides the user.
enum ClubsRead {
  CLUBS_READ_UNSPECIFIED = 0;
  CLUBS_READ_EVERYONE = 1;
  // The people the user follows.
  CLUBS_READ_FOLLOWING = 2;
  CLUBS_READ_ONLY_ME = 3;
  // Signed-in people.
  CLUBS_READ_USERS = 4;
}

// Who may write private messages to a user. Whoever the user wrote to may
// answer whatever the setting.
enum MessagesWrite {
  MESSAGES_WRITE_UNSPECIFIED = 0;
  MESSAGES_WRITE_EVERYONE = 1;
  // The people the user follows.
  MESSAGES_WRITE_FOLLOWING = 2;
  MESSAGES_WRITE_NOBODY = 3;
}

// Who may write on a user's wall besides the user.
enum WallWrite {
  WALL_WRITE_UNSPECIFIED = 0;
  WALL_WRITE_EVERYONE = 1;
  // The people the user follows.
  WALL_WRITE_FOLLOWING = 2;
  WALL_WRITE_ONLY_ME = 3;
}

// Fields 7-10 are empty both when not set and when hidden by the owner.
message PublicProfile {
  string id = 1;
  string name = 2;
  string surname = 3;
  string nickname = 4;
  string status = 5;
  Gender gender = 6;
  Relationship relationship = 7;
  Worldview worldview = 8;
  PoliticalViews political_views = 9;
  google.protobuf.Timestamp birthday = 10;
  // Empty without a photo.
  string avatar_id = 11;
  // The owner deleted the page: only names and the photo are left.
  bool deactivated = 12;
  // The birthday is told without its year, which is then 2000.
  bool birth_year_hidden = 13;
  string hometown = 14;
  // Whom the relationship names; empty for nobody and when hidden.
  string relationship_partner_id = 15;
  Contacts contacts = 16;
  Interests interests = 17;
  repeated ExtraField extra_fields = 18;
  google.protobuf.Timestamp registered_at = 19;
  // The caller may not see the page: only the names, the pronouns and the
  // photo are told.
  bool page_hidden = 20;
  // The caller may not see its information, left empty (registered_at
  // too).
  bool info_hidden = 21;
  // When the user last visited the site ("был в сети"); unset if never
  // or hidden from the caller. Only GetProfile tells it.
  google.protobuf.Timestamp last_seen_at = 22;
  // The user visited within the last minutes ("Онлайн").
  bool online = 23;
  // "Фон страницы", as in User; none on a deleted or hidden page.
  string backdrop_left = 24;
  string backdrop_right = 25;
  // "Заполненность страницы", in percent; 0 on a deleted or hidden page.
  // Only GetProfile tells it.
  int32 completeness = 26;
  // The page is a closed one ("Закрытая страница"): those its owner
  // does not follow get it with page_hidden.
  bool closed = 27;
  // The page is confirmed by the administrators ("Подтверждённая
  // страница"): a checkmark by the name; told on a hidden page too, never
  // on a deleted one.
  bool verified = 28;
  // The administrators blocked the page: only the names and the photo are
  // told with it. Unset when it is not blocked.
  Ban ban = 29;
  reserved 30;
  reserved "foreign_agent";
  // The label the administrators put on the page (an orange one above
  // the name), "" for none: told as verified is.
  string alert = 31;
  // The user has Freenet Prime: a mark by the name, told as verified is.
  bool prime = 32;
  // How the page is dressed with Prime: only GetProfile tells it, of a
  // page open to the caller, while Prime lasts.
  PrimeStyle prime_style = 33;
}

enum Gender {
  GENDER_NONE = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
  // openvk's "они/их".
  GENDER_NEUTRAL = 3;
