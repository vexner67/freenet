}

// A pack of the "Магазин стикеров".
message StickerPack {
  string id = 1;
  // What it costs, in votes, once; 0 for a free one.
  int64 price = 2;
  // The names of its stickers, in the order they are shown.
  repeated string stickers = 3;
  // The caller has taken it, free or for votes.
  bool bought = 4;
  // It is among the caller's stickers.
  bool added = 5;
  // Who made it of their photos; empty for a pack of the site, whose name
  // and pictures the site knows.
  string author_id = 6;
  string name = 7;
  string about = 8;
  // The shop shows it; a pack of the site always.
  bool published = 9;
  // How many people have taken it, its author left out.
  int32 holders = 10;
}

message AddStickerPackRequest {
  string pack_id = 1;
}

message RemoveStickerPackRequest {
  string pack_id = 1;
}

message ListMyStickerPacksRequest {}

message ListMyStickerPacksResponse {
  // Newest first.
  repeated StickerPack packs = 1;
}

message CreateStickerPackRequest {
  string name = 1;
  string about = 2;
  // In votes, 0 for a free one.
  int64 price = 3;
  bool published = 4;
  // The caller's photos, in the order the stickers are shown.
  repeated string photo_ids = 5;
}

message CreateStickerPackResponse {
  StickerPack pack = 1;
}

message EditStickerPackRequest {
  string pack_id = 1;
  string name = 2;
  string about = 3;
  int64 price = 4;
  bool published = 5;
  // Photos of the caller to add after the stickers.
  repeated string add_photo_ids = 6;
  // Stickers to take out, by their photos.
  repeated string remove_photo_ids = 7;
}

message EditStickerPackResponse {
  StickerPack pack = 1;
  // The photos the pack no longer has, whose files go.
  repeated string removed_photo_ids = 2;
}

message DeleteStickerPackRequest {
  string pack_id = 1;
}

message DeleteStickerPackResponse {
  // The photos of the pack, whose files go.
  repeated string removed_photo_ids = 1;
}

message GetStickerAuthorsRequest {
  // Up to 100 sticker names.
  repeated string stickers = 1;
}

message GetStickerAuthorsResponse {
  // Sticker → the author whose photo it is; stickers of the site and
  // unknown ones are left out.
  map<string, string> authors = 1;
}

// OreVein is how an ore is mined: it opens at experience; a dig takes
// energy, gives from least to most of it and gain experience; a unit
// sells for price hundredths of a vote.
message OreVein {
  string ore = 1;
  int64 experience = 2;
  int64 least = 3;
  int64 most = 4;
  int64 price = 5;
  int64 gain = 6;
  int32 energy = 7;
}

// MineEvents are the chances of the events of a dig, each in 10000, and
// what they do.
message MineEvents {
  int32 nugget = 1;
  // How many times a nugget multiplies the ore.
  int32 nugget_times = 2;
  int32 chest = 3;
  // The votes of a chest.
  int64 chest_least = 4;
  int64 chest_most = 5;
  int32 collapse = 6;
  int32 drink = 7;
  // The energy a drink gives back.
  int32 drink_energy = 8;
}

message MineSettings {
  // All ores in order: stone, coal, iron, gold, diamond, crystal.
  repeated OreVein veins = 1;
  // The most energy a miner has.
  int32 energy = 2;
  // How long a point of energy takes to come back.
  int32 regen_seconds = 3;
  MineEvents events = 4;
}

// Miner is the caller in the mine now.
message Miner {
  int32 energy = 1;
  // How long the next point of energy takes, 0 when the energy is full.
  int32 next_energy_seconds = 2;
  int64 experience = 3;
  // Ore → the units mined and not sold yet.
  map<string, int64> backpack = 4;
  int64 digs = 5;
  // The votes taken out of the mine: sales and chests.
  int64 earned = 6;
}

message GetMineRequest {}

message MineState {
  MineSettings settings = 1;
  Miner miner = 2;
}

message DigOreRequest {
  string ore = 1;
}

message DigOreResponse {
  // The units of ore dug.
  int64 units = 1;
  // "", "nugget", "chest", "collapse" or "drink".
  string event = 2;
  // The votes of a chest and the balance after them; 0 without one.
  int64 votes = 3;
  int64 balance = 4;
  // The experience the dig gave.
  int64 experience = 5;
  MineState mine = 6;
}

message SellOreRequest {
  // Empty: every ore.
  string ore = 1;
}

message SellOreResponse {
  int64 units = 1;
  int64 votes = 2;
  int64 balance = 3;
  MineState mine = 4;
}

message GetMineSettingsRequest {}

message GetMineSettingsResponse {
  MineSettings settings = 1;
  // How the mine does: digs made, votes paid for ore and found in chests,
  // pages that dug.
  int64 digs = 2;
  int64 sold = 3;
  int64 chests = 4;
  int64 miners = 5;
}

message SetMineRequest {
  MineSettings settings = 1;
}

// FirmPlan is an enterprise as the administrators set it: the votes it
// costs to found, its next level costs times the level (from its cash),
// the levels, the workers a level seats and the upkeep of a level an hour
// in hundredths of a vote.
message FirmPlan {
  string kind = 1;
  int64 price = 2;
  int64 upgrade = 3;
  int32 levels = 4;
  int32 staff = 5;
  int64 upkeep = 6;
}

// GoodPlan is a good: its base price in hundredths of a vote a unit and
// the units a day that halve what the state and the city pay for it.
message GoodPlan {
  string good = 1;
  int64 base = 2;
  int64 norm = 3;
}

// FirmSettings are the enterprises and the goods in order, the standard
// wage an hour in hundredths, the fee of the exchange in percent, what
// the state pays (floor) and asks (ceiling) and the city pays (retail) in
// percent of the base, the hours of work the storage holds and the
// percent of the price a new enterprise has in its cash.
message FirmSettings {
  repeated FirmPlan plans = 1;
  repeated GoodPlan goods = 2;
  int64 wage = 3;
  int32 fee = 4;
  int32 floor = 5;
  int32 ceiling = 6;
  int32 retail = 7;
  int32 storage = 8;
  int32 capital = 9;
  // How many enterprises a page may direct.
  int32 max_firms = 10;
  // The shares an enterprise is founded with, the founder's.
  int64 founding_shares = 11;
  // The shares the exchange sells when an enterprise is founded.
  int64 float_shares = 12;
  // The most shares an enterprise may have.
  int64 max_shares = 13;
}

// FirmSpec is what an enterprise does: makes rate units of output a
// worker an hour of the inputs, or, a shop, sells rate units of each good
// it sells.
message FirmSpec {
  string kind = 1;
  int32 tier = 2;
  string output = 3;
  repeated FirmInput inputs = 4;
  repeated string sells = 5;
  map<string, double> rate = 6;
}

message FirmInput {
  string good = 1;
  int64 units = 2;
}

// GoodQuote is a good now, in hundredths a unit: what the state pays and
// asks, what the city pays the shops, the best orders of the exchange (0
// — none), the last deal there and the units traded in a day.
message GoodQuote {
  string good = 1;
  int64 state_bid = 2;
  int64 state_ask = 3;
  int64 city_price = 4;
  int64 best_bid = 5;
  int64 best_ask = 6;
  int64 last = 7;
  int64 volume = 8;
}

// FirmStock is a good an enterprise keeps: the units, how many it holds,
// those its orders wait for, and what it does with it by itself.
message FirmStock {
  string good = 1;
  int64 units = 2;
  int64 capacity = 3;
  int64 incoming = 4;
  bool auto_buy = 5;
  int64 buy_max = 6;
  bool auto_sell = 7;
  int64 sell_min = 8;
}

// FirmHour is an hour of an enterprise: units and hundredths of a vote,
// the workers hired and those who left for better pay.
message FirmHour {
  google.protobuf.Timestamp hour = 1;
  int64 made = 2;
  int64 bought = 3;
  int64 sold = 4;
  int64 income = 5;
  int64 purchases = 6;
  int64 wages = 7;
  int64 upkeep = 8;
  int64 fees = 9;
  int64 hired = 10;
  int64 left = 11;
}

message FirmHolder {
  string user_id = 1;
  int64 shares = 2;
}

// FirmImprovement is an improvement of an enterprise: its rank and the
// next rank's cost in hundredths (0 at the top).
message FirmImprovement {
  string kind = 1;
  int32 rank = 2;
  int64 cost = 3;
}

// Firm is an enterprise: the cash, what its orders keep (escrow), the
// upkeep an hour, the profit of the last day, its worth closed and the
// repair of its machines are in hundredths of a vote; the next level
// costs upgrade_cost votes (0 at the top). Its machines are worn by wear
// percent, its workers strike till idle_until; a share last went for
// price hundredths, and float of its new shares are up on the stock
// exchange.
message Firm {
  string id = 1;
  string kind = 2;
  string name = 3;
  string director_id = 4;
  google.protobuf.Timestamp founded_at = 5;
  int32 level = 6;
  int32 workers = 7;
  int64 wage = 8;
  int64 cash = 9;
  int64 escrow = 10;
  double productivity = 11;
  int32 seats = 12;
  int64 upgrade_cost = 13;
  int64 upkeep = 14;
  int64 profit = 15;
  int64 shares = 16;
  reserved 17;
  reserved "share_price";
  int64 worth = 18;
  repeated FirmStock stock = 19;
  repeated FirmHour hours = 20;
  repeated FirmHolder holders = 21;
  double wear = 22;
  int64 repair_cost = 23;
  google.protobuf.Timestamp idle_until = 24;
  repeated FirmImprovement improvements = 25;
  int64 price = 26;
  int64 float = 27;
  // forecast is the hour going on as it ends if nothing changes, and
  // forecast_cash the cash then; none while ended hours wait to be counted.
  FirmHour forecast = 28;
  int64 forecast_cash = 29;
  // wanted is the workers the enterprise seeks: workers and the vacancies.
  int32 wanted = 30;
}

// FirmLabour is the labour market of the city: its people, those working,
// the workers the enterprises seek and the wage they pay on average in
// hundredths an hour.
message FirmLabour {
  int32 people = 1;
  int32 employed = 2;
  int32 jobs = 3;
  int64 wage = 4;
}

// StockTender is an offer of user_id to buy shares of firm_id from their
// holders at price hundredths a share till until.
message StockTender {
  string id = 1;
  string firm_id = 2;
  string user_id = 3;
  int64 price = 4;
  int64 shares = 5;
  google.protobuf.Timestamp placed_at = 6;
  google.protobuf.Timestamp until = 7;
}

message ExchangeOrder {
  string id = 1;
  string firm_id = 2;
  string good = 3;
  bool buy = 4;
  int64 price = 5;
  int64 units = 6;
  google.protobuf.Timestamp placed_at = 7;
}

// FirmContract is an order of the city: units of a good at price
// hundredths a unit, open till deadline or, taken by firm_id, to deliver
// by it.
message FirmContract {
  string id = 1;
  string good = 2;
  int64 units = 3;
  int64 price = 4;
  google.protobuf.Timestamp posted = 5;
  google.protobuf.Timestamp deadline = 6;
  string firm_id = 7;
  int64 delivered = 8;
}

// FirmEvent is what happened in the city: to the enterprise firm_id, or
// to all of kinds (none — all of them), from start till end.
message FirmEvent {
  string id = 1;
  string kind = 2;
  string firm_id = 3;
  repeated string kinds = 4;
  google.protobuf.Timestamp start = 5;
  google.protobuf.Timestamp end = 6;
}

message GetFirmsRequest {}

message FirmsState {
  FirmSettings settings = 1;
  repeated FirmSpec catalog = 2;
  repeated GoodQuote quotes = 3;
  repeated Firm firms = 4;
  repeated ExchangeOrder orders = 5;
  reserved 6;
  reserved "offers";
  // When the city counts the next hour.
  google.protobuf.Timestamp next_hour = 7;
  repeated FirmContract contracts = 8;
  repeated FirmEvent news = 9;
  FirmLabour labour = 10;
  repeated StockTender tenders = 11;
}

message RunFirmsRequest {
  string action = 1;
  string firm_id = 2;
  string kind = 3;
  string name = 4;
  string good = 5;
  bool buy = 6;
  int64 price = 7;
  int64 units = 8;
  int32 workers = 9;
  int64 wage = 10;
  int64 votes = 11;
  int64 shares = 12;
  string order_id = 13;
  reserved 14;
  reserved "offer_id";
  bool auto_buy = 15;
  int64 buy_max = 16;
  bool auto_sell = 17;
  int64 sell_min = 18;
  string improvement = 19;
  string contract_id = 20;
}

message FirmDeal {
  string good = 1;
  int64 units = 2;
  int64 price = 3;
}

// RunFirmsResponse is the votes the caller spent and got and the balance
// after (0 when none moved), the enterprise founded, the deals of an
// order, and the city after.
message RunFirmsResponse {
  int64 spent = 1;
  int64 got = 2;
  int64 balance = 3;
  string firm_id = 4;
  repeated FirmDeal deals = 5;
  FirmsState firms = 6;
}

message GetStocksRequest {
  string firm_id = 1;
}

// StockCandle is an hour of a share's price in hundredths and the shares
// traded.
message StockCandle {
  google.protobuf.Timestamp hour = 1;
  int64 open = 2;
  int64 high = 3;
  int64 low = 4;
  int64 close = 5;
  int64 volume = 6;
}

// StockCompany is an enterprise on the stock exchange, in hundredths a
// share: its shares, those the exchange holds (pool) and of the
// enterprise (float); its worth (book) and with its profit (fair); the
// price now, what the exchange pays and asks, the best orders of people
// (0 — none), the price a day ago and the shares traded in a day; the
// profit of the last day in hundredths; its candles — of the week for the
// company looked at, of the day for the others.
message StockCompany {
  string firm_id = 1;
  string name = 2;
  string kind = 3;
  int32 level = 4;
  string director_id = 5;
  int64 shares = 6;
  int64 pool = 7;
  int64 float = 8;
  int64 book = 9;
  int64 fair = 10;
  int64 price = 11;
  int64 bid = 12;
  int64 ask = 13;
  int64 best_bid = 14;
  int64 best_ask = 15;
  int64 day_ago = 16;
  int64 volume = 17;
  int64 profit = 18;
  int32 holders = 19;
  repeated StockCandle candles = 20;
}

// StockIndexPoint is the index of the exchange at an hour, in hundredths
// of a point.
message StockIndexPoint {
  google.protobuf.Timestamp hour = 1;
  int64 value = 2;
}

// StockOrder is an order of shares at price hundredths a share (0 — at
// any).
message StockOrder {
  string id = 1;
  string firm_id = 2;
  bool buy = 3;
  int64 price = 4;
  int64 shares = 5;
  google.protobuf.Timestamp placed_at = 6;
}

// StockLevel is a price of the order book and the shares people wait to
// deal at it.
message StockLevel {
  int64 price = 1;
  int64 shares = 2;
  int32 orders = 3;
}

// StockHolding is shares of the caller: free are those no order of it
// holds.
message StockHolding {
  string firm_id = 1;
  int64 shares = 2;
  int64 free = 3;
}

// StocksState is the stock exchange: the companies, the index, the news
// of the city, the fee of a sale in percent, and for the caller its broker
// account in hundredths, shares and orders; bids and asks are the order
// book of firm_id, the better first; tenders are the offers to buy out
// shareholders.
message StocksState {
  repeated StockCompany companies = 1;
  repeated StockIndexPoint index = 2;
  repeated FirmEvent news = 3;
  int32 fee = 4;
  int64 account = 5;
  repeated StockHolding holdings = 6;
  repeated StockOrder orders = 7;
  string firm_id = 8;
  repeated StockLevel bids = 9;
  repeated StockLevel asks = 10;
  google.protobuf.Timestamp next_hour = 11;
  repeated StockTender tenders = 12;
}

// RunStocksRequest is an action on the stock exchange: order_id is the
// order cancelled or the offer sold to or taken back.
message RunStocksRequest {
  string action = 1;
  string firm_id = 2;
  bool buy = 3;
  int64 price = 4;
  int64 shares = 5;
  int64 votes = 6;
  string order_id = 7;
}

// RunStocksResponse is the votes the caller spent and got and the balance
// after (0 when none moved), what an order dealt at once — shares and
// hundredths, and the exchange after, looking at firm_id.
message RunStocksResponse {
  int64 spent = 1;
  int64 got = 2;
  int64 balance = 3;
  int64 shares = 4;
  int64 money = 5;
  StocksState stocks = 6;
}

message GetFirmSettingsRequest {}

// GetFirmSettingsResponse is the settings and how the enterprises do: how
// many there are, the votes people spent on them and got of them, and the
// fees of the exchange in hundredths.
message GetFirmSettingsResponse {
  FirmSettings settings = 1;
  int64 firms = 2;
  int64 spent = 3;
  int64 paid = 4;
  int64 fees = 5;
}

message SetFirmSettingsRequest {
  FirmSettings settings = 1;
}

// BankSettings are the rates of the bank, in hundredths of a percent a
// day, and its limits: the most a deposit grows to and a loan lends, in
// votes, and the term of a loan in days.
message BankSettings {
  int32 deposit_rate = 1;
  int64 deposit_most = 2;
  int32 loan_rate = 3;
  int64 loan_most = 4;
  int32 loan_days = 5;
  int32 penalty_rate = 6;
}

// BankAccount is the deposit and the loan of the caller now: the deposit
// and the debt in hundredths of a vote, what was borrowed and when it is
// due (unset without a loan).
message BankAccount {
  int64 deposit = 1;
  int64 debt = 2;
  int64 borrowed = 3;
  google.protobuf.Timestamp due_at = 4;
  bool overdue = 5;
}

message GetBankRequest {}

message BankState {
  BankSettings settings = 1;
  BankAccount account = 2;
}

message BankAmountRequest {
  // Votes; 0 takes the whole deposit or pays the whole loan back.
  int64 amount = 1;
}

message BankMoveResponse {
  // The votes moved and the balance after them.
  int64 votes = 1;
  int64 balance = 2;
  BankState bank = 3;
}

message GetBankSettingsRequest {}

message GetBankSettingsResponse {
  BankSettings settings = 1;
  // Votes on deposits and owed on loans, in hundredths, as counted last,
  // and how many pages have each.
  int64 deposits = 2;
  int64 depositors = 3;
  int64 debts = 4;
  int64 debtors = 5;
}

message SetBankSettingsRequest {
  BankSettings settings = 1;
}

message ListHoldemTablesRequest {
  // "public" (the default), "mine", "invited".
  string section = 1;
}

message ListHoldemTablesResponse {
  repeated HoldemTable tables = 1;
}

message CreateHoldemTableRequest {
  string name = 1;
  bool private = 2;
  int32 seats = 3;
  int64 big_blind = 4;
  int64 buy_in = 5;
}

message QuickHoldemRequest {
  int64 big_blind = 1;
  int64 buy_in = 2;
}

message HoldemTableRequest {
  string id = 1;
}

message SitHoldemTableRequest {
  string id = 1;
  // -1 — the first free seat.
  int32 seat = 2;
  int64 buy_in = 3;
}

message ActHoldemTableRequest {
  string id = 1;
  // "fold", "check", "call", "raise", "allin".
  string action = 2;
  // The bet a raise makes in all.
  int64 amount = 3;
}

message InviteHoldemTableRequest {
  string id = 1;
  repeated string nicknames = 2;
}

message HoldemTableResponse {
  // Absent when the table closed as the caller left it.
  HoldemTable table = 1;
  // The balance of the caller after the buy-in or the payout.
  int64 balance = 2;
}

// HoldemSeat is a seat as the viewer sees it; user_id is empty on a free
// one. Cards are the viewer's own and those shown at the showdown.
message HoldemSeat {
  string user_id = 1;
  int64 stack = 2;
  int64 bet = 3;
  repeated string cards = 4;
  bool has_cards = 5;
  bool folded = 6;
  bool all_in = 7;
  bool away = 8;
  bool leaving = 9;
  // The last action: "fold", "check", "call", "raise", "allin",
  // "small_blind", "big_blind"; empty for none.
  string last = 10;
  // What the seat won in the hand over.
  int64 won = 11;
  // The best hand of the cards seen ("pair", "flush"...) and its cards.
  string hand = 12;
  repeated string best = 13;
}

message HoldemTable {
  string id = 1;
  string name = 2;
  bool private = 3;
  string owner_id = 4;
  int64 big_blind = 5;
  int64 small_blind = 6;
  int64 min_buy_in = 7;
  int64 max_buy_in = 8;
  // "waiting", "preflop", "flop", "turn", "river", "showdown".
  string street = 9;
  int64 hand = 10;
  int32 button = 11;
  // The seat to act, -1 for none.
  int32 turn = 12;
  // Milliseconds until the turn passes or the next hand is dealt.
  int64 turn_ms = 13;
  repeated string board = 14;
  int64 pot = 15;
  int64 current_bet = 16;
  int64 version = 17;
  repeated HoldemSeat seats = 18;
  int32 players = 19;
  // The seat of the viewer, -1 for none; what they have to call and the
  // least and most bets of a raise, 0 when they cannot raise.
  int32 you = 20;
  int64 to_call = 21;
  int64 raise_least = 22;
  int64 raise_most = 23;
  bool invited = 24;
}

message VisitPageRequest {
