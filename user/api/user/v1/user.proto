message VoteOperation {
  string id = 1;
  // transfer, voucher, gift, stickers, casino, aim or stake.
  string kind = 2;
  // What came in (above zero) or went out (below).
  int64 amount = 3;
  // The votes after it.
  int64 balance = 4;
  // The other person of a transfer, a gift or a sticker pack; empty for
  // none or an erased page.
  string peer_id = 5;
  // The message of a transfer, the gift, the sticker pack (its ID for a
  // pack of the site, its name for one of a person) or the question of an
  // event.
  string note = 6;
  google.protobuf.Timestamp created_at = 7;
}

