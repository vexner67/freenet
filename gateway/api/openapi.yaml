  /api/v1/me/bank/{action}:
    post:
      summary: Put or take a deposit, take or repay a loan
      description: '`deposit` puts votes on the deposit (they go to the treasury), `withdraw` takes whole votes off it (0 — all), `loan` lends votes (one loan at a time, pages a week old with a filled profile), `repay` pays the loan back (0 or more than owed — all). Rate limit RATE_LIMIT_BANK.'
      security: [{ bearer: [] }]
      parameters:
        - { name: action, in: path, required: true, schema: { type: string, enum: [deposit, withdraw, loan, repay] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: integer, format: int64 }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  votes: { type: integer, format: int64, description: The votes moved }
                  balance: { type: integer, format: int64 }
                  bank: { $ref: "#/components/schemas/Bank" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { description: Unknown action }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { description: Too many requests }

  /api/v1/bank/settings:
