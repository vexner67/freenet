      responses:
        "200":
          description: One page of people
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/photo-comments/{id}/like:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Like a comment under a photo
      description: Idempotent, as the heart of a comment under a post. Only who may see the photo; nobody is notified.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Like" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Take the like back
      description: Idempotent.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Like" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/photo-comments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Delete a comment under a photo
      description: Its author, who uploaded the photo, the owner of the album or the admins of its community.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not yours to delete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/faves/posts:
    get:
      summary: The posts you like, newest like first ("Закладки")
      description: |
        openvk's "Понравившиеся записи": yours alone, nobody else reads
        them. Each post is shown as a wall shows it, with the beginning of
        its text; `total` counts the posts you like. Posts in an archive
        and those of deleted pages are left out of `posts`, still counted. `canPost` and `canSuggest` are not told.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of liked posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/faves/comments:
    get:
      summary: The comments under posts you like, newest like first
      description: |
        Each comment tells its post (`postId`) and carries the beginning of
        its text. Comments under posts in an archive are not listed, still
        counted; a comment whose author, or whose post's author or wall
        owner, deleted the page is left out of `comments`, still counted.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of liked comments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/faves/photos:
    get:
      summary: The photos of albums you like, newest like first
      description: |
        A photo whose uploader deleted the page, or whose album's owner no
        longer shows you their photos, is left out of `photos`, still
        counted in `total`.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of liked photos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumPhotoPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/gifts:
    get:
      summary: The catalogue of gifts ("Выбрать подарок")
      description: |
        No token needed. The collections ("Коллекции") and the names of
        their gifts, in the order they are shown. The catalogue is fixed;
        a gift costs the sender `prices[i]` votes ("голоса"), 0 for a
        free one: the administrators of the site price each gift, the
        rest cost their collection's `price`. The pictures are the
        site's, which knows a gift by its name.
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema:
                type: object
                required: [collections]
                properties:
                  collections:
                    type: array
                    items:
                      type: object
                      required: [id, gifts, price, prices]
                      properties:
                        id: { type: string, description: "The name of the collection, as `freenet`" }
                        price: { type: integer, minimum: 0, description: "What its gifts cost the sender unless priced otherwise, in votes; 0 is free" }
                        prime: { type: boolean, description: "Only those with Freenet Prime send its gifts: `this is for freenet prime only` (409) otherwise" }
                        gifts:
                          type: array
                          items: { type: string, description: "The name of a gift, as `rose`" }
                        prices:
                          type: array
                          description: What each of `gifts` costs now, in their order; empty from a server that does not know them
                          items: { type: integer, minimum: 0 }
                        supplies:
                          type: array
                          description: 'How many of each of `gifts` may ever be sent, in their order; 0 — no end'
                          items: { type: integer, minimum: 0 }
                        sold:
                          type: array
                          description: How many of each of `gifts` were sent, in their order
                          items: { type: integer, minimum: 0 }
                  models: { type: array, items: { $ref: "#/components/schemas/GiftTrait" }, description: The models a collectible may roll, commonest first }
                  backdrops: { type: array, items: { $ref: "#/components/schemas/GiftTrait" }, description: The backdrops, commonest first }
                  symbols: { type: array, items: { $ref: "#/components/schemas/GiftTrait" }, description: The symbols of the pattern, commonest first }
                  upgradePrice: { type: integer, description: What "Улучшить" costs, in votes }
                  transferPrice: { type: integer, description: What giving a collectible away costs, in votes }

  /api/v1/gifts/{gift}/supply:
    parameters:
      - name: gift
        in: path
        required: true
        schema: { type: string }
        description: The name of a gift, as `freenet_coin`
    put:
      summary: Limit the edition of a gift ("Тираж" in the admin panel)
      description: |
        For the administrators of the site: no more than `supply` of the
        gift are ever sent, 0 for no end. A limit below what was sent
        already sells nothing more.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supply]
              properties:
                supply: { type: integer, minimum: 0, maximum: 1000000000 }
      responses:
        "204": { description: Limited }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator of the site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/gifts/{gift}/price:
    parameters:
      - name: gift
        in: path
        required: true
        schema: { type: string }
        description: The name of a gift, as `rose`
    put:
      summary: Price a gift ("Подарки" of the admin panel)
      description: |
        For the administrators of the site: the gift costs `price` votes
        from now on, 0 makes it free. Gifts already sent are not touched.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price: { type: integer, minimum: 0 }
      responses:
        "204": { description: Priced }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator of the site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/users/{nickname}/gifts:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    get:
      summary: The gifts sent to a user ("Подарки"), the newest first
      description: |
        No token needed; whether you may see them is the user's `giftsRead`,
        and those of a deleted page or of a page hidden from you are hidden.
        A gift sent anonymously tells who sent it and what was said only to
        the one it was sent to and to its sender.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [gifts, nextCursor, total]
                properties:
                  gifts:
                    type: array
                    items: { $ref: "#/components/schemas/Gift" }
                  nextCursor: { type: string, description: Empty on the last page }
                  total: { type: integer, description: The gifts on all pages }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "403":
          description: "`this page is deleted`, `this page is hidden` or `this user's gifts are hidden`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Send the user a gift ("Отправить подарок")
      description: |
        Needs a filled-in profile. The user hears about it (`gift`), unless
        it is you. A deleted page takes no gifts, and neither does a page
        that does not show itself to you or one with a blacklist between you
        two, either way. You may send a gift to yourself. A gift of a paid
        collection takes its price from your votes (`votes` of GET
        /api/v1/me): 409 `not enough votes` when you have fewer. Limited per
        user.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [gift]
              properties:
                gift: { type: string, description: "The name of a gift of the catalogue" }
                caption: { type: string, maxLength: 250, description: "\"Ваше сообщение\"; may be left out" }
                anonymous:
                  type: boolean
                  description: "\"Анонимно\": only the user is told who sent the gift and what was said with it"
      responses:
        "201":
          description: The gift
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Gift" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`this page is deleted` or `you cannot send a gift to this user`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not enough votes`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/votes:
    get:
      summary: The statement of your votes ("Голоса")
      description: |
        Every change of your votes, newest first: transfers both ways,
        vouchers, gifts, sticker packs bought and sold, the casino and the
        stakes on events. `income` and `expense` are what came in and went
        out over the last 30 days.
      security: [{ bearer: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: "`nextCursor` of the previous page" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - name: flow
          in: query
          schema: { type: string, enum: ["", in, out] }
          description: "`in` for what came in, `out` for what went out"
      responses:
        "200":
          description: A page of the statement
          content:
            application/json:
              schema:
                type: object
                required: [operations, nextCursor, income, expense]
                properties:
                  operations:
                    type: array
                    items: { $ref: "#/components/schemas/VoteOperation" }
                  nextCursor: { type: string, description: Empty on the last page }
                  income: { type: integer, format: int64 }
                  expense: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/v1/me/vouchers:
    post:
      summary: Use a voucher ("Активировать ваучер")
      description: |
        A voucher gives the account that enters its serial number votes
        ("голоса", which pay for gifts), rating (percent added to
        `completeness` of the page) or both, once per account and to as
        many accounts as its makers allowed. Whatever is wrong with the
        voucher - there is none, it has run out, you have used it - the
        answer is the same 409 `voucher is not valid`. Limited per user.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, description: "The serial number: 24 letters and digits, in any case, with dashes and spaces or without" }
      responses:
        "200":
          description: What the voucher gave
          content:
            application/json:
              schema:
                type: object
                required: [votes, rating, balance]
                properties:
                  votes: { type: integer, description: The votes it gave }
                  rating: { type: integer, description: The percent of rating it gave }
                  balance: { type: integer, description: The votes you have now }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`voucher is not valid`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/users/{nickname}/votes:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Hand the user some of your votes ("Перевод голосов")
      description: |
        The user hears about it (`votes`). Not to yourself, not to a deleted
        page and not across a blacklist, either way. Limited per user.
        A fee of 3% of the votes, rounded up and at least 1, goes to the
        treasury on top: handing 100 costs 103.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [votes]
              properties:
                votes: { type: integer, minimum: 1 }
                note: { type: string, maxLength: 140, description: "The message with the transfer, one line; both statements show it" }
      responses:
        "200":
          description: Handed over
          content:
            application/json:
              schema:
                type: object
                required: [votes, fee]
                properties:
                  votes: { type: integer, description: The votes you have left }
                  fee: { type: integer, description: The fee paid on top of the votes }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`this page is deleted` or `you cannot transfer votes to this user`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not enough votes`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/vouchers:
    get:
      summary: The vouchers ("Ваучеры"), the newest first
      description: |
        Only for the administrators of the site (`admin` of GET /api/v1/me),
        named by the ADMIN_EMAILS of the user service; 403 to anyone else.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [vouchers, nextCursor]
                properties:
                  vouchers:
                    type: array
                    items: { $ref: "#/components/schemas/Voucher" }
                  nextCursor: { type: string, description: Empty on the last page }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Make a voucher
      description: Only for the administrators. A voucher gives votes, rating or both.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [usages]
              properties:
                code: { type: string, description: "The serial number, 24 letters and digits; left out or empty for a generated one" }
                votes: { type: integer, minimum: 0 }
                rating: { type: integer, minimum: 0, maximum: 1000000, description: Percent added to the page of whoever uses it }
                usages: { type: integer, description: "How many accounts may use it: 1-1000000, or -1 for any number" }
      responses:
        "201":
          description: The voucher
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Voucher" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`voucher with this serial number already exists`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/vouchers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Delete a voucher
      description: Only for the administrators. Nobody else can use it; what it gave stays given. Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/ads:
    get:
      summary: The ads of the global feed
      description: >-
        Public. The shown ads, newest first, which "Все новости" slips between
        its posts. With all=true every ad, hidden too — only for the
        administrators of the site.
      parameters:
        - name: all
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: The ads
          content:
            application/json:
              schema:
                type: object
                required: [ads]
                properties:
                  ads:
                    type: array
                    items: { $ref: "#/components/schemas/Ad" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: All the ads asked for by someone who is not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Make an ad
      description: >-
        Only for the administrators. The link gets https:// when the scheme is
        left out. The cover is an upload of the caller (POST /me/photos), kept
        for good; it goes if the ad is refused. 409 when the site has 100 ads.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, title]
              properties:
                url: { type: string, maxLength: 2048 }
                title: { type: string, maxLength: 100 }
                text: { type: string, maxLength: 500 }
                photo: { type: string, format: uuid, description: The cover; empty for none }
                active: { type: boolean, description: Shown in the feed }
      responses:
        "201":
          description: The ad
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ad" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The site has as many ads as it keeps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/ads/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Change an ad
      description: >-
        Only for the administrators. Changes what the body names. photo is a new
        upload of the caller, whose file replaces the old cover (which goes), or
        "" to take the cover away; the cover the ad has is not named again.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, maxLength: 2048 }
                title: { type: string, maxLength: 100 }
                text: { type: string, maxLength: 500 }
                photo: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: The ad as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ad" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such ad
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Delete an ad
      description: Only for the administrators. The cover goes with it.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such ad
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/ads/{id}/views:
    post:
      summary: Count that you saw the ad in the feed
      description: >-
        Counts that the caller saw the ad in the feed, for the stats of the administrators:
        how often and by how many people. Only a shown ad is counted.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Counted }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: No such shown ad
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/ads/{id}/clicks:
    post:
      summary: Count that you followed the link of the ad
      description: >-
        Counts that the caller followed the link of the ad, for the stats of the administrators:
        how often and by how many people. Only a shown ad is counted.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Counted }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: No such shown ad
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/vote-rate:
    get:
      summary: What a vote is worth
      description: Public. The rate the site tells people, in kopecks for one vote; 700 (7 ₽) until the administrators set another.
      responses:
        "200":
          description: The rate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoteRate" }
    put:
      summary: Set what a vote is worth
      description: Only for the administrators of the site.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoteRate" }
      responses:
        "204": { description: Set }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/treasury:
    get:
      summary: The treasury of the site
      description: 'Public. Every vote given — the daily bonus, vouchers, wins of the casino, payouts of events, wages — comes out of the treasury, and every vote spent goes into it; transfers between people go past it. It has no bottom: `votes` is what it has taken more than paid since it was made with 25000, below zero when it has paid more.'
      responses:
        "200":
          description: The treasury
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Treasury" }

  /api/v1/economy:
    put:
      summary: Set the economy of the site
      description: Only for the administrators of the site. The daily bonus and the fees in percent; GET /api/v1/treasury says them.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Economy" }
      responses:
        "204": { description: Set }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/bonus:
    get:
      summary: The caller's daily bonus
      description: What the bonus gives (the administrators set it), whether the caller took it today (a Moscow day) and whether they may take it at all.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The bonus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bonus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      summary: Take the daily bonus
      description: 'Once a Moscow day, for a page a week old with a filled profile, not deleted and not banned: `the bonus is for pages a week old with a filled profile`, `the bonus is taken today` (409).'
      security: [{ bearer: [] }]
      responses:
        "200":
          description: What the bonus gave
          content:
            application/json:
              schema:
                type: object
                required: [votes, balance]
                properties:
                  votes: { type: integer, format: int64 }
                  balance: { type: integer, format: int64, description: What the caller has now }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/rating:
    post:
      summary: Raise your rating ("Повысить рейтинг")
      description: '3 votes a percent, into the treasury; the rating goes up to 1000% at most: `the rating cannot go above 1000 percent` (409). Limited per user.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [percent]
              properties:
                percent: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: Raised
          content:
            application/json:
              schema:
                type: object
                required: [balance, rating]
                properties:
                  balance: { type: integer, format: int64, description: The votes you have now }
                  rating: { type: integer, description: Your rating now, in percent }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/prime:
    get:
      summary: What Freenet Prime costs
      description: Public. The prices of a month, a quarter and a year of Freenet Prime, in votes; the administrators set them.
      responses:
        "200":
          description: The prices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrimePrices" }

  /api/v1/prime/prices:
    put:
      summary: Price Freenet Prime
      description: Only for the administrators of the site (403 otherwise); each price is 1 to 1000000 votes.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrimePrices" }
      responses:
        "204": { description: Priced }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }

  /api/v1/me/prime:
    post:
      summary: Buy Freenet Prime for yourself
      description: 'The votes go to the treasury, and the period adds to what is left of your subscription. Not enough votes — `not enough votes` (409). Limited per user.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrimeOrder" }
      responses:
        "200":
          description: Bought
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrimePurchase" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/prime/invisible:
    put:
      summary: Turn «Невидимка» of Freenet Prime on or off
      description: 'While it is on, others are not told when you are online or were last seen, and the stories you watch do not count you. Turning it on takes Prime: `this is for freenet prime only` (409).'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invisible]
              properties:
                invisible: { type: boolean }
      responses:
        "204": { description: Set }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/me/prime/style:
    put:
      summary: Dress your page with Freenet Prime
      description: 'The colour of the name, the frame of the photo, the pattern behind the page and the mood by the status, all at once; "" for the name and the frame is the default. Others see it while Prime lasts. Any style but the default one takes Prime: `this is for freenet prime only` (409).'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrimeStyle"
      responses:
        "204": { description: Set }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/users/{nickname}/prime:
    post:
      summary: Give Freenet Prime as a present
      description: 'Refused where a gift would be: `you cannot send a gift to this user` (403), `this page is deleted` (409). The recipient hears of it (`prime`).'
      security: [{ bearer: [] }]
      parameters:
        - { name: nickname, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrimeOrder" }
      responses:
        "200":
          description: Given; `until` is the recipient's
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrimePurchase" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/decor:
    get:
      summary: The New Year decoration of the site
      description: 'Public. Whether the site wears the New Year decoration now — snow, a garland under the header, a hat on the logo — and what the administrators set: `auto` (by the calendar of Moscow, from December 15 to January 14), `on` or `off`.'
      responses:
        "200":
          description: The decoration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decor" }
    put:
      summary: Turn the New Year decoration on or off
      description: Only for the administrators of the site.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [auto, "on", "off"] }
      responses:
        "204": { description: Set }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/casino:
    get:
      summary: The casino of the site
      description: 'Public. What a spin costs and the votes each prize gives (0 — nothing). The odds are not told: the administrators tune them.'
      responses:
        "200":
          description: The casino
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Casino" }
    put:
      summary: Change the casino
      description: 'Only for the administrators of the site: the price of a spin and 2–12 prizes with their weights — a prize is as likely as its weight among all weights.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price, prizes]
              properties:
                price: { type: integer, format: int64, minimum: 1 }
                prizes:
                  type: array
                  minItems: 2
                  maxItems: 12
                  items: { $ref: "#/components/schemas/CasinoPrize" }
      responses:
        "204": { description: Set }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/casino/settings:
    get:
      summary: The casino with its odds
      description: 'Only for the administrators: the prizes with their weights and how the casino does — spins made, votes spent on them and won.'
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                type: object
                required: [price, prizes, spins, spent, won, bets, wagers, rocket, rockets, jackpot]
                properties:
                  price: { type: integer, format: int64 }
                  prizes:
                    type: array
                    items: { $ref: "#/components/schemas/CasinoPrize" }
                  spins: { type: integer, format: int64 }
                  spent: { type: integer, format: int64 }
                  won: { type: integer, format: int64 }
                  bets: { $ref: "#/components/schemas/CasinoBets" }
                  wagers:
                    type: object
                    description: How the bets do
                    required: [count, spent, won]
                    properties:
                      count: { type: integer, format: int64, description: Bets made }
                      spent: { type: integer, format: int64, description: Votes bet }
                      won: { type: integer, format: int64, description: Votes won }
                  rocket: { $ref: "#/components/schemas/CasinoRocket" }
                  rockets:
                    type: object
                    description: How "Ракетка" does
                    required: [count, spent, won]
                    properties:
                      count: { type: integer, format: int64, description: Rounds launched }
                      spent: { type: integer, format: int64, description: Votes bet }
                      won: { type: integer, format: int64, description: Votes paid }
                  jackpot: { type: integer, format: int64, description: The win the site celebrates over the whole screen }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/casino/spins:
    post:
      summary: Spin the casino
      description: 'Takes the price of a spin from your votes and pays the prize, at once. Rate limited.'
      security: [{ bearer: [] }]
      responses:
        "200":
          description: What the spin won
          content:
            application/json:
              schema:
                type: object
                required: [prize, votes, balance]
                properties:
                  prize: { type: integer, description: The index of the prize won }
                  votes: { type: integer, format: int64, description: The votes it won }
                  balance: { type: integer, format: int64, description: Your votes after the spin }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/casino/bets:
    put:
      summary: Change the bets of the casino
      description: 'Only for the administrators of the site: the least and the most of a bet (1–100000000) and 1–10 different multipliers, each with the chance it wins with.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [least, most, multipliers]
              properties:
                least: { type: integer, format: int64, minimum: 1 }
                most: { type: integer, format: int64 }
                multipliers:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { $ref: "#/components/schemas/AimMultiplier" }
      responses:
        "204": { description: Set }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/casino/wagers:
    post:
      summary: Bet in the casino
      description: 'Bets your votes on a multiplier: the bet comes back multiplied (rounded down) or not at all, at once. Rate limited, with the spins'' limit counted apart.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, multiplier]
              properties:
                amount: { type: integer, format: int64, description: The votes bet, within the limits of the casino }
                multiplier: { type: integer, description: 'One of the multipliers of the casino, in hundredths: 200 — ×2' }
      responses:
        "200":
          description: How the bet went
          content:
            application/json:
              schema:
                type: object
                required: [won, roll, chance, votes, balance]
                properties:
                  won: { type: boolean }
                  roll: { type: integer, description: 'The roll, 0–9999: the bet wins when it falls in the middle, chance wide — from (10000 - chance) / 2' }
                  chance: { type: integer, description: The chance of the bet, of 10000 }
                  votes: { type: integer, format: int64, description: The votes it won; 0 when it lost }
                  balance: { type: integer, format: int64, description: Your votes after the bet }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/casino/rocket:
    put:
      summary: Change "Ракетка"
      description: 'Only for the administrators of the site: the least and the most of a bet (1–100000000), the return — what the rocket gives back of the bets on average, in hundredths of a percent (1–10000) — and its top multiplier in hundredths (200–1000000), where it explodes whatever was drawn.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CasinoRocket" }
      responses:
        "204": { description: Set }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/casino/jackpot:
    put:
      summary: Change the jackpot
      description: 'Only for the administrators of the site: the win, in votes (1–1000), from which the site celebrates over the whole screen.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [jackpot]
              properties:
                jackpot: { type: integer, format: int64, minimum: 1 }
      responses:
        "204": { description: Set }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/casino/rockets:
    post:
      summary: Launch a rocket
      description: 'Takes your votes and launches a rocket whose multiplier grows from ×1 as 100·e^(0.00012·ms) (×2 in about 5.8 s). The server draws where it explodes at the launch and tells it only once the round is over. Cash it (`POST …/cash`) before it explodes and the bet comes back multiplied by what it shows then; with `auto` it cashes by itself at that multiplier, and the round is over at once. Rate limited, with the casino''s limit counted apart.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, format: int64, description: The votes bet, within the limits of the rocket }
                auto: { type: integer, description: 'The multiplier to cash at by itself, in hundredths, from 101 to the top; 0 or none — by hand' }
      responses:
        "200":
          description: The round
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RocketRound" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/casino/rockets/{id}:
    get:
      summary: A round of yours as it is now
      description: The page asks while the rocket flies, to learn it exploded. `balance` is 0 here.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The round
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RocketRound" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/casino/rockets/{id}/cash:
    post:
      summary: Cash a rocket
      description: 'Takes the bet back at the multiplier the rocket shows now, by the clock of the server. Too late — the round comes back `crashed`, without a win. 409 for a round cashed already or cashing by itself. Rate limited.'
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The round
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RocketRound" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/casino/poker:
    get:
      summary: The poker table
      description: '"Покер": Casino Hold''em against the dealer. The limits of the ante and the pays of the ante to one by the hand of the player (`pays`: straight, flush, full house, four of a kind, straight flush, royal flush) and, with a token, your hand waiting for the call or the fold (`dealt`, null without).'
      security: [{}, { bearer: [] }]
      responses:
        "200":
          description: The table
          content:
            application/json:
              schema:
                type: object
                required: [poker, dealt]
                properties:
                  poker: { $ref: "#/components/schemas/Poker" }
                  dealt:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/PokerHand" }]

  /api/v1/casino/poker/hands:
    post:
      summary: Deal a hand of poker
      description: 'Takes the ante and deals two cards to you, two to the dealer (closed) and the flop. Then call (twice the ante) or fold. 400 for an ante out of the limits, 409 without votes or with a hand waiting already. Rate limited.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ante]
              properties:
                ante: { type: integer, format: int64 }
      responses:
        "200":
          description: The hand dealt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PokerHand" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/casino/poker/hands/{id}/{action}:
    post:
      summary: Call or fold a hand of poker
      description: '`call` pays twice the ante and opens the dealer and the board. The dealer plays with a pair of fours or better: when he does not, the ante is paid by its pay and the call comes back (`unqualified`); when he does, the better hand wins — the ante by its pay and the call one to one (`won`), both bets back on a tie (`tied`), nothing on a loss (`lost`). `fold` gives the hand up, the ante lost. 404 for a hand not yours or an unknown action, 409 for a hand over. Rate limited.'
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [call, fold] } }
      responses:
        "200":
          description: The hand over
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PokerHand" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/casino/poker/settings:
    get:
      summary: The poker settings
      description: For the administrators of the site (403 for others) — the table and how it does.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                type: object
                required: [poker, hands, spent, won]
                properties:
                  poker: { $ref: "#/components/schemas/Poker" }
                  hands: { type: integer, format: int64 }
                  spent: { type: integer, format: int64 }
                  won: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    put:
      summary: Change the poker settings
      description: For the administrators of the site (403 for others) — the limits of the ante (the most up to a third of the biggest bet) and six pays, each from 1 to 10000.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Poker" }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }

  /api/v1/casino/tables:
    get:
      summary: Poker tables
      description: 'No-limit Texas Hold''em of people. `section`: `public` (the default; the open tables, the fullest first), `mine` (the tables you sit at), `invited` (private tables you are invited to). Up to 50.'
      parameters:
        - { name: section, in: query, schema: { type: string, enum: [public, mine, invited] } }
      responses:
        "200":
          description: The tables
          content:
            application/json:
              schema:
                type: object
                required: [tables]
                properties:
                  tables: { type: array, items: { $ref: "#/components/schemas/HoldemTable" } }
        "400": { $ref: "#/components/responses/InvalidArgument" }
    post:
      summary: Open a poker table
      description: 'Opens a table of 2 to 9 seats with the big blind (2 and up; the small one is half) and seats you with the buy-in — from 20 to 200 big blinds, taken from your votes. A private table is seen and sat at by its owner, the invited and those sitting. 400 for wrong settings, 409 without votes. Rate limited.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats, bigBlind, buyIn]
              properties:
                name: { type: string }
                private: { type: boolean }
                seats: { type: integer }
                bigBlind: { type: integer, format: int64 }
                buyIn: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/HoldemSeat" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/casino/tables/quick:
    post:
      summary: A quick poker game
      description: 'Seats you at the fullest open table of the big blind (2, 10, 50, 200 or 1000) with a free seat, or opens one of six seats. 400 for another big blind or a buy-in out of the limits, 409 without votes. Rate limited.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bigBlind, buyIn]
              properties:
                bigBlind: { type: integer, format: int64 }
                buyIn: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/HoldemSeat" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/casino/tables/{id}:
    get:
      summary: A poker table
      description: 'The table as you see it: your cards and those shown at the showdown. It moves on as it is read — a turn passes after 30 s (a check when it costs nothing, else a fold; two missed turns sit the player out, five minutes out stand them up with their chips), a hand is dealt 6 s after the last. With `version` equal to the table''s while a turn runs, only `{version, turnMs, same: true}`. 404 for an unknown table or a private one not yours.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HoldemTable" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/casino/tables/{id}/seat:
    post:
      summary: Sit at a poker table
      description: '`seat` from 0, or absent for the first free one; the buy-in is taken from your votes. 409 for a full table, a taken seat, sitting already, a private table you are not invited to or without votes. Rate limited.'
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buyIn]
              properties:
                seat: { type: integer }
                buyIn: { type: integer, format: int64 }
      responses:
        "200": { $ref: "#/components/responses/HoldemSeat" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Leave a poker table
      description: 'Your chips come back as votes; in a hand you fold first. The table closes when nobody sits at it — `table` is null then. 409 when you do not sit at it.'
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/HoldemSeat" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/casino/tables/{id}/actions:
    post:
      summary: Act at a poker table
      description: '`fold`, `check`, `call`, `raise` (`amount` — the bet in all, from `raiseLeast` to `raiseMost`), `allin`. 400 for a raise out of the limits, 409 out of turn or for an action not possible now.'
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [fold, check, call, raise, allin] }
                amount: { type: integer, format: int64 }
      responses:
        "200":
          description: The table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HoldemTable" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/casino/tables/{id}/back:
    post:
      summary: Come back to a poker table
      description: A player sat out comes back into the next hands. 409 when you do not sit at it.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HoldemTable" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/casino/tables/{id}/invitations:
    post:
      summary: Invite people to a poker table
      description: 'By nicknames (unknown ones are skipped), up to 50 a table; the owner and those sitting invite. 409 for others. Rate limited.'
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nicknames]
              properties:
                nicknames: { type: array, items: { type: string } }
      responses:
        "200":
          description: The table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HoldemTable" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/mine:
    get:
      summary: Your mine
      description: '"Шахта": the ores of the mine with what each needs, yields and pays, and your miner — energy (it comes back by itself, a point each `regenSeconds`; `nextEnergySeconds` till the next, 0 when full), experience, the ore in the backpack, digs and the votes the ore earned. A page that never dug starts with full energy.'
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The mine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MineState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/mine/digs:
    post:
      summary: Dig ore
      description: 'Spends the energy of a dig of the ore and gives from `least` to `most` units of it into the backpack and `gain` experience. An ore opens with its experience (409 before). A dig may meet an event: `nugget` — the ore times `nuggetTimes`, `chest` — votes from the treasury at once, `collapse` — nothing found, `drink` — energy back. 409 without energy. Rate limited.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ore]
              properties:
                ore: { type: string, enum: [stone, coal, iron, gold, diamond, crystal] }
      responses:
        "200":
          description: What the dig gave
          content:
            application/json:
              schema:
                type: object
                properties:
                  units: { type: integer, format: int64 }
                  event: { type: string, enum: ["", nugget, chest, collapse, drink] }
                  votes: { type: integer, format: int64, description: The votes of a chest, 0 without one }
                  balance: { type: integer, format: int64, description: Your votes after a chest, 0 without one }
                  experience: { type: integer, format: int64, description: The experience the dig gave }
                  mine: { $ref: "#/components/schemas/MineState" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/mine/sales:
    post:
      summary: Sell ore
      description: 'Sells all of an ore from the backpack, or of every ore with `ore` empty, for `price` hundredths of a vote a unit out of the treasury (rounded down; what does not make a whole vote stays). Only for pages a week old with a filled profile, and 409 with nothing to sell. Rate limited.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ore: { type: string, description: The ore; empty — all }
      responses:
        "200":
          description: What the sale gave
          content:
            application/json:
              schema:
                type: object
                properties:
                  units: { type: integer, format: int64 }
                  votes: { type: integer, format: int64 }
                  balance: { type: integer, format: int64 }
                  mine: { $ref: "#/components/schemas/MineState" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/firms:
    get:
      summary: The economy of the enterprises
      description: '"Бизнес": the settings and what each enterprise does, the quotes of the goods, every enterprise with its storage, last hours and shareholders, the orders of the exchange and the offers of shares. The city counts itself hour by hour at `nextHour`: each enterprise pays wages and upkeep from its cash (working as much less as it lacks), buys what it works with from the state and sells what it makes to the state — a shop to the city — as its `stock` says. Money of the enterprises is in hundredths of a vote, of people (deposits, dividends, prices of shares) in votes.'
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The city
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Firms" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/firms/{action}:
    post:
      summary: Act in the economy
      description: '`found` founds an enterprise of `kind` named `name` (1–40 characters) for its price, into the treasury: you hold its 100 shares and direct it; at most 10 directed. For the director of `firm`: `rename` (`name`), `upgrade` (paid from its cash), `staff` (`workers` up to the seats, `wage` in hundredths from half to three times the standard), `deposit` (`votes` into its cash), `dividend` (`votes` of its cash to the shareholders by their shares), `liquidate` (its worth to the shareholders; its goods are lost), `auto` (for `good`: `autoBuy` from the state paying at most `buyMax`, `autoSell` taking at least `sellMin`), `order` (`good`, `buy`, `price` in hundredths, `units` — on the exchange; what meets other orders changes hands at their price at once, the seller paying the fee), `cancel` (`order`), `state_buy` and `state_sell` (`good`, `units` — with the state at once), `issue` (`shares` new at `votes` each, into its cash). For a shareholder: `offer` (`shares` at `votes` each, in place of the last offer). For anyone: `cancel_offer` (`offer`, yours or an issue you direct) and `buy_shares` (`offer`, `shares`). The largest shareholder directs. Taking votes out (`dividend`, `liquidate`, `offer`) is for pages a week old with a filled profile. Rate limited.'
      security: [{ bearer: [] }]
      parameters:
        - { name: action, in: path, required: true, schema: { type: string, enum: [found, rename, upgrade, staff, deposit, dividend, liquidate, auto, order, cancel, state_buy, state_sell, offer, issue, cancel_offer, buy_shares] } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firm: { type: string, description: The ID of the enterprise }
                kind: { type: string, enum: [farm, mine, oilrig, forestry, mill, steelworks, chemworks, sawmill, bakery, joinery, electroplant, shop] }
                name: { type: string }
                good: { type: string, enum: [grain, ore, oil, wood, flour, metal, plastic, boards, bread, furniture, electronics] }
                buy: { type: boolean }
                price: { type: integer, format: int64, description: Hundredths of a vote a unit }
                units: { type: integer, format: int64 }
                workers: { type: integer }
                wage: { type: integer, format: int64, description: Hundredths of a vote an hour }
                votes: { type: integer, format: int64 }
                shares: { type: integer, format: int64 }
                order: { type: string, description: The ID of an order }
                offer: { type: string, description: The ID of an offer of shares }
                autoBuy: { type: boolean }
                buyMax: { type: integer, format: int64 }
                autoSell: { type: boolean }
                sellMin: { type: integer, format: int64 }
      responses:
        "200":
          description: What the action did
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirmDone" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/firm/settings:
    get:
      summary: The enterprises for the administrators
      description: 'Only for the administrators of the site: the prices of the enterprises and the goods, and how they do — enterprises open, votes spent on them and got of them, fees of the exchange in hundredths.'
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The settings and the stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/FirmSettings" }
                  firms: { type: integer, format: int64 }
                  spent: { type: integer, format: int64 }
                  paid: { type: integer, format: int64 }
                  fees: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      summary: Change the enterprises
      description: 'Only for the administrators of the site: all enterprises and goods in order, the standard wage, the fee (0–50 %), the prices of the state and the city in percent of the base (the state buying below what it sells), the hours the storage holds (1–720) and the capital of a new enterprise (0–100 % of its price).'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FirmSettings" }
      responses:
        "204": { description: Set }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

