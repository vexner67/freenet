  /api/v1/topic-messages/{id}/like:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Like a message of a topic
      description: Idempotent, as the heart of a comment; its author is notified (topic_message_like), unless it was written on behalf of the community.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Like" }
