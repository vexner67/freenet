  /api/v1/users/{nickname}/visits:
    post:
      summary: Visit a page
      description: '"Гости": the site calls it when you open a page of another person; the owner sees you among the guests for 30 days, the last visit only. Freenet Prime "Невидимка" leaves no trace, nor does your own page, a deleted or a banned one. Rate limited.'
