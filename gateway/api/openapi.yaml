        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{nickname}/albums:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    get:
      summary: A person's photo albums ("Альбомы"), newest first
      description: |
        Those of a deleted page are gone, as its wall (403), and so are
