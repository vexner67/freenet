      responses:
        "200": { $ref: "#/components/responses/Like" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/photo-comments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Delete a comment under a photo
      description: Its author, who uploaded the photo, the owner of the album or the admins of its community.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not yours to delete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/faves/posts:
    get:
      summary: The posts you like, newest like first ("Закладки")
      description: |
        openvk's "Понравившиеся записи": yours alone, nobody else reads
        them. Each post is shown as a wall shows it, with the beginning of
        its text; `total` counts the posts you like. Posts in an archive
        and those of deleted pages are left out of `posts`, still counted. `canPost` and `canSuggest` are not told.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of liked posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/faves/comments:
    get:
      summary: The comments under posts you like, newest like first
      description: |
        Each comment tells its post (`postId`) and carries the beginning of
        its text. Comments under posts in an archive are not listed, still
        counted; a comment whose author, or whose post's author or wall
        owner, deleted the page is left out of `comments`, still counted.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of liked comments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/faves/photos:
    get:
      summary: The photos of albums you like, newest like first
      description: |
        A photo whose uploader deleted the page, or whose album's owner no
        longer shows you their photos, is left out of `photos`, still
        counted in `total`.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of liked photos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumPhotoPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/posts:
    get:
      summary: The posts you wrote, newest first ("Написанные мной записи")
      description: |
        What you wrote on your wall and on the walls of others, people and
        communities, with the beginnings of the texts; `total` counts it.
        Not what was archived on the wall of another, nor what you
        suggested for a community and its admins published. A post on the
        wall of a deleted page is left out of `posts`, still counted.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of your posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/gifts:
    get:
      summary: The catalogue of gifts ("Выбрать подарок")
      description: |
        No token needed. The collections ("Коллекции") and the names of
        their gifts, in the order they are shown. The catalogue is fixed;
        the gifts of a collection cost the sender its `price` in votes
        ("голоса"), 0 for a free one. The pictures are the site's, which
        knows a gift by its name.
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema:
                type: object
                required: [collections]
                properties:
                  collections:
                    type: array
                    items:
                      type: object
                      required: [id, gifts, price]
                      properties:
                        id: { type: string, description: "The name of the collection, as `flowers`" }
                        price: { type: integer, minimum: 0, description: "What each of its gifts costs the sender, in votes; 0 is free" }
                        gifts:
                          type: array
                          items: { type: string, description: "The name of a gift, as `rose`" }

  /api/v1/users/{nickname}/gifts:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    get:
      summary: The gifts sent to a user ("Подарки"), the newest first
      description: |
        No token needed; whether you may see them is the user's `giftsRead`,
        and those of a deleted page or of a page hidden from you are hidden.
        A gift sent anonymously tells who sent it and what was said only to
        the one it was sent to and to its sender.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [gifts, nextCursor, total]
                properties:
                  gifts:
                    type: array
                    items: { $ref: "#/components/schemas/Gift" }
                  nextCursor: { type: string, description: Empty on the last page }
                  total: { type: integer, description: The gifts on all pages }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "403":
          description: "`this page is deleted`, `this page is hidden` or `this user's gifts are hidden`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Send the user a gift ("Отправить подарок")
      description: |
        Needs a filled-in profile. The user hears about it (`gift`), unless
        it is you. A deleted page takes no gifts, and neither does a page
        that does not show itself to you or one with a blacklist between you
        two, either way. You may send a gift to yourself. A gift of a paid
        collection takes its price from your votes (`votes` of GET
        /api/v1/me): 409 `not enough votes` when you have fewer. Limited per
        user.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [gift]
              properties:
                gift: { type: string, description: "The name of a gift of the catalogue" }
                caption: { type: string, maxLength: 250, description: "\"Ваше сообщение\"; may be left out" }
                anonymous:
                  type: boolean
                  description: "\"Анонимно\": only the user is told who sent the gift and what was said with it"
      responses:
        "201":
          description: The gift
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Gift" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`this page is deleted` or `you cannot send a gift to this user`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not enough votes`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/vouchers:
    post:
      summary: Use a voucher ("Активировать ваучер")
      description: |
        A voucher gives the account that enters its serial number votes
        ("голоса", which pay for gifts), rating (percent added to
        `completeness` of the page) or both, once per account and to as
        many accounts as its makers allowed. Whatever is wrong with the
        voucher - there is none, it has run out, you have used it - the
        answer is the same 409 `voucher is not valid`. Limited per user.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, description: "The serial number: 24 letters and digits, in any case, with dashes and spaces or without" }
      responses:
        "200":
          description: What the voucher gave
          content:
            application/json:
              schema:
                type: object
                required: [votes, rating, balance]
                properties:
                  votes: { type: integer, description: The votes it gave }
                  rating: { type: integer, description: The percent of rating it gave }
                  balance: { type: integer, description: The votes you have now }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`voucher is not valid`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/users/{nickname}/votes:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Hand the user some of your votes ("Перевод голосов")
      description: |
        The user hears about it (`votes`). Not to yourself, not to a deleted
        page and not across a blacklist, either way. Limited per user.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [votes]
              properties:
                votes: { type: integer, minimum: 1, maximum: 1000000 }
      responses:
        "200":
          description: Handed over
          content:
            application/json:
              schema:
                type: object
                required: [votes]
                properties:
                  votes: { type: integer, description: The votes you have left }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`this page is deleted` or `you cannot transfer votes to this user`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`not enough votes`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/vouchers:
    get:
      summary: The vouchers ("Ваучеры"), the newest first
      description: |
        Only for the administrators of the site (`admin` of GET /api/v1/me),
        named by the ADMIN_EMAILS of the user service; 403 to anyone else.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [vouchers, nextCursor]
                properties:
                  vouchers:
                    type: array
                    items: { $ref: "#/components/schemas/Voucher" }
                  nextCursor: { type: string, description: Empty on the last page }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Make a voucher
      description: Only for the administrators. A voucher gives votes, rating or both.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [usages]
              properties:
                code: { type: string, description: "The serial number, 24 letters and digits; left out or empty for a generated one" }
                votes: { type: integer, minimum: 0, maximum: 1000000 }
                rating: { type: integer, minimum: 0, maximum: 1000, description: Percent added to the page of whoever uses it }
                usages: { type: integer, description: "How many accounts may use it: 1-1000000, or -1 for any number" }
      responses:
        "201":
          description: The voucher
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Voucher" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`voucher with this serial number already exists`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/vouchers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Delete a voucher
      description: Only for the administrators. Nobody else can use it; what it gave stays given. Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/gifts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Delete a gift from your page
      description: Only the one a gift was sent to deletes it; the notification about it goes too.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: The gift was sent to someone else
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/stickers:
    get:
      summary: The sticker shop ("Магазин стикеров")
      description: |
        No token needed; with one, each pack says whether it is yours. The
        catalogue is fixed: a pack costs `price` votes ("голоса") once, 0
        for a free one. The pictures are the site's, which knows a sticker
        by its name.
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema:
                type: object
                required: [packs]
                properties:
                  packs:
                    type: array
                    items:
                      type: object
                      required: [id, price, stickers, bought, added]
                      properties:
                        id: { type: string, description: "The name of the pack, as `cats`" }
                        price: { type: integer, minimum: 0, description: "What it costs once, in votes; 0 is free" }
                        stickers:
                          type: array
                          items: { type: string, description: "The name of a sticker, as `cat_hi`" }
                        bought: { type: boolean, description: "You have taken it, free or for votes" }
                        added: { type: boolean, description: "It is among your stickers: you can send them" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/stickers/{pack}:
    parameters:
      - name: pack
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Add a pack to your stickers ("Добавить бесплатно", "Купить")
      description: A pack with a price takes it from your votes the first time; added again after it was put away, it is free. Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Added }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: You have fewer votes than the pack costs (`not enough votes`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Put a pack away ("Убрать набор")
      description: Its stickers can no longer be sent; a bought pack stays bought. Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Put away }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/users/{nickname}/notes:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    get:
      summary: The notes of a user ("Заметки"), the newest first
      description: |
        No token needed; whether you may see them is the user's `notesRead`,
        and those of a deleted page or of a page hidden from you are hidden.
        Each note carries the beginning of its text (`textCut`).
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [author, notes, nextCursor, total]
                properties:
                  author: { $ref: "#/components/schemas/Author" }
                  notes:
                    type: array
                    items: { $ref: "#/components/schemas/Note" }
                  nextCursor: { type: string, description: Empty on the last page }
                  total: { type: integer, description: The notes on all pages }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "403":
          description: "`this page is deleted`, `this page is hidden` or `this user's notes are hidden`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/notes:
    post:
      summary: Write a note ("Добавить запись")
      description: Needs a filled-in profile, as posting does. Limited as posts are.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteDraft" }
      responses:
        "201":
          description: The note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: A note with its whole text and who wrote it
      description: No token needed. A note of a deleted page, or of notes hidden from you, is not found.
      responses:
        "200":
          description: The note
          content:
            application/json:
              schema:
                type: object
                required: [author, note]
                properties:
                  author: { $ref: "#/components/schemas/Author" }
                  note: { $ref: "#/components/schemas/Note" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Change a note ("Редактировать заметку")
      description: Only its author, whenever they like; the title and the text are replaced. Limited as edits of posts are.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteDraft" }
      responses:
        "200":
          description: The note as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not yours to change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Delete a note with its comments
      description: Only its author.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not yours to delete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/notes/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: The comments under a note, the oldest first
      description: For those shown the note. Comments of deleted pages are left out, still counted in `total`.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [comments, nextCursor, total]
                properties:
                  comments:
                    type: array
                    items: { $ref: "#/components/schemas/NoteComment" }
                  nextCursor: { type: string }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Comment a note
      description: |
        Text only. Needs a filled-in profile and no blacklist between you
        and the author of the note (`you cannot comment on this note`). The
        author hears about it (`note_comment`). Limited as comments are.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 60000 }
      responses:
        "201":
          description: The comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteComment" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: A blacklist stands between you and the author
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/note-comments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Delete a comment under a note
      description: Its author or the author of the note.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not yours to delete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/note-comments/{id}/text:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: What a comment under a note says, whole
      description: The list carries its beginning (`textCut`). For those shown the note.
      responses:
        "200":
          description: The text
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/album-photos/{id}/reposts:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Share a photo of an album ("Поделиться" under a photo)
      description: As sharing a post, the same body; the post shows the photo (`sharedPhoto`).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text: { type: string, maxLength: 60000 }
                club: { type: string }
                fromClub: { type: boolean }
                signed: { type: boolean }
      responses:
        "201":
          description: The post sharing it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You cannot post on that community's wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/album-photos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: A photo of an album, for its page
      description: With who uploaded it (`author`) and its album with whom that belongs to; the photos of a deleted page are not found.
      responses:
        "200": { $ref: "#/components/responses/AlbumPhotoPage" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Change the description of a photo
      description: Who uploaded it only.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string, maxLength: 255 }
      responses:
        "200": { $ref: "#/components/responses/AlbumPhotoPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not who uploaded it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Delete a photo of an album
      description: Who uploaded it, the owner of the album or the admins of the community that owns it; the image goes too.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: None of them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/album-photos/{id}/album:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Move a photo to another album
      description: To an album of the same owner that people fill by hand; the owner of the albums or the admins of the community that owns them. The photo no longer shows the album it leaves.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [albumId]
              properties:
                albumId: { type: string, format: uuid }
      responses:
        "204": { description: Moved }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not who may edit the albums
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The album is kept by the site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/albums/{id}/cover:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Choose the photo that shows an album
      description: '"Обложка альбома": a photo of the album instead of its first one, until it is deleted or moved away; the owner of the album or the admins of the community that owns it.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoId]
              properties:
                photoId: { type: string, format: uuid }
      responses:
        "204": { description: Chosen }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not who may edit the album
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/clubs/{ref}/posts:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    get:
      summary: A community's wall, newest first
      description: As a user's wall; `canPost` says whether you may write there on your own behalf, `canSuggest` whether you may suggest a post instead.
      parameters:
        - name: type
          in: query
          description: 'The tab of openvk''s wall: none for all posts ("Все записи", the pinned one first), `owner` for the wall''s own — by its owner, or for the community whose wall it is ("Записи Анны", "Записи сообщества") — `others` for the rest ("Чужие записи") and `archive` for the posts put away ("Архив записей"), which the other tabs leave out and only the owner of the wall or the admins of the community read (403); `total` counts the tab'
          schema: { type: string, enum: [owner, others, archive] }
        - name: q
          in: query
          description: '"Поиск" of the wall: the posts of the tab that say this, in any case; the pinned post is then in its place'
          schema: { type: string, maxLength: 100 }
        - name: year
          in: query
          description: 'The posts written in this year (UTC) only, as the years of openvk''s "Архив записей"; the pinned post is then in its place. The first page of the archive tells in `years` which there are'
          schema: { type: integer, minimum: 1970, maximum: 9999 }
        - name: comments
          in: query
          description: "`last` brings each post with `lastComments`, its three newest comments (\"Микроблог\")"
          schema: { type: string, enum: [last] }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of the wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Write on a community's wall
      description: |
        On an open wall anyone may, on any other only its admins, and then
        for the community; with `fromClub` the post speaks for the
        community ("От имени сообщества"), admins only. Your profile must be filled in first.
        Nobody is notified of posts here, nor the writer of a post for the
        community of its likes, comments and reposts.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewClubPost" }
      responses:
        "201":
          description: The new post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`you cannot post on this wall`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/clubs/{ref}/posts/archive:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    put:
      summary: Put the posts of a community's wall away in its archive
      description: |
        "Архивировать все записи за 2025" of openvk with `year`, without it
        "Архивировать все записи целиком": every post of the wall written
        in the year (UTC), whoever wrote it, goes to the archive, the
        pinned one too. The admins of the community only. Idempotent.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ArchiveYear"
      responses:
        "200":
          description: How many posts went to the archive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchivedWall" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Return the posts of a community's wall from its archive
      description: |
        "Разархивировать все записи за 2025" of openvk with `year`; without
        it every archived post of the wall returns. Idempotent.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ArchiveYear"
      responses:
        "200":
          description: How many posts came back
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchivedWall" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/events:
    get:
      summary: Live events of a page (WebSocket)
      description: |
        A WebSocket: upgrade, then send `{"token": "<access token>"}` as the
        first message within 10 s (the token is not put in the URL, which
        would land in logs). Then the server sends JSON events, told apart
        by `type`:

        - `ready` — connected; `messages` and `notifications` are the menu
          counters (unread dialogs and notifications).
        - `counters` — a counter changed; only the changed one is set.
        - `message` — a new message of your dialogs, sent or received:
          `peer` (Author) and `message` (Message).
        - `read` — the dialog with `peer` was read up to `upTo`, by you on
          another page (`byMe`) or by the peer.
        - `delete` — message `id` of the dialog with `peer` is gone from it:
          deleted by you for yourself on another page.
        - `edit` — a message of the dialog with `peer` says something else
          now, or nothing: its sender, you or the peer, edited it or took
          it back from both sides (`deleted`): `peer` and `message`
          (Message; `read` is not told).
        - `chat_message` — a new message of a chat you are in, yours or
          someone's, or what happened there: `chat` (its ID) and `message`
          (ChatMessage; `unread` is not told).
        - `chat_edit` — a message of chat `chat` says something else now,
          or nothing: its sender edited it or took it back (`deleted`).
        - `chat_read` — you have read chat `chat` up to `upTo` on another
          page.
        - `notification` — `change` is `new`, `gone` or `read`.

        While it is open, you are on the site ("Онлайн" on your page).

        The connection lives until the access token expires: then it is
        closed with code 4001 — refresh the token and connect again. 1001:
        the server stops; 1013: connect again a bit later. After any gap,
        catch up with the usual requests: events are not replayed. Browser
        origins other than the API's need `CORS_ALLOWED_ORIGINS`.
      responses:
        "101": { description: Switching to the WebSocket protocol }
        "403": { description: The origin is not allowed }

  /api/v1/dialogs:
    get:
      summary: Your dialogs and chats, the most recently written first
      description: >-
        One list of both: a row is the dialog with `peer` or, with `chat`,
        a chat of several people. Dialogs with accounts that are gone are
        left out, so a page may be shorter than asked.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of dialogs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DialogPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/chats:
    post:
      summary: Start a chat of several people ("Создать беседу")
      description: >-
        You and at least two others, at most 50 in all. Each of them must
        let you add them (`chatsInvite` of their privacy, no blacklist
        either way). Your profile must be filled in first.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                title: { type: string, maxLength: 64 }
                members:
                  type: array
                  minItems: 2
                  maxItems: 49
                  items: { type: string, description: A nickname }
      responses:
        "201":
          description: The chat with who is in it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "`you cannot add this user to a chat`" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`the chat is full`" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/chats/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: A chat you are or were in, with who is in it
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Rename a chat ("Обновить название"); anyone in it may
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 64 }
      responses:
        "200":
          description: The chat as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`you are not in this chat`" }

  /api/v1/chats/{id}/members:
    post:
      summary: Add people to a chat ("Добавить участников"); anyone in it may
      description: >-
        Who was removed comes back this way; who left on their own does
        not (`the user has left the chat`) and returns themselves.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                members:
                  type: array
                  items: { type: string, description: A nickname }
      responses:
        "200":
          description: The chat as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "`you cannot add this user to a chat`" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`the chat is full`, `the user has left the chat`, `you are not in this chat`" }

  /api/v1/chats/{id}/members/{nickname}:
    delete:
      summary: Remove someone from a chat ("Исключить из беседы"); only its creator may
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: nickname
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The chat as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "Not yours to do: `permission denied`" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/chats/{id}/membership:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Come back to a chat you left ("Вернуться в чат")
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The chat as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`you were removed from this chat`, `the chat is full`" }
    delete:
      summary: Leave a chat ("Покинуть чат")
      description: The chat stays in your list as it was when you left.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The chat as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`you are not in this chat`" }

  /api/v1/chats/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: The messages of a chat, oldest first
      description: >-
        The newest page, older ones with `cursor`, what came after a
        message with `after`, or the part around a message with `around`
        (about half of `limit` before it and half after, as a found
        message opens; 404 if you are not shown it there). Long texts come
        cut (`textCut`). Who is not in the chat anymore reads it up to the
        moment they went.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: after
          in: query
          schema: { type: string, format: uuid }
        - name: around
          in: query
          description: Not with `cursor` or `after`
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessagePage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Write to a chat
      description: >-
        Text, photos (yours, from POST /me/photos, up to 10), a shared post
        (`post`), messages of your chats to carry on (`forward`, at most 20
        counting those they carry themselves) or some of them; or a photo
        of an album you are shown (`albumPhoto`), with text alone. What is
        not there for you answers 400 `post not found`, `photo not found`,
        `forwarded message not found`. Messages of chats are not
        encrypted: `sealed` answers 400 `messages of chats are not
        encrypted`, and a message of a dialog, which is, cannot be carried
        into a chat (400 `encrypted messages cannot be forwarded into a
        chat`).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 60000 }
                photos:
                  type: array
                  maxItems: 10
                  items: { type: string, format: uuid }
                post: { type: string, format: uuid }
                albumPhoto: { type: string, format: uuid }
                sticker: { type: string, description: "A sticker of a pack among your stickers (GET /stickers); it goes alone, with nothing else" }
                forward:
                  type: array
                  maxItems: 20
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: The message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`you are not in this chat`" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/chats/{id}/read:
    post:
      summary: Read a chat up to one of its messages
      description: The mark never moves back.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upTo]
              properties:
                upTo: { type: string, format: uuid }
      responses:
        "204": { description: Read }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/chat-messages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: A message of a chat with its whole text
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Edit your message, within a day
      description: >-
        What it says and its photos, as `PATCH /api/v1/messages/{id}`: the
        request names the changes — `removePhotos` are deleted, `addPhotos`
        (your uploads that nothing shows yet) come after the photos kept.
        The post it shares and the messages it forwards stay. Everyone in
        the chat gets a `chat_edit` event.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 60000, description: "May be empty only when the message has photos, shares a post or forwards messages" }
                baseText: { type: string, maxLength: 60000, description: "The whole text the edit started from: with it the edit is refused (409 `the message was changed`) when the message says something else by now" }
                addPhotos:
                  type: array
                  maxItems: 10
                  items: { type: string, format: uuid }
                removePhotos:
                  type: array
                  maxItems: 10
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: The message as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "Not yours to do: `permission denied`" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The day in which it could be done has passed (`the message can no longer be edited`), or the message no longer says `baseText` (`the message was changed`)" }
    delete:
      summary: Take your message back from everyone, within a day
      description: It stays in its place saying nothing ("Сообщение удалено").
      security: [{ bearer: [] }]
      responses:
        "204": { description: Taken back }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "Not yours to do: `permission denied`" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The day in which it could be done has passed" }

  /api/v1/dialogs/unread-count:
    get:
      summary: How many dialogs and chats have unread messages, at most 100
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The number for the menu counter
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer, maximum: 100 }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/dialogs/{nickname}/messages:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Your dialog with a user, oldest first
      description: |
        Without parameters, the newest messages. `cursor` = `nextCursor`
        pages back in time; `after` = the newest message you have returns
        what came since, for polling; `around` = a message of the dialog
        returns the part around it, about half of `limit` before and half
        after, as a found message opens (404 if the dialog does not have
        it): page back with `nextCursor` and on with `after`. One of them.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: after
          in: query
          schema: { type: string, format: uuid }
        - name: around
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A run of messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Write to a user
      description: |
        Your profile must be filled in first; you cannot write to yourself.
        The user's privacy (`messagesWrite`) and blacklists decide whether
        you may; whoever wrote to you may always be answered, unless one of
        you blacklisted the other. What it says goes sealed (`sealed`, as
        in `Message`, for the keys of both of you as they are now: 409 `the
        encryption keys changed` otherwise, and the user must have a key —
        `GET /api/v1/users/{nickname}/message-key`); plain `text` answers
        400 `messages are end-to-end encrypted`. Photos, a post shared into the
        dialog ("Поделиться" "в переписку"), messages of your dialogs to
        carry on ("Переслать") or some of them; photos are IDs from
        `POST /api/v1/me/photos` and must be yours, the post must be there
        (`post not found` otherwise). `albumPhoto` shares a photo of an
        album you can see ("Поделиться" under a photo; `photo not found`
        otherwise), with words alone. `forward`: at most 20 messages,
        counting those they carry themselves; they go oldest first, as
        copies of what they are now, with their photos, their words sealed
        in `sealed` with the message's own; one that you do not have or
        that was taken back fails with `forwarded message not found`.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sealed: { type: string, format: byte }
                photos: { $ref: "#/components/schemas/PhotoIDs" }
                post: { type: string, format: uuid }
                albumPhoto: { type: string, format: uuid }
                sticker: { type: string, description: "A sticker of a pack among your stickers (GET /stickers); it goes alone, with nothing else" }
                forward:
                  type: array
                  maxItems: 20
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: The sent message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: The user's privacy or a blacklist does not let you write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`the encryption keys changed`: the message is sealed for keys that are not yours or the user's anymore, or the user has none"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/message-key:
    get:
      summary: Your key for messages, as the server has it
      description: |
        The public key (X25519) messages of your dialogs are sealed with;
        the private one lives in your browsers only. A browser whose key is
        not this one cannot open new messages: move the key to it from the
        one that has it, or set up a new one. Null before any.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageKey" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      summary: Set up your key for messages
      description: |
        A key your browser made becomes the one your messages are sealed
        with from now on. What was sealed with the one before stays so: a
        browser without it cannot open those messages.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicKey]
              properties:
                publicKey: { type: string, format: byte, description: "32 bytes" }
      responses:
        "204": { description: Set }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/users/{nickname}/message-key:
    get:
      summary: The key messages to a user are sealed with
      description: Null for a user who has not set one up yet; nobody can write to them until they do.
      security: [{ bearer: [] }]
      parameters:
        - name: nickname
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageKey" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/dialogs/{nickname}/read:
    post:
      summary: Read your dialog with a user up to one of their messages
      description: The mark never moves back; `upTo` must be a message from that user to you.
      security: [{ bearer: [] }]
      parameters:
        - name: nickname
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upTo]
              properties:
                upTo: { type: string, format: uuid }
      responses:
        "204": { description: Read }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{nickname}/follow:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Follow the user
      description: Idempotent. Your profile must be filled in first.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/FollowStats" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: One of you blacklisted the other
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Unfollow the user
      description: Idempotent.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/FollowStats" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{nickname}/followers:
    get:
      summary: Who follows the user, newest follow first
      description: |
        No token needed; whether you may see the follows, either way, is
        the user's `friendsRead`.
      parameters: &followListParams
        - name: nickname
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses: &followListResponses
        "200":
          description: One page of people
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "403":
          description: "`this page is deleted`, `this page is hidden` or `this user's follows are hidden`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{nickname}/following:
    get:
      summary: Whom the user follows, newest follow first
      description: |
        With `online=true` only those online now, openvk's "Друзья онлайн";
        with `common=true` (a token required) only whom you follow too, its
        "Общие друзья"; `total` then counts them.
      parameters:
        - name: nickname
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: online
          in: query
          schema: { type: boolean, default: false }
        - name: common
          in: query
          schema: { type: boolean, default: false }
      responses: *followListResponses

  /api/v1/users/{nickname}/clubs:
    get:
      summary: The communities of a user, the newest joined first
      description: |
        The block "Группы" of a page: groups only, not events. No token needed; whether you may see
        them is the user's `clubsRead`, and those of a deleted page or of a
        page hidden from you are hidden. With a token each comes with your
        `role` in it, to join or leave it from the list.
      parameters: *followListParams
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [clubs, nextCursor, total]
                properties:
                  clubs:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ClubInfo"
                        - type: object
                          required: [role]
                          properties:
                            role:
                              type: string
                              enum: ["", member, admin, owner]
                              description: What you are in it; empty for none and without a token
                  nextCursor: { type: string, description: "Empty on the last page" }
                  total: { type: integer, description: "How many on all pages" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "403":
          description: "`this page is deleted`, `this page is hidden` or `this user's clubs are hidden`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{nickname}/events:
    get:
      summary: The events of a user, the newest joined first
      description: |
        The block "Встречи" of a page: as `/api/v1/users/{nickname}/clubs`, for the events
        the user comes or might come to, shown by the same `clubsRead`.
      parameters:
        - name: nickname
          in: path
          required: true
          schema: { type: string }
        - name: time
          in: query
          description: "Only the events ahead or going on (`upcoming`) or those over (`past`); all without it"
          schema: { type: string, enum: [upcoming, past] }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page, as of `/api/v1/users/{nickname}/clubs`
          content:
            application/json:
              schema:
                type: object
                required: [clubs, nextCursor, total]
                properties:
                  clubs:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ClubInfo"
                        - type: object
                          required: [role]
                          properties:
                            role:
                              type: string
                              enum: ["", member, admin, owner]
                              description: What you are in it; empty for none and without a token
                  nextCursor: { type: string, description: "Empty on the last page" }
                  total: { type: integer, description: "How many on all pages" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "403":
          description: "`this page is deleted`, `this page is hidden` or `this user's clubs are hidden`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/feed:
    get:
      summary: Your news feed
      description: |
        Posts of the people you follow and your own, on any wall, and every
        post on their walls, on yours and on the walls of your clubs,
        newest first, each with its author. Page with `cursor` = `nextCursor`; `total` is always 0.
        A new follow or club shows in the feed a moment later: the posts
        service hears of it after the fact.
        Posts marked as adult are left out when your `interface.nsfw` is
        `hide`. What the people in your blacklist wrote is left out
        too, on any wall and with `type=all` as well, unless one wrote in
        the name of a community. A post on the wall of a community you run
        comes with `moderated`: you may delete, pin and put it away.

        With `type=all` it is "Все новости" of openvk instead: the posts of
        every wall, whomever you follow.

        "Настройки ленты" of openvk come with the request and are not
        kept by the server. The walls you ignore
        (`/api/v1/me/feed/ignored`) are left out of both feeds, whoever
        wrote there, and an ignored person is not followed to the walls of
        others either; `ignored=true` brings them back. `alien=false`
        leaves only what a wall says itself: people on their own walls,
        communities in their name.
      security: [{ bearer: [] }]
      parameters:
        - name: type
          in: query
          description: "`all` for the posts of everyone; anything else but nothing is 400 `invalid feed type`"
          schema: { type: string, enum: [all] }
        - name: alien
          in: query
          description: "`false` leaves out what people wrote on the walls of others (\"Показывать посты на чужих стенах\" taken off)"
          schema: { type: boolean, default: true }
        - name: ignored
          in: query
          description: "`true` shows the walls you ignore too (\"Показывать игнорируемые источники\")"
          schema: { type: boolean, default: false }
        - name: comments
          in: query
          description: "`last` brings each post with `lastComments`, its three newest comments (\"Микроблог\")"
          schema: { type: string, enum: [last] }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of the feed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /healthz:
    get:
      summary: Liveness of the gateway
      responses:
        "200": { description: Up }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  requestBodies:
    Album:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, maxLength: 36 }
              description: { type: string, maxLength: 255 }
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refreshToken]
            additionalProperties: false
            properties:
              refreshToken: { type: string }

  parameters:
    ArchiveYear:
      name: year
      in: query
      description: The year (UTC) whose posts to move; none for the posts of every year
      schema: { type: integer, minimum: 1970, maximum: 9999 }
    OnWall:
      name: onWall
      in: query
      description: |
        `true`: also post the photo on the wall ("Опубликовать запись на
        стене"), yours or the community's, speaking for it. Without a filled
        profile there is no post. If the post is refused (too many posts),
        the photo is changed all the same and the error tells why.
      schema: { type: boolean }
    ClubRef:
      name: ref
      in: path
      required: true
      description: A community's address (whatever the case) or, without one, its ID
      schema: { type: string }

  responses:
    ClubList:
      description: Communities
      content:
        application/json:
          schema:
            type: object
            required: [clubs, nextCursor]
            properties:
              clubs:
                type: array
                items: { $ref: "#/components/schemas/ClubInfo" }
              nextCursor: { type: string, description: "Empty on the last page or with no paging" }
    Club:
      description: The community as you see it
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/ClubInfo" }
              - type: object
                required: [role, owner, canStartTopic]
                properties:
                  role: { type: string, enum: ["", member, admin, owner], description: "What you are in it; empty without a token or membership" }
                  canStartTopic: { type: boolean, description: "You may start a topic in its discussions (\"Создать тему\")" }
                  ignoredByMe: { type: boolean, description: "Your news leave this wall out; told by `GET /api/v1/clubs/{ref}` alone, with a token" }
                  requested: { type: boolean, description: "You asked to join this closed group and wait for an answer (\"Отменить заявку\" is `DELETE .../membership`)" }
                  requests: { type: integer, description: "How many people wait to be let in; told to those who run the group" }
                  owner:
                    description: Its creator; null when the page is deleted or erased, or when the community hides its owner from you
                    oneOf:
                      - { $ref: "#/components/schemas/Author" }
                      - { type: "null" }
                  ownerTitle: { type: string, description: "What the owner does in the community; empty for none or without `owner`" }
                  maybe: { type: boolean, description: "You only might come to the event" }
    AlbumList:
      description: One page of albums with whom they belong to
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/AlbumOwner" }
              - type: object
                required: [albums, nextCursor, total]
                properties:
                  albums:
                    type: array
                    items: { $ref: "#/components/schemas/Album" }
                  nextCursor: { type: string, description: "Empty on the last page" }
                  total: { type: integer }
    AlbumPage:
      description: An album with whom it belongs to
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/AlbumOwner" }
              - type: object
                required: [album]
                properties:
                  album: { $ref: "#/components/schemas/Album" }
    AlbumPhotoPage:
      description: A photo with who uploaded it and its album
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/AlbumOwner" }
              - type: object
                required: [photo, author, album]
                properties:
                  photo: { $ref: "#/components/schemas/AlbumPhoto" }
                  author: { $ref: "#/components/schemas/Author" }
                  album: { $ref: "#/components/schemas/Album" }
    TopicPage:
      description: A topic with its community; role is what you are in it
      content:
        application/json:
          schema:
            type: object
            required: [topic, club, role]
            properties:
              topic: { $ref: "#/components/schemas/Topic" }
              club: { $ref: "#/components/schemas/Author" }
              role: { type: string, enum: ["", member, admin, owner] }
    Like:
      description: How many likes the post has now
      content:
        application/json:
          schema:
            type: object
            required: [likes, liked]
            properties:
              likes: { type: integer }
              liked: { type: boolean, description: "You like the post now" }
    Tokens:
      description: Token pair
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, refreshToken]
            properties:
              accessToken: { type: string }
              refreshToken: { type: string }
    User:
      description: The caller's account
      content:
        application/json:
          schema: { $ref: "#/components/schemas/User" }
    FollowStats:
      description: Fresh follow counters of the user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FollowStats" }
    InvalidArgument:
      description: Invalid input; the message says what
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: Missing, invalid or expired token or code
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited (sign-in codes, or spam protection of posts, comments, likes, messages, uploads, follows and communities); try again later
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Session:
      type: object
      required: [id, createdAt, lastUsedAt, ip, userAgent, current]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time, description: The sign-in }
        lastUsedAt:
          type: string
          format: date-time
          description: When its tokens were last issued, at the sign-in or a refresh
        ip: { type: string, description: 'Where from, "" when unknown' }
        userAgent: { type: string, description: 'What the browser called itself, "" when unknown' }
        current: { type: boolean, description: The session of the access token that asks }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_argument, unauthenticated, permission_denied, not_found,
                     conflict, too_many_requests, unavailable, method_not_allowed, internal]
            message: { type: string }

    Profile:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        surname: { type: string, maxLength: 100 }
        nickname:
          type: string
          maxLength: 32
          pattern: "^[A-Za-z](?:[A-Za-z0-9_]*[A-Za-z0-9])?$"
        status: { type: string, maxLength: 200 }
        gender: { type: string, enum: ["", male, female, neutral], description: "openvk's \"Местоимения\": neutral is \"они/их\"" }
        relationship:
          type: string
          enum: ["", single, dating, engaged, married, civil_union, in_love, complicated, looking]
        hometown: { type: string, maxLength: 64 }
        hideBirthYear: { type: boolean, description: "Show only the day and the month of the birthday" }
        worldview:
          type: string
          enum: ["", islam, orthodox, catholicism, judaism, protestantism, buddhism,
                 confucianism, secular_humanism]
        politicalViews:
          type: string
          enum: ["", communist, socialist, liberal, conservative, monarchist,
                 ultraconservative, indifferent, libertarian, moderate_islamism,
                 radical_islamism]
        birthday:
          type: [string, "null"]
          example: "1990-05-17"
          description: "YYYY-MM-DD, or --MM-DD in a public profile whose owner shows only the day and the month"

    Contacts:
      type: object
      description: openvk's "Контактная информация"
      properties:
        email: { type: string, maxLength: 254, description: "To show on the page, not the one to sign in with" }
        telegram: { type: string, description: "A username, without @" }
        website: { type: string, maxLength: 256 }
        city: { type: string, maxLength: 64 }
        address: { type: string, maxLength: 255 }

    Interests:
      type: object
      description: openvk's "Личная информация"; each up to 1000 characters
      properties:
        interests: { type: string }
        music: { type: string }
        films: { type: string }
        shows: { type: string }
        books: { type: string }
        quotes: { type: string }
        games: { type: string }
        about: { type: string, description: "\"О себе\"" }

    ExtraField:
      type: object
      required: [name, text, place]
      properties:
        name: { type: string, maxLength: 50 }
        text: { type: string, maxLength: 60000 }
        place: { type: string, enum: [contacts, interests], description: Where it shows }

    About:
      type: object
      description: The rest of the page, public
      required: [contacts, interests, fields, registeredAt, partner]
      properties:
        contacts: { $ref: "#/components/schemas/Contacts" }
        interests: { $ref: "#/components/schemas/Interests" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/ExtraField" }
        registeredAt: { type: string, format: date-time, description: "\"Дата регистрации\"" }
        partner:
          description: Whom the relationship names; null for nobody, when it is hidden and when that page is deleted
          oneOf:
            - { $ref: "#/components/schemas/Author" }
            - { type: "null" }

    Privacy:
      type: object
      additionalProperties: false
      properties:
        showBirthday: { type: boolean }
        showRelationship: { type: boolean }
        showWorldview: { type: boolean }
        showPoliticalViews: { type: boolean }
        wallWrite:
          type: string
          enum: [everyone, following, only_me]
          description: "Who may write on your wall besides you; following: the people you follow"
        messagesWrite:
          type: string
          enum: [everyone, following, nobody]
          description: "Who may write private messages to you; whoever you wrote to may answer anyway"
        clubsRead:
          type: string
          enum: [everyone, users, following, only_me]
          description: "Who sees your communities on your page (\"Кому видно мои группы\"); the communities show their members anyway"
        pageRead:
          type: string
          enum: [everyone, users]
          description: "Who sees your page at all (\"Кому в интернете видно мою страницу\"): anyone or signed-in people; to the others it shows only the names and the photo"
        infoRead:
          type: string
          enum: [everyone, users, following, only_me]
          description: "Who sees the information of your page (\"Кому видно основную информацию моей страницы\"): all but the names, the photo, the status and the pronouns; the search filters by it find you only with everyone"
        photosRead:
          type: string
          enum: [everyone, users, following, only_me]
          description: "Who sees your photo albums (\"Кому видно мои фотографии\")"
        friendsRead:
          type: string
          enum: [everyone, users, following, only_me]
          description: "Who sees whom you follow and who follows you (\"Кому видно моих друзей\")"
        onlineRead:
          type: string
          enum: [everyone, users, following, only_me]
          description: "Who sees when you were last online after a long absence (\"Кто видит мою неактивность\"); a shorter one anyone sees, as on openvk"
        notesRead:
          type: string
          enum: [everyone, users, following, only_me]
          description: "Who sees your notes (\"Кому видно мои заметки\"); everyone when left out"
        giftsRead:
          type: string
          enum: [everyone, users, following, only_me]
          description: "Who sees the gifts sent to you (\"Кому видны мои подарки\"); everyone when left out"
        chatsInvite:
          type: string
          enum: [everyone, following, nobody]
          description: "Who may add you to chats (\"Кто может добавлять меня в чаты\"): `following` are the people you follow, the default, also when left out"
        closed:
          type: boolean
          description: "A closed profile (\"Тип профиля: закрытый\"): only the people you follow see anything of the page but the names and the photo, whatever the other settings say; false when left out"

    User:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - $ref: "#/components/schemas/About"
        - type: object
          required: [id, avatar, email, profileCompleted, privacy, deactivated]
          properties:
            id: { type: string, format: uuid }
            avatar: { $ref: "#/components/schemas/Avatar" }
            email: { type: string, format: email }
            profileCompleted: { type: boolean }
            privacy: { $ref: "#/components/schemas/Privacy" }
            backdrop: { $ref: "#/components/schemas/Backdrop" }
            completeness:
              type: integer
              description: '"Заполненность страницы" in percent, as openvk weighs it: interests, the e-mail and the city of the contacts 20 each, Telegram and the status 15 each, 10 always, and the rating vouchers gave on top, so it may pass 100'
            votes:
              type: integer
              description: '"Баланс": the votes you have, told by GET /api/v1/me; vouchers and transfers give them, paid gifts and transfers take them'
            admin:
              type: boolean
              description: You are an administrator of the site and make the vouchers
            unfilled:
              type: array
              items: { type: string, enum: [interests, email, telegram, status, city] }
              description: What is missing, for openvk's hints under the gauge
            interface: { $ref: "#/components/schemas/Interface" }
            pinnedClubs:
              type: array
              items: { $ref: "#/components/schemas/Club" }
              description: 'The clubs in your left menu ("Добавить в левое меню"), told by GET /api/v1/me alone; absent when there are none'
            deactivated:
              type: boolean
              description: "You deleted the page; see POST /api/v1/me/deactivate"
            purgeAt:
              type: string
              format: date-time
              description: "Only for a deleted page: when it can no longer be restored and its data is erased"

    Avatar:
      type: [object, "null"]
      description: URLs of the profile photo; null without one
      required: [large, small]
      properties:
        large: { type: string, example: "/media/avatars/<user>/<avatar>/large.jpg" }
        small: { type: string, example: "/media/avatars/<user>/<avatar>/small.jpg" }

    Author:
      type: object
      required: [id, nickname, name, surname, gender]
      properties:
        id: { type: string, format: uuid }
        avatar: { $ref: "#/components/schemas/Avatar" }
        nickname: { type: string }
        name: { type: string }
        surname: { type: string }
        gender: { type: string, enum: ["", male, female] }
        deactivated:
          type: boolean
          description: "Only in dialogs: the person deleted the page. Elsewhere such people and what they wrote are left out"
        club:
          type: boolean
          description: "A community, as the owner of a wall or the voice of a post: only `id`, `name` and `address` are set, its page is /club/<address or id>"
        address: { type: string, description: "A community's address; empty for none" }
        online: { type: boolean, description: "The person is on the site now (\"Онлайн\"); told only of a page open to everyone, absent otherwise" }

    Interface:
      type: object
      description: How the site looks to its owner ("Интерфейс" of the settings)
      required: [avatarStyle, mainPage]
      properties:
        avatarStyle: { type: string, enum: [square, round], description: "How photos of people are shown; square by default" }
        mainPage: { type: string, enum: [page, feed], description: "Where the site opens: your page (the default) or the news" }
        hiddenMenu:
          type: array
          description: The links taken out of the left menu; none by default
          items: { type: string, enum: [photos, messages, notes, groups, events, feed, notifications] }
        theme: { type: string, enum: [default, blue, dark], description: "The look of the whole site (\"Стиль\"); default when left out" }
        hideRating: { type: boolean, description: "Takes \"Заполненность страницы\" off the pages its owner reads (\"Рейтинг\")" }
        nsfw: { type: string, enum: [blur, hide, show], description: "Posts marked as adult: blurred until clicked (the default), blurred and left out of the news, or shown as any other" }
        postView: { type: string, enum: [old, microblog], description: "How posts are laid out (\"Вид постов\"); old by default" }
        timezone:
          type: [integer, "null"]
          description: The clock dates are shown by, minutes east of UTC (-720..840 in steps of 15); null for the browser's own

    AdminsDisplay:
      type: string
      enum: [creator, all, none]
      description: "What the page shows of those who run the community: only its creator (\"Создатель\"), all the admins (\"Администраторы\") or nothing"

    ClubInfo:
      type: object
      required: [id, name, description, address, website, wall, adminsDisplay, members, createdAt, openTopics, topicsAboveWall, backdrop, kind, startsAt, endsAt, maybes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, description: "Plain text with \\n line breaks" }
        address: { type: string, description: "Empty for none: the page is then /club/<id>" }
        website: { type: string, description: "An http or https link (\"Сайт\"); empty for none" }
        wall: { type: string, enum: [open, suggest, closed], description: "Who may write on the wall: everyone, only its admins with posts suggested by others (\"Предложка\"), or only its admins" }
        adminsDisplay: { $ref: "#/components/schemas/AdminsDisplay" }
        members: { type: integer }
        createdAt: { type: string, format: date-time }
        avatar: { $ref: "#/components/schemas/Avatar" }
        openTopics: { type: boolean, description: "Anyone starts topics in its discussions, not only its admins (\"Все могут создавать темы\")" }
        topicsAboveWall: { type: boolean, description: "Its page lists the topics above the wall (\"Отображать список тем над стеной\")" }
        backdrop: { $ref: "#/components/schemas/Backdrop" }
        kind: { type: string, enum: [group, event], description: "An event (\"встреча\") is a community with the time it starts" }
        startsAt: { type: [string, "null"], format: date-time, description: "When the event starts; null for a group" }
        endsAt: { type: [string, "null"], format: date-time, description: "When the event ends; null for none" }
        maybes: { type: integer, description: "How many of `members` only might come to the event (\"Возможно придут\"); the others are sure to" }
        closed: { type: boolean, description: "A closed group (\"Закрытая группа\"): joining it (`PUT .../membership`) only asks to, and its wall, members, topics and albums answer 403 `this club is closed` (topics and albums by ID - 404) to those who are not members" }

    Topic:
      type: object
      description: A discussion of a community ("Обсуждения")
      required: [id, author, title, fromWall, closed, pinned, restricted, createdAt, updatedAt, messages, lastMessage, mine]
      properties:
        id: { type: string, format: uuid }
        author: { description: "Who started it, or the community for a topic of the community", allOf: [{ $ref: "#/components/schemas/Author" }] }
        title: { type: string, maxLength: 127 }
        fromWall: { type: boolean, description: "Started for the community, shown as its author" }
        closed: { type: boolean, description: "Nobody writes in it (\"Закрыть тему\")" }
        pinned: { type: boolean, description: "On top of the list (\"Закрепить тему\")" }
        restricted: { type: boolean, description: "Only the admins write in it (\"Комментировать могут только администраторы\")" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: "The newest message, or createdAt without one" }
        messages: { type: integer }
        lastMessage:
          description: Who answered last and when ("ответил"); only in lists, null without a message
          oneOf:
            - type: object
              required: [author, createdAt]
              properties:
                author: { $ref: "#/components/schemas/Author" }
                createdAt: { type: string, format: date-time }
            - type: "null"
        mine: { type: boolean, description: "You started it; false without a token" }

    TopicMessage:
      type: object
      description: What someone wrote in a topic, shaped as a comment
      required: [id, author, text, photos, createdAt, fromWall, mine, likes, liked]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        text: { type: string, description: "Plain text with \\n line breaks; empty when photos only" }
        textCut:
          type: boolean
          description: "`text` is only its beginning (1000 characters): lists carry no more. GET /api/v1/topic-messages/{id}/text tells it whole. Absent when the text is whole"
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string, format: date-time }
        fromWall: { type: boolean, description: "It speaks for the community, shown as its author" }
        mine: { type: boolean, description: "You wrote it; false without a token" }
        likes: { type: integer, description: "Its hearts" }
        liked: { type: boolean, description: "You put one; false without a token, and in the answer to writing a message" }

    NewClubPost:
      type: object
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 60000 }
        photos: { $ref: "#/components/schemas/PhotoIDs" }
        fromClub: { type: boolean, description: "Speak for the community (admins only; always on a closed wall)" }
        signed: { type: boolean, description: "With fromClub: name yourself under the post (\"Подпись автора\")" }
        nsfw: { type: boolean, description: "Marks the post as adult (\"Содержит NSFW-контент\")" }
        poll: { $ref: "#/components/schemas/NewPoll" }

    NewPost:
      type: object
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 60000 }
        photos: { $ref: "#/components/schemas/PhotoIDs" }
        nsfw: { type: boolean, description: "Marks the post as adult (\"Содержит NSFW-контент\"); an edit that leaves it out keeps the mark" }
        poll:
          description: "The poll a new post asks; with it `text` and `photos` may be empty. Only when writing: the poll of a post stays as asked, and an edit that carries one is refused (400)"
          allOf:
            - { $ref: "#/components/schemas/NewPoll" }

    NewPoll:
      type: object
      description: 'A poll for a new post ("Новый опрос")'
      additionalProperties: false
      required: [title, options]
      properties:
        title: { type: string, minLength: 1, maxLength: 128, description: "What is asked (\"Тема опроса\"), one line" }
        options:
          description: The answers, in the order shown, each one line
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 128 }
        anonymous: { type: boolean, description: "Who voted is not told (\"Анонимный опрос\")" }
        multiple: { type: boolean, description: "Several options may be chosen (\"Множественный выбор\")" }
        locked: { type: boolean, description: "A vote cannot be taken back (\"Запретить отменять свой голос\")" }
        days: { type: integer, minimum: 0, maximum: 31, description: "How many days the poll takes votes (\"Голосование истекает через\"); 0 or absent: for ever" }

    Poll:
      type: object
      description: The poll of a post, as you see it
      required: [title, options, voters, anonymous, multiple, locked, endsAt, ended, voted]
      properties:
        title: { type: string }
        options:
          type: array
          items:
            type: object
            required: [name, votes]
            properties:
              name: { type: string }
              votes: { type: integer, description: How many people chose it }
        voters: { type: integer, description: "How many people voted; with `multiple` less than the sum of `votes`" }
        anonymous: { type: boolean, description: "Who voted is not told: no list of voters" }
        multiple: { type: boolean, description: Several options may be chosen }
        locked: { type: boolean, description: A vote cannot be taken back }
        endsAt:
          description: Until when it takes votes; null for a poll that never ends
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        ended: { type: boolean, description: "`endsAt` has passed: no votes are cast or taken back" }
        voted:
          description: The places (from 0) of the options you chose; empty when you have not voted, and without a token
          type: array
          items: { type: integer }

    PhotoIDs:
      description: IDs from `POST /api/v1/me/photos`, yours, in the order shown
      type: array
      maxItems: 10
      uniqueItems: true
      items: { type: string, format: uuid }

    Post:
      type: object
      required: [id, author, wall, text, photos, createdAt, likes, liked, comments, reposts, repost, editedAt, editableUntil, pinned, fromWall, avatarUpdate, mine, signer]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        wall:
          description: The owner of the wall when it is not the author's own; null otherwise
          oneOf:
            - $ref: "#/components/schemas/Author"
            - type: "null"
        text: { type: string, description: "Plain text with \\n line breaks; never HTML; empty when the post is photos only or a repost without a word" }
        textCut:
          type: boolean
          description: "`text` is only its beginning (1000 characters): lists carry no more. GET /api/v1/posts/{id} tells the post whole. Absent when the text is whole"
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string, format: date-time }
        likes: { type: integer }
        liked: { type: boolean, description: "You like the post; false without a token" }
        comments: { type: integer }
        reposts: { type: integer, description: "How many times the post was shared" }
        sharedPhoto:
          description: 'A photo of an album the post shares ("Поделиться" under a photo); null otherwise. A deleted photo leaves only its ID'
          oneOf:
            - $ref: "#/components/schemas/SharedPhoto"
            - type: "null"
        repost:
          description: The shared post when this is a repost; null otherwise
          oneOf:
            - $ref: "#/components/schemas/SharedPost"
            - type: "null"
        poll:
          description: The poll the post asks; null for a post without one
          oneOf:
            - $ref: "#/components/schemas/Poll"
            - type: "null"
        editedAt:
          description: When the author last edited the post; null if never ("ред.")
          oneOf:
            - { type: string, format: date-time }
            - type: "null"
        editableUntil: { type: string, format: date-time, description: "Until when the author may edit it" }
        pinned: { type: boolean, description: "Shown first on its wall (\"закреплено\")" }
        archived: { type: boolean, description: "Put away in the archive of its wall (\"Архив записей\"): only the owner of the wall, or the admins of the community, see it" }
        commentsClosed: { type: boolean, description: "It takes no new comments: the owner of the wall closed them" }
        nsfw: { type: boolean, description: "Its author marked it as adult (\"Содержит NSFW-контент\"): the site blurs it until clicked, as the reader's settings say" }
        fromWall:
          type: boolean
          description: "The post speaks for its wall, a community (\"От имени сообщества\"): `author` is the community, `wall` null, who wrote it is not told"
        avatarUpdate: { type: boolean, description: "The post shows the new photo of its wall's owner, its one photo (\"обновил фотографию на своей странице\", \"обновило фотографию группы\"); never edited" }
        mine: { type: boolean, description: "You wrote it and may edit it; false without a token, and for a post you suggested that a community published, which is the community's" }
        moderated: { type: boolean, description: "Only in the feed: the post is on the wall of a community you run" }
        signer:
          description: "Who wrote a post for a community that names its author (\"Автор: ...\"); null otherwise"
          oneOf:
            - { $ref: "#/components/schemas/Author" }
            - { type: "null" }
        lastComments:
          description: "Its three newest comments, oldest first; only in a list asked for with `comments=last`, and left out when there are none. Those of archived posts are not told"
          type: array
          items: { $ref: "#/components/schemas/Comment" }

    SharedPost:
      type: object
      description: |
        The post a repost shares, without counters. When it or its author is
        gone, only id and deleted: true are set ("Запись удалена"). repostOf
        is set when the shared post is itself a repost: link to it.
      required: [id, deleted, author, wall, text, photos, createdAt, repostOf, avatarUpdate]
      properties:
        id: { type: string, format: uuid }
        deleted: { type: boolean }
        avatarUpdate: { type: boolean, description: "It shows a new photo, as Post's avatarUpdate" }
        nsfw: { type: boolean, description: "Its author marked it as adult, as Post's nsfw" }
        textCut: { type: boolean, description: "`text` is only its beginning, as Post's textCut" }
        author:
          oneOf:
            - $ref: "#/components/schemas/Author"
            - type: "null"
        wall:
          description: The owner of the wall when not the author's own; null otherwise
          oneOf:
            - $ref: "#/components/schemas/Author"
            - type: "null"
        text: { type: string }
        photos:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string }
        repostOf: { type: string, description: "Empty unless the shared post is itself a repost" }
        poll:
          description: "The poll the shared post asks, as Post's poll; in a message and in live events without `voted`"
          oneOf:
            - $ref: "#/components/schemas/Poll"
            - type: "null"

    Photo:
      type: object
      required: [id, large, small]
      properties:
        id: { type: string, format: uuid }
        large: { type: string, description: "URL, up to 1280 on the longer side" }
        small: { type: string, description: "URL, up to 640 on the longer side" }

    Album:
      type: object
      required: [id, name, description, photos, createdAt, updatedAt, cover]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        photos: { type: integer, description: How many photos it has }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: "Renamed, photos added or deleted (\"Обновлён\")" }
        cover:
          description: The photo chosen to show it, else its first; null while it has none
          oneOf:
            - { $ref: "#/components/schemas/Photo" }
            - { type: "null" }
        kind:
          type: string
          enum: ["", avatars, wall]
          description: '"" for an album people make; "avatars" is "Фотографии со страницы", which the site keeps with every new photo of the page, and "wall" is "Фотографии со стены", where it keeps a copy of every photo of the posts a person writes on their own wall: nobody renames, deletes or fills them by hand, their photos may be deleted and moved to other albums'

    AlbumPhoto:
      allOf:
        - { $ref: "#/components/schemas/Photo" }
        - type: object
          required: [description, createdAt, mine]
          properties:
            description: { type: string }
            createdAt: { type: string, format: date-time }
            mine: { type: boolean, description: You uploaded it }
            likes: { type: integer }
            comments: { type: integer }
            liked: { type: boolean, description: You like it }
            nsfw: { type: boolean, description: "It came from a post marked as adult: blurred as the reader's settings say" }

    AlbumOwner:
      type: object
      required: [owner, role]
      properties:
        owner: { $ref: "#/components/schemas/Author" }
        role: { type: string, enum: ["", member, admin, owner], description: "What you are in the community that owns it; empty for a person" }

    Comment:
      type: object
      required: [id, postId, author, text, photos, createdAt, replyTo, likes, liked, fromWall, mine]
      properties:
        id: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        text: { type: string, description: "Plain text with \\n line breaks; never HTML; empty when photos only" }
        textCut:
          type: boolean
          description: "`text` is only its beginning (1000 characters): lists carry no more. GET /api/v1/comments/{id}/text tells it whole. Absent when the text is whole"
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string, format: date-time }
        replyTo:
          description: The comment this one answers ("в ответ"); null for none, and once it is deleted
          oneOf:
            - { type: string, format: uuid }
            - type: "null"
        likes: { type: integer }
        liked: { type: boolean, description: "You like the comment; false without a token" }
        fromWall: { type: boolean, description: "It speaks for the community, which is its author; who wrote it is not told" }
        mine: { type: boolean, description: "You wrote it; false without a token" }

    CommentPage:
      type: object
      required: [comments, nextCursor, total]
      properties:
        comments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        nextCursor: { type: string, description: "Empty on the last page" }
        total: { type: integer, description: "All comments of the post" }

    Notification:
      type: object
      required: [id, type, createdAt, actor, post, comment]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [like, comment, follow, wall_post, repost, comment_reply, comment_like, post_accepted, suggested_post, club_admin, topic_message, post_mention, comment_mention, topic_mention, topic_message_like, photo_like, photo_comment, photo_mention, event_reminder, note_comment, gift, votes]
          description: "wall_post: the actor wrote on your wall; repost: the actor shared your post, post is the repost; comment_reply: the actor answered your comment under post, comment is the answer; comment_like: the actor liked your comment; post_accepted: the actor, a community, published the post you suggested; suggested_post: someone suggested a post for the actor, a community you run (until it is published, declined or withdrawn); club_admin: you were made an admin of the actor, a community (until you are dismissed); topic_message: the actor, a person or the community, wrote in the topic you started, named by `topic` (until the message or the topic is deleted); post_mention, comment_mention, topic_mention: the actor named you (\"@nickname\" or \"[nickname|Name]\") in post, in comment under post, or in a message of topic; topic_message_like: the actor liked your message in topic (until the like is taken back or the message deleted); photo_like, photo_comment: the actor liked or commented the photo you put into an album, named by `photo`; photo_mention: the actor named you in comment under `photo`; event_reminder: the actor, an event you are going to (surely or maybe), starts within a day — told once, and again if the event is moved; note_comment: the actor commented your note, named by `note` (until the comment or the note is deleted); gift: the actor sent you a gift (until you delete it); votes: the actor handed you votes"
        createdAt: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/Author" }
        post:
          description: The liked, commented or written post, or the repost; null for follows, suggested posts, appointments and messages in topics
          nullable: true
          type: object
          required: [id, createdAt, text]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            text: { type: string, description: "What the post says; empty when photos only" }
        comment:
          description: "The comment, for the notifications about one: what it says, 1000 characters at most. Also the message of a topic (topic_message, topic_mention, topic_message_like) the comment under a photo (photo_comment, photo_mention) and under a note (note_comment); null for the others and for a message of photos only"
          nullable: true
          type: object
          required: [id, text]
          properties:
            id: { type: string, format: uuid }
            text: { type: string }
        topic:
          description: Only for topic_message, topic_mention and topic_message_like; absent otherwise
          type: object
          required: [id, title]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
        photo:
          description: Only for photo_like, photo_comment and photo_mention; absent otherwise
          allOf: [{ $ref: "#/components/schemas/Photo" }]
        note:
          description: Only for note_comment; absent otherwise
          type: object
          required: [id, title]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }

    NotificationPage:
      type: object
      required: [notifications, nextCursor, newestId]
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        nextCursor: { type: string, description: "Empty on the last page" }
        newestId:
          type: string
          description: "The newest notification of the page, shown or not; empty on an empty page"

    MessageKey:
      type: object
      required: [publicKey]
      properties:
        publicKey: { type: ["string", "null"], format: byte, description: "32 bytes of X25519; null for none" }

    Message:
      type: object
      required: [id, sealed, photos, createdAt, out, read, deletableUntil, forwardedCount, deleted]
      properties:
        id: { type: string, format: uuid }
        sealed:
          type: ["string", "null"]
          format: byte
          description: >-
            What it says, end-to-end encrypted; null when it says nothing.
            The bytes: version 1, the X25519 public keys of the sender and
            of the recipient (32 each), a 12-byte IV and AES-256-GCM's
            ciphertext with its tag, the first 77 bytes its additional
            data. The AES key is HKDF-SHA256 of the X25519 shared secret,
            with no salt and the info "freenet message v1" followed by the
            two public keys, the smaller first. The plaintext is the JSON
            `{"t": text, "f": [the texts of the messages it carries on, in
            the order of all of them]}`, plain text with \\n line breaks.
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string, format: date-time }
        out: { type: boolean, description: "You sent it" }
        read: { type: boolean, description: "Its recipient has read it" }
        deletableUntil:
          type: string
          description: "Until when you may delete your message from both sides (date-time); empty for the peer's"
        editableUntil:
          type: string
          description: "Until when you may edit your message (date-time); empty for the peer's"
        editedAt:
          type: [string, "null"]
          format: date-time
          description: When its sender edited it; null if never
        post: { type: string, description: "A post shared in it; empty for none" }
        repost:
          description: The shared post, as inside a repost; absent in the list of dialogs and without one
          $ref: "#/components/schemas/SharedPost"
        albumPhoto: { type: string, description: "A photo of an album shared in it; empty for none" }
        sharedPhoto:
          description: The shared photo, as in a post that shares one; absent in the list of dialogs and without one
          $ref: "#/components/schemas/SharedPhoto"
        sticker: { type: string, description: "The sticker the message is, alone; empty for none" }
        forwardedCount: { type: integer, description: "How many messages it carries on from dialogs and chats" }
        forwarded:
          type: array
          description: The messages it carries on, oldest first, as a tree written parent first (depth), without those whose authors' pages are gone and what they carried on; absent in the list of dialogs and without any
          items: { $ref: "#/components/schemas/ForwardedMessage" }
        deleted:
          type: boolean
          description: "Its sender took it back from both sides: it says nothing (\"Сообщение удалено\") and can be neither edited nor taken back again, only deleted for yourself"

    ForwardedMessage:
      type: object
      description: A message carried on from a dialog or a chat, a copy of what its author wrote then; one that carried on others itself is followed by them, one level deeper, and may say nothing of its own
      required: [index, depth, author, text, photos, createdAt, post]
      properties:
        index: { type: integer, description: "Its place among all the messages carried on, those not shown too: in a dialog its text is the `f[index]` of the sealed message" }
        depth: { type: integer, description: "How deep it is carried: 0 for a message forwarded itself, 1 for one that message carried on, and so on" }
        author: { $ref: "#/components/schemas/Author" }
        text: { type: string, description: "Empty in a dialog: the text is sealed in the message" }
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string, format: date-time, description: "When it was written" }
        post: { type: string, description: "A post shared in it; empty for none" }
        repost: { $ref: "#/components/schemas/SharedPost" }
        albumPhoto: { type: string, description: "A photo of an album shared in it; empty for none" }
        sharedPhoto: { $ref: "#/components/schemas/SharedPhoto" }
        sticker: { type: string, description: "The sticker it is; empty for none" }

    SharedPhoto:
      type: object
      description: A photo of an album shared in a post or a message; a deleted photo leaves only its ID
      required: [id, deleted, photo, albumId]
      properties:
        id: { type: string, format: uuid }
        deleted: { type: boolean }
        photo: { oneOf: [{ $ref: "#/components/schemas/Photo" }, { type: "null" }] }
        albumId: { type: string }
        nsfw: { type: boolean, description: The photo came from a post marked as adult }

    Dialog:
      type: object
      description: A dialog (`peer` and `lastMessage`) or a chat of several people (`chat`).
      required: [unread]
      properties:
        peer: { $ref: "#/components/schemas/Author" }
        lastMessage: { $ref: "#/components/schemas/Message" }
        chat: { $ref: "#/components/schemas/Chat" }
        unread: { type: boolean, description: "Someone wrote something you have not read" }

    Chat:
      type: object
      description: A chat of several people ("беседа") as you have it.
      required: [id, title, ownerId, createdAt, memberCount, state, unread, lastMessage]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 64, description: "May be empty: the chat has no name of its own" }
        ownerId: { type: string, format: uuid, description: "Who created it (\"создатель\"): only they remove people" }
        createdAt: { type: string, format: date-time }
        memberCount: { type: integer, description: How many people are in it now }
        state:
          type: string
          enum: [active, left, kicked]
          description: >-
            `left`: you left and may come back; `kicked`: the creator
            removed you. Either way the chat stays as it was at that moment.
        unread: { type: boolean }
        lastMessage:
          oneOf: [{ $ref: "#/components/schemas/ChatMessage" }, { type: "null" }]
          description: The last message you are shown; null when the page of who wrote it is gone
        members:
          type: array
          description: Who is in it, who joined first first; told by the chat itself, not by lists, and only to those in it
          items: { $ref: "#/components/schemas/Author" }

    ChatMessage:
      type: object
      required: [id, chatId, author, out, text, photos, action, createdAt, editedAt, deleted, deletableUntil, editableUntil, unread, post, albumPhoto, forwardedCount]
      properties:
        id: { type: string, format: uuid }
        chatId: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        out: { type: boolean, description: Your own }
        text: { type: string, maxLength: 60000, description: "Of an action, the title it tells of" }
        textCut: { type: boolean, description: "`text`, or the text of a message it carries on, is only the beginning; GET /chat-messages/{id} has them whole" }
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        action:
          type: string
          enum: ["", create, title, invite, kick, leave, return]
          description: >-
            Not empty: the message tells what `author` did instead of
            saying something — created the chat, renamed it (`text`),
            added or removed `target`, left, came back.
        target: { $ref: "#/components/schemas/Author" }
        createdAt: { type: string, format: date-time }
        editedAt: { type: [string, "null"], format: date-time }
        deleted: { type: boolean, description: "Its sender took it back: it says nothing (\"Сообщение удалено\")" }
        deletableUntil: { type: string, description: "Until when you may take your message back, a day; \"\" for others' and for actions" }
        editableUntil: { type: string, description: "Until when you may edit your message, a day" }
        unread: { type: boolean, description: "Someone else's, which you have not read" }
        post: { type: string, description: "A post shared in it; empty for none" }
        repost:
          description: The shared post, as inside a repost; absent in the list of dialogs and without one
          $ref: "#/components/schemas/SharedPost"
        albumPhoto: { type: string, description: "A photo of an album shared in it; empty for none" }
        sharedPhoto:
          description: The shared photo; absent in the list of dialogs and without one
          $ref: "#/components/schemas/SharedPhoto"
        sticker: { type: string, description: "The sticker the message is, alone; empty for none" }
        forwardedCount: { type: integer, description: "How many messages it carries on from dialogs and chats" }
        forwarded:
          type: array
          description: The messages it carries on, as in Message; absent in the list of dialogs and without any
          items: { $ref: "#/components/schemas/ForwardedMessage" }

    ChatMessagePage:
      type: object
      required: [messages, nextCursor]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
        nextCursor: { type: string, description: "Older messages remain; empty when there are none, and always with `after`" }

    DialogPage:
      type: object
      required: [dialogs, nextCursor]
      properties:
        dialogs:
          type: array
          items: { $ref: "#/components/schemas/Dialog" }
        nextCursor: { type: string, description: "Empty on the last page" }

    MessagePage:
      type: object
      required: [peer, messages, nextCursor, peerReadUpTo, canWrite]
      properties:
        peer: { $ref: "#/components/schemas/Author" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        nextCursor: { type: string, description: "Older messages remain; empty when none, always with after" }
        peerReadUpTo:
          type: string
          description: "The newest of your messages the peer has read, to update shown ones; empty if none"
        canWrite:
          type: boolean
          description: "You may write to the peer; told on the first page, false on older pages and with after"

    Relation:
      type: object
      required: [blockedByMe, blockedMe]
      properties:
        blockedByMe: { type: boolean, description: "You blacklisted the user; false without a token" }
        blockedMe: { type: boolean, description: "The user blacklisted you; false without a token" }

    FollowStats:
      type: object
      required: [followersCount, followingCount, isFollowing]
      properties:
        followersCount: { type: integer }
        followingCount: { type: integer }
        isFollowing: { type: boolean, description: "You follow the user; false without a token" }

    UserPage:
      type: object
      required: [users, nextCursor, total]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/PublicProfile" }
        nextCursor: { type: string, description: "Empty on the last page" }
        total: { type: integer }

    ArchivedWall:
      type: object
      required: [changed]
      properties:
        changed: { type: integer, description: "How many posts went to the archive or came back" }

    PostPage:
      type: object
      required: [posts, nextCursor, total]
      properties:
        posts:
          type: array
          items: { $ref: "#/components/schemas/Post" }
        nextCursor: { type: string, description: "Empty on the last page" }
        total: { type: integer, description: "All posts on the wall" }
        canPost:
          type: boolean
          description: "On a wall's first page: you may write on it; false without a token and in the news feed"
        canSuggest:
          type: boolean
          description: "On a community's wall, as canPost: you may suggest a post for it instead"
        years:
          type: array
          items: { type: integer }
          description: "On the first page of the archive (`type=archive`): the years (UTC) the posts of the wall were written in, archived or not, the latest first"

    NewPostponed:
      type: object
      required: [publishAt]
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 60000 }
        photos:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }
          description: IDs from POST /api/v1/me/photos
        nsfw: { type: boolean }
        signed: { type: boolean, description: "For a community: name you under the post (\"Подпись автора\")" }
        publishAt: { type: string, format: date-time, description: "Ahead of now, within a year" }

    Postponed:
      type: object
      required: [id, author, text, photos, publishAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        text: { type: string }
        textCut:
          type: boolean
          description: "`text` is only its beginning (1000 characters), as the list carries it; GET /api/v1/postponed/{id} tells it whole"
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        nsfw: { type: boolean }
        fromClub: { type: boolean, description: "It will speak for the community" }
        signed: { type: boolean }
        publishAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    PostponedPosts:
      type: object
      required: [postponed]
      properties:
        postponed:
          type: array
          items: { $ref: "#/components/schemas/Postponed" }

    Suggestion:
      type: object
      required: [id, author, text, photos, createdAt]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        text: { type: string }
        textCut:
          type: boolean
          description: "`text` is only its beginning (1000 characters): lists carry no more. GET /api/v1/suggestions/{id}/text tells it whole. Absent when the text is whole"
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string, format: date-time }

    PublicProfile:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          required: [id, avatar, deactivated]
          properties:
            id: { type: string, format: uuid }
            avatar: { $ref: "#/components/schemas/Avatar" }
            deactivated:
              type: boolean
              description: "The owner deleted the page: only the names and the photo are left"
            pageHidden:
              type: boolean
              description: "The owner hid the page from you (`pageRead`, or a closed profile whose owner does not follow you): only the names and the photo are left"
            closed:
              type: boolean
              description: "A closed profile (\"Закрытая страница\")"
            infoHidden:
              type: boolean
              description: "The owner hid the information of the page from you (`infoRead`): only the names, the photo, the status and the pronouns are left"
            lastSeenAt:
              description: "When the user last visited the site (\"был в сети\"); null if never, when hidden (`onlineRead`) and in lists"
              oneOf:
                - { type: string, format: date-time }
                - { type: "null" }
            online:
              type: boolean
              description: "The user is on the site now (\"Онлайн\"). A list tells it too, but only of a page open to everyone (`pageRead`), as it does not know who looks"
            backdrop: { $ref: "#/components/schemas/Backdrop" }
            completeness:
              type: integer
              description: '"Заполненность страницы" in percent; only on the page itself, absent on a deleted or hidden one'

    Access:
      type: object
      description: Which blocks of a page you may see, as its owner's privacy allows
      required: [photos, friends, clubs, notes, gifts]
      properties:
        photos: { type: boolean, description: "The albums (`photosRead`)" }
        friends: { type: boolean, description: "The follows, either way (`friendsRead`)" }
        clubs: { type: boolean, description: "The communities (`clubsRead`)" }
        notes: { type: boolean, description: "The notes (`notesRead`)" }
        gifts: { type: boolean, description: "The gifts (`giftsRead`)" }

    Gift:
      type: object
      description: 'A gift sent to a page ("Подарки"), as you see it'
      required: [id, gift, caption, anonymous, sentAt, sender]
      properties:
        id: { type: string, format: uuid }
        gift: { type: string, description: "Its name in the catalogue, as `rose`" }
        caption: { type: string, description: "What the sender said with it; empty for none and when you are not told (an anonymous gift)" }
        anonymous: { type: boolean, description: "Sent anonymously; told to those who are told the sender" }
        sentAt: { type: string, format: date-time }
        sender:
          oneOf:
            - $ref: "#/components/schemas/Author"
            - type: "null"
          description: "Who sent it; null when you are not told (an anonymous gift) and when the page of the sender is deleted"

    Voucher:
      type: object
      description: 'A voucher ("Ваучер"), as the administrators see it'
      required: [id, code, votes, rating, usagesLeft, activations]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: "The serial number: 24 capital letters and digits" }
        votes: { type: integer, description: The votes it gives }
        rating: { type: integer, description: The percent of rating it gives }
        usagesLeft: { type: integer, description: "How many more accounts may use it; -1 for any number, 0 when it has run out" }
        activations: { type: integer, description: How many accounts have used it }

    NoteDraft:
      type: object
      additionalProperties: false
      required: [title, text]
      properties:
        title: { type: string, minLength: 1, maxLength: 256, description: "One line (\"Название\")" }
        text: { type: string, minLength: 1, maxLength: 60000, description: "Plain text (\"Содержание\")" }

    Note:
      type: object
      description: 'A note of a person ("Заметки"): a title and a text kept apart from the wall'
      required: [id, title, text, comments, createdAt, editedAt, mine]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        text: { type: string, description: "Plain text with \\n line breaks; never HTML" }
        textCut:
          type: boolean
          description: "`text` is only its beginning (1000 characters): the list carries no more. GET /api/v1/notes/{id} tells it whole. Absent when the text is whole"
        comments: { type: integer }
        createdAt: { type: string, format: date-time }
        editedAt:
          type: [string, "null"]
          format: date-time
          description: When it was last changed; null if never
        mine: { type: boolean, description: You wrote it }

    NoteComment:
      type: object
      required: [id, author, text, createdAt, mine]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        text: { type: string, description: "Plain text with \\n line breaks; never HTML" }
        textCut:
          type: boolean
          description: "`text` is only its beginning (1000 characters). GET /api/v1/note-comments/{id}/text tells it whole. Absent when the text is whole"
        createdAt: { type: string, format: date-time }
        mine: { type: boolean, description: You wrote it }

    Backdrop:
      description: '"Фон страницы": the photos on the left and on the right of a page, of a person or a community; null for none'
      oneOf:
        - type: object
          required: [left, right]
          properties:
            left: { oneOf: [{ $ref: "#/components/schemas/Photo" }, { type: "null" }] }
            right: { oneOf: [{ $ref: "#/components/schemas/Photo" }, { type: "null" }] }
        - type: "null"

    PhotoComment:
      type: object
      required: [id, author, text, createdAt, mine, replyTo, likes, liked]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        text: { type: string, description: "Plain text with \\n line breaks; never HTML" }
        textCut:
          type: boolean
          description: "`text` is only its beginning (1000 characters): lists carry no more. GET /api/v1/photo-comments/{id}/text tells it whole. Absent when the text is whole"
        createdAt: { type: string, format: date-time }
        mine: { type: boolean, description: You wrote it }
        replyTo:
          type: [string, "null"]
          format: uuid
          description: The comment under the same photo it answers; null for none or when that comment is deleted
        likes: { type: integer }
        liked: { type: boolean, description: "You like it; false without a token" }
