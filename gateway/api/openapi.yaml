      responses:
        "200": { $ref: "#/components/responses/AlbumPage" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Rename an album ("Редактировать альбом")
      description: Its owner or the admins of the community that owns it.
