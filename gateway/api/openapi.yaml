openapi: 3.1.0
info:
  title: Freenet API
  version: 1.0.0
  description: |
    Public HTTP API of Freenet, served by the gateway.

    Sign-in is passwordless: request a code by email, exchange it for a token
    pair. Send the access token as `Authorization: Bearer <token>`; it lives
    15 minutes. Exchange the refresh token for a new pair before that; each
    refresh token works once, and reusing an old one ends the session.

    Texts are plain. A post, a comment, a message of a topic or a comment
    under a photo names people as `@nickname` (at the start or after a
    space) or `[nickname|Any name]`: the site draws both as links to
    `/nickname` when there is such a page (`GET /api/v1/nicknames`), and
    the first 10 people so named in a new text, a repost's words or an
    edited post are notified (`post_mention`, `comment_mention`,
    `topic_mention`, `photo_mention`), once for a post however often it is
    edited, unless a blacklist stands between them and the author.

    Errors always have the shape `{"error": {"code": "...", "message": "..."}}`;
    `message` is safe to show to the user.

    Every response carries `X-Request-ID`, the name of the request in the
    logs of the gateway and of every service it called: quote it when
    reporting a problem. An `X-Request-ID` sent by the client is ignored
    unless the gateway runs behind its own proxy.
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/v1/auth/code:
    post:
      summary: Email a sign-in code
      description: |
        Answers the same way whether or not the email has an account. One
        code per email per minute and a limited number per client address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, example: ann@example.com }
      responses:
        "204": { description: Code sent }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/verify:
    post:
      summary: Exchange a code for tokens
      description: |
        Creates the account on the first sign-in; its profile is empty until
        `PUT /api/v1/me/profile` (`profileCompleted` is false). A code works
        once and survives five attempts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9]{6}$", example: "123456" }
      responses:
        "200":
          description: >-
            The token pair, or, when the page has the second step on, only
            `twoFactorTicket`: the sign-in ends with
            `POST /api/v1/auth/two-factor`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  twoFactorTicket: { type: string }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/two-factor:
    post:
      summary: Finish a sign-in with the code of the authenticator app
      description: |
        The second step of a page that has it on: the ticket of
        `POST /api/v1/auth/verify` and a six-digit code of the app (TOTP,
        RFC 6238) or a recovery code ("abcde-fghij"). Every code works once.
        A ticket lives 10 minutes and survives five codes; ten codes of a
        page are checked per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, code]
              additionalProperties: false
              properties:
                ticket: { type: string }
                code: { type: string, example: "123456" }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/refresh:
    post:
      summary: Get a new token pair
      requestBody: { $ref: "#/components/requestBodies/RefreshToken" }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/auth/logout:
    post:
      summary: End the session of a refresh token
      description: Idempotent. The access token stays valid until it expires.
      requestBody: { $ref: "#/components/requestBodies/RefreshToken" }
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/batch:
    post:
      summary: Several reads at once
      description: >-
        Makes 1 to 20 GET requests of this API (but not of /api/v1/batch and
        /api/v1/events) at once, each with the headers of this request, so
        with its token, and answers what each would have answered by itself,
        in the same order: its status and its JSON body (none for 204). A
        page asks for what it shows in one round trip instead of one per
        block. The batch itself is 200 whatever its reads answer. No token
        needed: the reads answer as they would without one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requests]
              properties:
                requests:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [path]
                    properties:
                      path:
                        type: string
                        description: The path and query of the read, as "/api/v1/users/ann?x=1".
      responses:
        "200":
          description: The answers of the reads
          content:
            application/json:
              schema:
                type: object
                required: [responses]
                properties:
                  responses:
                    type: array
                    items:
                      type: object
                      required: [status]
                      properties:
                        status: { type: integer }
                        body:
                          description: The JSON body of the answer, an error included.
        "400": { $ref: "#/components/responses/InvalidArgument" }

  /api/v1/me:
    get:
      summary: The caller's account
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/two-factor:
    get:
      summary: Whether signing in takes the code of an authenticator app
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The second step
          content:
            application/json:
              schema:
                type: object
                required: [enabled, recoveryLeft]
                properties:
                  enabled: { type: boolean }
                  recoveryLeft: { type: integer, description: Recovery codes still unused }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/two-factor/setup:
    post:
      summary: A new secret for the authenticator app
      description: >-
        The key to type in by hand, the otpauth:// address and its QR code
        as rows of "0" and "1" ("1" is dark). The second step stays off
        until `POST /api/v1/me/two-factor/enable`; a secret set up before
        and not enabled is replaced.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The secret
          content:
            application/json:
              schema:
                type: object
                required: [secret, uri, qr]
                properties:
                  secret: { type: string, example: "GEZD GNBV GY3T QOJQ GEZD GNBV GY3T QOJQ" }
                  uri: { type: string }
                  qr: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/me/two-factor/enable:
    post:
      summary: Turn the second step on with the first code of the app
      description: Returns the ten recovery codes, given this once.
      security: [{ bearer: [] }]
      requestBody: { $ref: "#/components/requestBodies/TwoFactorCode" }
      responses:
        "200": { $ref: "#/components/responses/RecoveryCodes" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/two-factor/disable:
    post:
      summary: Turn the second step off for a code of the app or a recovery code
      security: [{ bearer: [] }]
      requestBody: { $ref: "#/components/requestBodies/TwoFactorCode" }
      responses:
        "204": { description: Turned off }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/two-factor/recovery:
    post:
      summary: New recovery codes for a code of the app
      description: The ones given before stop working.
      security: [{ bearer: [] }]
      requestBody: { $ref: "#/components/requestBodies/TwoFactorCode" }
      responses:
        "200": { $ref: "#/components/responses/RecoveryCodes" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/sessions:
    get:
      summary: Where you are signed in ("Сессии" of the settings)
      description: >-
        The sessions that can still be continued, the latest used first, at
        most 100. A session is a sign-in: it remembers where from it was
        made and where from and when its tokens were last refreshed. The
        address and the browser's name are what the client said; either is
        "" when unknown. Nobody else sees them.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    delete:
      summary: Sign out everywhere but here ("Сбросить все сессии")
      description: >-
        Ends every session of yours but the one of the access token. Their
        refresh tokens stop working at once; an access token issued already
        lives out its minutes.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: How many sessions ended
          content:
            application/json:
              schema:
                type: object
                required: [ended]
                properties:
                  ended: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/sessions/{id}:
    delete:
      summary: Sign out of one of your sessions
      description: >-
        The session of the access token can be ended too; that is signing
        out. An access token issued already lives out its minutes.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: The session is ended }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/profile:
    put:
      summary: Replace the profile ("Основное" of "Редактировать страницу")
      description: |
        Fields left out are cleared. `name` and `nickname` are required.
        `partner` is the nickname of whom the relationship names (`dating`,
        `engaged`, `married`, `civil_union`, `in_love`, `complicated`);
        others name nobody.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Profile"
                - type: object
                  properties:
                    partner: { type: string, description: "A nickname; `partner not found` if nobody has it" }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: The nickname is taken (case-insensitive)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/status:
    put:
      summary: Change your status alone, as openvk edits it on your page
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, maxLength: 200 }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/nickname:
    put:
      summary: Change the address of your page alone ("Адрес страницы" of the settings)
      description: The rest of the profile stays as it is. The profile has to be filled in first.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: Another page has this address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/contacts:
    put:
      summary: Replace "Контактная информация"
      description: Every field is optional; `https://` is added to a website without a scheme, `@` and t.me links are taken for Telegram.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Contacts" }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/interests:
    put:
      summary: Replace "Личная информация"
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Interests" }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/fields:
    put:
      summary: Replace "Дополнительно", the fields you name
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: array
                  maxItems: 7
                  items: { $ref: "#/components/schemas/ExtraField" }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/backdrop/{side}:
    parameters:
      - name: side
        in: path
        required: true
        schema: { type: string, enum: [left, right] }
    put:
      summary: Set one side of your backdrop ("Фон страницы")
      description: The body is the image itself, as for a photo; the other side stays, the photo this one replaces is deleted.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/backdrop:
    delete:
      summary: Take your backdrop away ("Удалить фон"), both sides
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/interface:
    put:
      summary: Change how the site looks to you ("Интерфейс")
      description: >-
        The whole form of openvk's tab: how everyone's photos are shown
        ("Отображение аватаров"), where the site opens ("Главная
        страница") and which links the left menu leaves out ("Левое
        меню"). Nobody else sees it; the site applies it, the API serves
        the same either way.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Interface" }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/privacy:
    put:
      summary: Choose who sees your page and its parts, and who writes to you
      description: |
        "Приватность" of openvk's settings. Sensitive fields are hidden by
        default; a new wall is open to the people you follow; the page and
        its parts are open to everyone. All settings are sent at once.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Privacy" }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/deactivate:
    post:
      summary: Delete your page
      description: |
        openvk's "Удаление страницы": the page is hidden at once and can be
        restored until `purgeAt` (seven months by default); then its data is
        erased in every service: the profile, posts and posts on its wall,
        likes, comments, photos, dialogs on both sides and notifications.
        Meanwhile others see only the name and the photo (`deactivated`),
        nobody may follow it, write on its wall or to it, and what its owner
        wrote is hidden. Refresh the tokens right after: those of a deleted
        page are good only for `GET /api/v1/me` and
        `POST /api/v1/me/reactivate`; send other requests without a token,
        as an anonymous visitor.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 1000
                  description: "Why, in the owner's words or one of openvk's reasons; may be empty"
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: The page is deleted already (`your page is deleted`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/reactivate:
    post:
      summary: Restore your deleted page
      description: |
        Works with the token of a deleted page; refresh the tokens right
        after to get full ones again.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`this page is not deleted`, or `this page can no longer be restored` after `purgeAt`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/users/{nickname}:
    get:
      summary: Someone's public profile with follow counters
      description: |
        No token needed. Fields the owner has not opened are empty, the same
        as fields that are not set. Nickname lookup is case-insensitive.
        With a token, `isFollowing` tells whether you follow the user, and
        `blockedByMe` / `blockedMe` who of you blacklisted the other: the
        website then shows the limited page of openvk instead of the profile.
        As the owner's privacy allows: a page hidden from you
        (`pageHidden`, "Кому в интернете видно мою страницу") has only the
        names and the photo, hidden information (`infoHidden`) leaves
        everything but the names, the photo, the status and the pronouns
        empty, and `access` says which blocks of the page you may see.
      parameters:
        - name: nickname
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PublicProfile"
                  - $ref: "#/components/schemas/About"
                  - $ref: "#/components/schemas/FollowStats"
                  - $ref: "#/components/schemas/Relation"
                  - type: object
                    required: [access, ignoredByMe]
                    properties:
                      access: { $ref: "#/components/schemas/Access" }
                      ignoredByMe: { type: boolean, description: "Your news leave this wall out (\"Игнорируемые источники\"); false without a token" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/blacklist:
    get:
      summary: Your blacklist, newest first
      description: |
        "Чёрный список" of openvk. A block shuts messages, wall posts,
        comments and follows between you and the user, both ways.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of the blacklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/blacklist/{nickname}:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Blacklist the user
      description: Idempotent. Drops the follows between you, both ways.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Blacklisted }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Take the user off your blacklist
      description: Idempotent. Follows dropped by the block do not come back.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Taken off }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/feed/ignored:
    get:
      summary: The sources your news leave out, newest first
      description: |
        "Игнорируемые источники" of openvk's feed settings: the people and
        the communities whose walls your feeds leave out, at most 50. A
        community comes with `club`, a deleted page with `deactivated`;
        an erased page stops being ignored by itself.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The ignored sources
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/Author" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    delete:
      summary: Stop ignoring several sources ("Не игнорировать")
      description: Idempotent.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: query
          required: true
          description: The IDs of 1–10 people or communities, repeated
          schema:
            type: array
            minItems: 1
            maxItems: 10
            items: { type: string, format: uuid }
      responses:
        "204": { description: Not ignored any more }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/feed/ignored/users/{nickname}:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Leave the wall of the user out of your news ("Игнорировать пользователя")
      description: |
        Idempotent. 400 `you cannot ignore yourself`; 409 `too many ignored
        sources` once 50 are ignored.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Ignored }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: Stop ignoring the user ("Не игнорировать пользователя")
      description: Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Not ignored any more }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/feed/ignored/clubs/{ref}:
    parameters:
      - name: ref
        in: path
        required: true
        description: The address of the community or its ID
        schema: { type: string }
    put:
      summary: Leave the wall of the community out of your news ("Игнорировать группу")
      description: Idempotent. 409 `too many ignored sources` once 50 are ignored.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Ignored }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      summary: Stop ignoring the community ("Не игнорировать группу")
      description: Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Not ignored any more }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{nickname}/posts:
    get:
      summary: Someone's wall, newest first
      description: |
        The posts on the wall, by its owner and by others. No token needed;
        with one, `liked` says whether you like each post, and the first
        page says in `canPost` whether you may write there. The pinned post
        (`pinned`) comes first on the first page, on top of `limit` others,
        and not again later.
        Page with `cursor` = `nextCursor` of the previous page; an empty
        `nextCursor` means the last page.
      parameters:
        - name: nickname
          in: path
          required: true
          schema: { type: string }
        - name: type
          in: query
          description: 'The tab of openvk''s wall: none for all posts ("Все записи", the pinned one first), `owner` for the wall''s own — by its owner, or for the community whose wall it is ("Записи Анны", "Записи сообщества") — `others` for the rest ("Чужие записи") and `archive` for the posts put away ("Архив записей"), which the other tabs leave out and only the owner of the wall or the admins of the community read (403); `total` counts the tab'
          schema: { type: string, enum: [owner, others, archive] }
        - name: q
          in: query
          description: '"Поиск" of the wall: the posts of the tab that say this, in any case; the pinned post is then in its place'
          schema: { type: string, maxLength: 100 }
        - name: year
          in: query
          description: 'The posts written in this year (UTC) only, as the years of openvk''s "Архив записей"; the pinned post is then in its place. The first page of the archive tells in `years` which there are'
          schema: { type: integer, minimum: 1970, maximum: 9999 }
        - name: ranked
          in: query
          description: "`true` puts the posts of the last week by how interesting they are to you (\"Сначала интересные\": likes, comments, reposts, photos, whom you like and comment on, how fresh), then the older ones newest first; the next pages follow the cursor, which says so itself"
          schema: { type: boolean, default: false }
        - name: comments
          in: query
          description: "`last` brings each post with `lastComments`, its three newest comments (\"Микроблог\")"
          schema: { type: string, enum: [last] }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of the wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "403":
          description: The owner deleted the page (`this page is deleted`) or hid it from you (`this page is hidden`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Write on someone's wall
      description: |
        As the owner's privacy allows (`wallWrite`); on your own nickname it
        is `POST /api/v1/me/posts`. The owner is notified. Your profile must
        be filled in first. Text, photos or both; photos are IDs from
        `POST /api/v1/me/photos` and must be yours.
      security: [{ bearer: [] }]
      parameters:
        - name: nickname
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPost" }
      responses:
        "201":
          description: The new post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: The owner does not let you write on the wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/users/{nickname}/posts/archive:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Put the posts of your wall away in its archive
      description: |
        "Архивировать все записи за 2025" of openvk with `year`, without it
        "Архивировать все записи целиком": every post of the wall written
        in the year (UTC), whoever wrote it, goes to the archive, the
        pinned one too. The owner of the wall only. Idempotent.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ArchiveYear"
      responses:
        "200":
          description: How many posts went to the archive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchivedWall" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Return the posts of your wall from its archive
      description: |
        "Разархивировать все записи за 2025" of openvk with `year`; without
        it every archived post of the wall returns. Idempotent.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ArchiveYear"
      responses:
        "200":
          description: How many posts came back
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchivedWall" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/avatar:
    put:
      summary: Set your profile photo
      description: |
        The body is the image itself (JPEG, PNG, GIF or WebP, at most 8 MB,
        at least 50x50), with its Content-Type. It is turned upright by its
        EXIF orientation, the middle square is kept and re-encoded, so EXIF
        data (location included) is dropped. The site crops the square you
        choose before sending it, as openvk does. The image also goes, as a
        photo of its own, into your "Фотографии со страницы" (an album of
        `kind` "avatars"); failing that, the photo is changed all the same.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Remove your profile photo
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/users:
    get:
      summary: Find people
      description: |
        Every word of `q` must occur in the name, surname or nickname, in any
        order and case. The filters are the links of openvk's page: people of
        a hometown or a city (whatever the case), or who name a film, a show
        or a book among their favourites; `q` may be empty with a filter.
        Only people with a filled-in profile are found. Newest accounts
        first; page with `cursor` = `nextCursor`.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 64 }
        - { name: hometown, in: query, schema: { type: string, maxLength: 64 } }
        - { name: city, in: query, schema: { type: string, maxLength: 64 } }
        - { name: film, in: query, schema: { type: string, maxLength: 64 } }
        - { name: show, in: query, schema: { type: string, maxLength: 64 } }
        - { name: book, in: query, schema: { type: string, maxLength: 64 } }
        - name: verified
          in: query
          description: "true: only the pages with the checkmark of a confirmed one; may go without `q`"
          schema: { type: boolean }
        - name: banned
          in: query
          description: "true: only the pages blocked now (\"Пользователи\" of the admin panel); may go without `q`"
          schema: { type: boolean }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of people; total is always 0
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }

  /api/v1/me/photos:
    post:
      summary: Upload a photo for a post
      description: |
        The raw image is the request body (JPEG, PNG, GIF or WebP, at most
        8 MB). It is turned upright by its EXIF orientation and scaled down
        whole, keeping its proportions; attach it to a post by its `id`.
        A photo goes to one post, comment, message or album, the first
        that takes it: attached anywhere else, it is `photo not found`
        (400), as a photo of another user is. A post that was refused
        gives its photos back. A photo that no post publishes within a
        day is deleted, and deleting the post deletes its photos.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The stored photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /media/photos/{userId}/{photoId}/{file}:
    get:
      summary: A photo of a post
      description: URLs come from the `photos` of posts and never change, so responses are cached for a year.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: photoId, in: path, required: true, schema: { type: string } }
        - name: file
          in: path
          required: true
          schema: { type: string, enum: [large.jpg, small.jpg] }
      responses:
        "200":
          description: JPEG, up to 1280 (large) or 640 (small) on the longer side
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /media/stickers/{sticker}:
    get:
      summary: A sticker a person made of their photo
      description: The smaller size of its photo. Its name never changes, so responses are cached for a year.
      parameters:
        - { name: sticker, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{32}$" } }
      responses:
        "200":
          description: JPEG, up to 640 on the longer side
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /media/avatars/{userId}/{avatarId}/{file}:
    get:
      summary: A profile photo
      description: |
        URLs come from the `avatar` fields; they change with every new photo,
        so responses are cached for a year.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: avatarId, in: path, required: true, schema: { type: string } }
        - name: file
          in: path
          required: true
          schema: { type: string, enum: [large.jpg, small.jpg] }
      responses:
        "200":
          description: JPEG, 400x400 (large) or 100x100 (small)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /media/documents/{id}:
    get:
      summary: Download a document
      description: |
        No token needed: whoever knows the ID downloads it, as with photos.
        Always an attachment (`application/octet-stream`), named after the
        document; a deleted document is gone.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/documents:
    get:
      summary: Your documents ("Мои Документы"), newest first
      security: [{ bearer: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: A page
          content:
            application/json:
              schema:
                type: object
                required: [documents, nextCursor, total]
                properties:
                  documents:
                    type: array
                    items: { $ref: "#/components/schemas/Document" }
                  nextCursor: { type: string, description: "Empty on the last page" }
                  total: { type: integer, description: How many documents you have }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      summary: Upload a document ("Загрузить документ")
      description: |
        The body is the file itself, up to 10 MB; `name` is its file name,
        whose end tells the format. The formats are openvk's: jpg, jpeg,
        png, gif, webp, psd, aep, docx, doc, odt, txt, md, pptx, ppt, xls,
        xlsx, pdf, djvu, fb2, ps, apk, zip, 7z, mp4, avi, mp3, flac.
      security: [{ bearer: [] }]
      parameters:
        - { name: name, in: query, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/documents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Rename your document ("Редактирование документа")
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "Not your document", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Delete your document
      description: It disappears from the posts and messages that attach it too.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "Not your document", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/stories:
    get:
      summary: The stories above your news ("истории" of VK)
      description: |
        A story is a photo with a few words shown for a day. These are
        yours and of the people you follow, grouped by author: you first,
        then those with a story you have not viewed, then the rest; each
        one's stories the oldest first. Those you blacklisted or ignore in
        the news, deleted pages and closed pages you may not see are left
        out.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The stories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoryList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/users/{nickname}/stories:
    get:
      summary: The live stories of a person, the oldest first
      security: [{ bearer: [] }]
      parameters:
        - { name: nickname, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The stories, under one author or none
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoryList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "The page is deleted or hidden", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/stories:
    post:
      summary: Tell a story
      description: |
        The profile must be filled in first. The photo is an ID from
        `POST /api/v1/me/photos`, yours; it is shown for a day and then
        deleted. At most 30 stories of yours live at once (409).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: uuid }
                text: { type: string, maxLength: 200 }
      responses:
        "201":
          description: The story
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { description: "Too many stories", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/stories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Delete your story with its photo
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "Not your story", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/stories/{id}/view:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: You viewed a story; once is enough, your own is not counted
      security: [{ bearer: [] }]
      responses:
        "204": { description: Viewed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/stories/{id}/like:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Like a story you see; its author hears about it (`story_like`)
      description: Idempotent. Limited as likes are.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Liked }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Take your like of a story back
      security: [{ bearer: [] }]
      responses:
        "204": { description: Not liked }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/stories/{id}/comments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: The comments of a story you see, the oldest first
      description: Those of deleted pages are left out of `comments` and of `total`.
      security: [{ bearer: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: One page of comments
          content:
            application/json:
              schema:
                type: object
                required: [comments, nextCursor, total]
                properties:
                  comments:
                    type: array
                    items: { $ref: "#/components/schemas/StoryComment" }
                  nextCursor: { type: string, description: "Empty on the last page" }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Comment a story you see
      description: |
        Text only. Needs a filled-in profile and no blacklist between you
        and the author of the story (`you cannot comment on this story`).
        The author hears about it (`story_comment`). Limited as comments
        are.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201":
          description: The comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoryComment" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: A blacklist stands between you and the author
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/story-comments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Delete a comment under a story
      description: Its author or the author of the story.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not yours to delete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/stories/{id}/viewers:
    get:
      summary: Who viewed your story, the latest first
      description: |
        `total` counts them; people whose page is deleted are left out of
        `users` and of `total`.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: One page of people
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "Not your story", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/posts:
    get:
      summary: The posts you wrote, newest first ("Написанные мной записи")
      description: |
        What you wrote on your wall and on the walls of others, people and
        communities, with the beginnings of the texts; `total` counts it.
        Not what was archived on the wall of another, nor what you
        suggested for a community and its admins published. A post on the
        wall of a deleted page is left out of `posts`, still counted.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of your posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      summary: Write on your own wall
      description: |
        The profile must be filled in first (it gives the wall its address).
        The first web address in the text gets a card (`link`), here and on
        the walls of others and of communities.
        Text, photos or both; photos are IDs from `POST /api/v1/me/photos`
        and must be yours.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPost" }
      responses:
        "201":
          description: The new post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/posts:
    get:
      summary: Search the posts of every wall
      description: |
        "Поиск записей" of openvk: the posts of every wall that the query
        finds, newest first, each with its author, as the news show them
        (`moderated` too). One tag (`#поход`, in any case) finds the posts
        that say it as a tag — `#` at the start of the text or after a space,
        then letters, digits and `_` — and not as a part of a longer one;
        any other query finds the posts whose text says it, in any case. An
        empty query finds nothing. `total` counts what the query finds.
        What "Все новости" would not show you is not found: archived posts,
        those of deleted pages, the walls closed to you and what the people
        in your blacklist wrote (but in the name of a community).
      security: [{ bearer: [] }]
      parameters:
        - name: q
          in: query
          description: At most 100 characters; longer is 400 `search query is too long`
          schema: { type: string }
        - name: comments
          in: query
          description: "`last` brings each post with `lastComments`, its three newest comments (\"Микроблог\")"
          schema: { type: string, enum: [last] }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of the posts found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/posts/{id}:
    get:
      summary: One post, for its page
      description: No token needed; with one, `liked` says whether you like it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The post with its author and wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a post
      description: By its author or by the owner of its wall.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Neither your post nor your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Edit your post
      description: |
        Its author changes the text and photos until `editableUntil`, a week
        after posting, as in openvk; the post then shows `editedAt`. The
        body is the whole new content, as when posting: text, photos or
        both; new photos must be yours. A repost keeps the post it shares
        and takes text only. Photos taken away are deleted.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPost" }
      responses:
        "200":
          description: The edited post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The week to edit the post is over
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/posts/{id}/purchase:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Pay to see the photos and documents of a paid post
      description: |
        The post's price goes to its author, who pays the tax of sticker
        packs of it into the treasury. Paid before, it costs nothing again.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The votes you have left and the post, open
          content:
            application/json:
              schema:
                type: object
                required: [balance, post]
                properties:
                  balance: { type: integer }
                  post: { $ref: "#/components/schemas/Post" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`this post is not for sale` (free, or yours); `not enough votes`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/posts/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Put the post away in the archive of your wall
      description: |
        "Архивировать" of openvk: the owner of the wall, or the admins of
        the community it is, whoever wrote the post. No wall, feed or other
        post shows it then, others do not find it by its address either,
        and it is no longer pinned; it is read with `?type=archive`.
        Others can neither like nor share it then (404), though a like
        given before can be taken back. Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Archived }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Return the post from the archive
      description: Idempotent; the post goes back to its place on the wall.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Returned }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/posts/{id}/closed-comments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Close the comments of a post on your wall
      description: |
        The owner of the wall, or the admins of the community it is: the
        post takes no new comments from anyone (409 "the comments are
        closed"), those written before stay. Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Closed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Open the comments of the post again
      description: Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Opened }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/posts/{id}/pin:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Pin the post on your wall
      description: |
        The owner of the wall shows the post first there, whoever wrote it;
        the post pinned before is unpinned. Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Pinned }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Unpin the post
      description: Idempotent; the post goes back to its place on the wall.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Unpinned }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/posts/{id}/reposts:
    post:
      summary: Share a post on your wall or a community's
      description: |
        As openvk's "Поделиться": a repost on your own wall shows the shared
        post inside, with what you say about it (may be empty). Sharing a
        repost that says nothing shares its original. The author of the
        shared post is notified (by the community, when the repost speaks
        for it). Your profile must be filled in first. With `club` the
        repost goes on that community's wall ("в группу"), as a post there
        would: for the community (`fromClub`, admins only, and always on a
        wall that is not open), maybe signed. `photos` are yours to add to
        your words, IDs from `POST /api/v1/me/photos`. To share a post in a
        dialog ("в переписку"), send a message with `post`.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text: { type: string, maxLength: 60000 }
                photos: { $ref: "#/components/schemas/PhotoIDs" }
                club: { type: string, description: "The address or ID of a community to share it in" }
                fromClub: { type: boolean }
                signed: { type: boolean }
      responses:
        "201":
          description: The repost
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    get:
      summary: Who shared the post, newest first
      description: |
        No token needed. The posts that share it, each with its author, a
        person or the community it speaks for, and the beginning of its
        text. `total` is the repost counter; reposts in an archive and
        those of deleted pages are left out of `posts`, still counted.
        `canPost` and `canSuggest` are not told.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of reposts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/posts/{id}/likes:
    get:
      summary: Who like the post, newest first ("Понравилось N людям")
      description: |
        No token needed. `total` is the like counter; people whose page is
        deleted are left out of `users`, still counted.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of people
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/posts/{id}/poll/vote:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Vote in the poll of the post
      description: |
        Chooses one option, or several of a poll with `multiple`, once: a
        second vote is refused until the first is taken back. The post must
        be one you can see. Limited as likes.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [options]
              properties:
                options:
                  description: The places of the chosen options, from 0
                  type: array
                  minItems: 1
                  items: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The poll as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Poll" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 'You have voted already ("you have voted in the poll already"), or the poll has ended ("the poll has ended")'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Take your vote back ("Отменить голос")
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The poll as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Poll" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 'You have not voted ("you have not voted in the poll"), the poll does not let votes be taken back ("the poll does not let a vote be taken back") or has ended ("the poll has ended")'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/posts/{id}/poll/voters:
    get:
      summary: Who chose an option of the poll, newest first ("Список проголосовавших")
      description: |
        No token needed. `total` is the counter of the option; people whose
        page is deleted are left out of `users`, still counted.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: option
          in: query
          required: true
          description: The place of the option, from 0
          schema: { type: integer, minimum: 0 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of people
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 'The poll is anonymous ("the poll is anonymous")'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/posts/{id}/like:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Like the post
      description: Idempotent; a second like counts once.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Like" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Take your like back
      description: Idempotent.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Like" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/posts/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Comments of a post, oldest first
      description: |
        No token needed. Page with `cursor` = `nextCursor` of the previous
        page; an empty `nextCursor` means the last page.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of comments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Comment on a post
      description: |
        Your profile must be filled in first. Text, photos or both; photos
        are IDs from `POST /api/v1/me/photos` and must be yours. They are
        deleted with the comment and with its post. `replyTo` answers a
        comment of the same post, as "Ответить": its author is notified
        (comment_reply); the text is yours to start with their name.
        `fromClub` speaks for the community whose wall the post is on
        ("От имени сообщества"), its admins only: readers see the
        community, and those it notifies hear from it.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text: { type: string, maxLength: 60000 }
                photos: { $ref: "#/components/schemas/PhotoIDs" }
                replyTo: { type: string, format: uuid, description: "The comment of this post to answer" }
                fromClub: { type: boolean, description: "For the community of the post's wall, its admins only" }
      responses:
        "201":
          description: The new comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You and the author of the post or the owner of its wall blacklisted one another, or `fromClub` and you do not run the community of its wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/comments/{id}:
    delete:
      summary: Delete a comment
      description: By the author of the comment or of the post, or by the owner of the wall.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Neither your comment nor your post nor your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/comments/{id}/text:
    get:
      summary: What a comment says, whole
      description: |
        No token needed. Lists of comments carry the beginning of a long
        text (`textCut`); this is all of it, for "Показать больше". A
        comment of a post you are not shown is not found.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The text
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/comments/{id}/likes:
    get:
      summary: Who like the comment, newest first ("Понравилось N людям")
      description: |
        No token needed. `total` is the like counter; people whose page is
        deleted are left out of `users`, still counted.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of people
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/comments/{id}/like:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Like the comment
      description: Idempotent; its author is notified (comment_like).
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Like" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Take your like of the comment back
      description: Idempotent.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Like" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/notifications:
    get:
      summary: Your notifications, newest first
      description: |
        `box=unread` (the default) is what is newer than your read mark,
        `box=archive` the rest. Notifications whose author, post or comment
        is gone are left out. Mark the page read with `newestId`.
      security: [{ bearer: [] }]
      parameters:
        - name: box
          in: query
          schema: { type: string, enum: [unread, archive], default: unread }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/notifications/unread-count:
    get:
      summary: How many notifications are unread, at most 100
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The number for the menu counter
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer, maximum: 100 }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/notifications/read:
    post:
      summary: Move your notifications up to one to the archive
      description: The mark never moves back; `upTo` must be your notification.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upTo]
              properties:
                upTo: { type: string, format: uuid, description: "newestId of the page you have seen" }
      responses:
        "204": { description: Read }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/push/key:
    get:
      summary: The key browsers subscribe to pushes with
      description: |
        The application server key (VAPID, P-256, base64url without
        padding) for `PushManager.subscribe`; null when the site does not
        push. Anyone may ask.
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema:
                type: object
                required: [publicKey]
                properties:
                  publicKey: { type: string, nullable: true }

  /api/v1/me/push:
    put:
      summary: Get your pushes in this browser
      description: |
        The browser takes the pushes of what happens to you while no page
        of the site is open: new notifications and messages. They say who
        did what, never the words of a message. A browser pushes to one
        user, whoever subscribed it last; you keep your ten newest
        browsers. The body is `PushSubscription.toJSON()` of the browser.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, description: "https URL of the browser's push service" }
                expirationTime: { type: number, nullable: true, description: "Not used" }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string, description: "base64url, 65 bytes" }
                    auth: { type: string, description: "base64url, 16 bytes" }
      responses:
        "204": { description: Subscribed }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`push notifications are off`: the site does not push"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Stop your pushes in this browser
      description: A browser that pushes to someone else now is left alone.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        "204": { description: Unsubscribed }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/messages/search:
    get:
      summary: Find your messages of chats by what they say
      description: |
        Newest first, each with its chat (`chat`, `chatMessage`). Messages
        of dialogs are end-to-end encrypted: the server cannot read them,
        the browser searches what it has opened itself (`peer` answers 400
        `messages of dialogs are end-to-end encrypted`). Messages taken
        back and what happened in a chat are not found; who is not in a
        chat anymore finds what they were shown. A message is found by its
        own words and by the words of the messages it forwards; a long
        text, its own or forwarded, comes as the part around what was
        found.
      security: [{ bearer: [] }]
      parameters:
        - name: q
          in: query
          required: true
          description: Text the messages say, in any case
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: chat
          in: query
          description: A chat of yours, to search it only
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of found messages
          content:
            application/json:
              schema:
                type: object
                required: [messages, nextCursor]
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      required: [chat, chatMessage]
                      properties:
                        chat:
                          type: object
                          required: [id, title]
                          properties:
                            id: { type: string, format: uuid }
                            title: { type: string, description: "May be empty: the chat has no name of its own" }
                        chatMessage: { $ref: "#/components/schemas/ChatMessage" }
                  nextCursor: { type: string, description: "Empty on the last page" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/messages:
    delete:
      summary: Delete several messages at once
      description: |
        As `DELETE /api/v1/messages/{id}` for each `id`, but all or none:
        if one of them may not be deleted, none is. Without `for`, your
        own messages from both sides; with `for=me`, any messages of your
        dialogs for you alone.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: query
          required: true
          description: From 1 to 100 messages; one named twice counts once.
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, format: uuid }
          style: form
          explode: true
        - name: for
          in: query
          schema: { type: string, enum: [me] }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: One of the messages is not yours
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`the message can no longer be deleted`: one of them is past its `deletableUntil`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/messages/{id}/reaction:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Put your reaction on a message of your dialog
      description: >-
        One reaction a person, as in VK: a new one takes the place of
        yours. Both sides hear the message as it is now (`edit` event).
        Not on a message taken back.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reaction]
              properties:
                reaction: { type: string, enum: [heart, like, laugh, wow, sad, fire] }
      responses:
        "204": { description: Put }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Take your reaction away
      security: [{ bearer: [] }]
      responses:
        "204": { description: Taken away, or there was none }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/messages/{id}:
    patch:
      summary: Edit your message
      description: |
        Within a day of sending (`editableUntil`), as in VK: what it says,
        sealed anew for the keys of both sides as they are now (409 `the
        encryption keys changed` otherwise), and its photos. The request
        names the changes, not the photos
        left, so edits from two windows do not undo each other:
        `removePhotos` are deleted, `addPhotos` (uploads from
        `POST /api/v1/me/photos` that nothing shows yet) come after the
        photos kept, and the rest stay. The message shows 10 at most. A
        photo to remove that is gone already is fine. The post it shares
        and the messages it forwards stay; without them and photos the
        message may not say nothing. Both sides get an `edit` event.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sealed:
                  type: string
                  format: byte
                  description: What it says from now on, sealed as in `Message`; absent or empty for nothing
                baseSealed:
                  type: string
                  format: byte
                  description: >-
                    `sealed` of the message the edit started from, "" for
                    nothing. With it the edit is refused (409 `the message
                    was changed`) when the message says something else by
                    now, so two windows do not overwrite each other's words;
                    without it the edit is applied as is.
                addPhotos:
                  type: array
                  maxItems: 10
                  items: { type: string, format: uuid }
                removePhotos:
                  type: array
                  maxItems: 10
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: The edited message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`the message can no longer be edited` after `editableUntil`; `the message was changed` when it no longer says `baseSealed`; `the encryption keys changed` when one side has a new key: fetch it and seal again"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Delete a message, for both sides or for yourself
      description: |
        Without `for`, your own message from both sides, within a day of
        sending (`deletableUntil`), as "delete for everyone" in VK: it
        stays in the dialog `deleted`, saying nothing ("Сообщение
        удалено"), its photos go, and both sides get an `edit` event with
        what it is now. With `for=me`, any message of your dialog for you
        alone ("Удалить у себя"), one taken back too: the peer keeps it,
        and your other pages get the `delete` event.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: for
          in: query
          schema: { type: string, enum: [me] }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`the message can no longer be deleted` after `deletableUntil`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/clubs:
    get:
      summary: Search communities by name or address
      description: Every word of `q` must occur, in any order and case; the newest first.
      parameters:
        - name: q
          in: query
          description: Required unless `verified` is
          schema: { type: string, maxLength: 64 }
        - name: verified
          in: query
          description: "`true` keeps the communities with the checkmark only, and needs no `q` (\"Группы\" of the admin panel)"
          schema: { type: boolean }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200": { $ref: "#/components/responses/ClubList" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
    post:
      summary: Create a community ("Создать группу")
      description: You own it. Your profile must be filled in first. It starts with an open wall and no address.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
                description: { type: string, maxLength: 1000 }
      responses:
        "201": { $ref: "#/components/responses/Club" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/about:
    get:
      summary: What the site counts ("о сайте")
      description: >-
        As openvk's "Об этой инстанции": the pages that are not deleted,
        those of them whose owners are on the site now, the groups and the
        posts on all walls, archived ones left out.
        No token needed. The numbers are counted again no more often than
        once a minute (`STATISTICS_TTL` of the gateway).
      responses:
        "200":
          description: The counts
          content:
            application/json:
              schema:
                type: object
                required: [users, online, clubs, posts]
                properties:
                  users: { type: integer }
                  online: { type: integer }
                  verified: { type: integer, description: "Pages with the checkmark, for the administrators' summary" }
                  clubs: { type: integer }
                  posts: { type: integer }

  /api/v1/nicknames:
    get:
      summary: Which nicknames are someone's
      description: >-
        A text says "@word" of anything: the site links it to a page only
        when there is one, and asks here about the words of a page at once.
        Pages are public, deleted ones too. No token needed.
      parameters:
        - name: nickname
          in: query
          description: A nickname to ask about, whatever the case; repeated, 100 at most. What is not a nickname is nobody's.
          schema:
            type: array
            maxItems: 100
            items: { type: string }
          style: form
          explode: true
      responses:
        "200":
          description: Those of the nicknames that are someone's, as their owners write them, each once
          content:
            application/json:
              schema:
                type: object
                required: [nicknames, verified]
                properties:
                  nicknames:
                    type: array
                    items: { type: string }
                  verified:
                    type: array
                    description: Those of `nicknames` whose pages wear the checkmark, shown after a mention
                    items: { type: string }
        "400": { $ref: "#/components/responses/InvalidArgument" }

  /api/v1/me/clubs:
    get:
      summary: Your communities ("Мои Группы"), the newest joined first
      description: With `managed=true` only those you run ("Управляемые"). `total` counts all of them.
      security: [{ bearer: [] }]
      parameters:
        - name: managed
          in: query
          schema: { type: boolean }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [clubs, nextCursor]
                properties:
                  clubs:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/ClubInfo" }
                        - type: object
                          required: [role, pinned]
                          properties:
                            role: { type: string, enum: [member, admin, owner] }
                            pinned: { type: boolean, description: "In your left menu" }
                  nextCursor: { type: string, description: "Empty on the last page" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/clubs/pinned:
    get:
      summary: The communities in your left menu
      description: Those you run and added ("Добавить в левое меню"), at most 10, in the order of joining.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/ClubList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/clubs/{ref}/pin:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    put:
      summary: Add a community you run to your left menu ("Добавить в левое меню")
      description: At most 10. Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Added }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You do not run the community
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`at most 10 clubs in the menu`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Take a community out of your left menu
      description: Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Taken out }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/clubs/{ref}/avatar:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    put:
      summary: Set the community's photo
      description: Its admins only. The body is the image itself, as for your own photo; the old photo is deleted, the new one goes into the community's "Фотографии со страницы" too.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/Club" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not an admin of the community
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Take the community's photo away
      description: Its admins only.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Club" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not an admin of the community
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/clubs/{ref}:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    get:
      summary: A community's page
      description: No token needed; with one, `role` says what you are in it.
      responses:
        "200": { $ref: "#/components/responses/Club" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Change a community's settings
      description: |
        Its admins only. The whole form: an empty address or website takes
        it away; `wall` is `open` (everyone writes), `suggest` (only
        admins write, others suggest posts: "Предложка") or `closed` (only
        admins); `adminsDisplay` is what the page shows of those who run
        the community ("Список админов"); `openTopics` lets anyone start
        topics ("Все могут создавать темы"), `topicsAboveWall` lists them
        above the wall.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, address, website, wall, adminsDisplay]
              properties:
                name: { type: string, maxLength: 64 }
                description: { type: string, maxLength: 1000 }
                address: { type: string, maxLength: 32, description: "Latin letters, digits and _, a letter first; unique whatever the case" }
                website: { type: string, maxLength: 256, description: "An http or https link; https:// is added when the scheme is left out" }
                wall: { type: string, enum: [open, suggest, closed] }
                adminsDisplay: { $ref: "#/components/schemas/AdminsDisplay" }
                openTopics: { type: boolean }
                topicsAboveWall: { type: boolean }
                verified: { type: boolean, description: "The administrators of the site confirmed the community: a checkmark by its name" }
        closed: { type: boolean, description: "A closed group (\"Закрытая группа\"): people ask to join, and only members see its wall, members, topics and albums. Left out, it stays as it is. Opening the group drops the requests that wait" }
      responses:
        "200": { $ref: "#/components/responses/Club" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not an admin of the community
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`club address is already taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Delete the community ("Удалить группу")
      description: |
        The owner only. The community goes with its members and join
        requests at once; its wall, topics, albums, photos and the
        notifications it caused go a moment later. It cannot be undone.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not the owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/clubs/{ref}/membership:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    put:
      summary: Join the community ("Вступить в группу")
      description: >-
        Idempotent. Your profile must be filled in first. A closed group
        is not joined but asked to let you in.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Club" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Leave the community ("Выйти из группы")
      description: Idempotent.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Club" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`the owner cannot leave the club`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/clubs/{ref}/members:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    get:
      summary: The members of a community, the newest first
      description: >-
        With `admins=true` only the owner and the admins ("Руководство").
        People whose page is deleted are left out. An admin the community
        hides ("Скрыт: Да") is a plain member, with no title, to everyone
        who does not run it, and is not among its admins; with a token of
        one who runs it they are shown as they are, with `hidden`. `total`
        counts the list asked for.
      parameters:
        - name: admins
          in: query
          schema: { type: boolean }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [members, nextCursor, total]
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      required: [user, role, title, hidden]
                      properties:
                        user: { $ref: "#/components/schemas/Author" }
                        role: { type: string, enum: [member, admin, owner] }
                        title: { type: string, description: "What an admin does in the community, shown under the name; empty for none" }
                        hidden: { type: boolean, description: "The community hides that they run it; told only to those who run it" }
                  nextCursor: { type: string, description: "Empty on the last page" }
                  total: { type: integer, description: "Members, or admins, on all pages, those whose page is deleted too" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/clubs/{ref}/admins/{nickname}:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Make a member an admin ("Назначить администратором")
      description: The owner only.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Appointed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not the owner, or the user is the owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { description: "The community, the user, or the user is not a member", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      summary: Make an admin a member again ("Снять полномочия администратора")
      description: The owner only.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Dismissed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not the owner, or the user is the owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { description: "The community, the user, or the user is not a member", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      summary: Give an admin a title and hide or show them ("Изменить комментарий", "Скрыт")
      description: >-
        Those who run the community do it for each other, the owner
        included. A field that is not sent stays as it is, and one of the
        two is required. A dismissed admin loses both.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 36, description: "One line; empty for none" }
                baseTitle: { type: string, maxLength: 36, description: "The title the change started from: with it `title` is written only over this one (409 `the title was changed` otherwise), so two admins do not overwrite each other" }
                hidden: { type: boolean }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "You do not run the community", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`the user does not run the club`; `the title was changed` when the seat no longer says `baseTitle`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/clubs/{ref}/requests:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    get:
      summary: Those who asked to join a closed group ("Заявки")
      description: Those who run the group only; the oldest request first.
      security: [{ bearer: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: A page of people
          content:
            application/json:
              schema:
                type: object
                required: [people, nextCursor, total]
                properties:
                  people: { type: array, items: { $ref: "#/components/schemas/Profile" } }
                  nextCursor: { type: string }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "You do not run the group", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/clubs/{ref}/requests/{nickname}:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Let the person in ("Принять заявку")
      description: Those who run the group only. The person becomes a member.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Accepted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "You do not run the group", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "The group, the user, or `join request not found`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      summary: Turn the person down ("Отклонить заявку")
      description: Those who run the group only. The person may ask again.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Rejected }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "You do not run the group", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "The group, the user, or `join request not found`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/clubs/{ref}/owner/{nickname}:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Hand the community over to an admin ("Назначить владельцем")
      description: The owner only; the owner stays an admin. It cannot be undone by the old owner.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Handed over }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not the owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`the new owner must be an admin of the club`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/clubs/{ref}/suggestions:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    get:
      summary: Posts suggested for a community's wall ("Предложенные записи")
      description: |
        All of them for its admins; with `mine=true` yours ("Предложенные
        вами записи"). Those whose author's page is deleted are left out,
        but counted in `total`.
      security: [{ bearer: [] }]
      parameters:
        - name: mine
          in: query
          schema: { type: boolean }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page, newest first
          content:
            application/json:
              schema:
                type: object
                required: [suggestions, nextCursor, total]
                properties:
                  suggestions:
                    type: array
                    items: { $ref: "#/components/schemas/Suggestion" }
                  nextCursor: { type: string, description: "Empty on the last page" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: All of them, and not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Suggest a post ("Предложить новость")
      description: |
        On a `suggest` wall, by anyone but its admins (`canSuggest`). Only
        you and the admins see it until an admin publishes it for the
        community or it is withdrawn or declined; the admins are notified
        until then (suggested_post). Your profile must be filled in first;
        the photos must be yours.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPost" }
      responses:
        "201":
          description: The suggestion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suggestion" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`you cannot suggest posts here`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/suggestions/{id}/publish:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Publish a suggestion ("Опубликовать запись")
      description: |
        The community's admins only. The post is new, on top of the wall,
        speaks for the community and keeps the suggested photos; its author
        is notified (post_accepted).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string, maxLength: 60000, description: "What the post says, as you leave it; may be empty when it has photos" }
                signed: { type: boolean, description: "Name the author under the post (\"Подпись автора\")" }
      responses:
        "201":
          description: The post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "204": { description: "Published, but its author's page was deleted meanwhile, so it is not shown" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not an admin of the community
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { description: "`suggestion not found`: published, withdrawn or declined", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/suggestions/{id}/text:
    get:
      summary: What a suggested post says, whole
      description: |
        For its author and the admins of the club, as the list is. Lists carry the beginning of a long text (`textCut`);
        this is all of it, for "Показать больше".
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The text
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/suggestions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Withdraw your suggestion, or decline one as an admin ("Отклонить")
      description: Its photos go with it.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Neither its author nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/postponed:
    get:
      summary: Your postponed posts ("Отложенные записи")
      description: |
        The posts that wait for your own wall, the soonest first: at most
        100 wait at once, so there are no pages.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostponedPosts" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      summary: Postpone a post for your own wall ("Таймер" of VK)
      description: |
        Nobody but you sees it until `publishAt`, when it is published as a
        new post dated then; the people its text names hear of it then.
        Text, photos or both, no poll. Your profile must be filled in first;
        the photos must be yours.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPostponed" }
      responses:
        "201":
          description: The postponed post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Postponed" }
        "400": { description: "`invalid publish time`, or `a postponed post is published within a year from now` (it must be ahead of now)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { description: "`too many postponed posts`: 100 wait already", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/clubs/{ref}/postponed:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    get:
      summary: The posts that wait for a community's wall
      description: For its admins, the soonest first. Those whose author's page is deleted are left out.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The posts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostponedPosts" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Postpone a post for a community
      description: |
        By its admins only: the post will speak for the community and, with
        `signed`, name you. The other admins see it, change it and publish
        it at once too.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPostponed" }
      responses:
        "201":
          description: The postponed post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Postponed" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`you cannot post on this wall`: not an admin"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`too many postponed posts`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/postponed/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: A postponed post, whole
      description: For its author and those who see it listed.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Postponed" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Change a postponed post
      description: |
        What it says and when it comes out, by its author or, for a
        community, its admins; the photos stay. The people the new text
        names will hear of it.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, publishAt]
              additionalProperties: false
              properties:
                text: { type: string, maxLength: 60000, description: "May be empty when it has photos" }
                nsfw: { type: boolean }
                publishAt: { type: string, format: date-time }
      responses:
        "200":
          description: The post as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Postponed" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: For a community, and no longer its admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Delete a postponed post
      description: By its author or, for a community, its admins; its photos go with it.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/postponed/{id}/publish:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Publish a postponed post now ("Опубликовать сейчас")
      description: As PATCH tells who may. The post is new, dated now, on top of the wall.
      security: [{ bearer: [] }]
      responses:
        "201":
          description: The post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "204": { description: "Published, but its author's page was deleted meanwhile, so it is not shown" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: For a community, and no longer its admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { description: "`postponed post not found`: published or deleted", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/clubs/{ref}/backdrop/{side}:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
      - name: side
        in: path
        required: true
        schema: { type: string, enum: [left, right] }
    put:
      summary: Set one side of a community's backdrop ("Фон страницы")
      description: Its admins only. The body is the image itself, as for a photo; the other side stays, the photo this one replaces is deleted.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/Club" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not an admin of the community
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/clubs/{ref}/backdrop:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    delete:
      summary: Take a community's backdrop away ("Удалить фон"), both sides
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Club" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not an admin of the community
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/clubs/{ref}/topics:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    get:
      summary: A community's discussions ("Обсуждения")
      description: |
        Pinned first, then the most recently active. `q` finds topics by
        their titles, whatever the case. Topics whose authors' pages are
        deleted are left out, but counted in `total`.
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: One page of topics
          content:
            application/json:
              schema:
                type: object
                required: [topics, nextCursor, total]
                properties:
                  topics:
                    type: array
                    items: { $ref: "#/components/schemas/Topic" }
                  nextCursor: { type: string, description: "Empty on the last page" }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Start a topic ("Новая тема")
      description: |
        Whom the community lets (`canStartTopic`); `fromClub` speaks for it,
        its admins only. `text` and `photos` are the first message and may
        both be empty. Your profile must be filled in first.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 127 }
                text: { type: string, maxLength: 60000 }
                photos: { $ref: "#/components/schemas/PhotoIDs" }
                fromClub: { type: boolean }
      responses:
        "201":
          description: The topic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topic" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`you cannot start topics here` or `you cannot write for this community`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/topics/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: A topic with its community, for its page
      responses:
        "200": { $ref: "#/components/responses/TopicPage" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Rename a topic and change its settings ("Редактирование темы")
      description: |
        Its author or an admin renames and closes it; only an admin pins it
        and restricts it, and only a topic of the community is restricted.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, closed, pinned, restricted]
              properties:
                title: { type: string, maxLength: 127 }
                closed: { type: boolean }
                pinned: { type: boolean }
                restricted: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/TopicPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Neither its author nor an admin, or not an admin for pinning and restricting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a topic with its messages ("Удалить тему")
      description: Its author or an admin; the photos of its messages go too.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Neither its author nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/topics/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: What is written in a topic, oldest first
      description: Messages whose authors' pages are deleted are left out, but counted in `total`.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: One page of messages
          content:
            application/json:
              schema:
                type: object
                required: [messages, nextCursor, total]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/TopicMessage" }
                  nextCursor: { type: string, description: "Empty on the last page" }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Write in a topic
      description: |
        Nobody writes in a closed topic (409), only the admins in a
        restricted one; `fromClub` speaks for the community, its admins
        only. Your profile must be filled in first; the photos must be yours.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 60000 }
                photos: { $ref: "#/components/schemas/PhotoIDs" }
                fromClub: { type: boolean }
      responses:
        "201":
          description: The message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopicMessage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`only the admins comment on this topic` or `you cannot write for this community`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`the topic is closed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/topic-messages/{id}/text:
    get:
      summary: What a message of a topic says, whole
      description: |
        No token needed. Lists carry the beginning of a long text (`textCut`);
