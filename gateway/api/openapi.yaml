                  comments:
                    type: array
                    items: { $ref: "#/components/schemas/PhotoComment" }
                  nextCursor: { type: string }
                  total: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Comment a photo
      description: Your profile must be filled in first; not between you and who uploaded the photo when one blacklisted the other.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
