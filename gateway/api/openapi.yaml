openapi: 3.1.0
info:
  title: Freenet API
  version: 1.0.0
  description: |
    Public HTTP API of Freenet, served by the gateway.

    Sign-in is passwordless: request a code by email, exchange it for a token
    pair. Send the access token as `Authorization: Bearer <token>`; it lives
    15 minutes. Exchange the refresh token for a new pair before that; each
    refresh token works once, and reusing an old one ends the session.

    Errors always have the shape `{"error": {"code": "...", "message": "..."}}`;
    `message` is safe to show to the user.

    Every response carries `X-Request-ID`, the name of the request in the
    logs of the gateway and of every service it called: quote it when
    reporting a problem. An `X-Request-ID` sent by the client is ignored
    unless the gateway runs behind its own proxy.
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/v1/auth/code:
    post:
      summary: Email a sign-in code
      description: |
        Answers the same way whether or not the email has an account. One
        code per email per minute and a limited number per client address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, example: ann@example.com }
      responses:
        "204": { description: Code sent }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/verify:
    post:
      summary: Exchange a code for tokens
      description: |
        Creates the account on the first sign-in; its profile is empty until
        `PUT /api/v1/me/profile` (`profileCompleted` is false). A code works
        once and survives five attempts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9]{6}$", example: "123456" }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/auth/refresh:
    post:
      summary: Get a new token pair
      requestBody: { $ref: "#/components/requestBodies/RefreshToken" }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/auth/logout:
    post:
      summary: End the session of a refresh token
      description: Idempotent. The access token stays valid until it expires.
      requestBody: { $ref: "#/components/requestBodies/RefreshToken" }
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me:
    get:
      summary: The caller's account
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/profile:
    put:
      summary: Replace the profile
      description: Fields left out are cleared. `name` and `nickname` are required.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Profile" }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: The nickname is taken (case-insensitive)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/privacy:
    put:
      summary: Choose which sensitive fields others see and who writes on your wall
      description: |
        Sensitive fields are hidden by default; a new wall is open to the
        people you follow. All settings are sent at once.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Privacy" }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/deactivate:
    post:
      summary: Delete your page
      description: |
        openvk's "Удаление страницы": the page is hidden at once and can be
        restored until `purgeAt` (seven months by default); then its data is
        erased in every service: the profile, posts and posts on its wall,
        likes, comments, photos, dialogs on both sides and notifications.
        Meanwhile others see only the name and the photo (`deactivated`),
        nobody may follow it, write on its wall or to it, and what its owner
        wrote is hidden. Refresh the tokens right after: those of a deleted
        page are good only for `GET /api/v1/me` and
        `POST /api/v1/me/reactivate`; send other requests without a token,
        as an anonymous visitor.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 1000
                  description: "Why, in the owner's words or one of openvk's reasons; may be empty"
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: The page is deleted already (`your page is deleted`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/reactivate:
    post:
      summary: Restore your deleted page
      description: |
        Works with the token of a deleted page; refresh the tokens right
        after to get full ones again.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`this page is not deleted`, or `this page can no longer be restored` after `purgeAt`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/users/{nickname}:
    get:
      summary: Someone's public profile with follow counters
      description: |
        No token needed. Fields the owner has not opened are empty, the same
        as fields that are not set. Nickname lookup is case-insensitive.
        With a token, `isFollowing` tells whether you follow the user, and
        `blockedByMe` / `blockedMe` who of you blacklisted the other: the
        website then shows the limited page of openvk instead of the profile.
      parameters:
        - name: nickname
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PublicProfile"
                  - $ref: "#/components/schemas/FollowStats"
                  - $ref: "#/components/schemas/Relation"
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/blacklist:
    get:
      summary: Your blacklist, newest first
      description: |
        "Чёрный список" of openvk. A block shuts messages, wall posts,
        comments and follows between you and the user, both ways.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of the blacklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/blacklist/{nickname}:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Blacklist the user
      description: Idempotent. Drops the follows between you, both ways.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Blacklisted }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Take the user off your blacklist
      description: Idempotent. Follows dropped by the block do not come back.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Taken off }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{nickname}/posts:
    get:
      summary: Someone's wall, newest first
      description: |
        The posts on the wall, by its owner and by others. No token needed;
        with one, `liked` says whether you like each post, and the first
        page says in `canPost` whether you may write there. The pinned post
        (`pinned`) comes first on the first page, on top of `limit` others,
        and not again later.
        Page with `cursor` = `nextCursor` of the previous page; an empty
        `nextCursor` means the last page.
      parameters:
        - name: nickname
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of the wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "403":
          description: The owner deleted the page (`this page is deleted`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Write on someone's wall
      description: |
        As the owner's privacy allows (`wallWrite`); on your own nickname it
        is `POST /api/v1/me/posts`. The owner is notified. Your profile must
        be filled in first. Text, photos or both; photos are IDs from
        `POST /api/v1/me/photos` and must be yours.
      security: [{ bearer: [] }]
      parameters:
        - name: nickname
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPost" }
      responses:
        "201":
          description: The new post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: The owner does not let you write on the wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/avatar:
    put:
      summary: Set your profile photo
      description: |
        The body is the image itself (JPEG, PNG, GIF or WebP, at most 8 MB,
        at least 50x50), with its Content-Type. It is turned upright by its
        EXIF orientation, the middle square is kept and re-encoded, so EXIF
        data (location included) is dropped.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Remove your profile photo
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/users:
    get:
      summary: Find people
      description: |
        Every word of `q` must occur in the name, surname or nickname, in any
        order and case. Only people with a filled-in profile are found.
        Newest accounts first; page with `cursor` = `nextCursor`.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, maxLength: 64 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of people; total is always 0
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }

  /api/v1/me/photos:
    post:
      summary: Upload a photo for a post
      description: |
        The raw image is the request body (JPEG, PNG, GIF or WebP, at most
        8 MB). It is turned upright by its EXIF orientation and scaled down
        whole, keeping its proportions; attach it to a post by its `id`.
        A photo that no post publishes within a day is deleted, and
        deleting the post deletes its photos.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The stored photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /media/photos/{userId}/{photoId}/{file}:
    get:
      summary: A photo of a post
      description: URLs come from the `photos` of posts and never change, so responses are cached for a year.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: photoId, in: path, required: true, schema: { type: string } }
        - name: file
          in: path
          required: true
          schema: { type: string, enum: [large.jpg, small.jpg] }
      responses:
        "200":
          description: JPEG, up to 1280 (large) or 640 (small) on the longer side
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /media/avatars/{userId}/{avatarId}/{file}:
    get:
      summary: A profile photo
      description: |
        URLs come from the `avatar` fields; they change with every new photo,
        so responses are cached for a year.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: avatarId, in: path, required: true, schema: { type: string } }
        - name: file
          in: path
          required: true
          schema: { type: string, enum: [large.jpg, small.jpg] }
      responses:
        "200":
          description: JPEG, 400x400 (large) or 100x100 (small)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/posts:
    post:
      summary: Write on your own wall
      description: |
        The profile must be filled in first (it gives the wall its address).
        Text, photos or both; photos are IDs from `POST /api/v1/me/photos`
        and must be yours.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPost" }
      responses:
        "201":
          description: The new post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/posts/{id}:
    get:
      summary: One post, for its page
      description: No token needed; with one, `liked` says whether you like it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The post with its author and wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a post
      description: By its author or by the owner of its wall.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Neither your post nor your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Edit your post
      description: |
        Its author changes the text and photos until `editableUntil`, a week
        after posting, as in openvk; the post then shows `editedAt`. The
        body is the whole new content, as when posting: text, photos or
        both; new photos must be yours. A repost keeps the post it shares
        and takes text only. Photos taken away are deleted.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewPost" }
      responses:
        "200":
          description: The edited post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The week to edit the post is over
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/posts/{id}/pin:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Pin the post on your wall
      description: |
        The owner of the wall shows the post first there, whoever wrote it;
        the post pinned before is unpinned. Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Pinned }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Unpin the post
      description: Idempotent; the post goes back to its place on the wall.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Unpinned }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/posts/{id}/reposts:
    post:
      summary: Share a post on your wall
      description: |
        As openvk's "Поделиться": a repost on your own wall shows the shared
        post inside, with what you say about it (may be empty). Sharing a
        repost that says nothing shares its original. The author of the
        shared post is notified. Your profile must be filled in first.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: The repost
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/posts/{id}/like:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Like the post
      description: Idempotent; a second like counts once.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Like" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Take your like back
      description: Idempotent.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Like" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/posts/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Comments of a post, oldest first
      description: |
        No token needed. Page with `cursor` = `nextCursor` of the previous
        page; an empty `nextCursor` means the last page.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of comments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Comment on a post
      description: |
        Your profile must be filled in first. Text, photos or both; photos
        are IDs from `POST /api/v1/me/photos` and must be yours. They are
        deleted with the comment and with its post. `replyTo` answers a
        comment of the same post, as "Ответить": its author is notified
        (comment_reply); the text is yours to start with their name.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text: { type: string, maxLength: 1000 }
                photos: { $ref: "#/components/schemas/PhotoIDs" }
                replyTo: { type: string, format: uuid, description: "The comment of this post to answer" }
      responses:
        "201":
          description: The new comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You and the author of the post or the owner of its wall blacklisted one another
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/comments/{id}:
    delete:
      summary: Delete a comment
      description: By the author of the comment or of the post, or by the owner of the wall.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Neither your comment nor your post nor your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/comments/{id}/like:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Like the comment
      description: Idempotent; its author is notified (comment_like).
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Like" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Take your like of the comment back
      description: Idempotent.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Like" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/notifications:
    get:
      summary: Your notifications, newest first
      description: |
        `box=unread` (the default) is what is newer than your read mark,
        `box=archive` the rest. Notifications whose author, post or comment
        is gone are left out. Mark the page read with `newestId`.
      security: [{ bearer: [] }]
      parameters:
        - name: box
          in: query
          schema: { type: string, enum: [unread, archive], default: unread }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/notifications/unread-count:
    get:
      summary: How many notifications are unread, at most 100
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The number for the menu counter
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer, maximum: 100 }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/notifications/read:
    post:
      summary: Move your notifications up to one to the archive
      description: The mark never moves back; `upTo` must be your notification.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upTo]
              properties:
                upTo: { type: string, format: uuid, description: "newestId of the page you have seen" }
      responses:
        "204": { description: Read }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/messages/{id}:
    delete:
      summary: Delete your message from both sides of the dialog
      description: |
        Within a day of sending (`deletableUntil`), as "delete for everyone"
        in VK; its photos go too. Both sides get a `delete` event.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`the message can no longer be deleted` after `deletableUntil`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/clubs:
    post:
      summary: Create a community ("Создать группу")
      description: You own it. Your profile must be filled in first. It starts with an open wall and no address.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
                description: { type: string, maxLength: 1000 }
      responses:
        "201": { $ref: "#/components/responses/Club" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/clubs:
    get:
      summary: Your communities ("Мои Группы"), the newest joined first
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [clubs, nextCursor]
                properties:
                  clubs:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/ClubInfo" }
                        - type: object
                          required: [role]
                          properties:
                            role: { type: string, enum: [member, admin, owner] }
                  nextCursor: { type: string, description: "Empty on the last page" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/clubs/{ref}:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    get:
      summary: A community's page
      description: No token needed; with one, `role` says what you are in it.
      responses:
        "200": { $ref: "#/components/responses/Club" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Change a community's settings
      description: |
        Its admins only. The whole form: an empty address takes the address
        away; `wall` is `open` (everyone writes) or `closed` (only admins).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, address, wall]
              properties:
                name: { type: string, maxLength: 64 }
                description: { type: string, maxLength: 1000 }
                address: { type: string, maxLength: 32, description: "Latin letters, digits and _, a letter first; unique whatever the case" }
                wall: { type: string, enum: [open, closed] }
      responses:
        "200": { $ref: "#/components/responses/Club" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not an admin of the community
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`club address is already taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/clubs/{ref}/membership:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    put:
      summary: Join the community ("Вступить в группу")
      description: Idempotent. Your profile must be filled in first.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Club" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Leave the community ("Выйти из группы")
      description: Idempotent.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Club" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`the owner cannot leave the club`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/clubs/{ref}/members:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    get:
      summary: The members of a community, the newest first
      description: With `admins=true` only the owner and the admins ("Руководство"). People whose page is deleted are left out.
      parameters:
        - name: admins
          in: query
          schema: { type: boolean }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [members, nextCursor]
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      required: [user, role]
                      properties:
                        user: { $ref: "#/components/schemas/Author" }
                        role: { type: string, enum: [member, admin, owner] }
                  nextCursor: { type: string, description: "Empty on the last page" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/clubs/{ref}/admins/{nickname}:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Make a member an admin ("Назначить администратором")
      description: The owner only.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Appointed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not the owner, or the user is the owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { description: "The community, the user, or the user is not a member", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      summary: Make an admin a member again ("Снять полномочия администратора")
      description: The owner only.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Dismissed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not the owner, or the user is the owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { description: "The community, the user, or the user is not a member", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/clubs/{ref}/posts:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    get:
      summary: A community's wall, newest first
      description: As a user's wall; `canPost` says whether you may write there on your own behalf.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of the wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Write on a community's wall
      description: |
        On an open wall anyone may, on a closed one only its admins; with
        `fromClub` the post speaks for the community ("От имени
        сообщества"), admins only. Your profile must be filled in first.
        Nobody is notified of posts here, nor the writer of a post for the
        community of its likes, comments and reposts.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewClubPost" }
      responses:
        "201":
          description: The new post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`you cannot post on this wall`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/events:
    get:
      summary: Live events of a page (WebSocket)
      description: |
        A WebSocket: upgrade, then send `{"token": "<access token>"}` as the
        first message within 10 s (the token is not put in the URL, which
        would land in logs). Then the server sends JSON events, told apart
        by `type`:

        - `ready` — connected; `messages` and `notifications` are the menu
          counters (unread dialogs and notifications).
        - `counters` — a counter changed; only the changed one is set.
        - `message` — a new message of your dialogs, sent or received:
          `peer` (Author) and `message` (Message).
        - `read` — the dialog with `peer` was read up to `upTo`, by you on
          another page (`byMe`) or by the peer.
        - `delete` — message `id` of the dialog with `peer` was deleted by
          its sender, you or the peer.
        - `notification` — `change` is `new`, `gone` or `read`.

        The connection lives until the access token expires: then it is
        closed with code 4001 — refresh the token and connect again. 1001:
        the server stops; 1013: connect again a bit later. After any gap,
        catch up with the usual requests: events are not replayed. Browser
        origins other than the API's need `CORS_ALLOWED_ORIGINS`.
      responses:
        "101": { description: Switching to the WebSocket protocol }
        "403": { description: The origin is not allowed }

  /api/v1/dialogs:
    get:
      summary: Your dialogs, the most recently written first
      description: Dialogs with accounts that are gone are left out.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of dialogs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DialogPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/dialogs/unread-count:
    get:
      summary: How many dialogs have unread messages, at most 100
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The number for the menu counter
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer, maximum: 100 }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/dialogs/{nickname}/messages:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Your dialog with a user, oldest first
      description: |
        Without parameters, the newest messages. `cursor` = `nextCursor`
        pages back in time; `after` = the newest message you have returns
        what came since, for polling. Not both.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: after
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A run of messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Write to a user
      description: |
        Your profile must be filled in first; you cannot write to yourself.
        The user's privacy (`messagesWrite`) and blacklists decide whether
        you may; whoever wrote to you may always be answered, unless one of
        you blacklisted the other. Text, photos or both; photos are IDs from
        `POST /api/v1/me/photos` and must be yours.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text: { type: string, maxLength: 4096 }
                photos: { $ref: "#/components/schemas/PhotoIDs" }
      responses:
        "201":
          description: The sent message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: The user's privacy or a blacklist does not let you write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/dialogs/{nickname}/read:
    post:
      summary: Read your dialog with a user up to one of their messages
      description: The mark never moves back; `upTo` must be a message from that user to you.
      security: [{ bearer: [] }]
      parameters:
        - name: nickname
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upTo]
              properties:
                upTo: { type: string, format: uuid }
      responses:
        "204": { description: Read }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{nickname}/follow:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Follow the user
      description: Idempotent. Your profile must be filled in first.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/FollowStats" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: One of you blacklisted the other
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Unfollow the user
      description: Idempotent.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/FollowStats" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{nickname}/followers:
    get:
      summary: Who follows the user, newest follow first
      parameters: &followListParams
        - name: nickname
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses: &followListResponses
        "200":
          description: One page of people
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{nickname}/following:
    get:
      summary: Whom the user follows, newest follow first
      parameters: *followListParams
      responses: *followListResponses

  /api/v1/feed:
    get:
      summary: Your news feed
      description: |
        Posts of the people you follow and your own, newest first, each with
        its author. Page with `cursor` = `nextCursor`; `total` is always 0.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of the feed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /healthz:
    get:
      summary: Liveness of the gateway
      responses:
        "200": { description: Up }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  requestBodies:
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refreshToken]
            additionalProperties: false
            properties:
              refreshToken: { type: string }

  parameters:
    ClubRef:
      name: ref
      in: path
      required: true
      description: A community's address (whatever the case) or, without one, its ID
      schema: { type: string }

  responses:
    Club:
      description: The community as you see it
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/ClubInfo" }
              - type: object
                required: [role, owner]
                properties:
                  role: { type: string, enum: ["", member, admin, owner], description: "What you are in it; empty without a token or membership" }
                  owner:
                    description: Its creator; null when the page is deleted or erased
                    oneOf:
                      - { $ref: "#/components/schemas/Author" }
                      - { type: "null" }
    Like:
      description: How many likes the post has now
      content:
        application/json:
          schema:
            type: object
            required: [likes, liked]
            properties:
              likes: { type: integer }
              liked: { type: boolean, description: "You like the post now" }
    Tokens:
      description: Token pair
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, refreshToken]
            properties:
              accessToken: { type: string }
              refreshToken: { type: string }
    User:
      description: The caller's account
      content:
        application/json:
          schema: { $ref: "#/components/schemas/User" }
    FollowStats:
      description: Fresh follow counters of the user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FollowStats" }
    InvalidArgument:
      description: Invalid input; the message says what
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: Missing, invalid or expired token or code
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited (sign-in codes, or spam protection of posts, comments, likes, messages, uploads, follows and communities); try again later
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_argument, unauthenticated, permission_denied, not_found,
                     conflict, too_many_requests, unavailable, method_not_allowed, internal]
            message: { type: string }

    Profile:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        surname: { type: string, maxLength: 100 }
        nickname:
          type: string
          maxLength: 32
          pattern: "^[A-Za-z](?:[A-Za-z0-9_]*[A-Za-z0-9])?$"
        status: { type: string, maxLength: 200 }
        gender: { type: string, enum: ["", male, female] }
        relationship: { type: string, enum: ["", single, dating, married, in_love, looking] }
        worldview:
          type: string
          enum: ["", islam, orthodox, catholicism, judaism, protestantism, buddhism,
                 confucianism, secular_humanism]
        politicalViews:
          type: string
          enum: ["", communist, socialist, moderate, liberal, conservative, monarchist,
                 ultraconservative, indifferent, libertarian]
        birthday: { type: [string, "null"], format: date, example: "1990-05-17" }

    Privacy:
      type: object
      additionalProperties: false
      properties:
        showBirthday: { type: boolean }
        showRelationship: { type: boolean }
        showWorldview: { type: boolean }
        showPoliticalViews: { type: boolean }
        wallWrite:
          type: string
          enum: [everyone, following, only_me]
          description: "Who may write on your wall besides you; following: the people you follow"
        messagesWrite:
          type: string
          enum: [everyone, following, nobody]
          description: "Who may write private messages to you; whoever you wrote to may answer anyway"

    User:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          required: [id, avatar, email, profileCompleted, privacy, deactivated]
          properties:
            id: { type: string, format: uuid }
            avatar: { $ref: "#/components/schemas/Avatar" }
            email: { type: string, format: email }
            profileCompleted: { type: boolean }
            privacy: { $ref: "#/components/schemas/Privacy" }
            deactivated:
              type: boolean
              description: "You deleted the page; see POST /api/v1/me/deactivate"
            purgeAt:
              type: string
              format: date-time
              description: "Only for a deleted page: when it can no longer be restored and its data is erased"

    Avatar:
      type: [object, "null"]
      description: URLs of the profile photo; null without one
      required: [large, small]
      properties:
        large: { type: string, example: "/media/avatars/<user>/<avatar>/large.jpg" }
        small: { type: string, example: "/media/avatars/<user>/<avatar>/small.jpg" }

    Author:
      type: object
      required: [id, nickname, name, surname, gender]
      properties:
        id: { type: string, format: uuid }
        avatar: { $ref: "#/components/schemas/Avatar" }
        nickname: { type: string }
        name: { type: string }
        surname: { type: string }
        gender: { type: string, enum: ["", male, female] }
        deactivated:
          type: boolean
          description: "Only in dialogs: the person deleted the page. Elsewhere such people and what they wrote are left out"
        club:
          type: boolean
          description: "A community, as the owner of a wall or the voice of a post: only `id`, `name` and `address` are set, its page is /club/<address or id>"
        address: { type: string, description: "A community's address; empty for none" }

    ClubInfo:
      type: object
      required: [id, name, description, address, wall, members, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, description: "Plain text with \\n line breaks" }
        address: { type: string, description: "Empty for none: the page is then /club/<id>" }
        wall: { type: string, enum: [open, closed], description: "Who may write on the wall: everyone, or only its admins" }
        members: { type: integer }
        createdAt: { type: string, format: date-time }

    NewClubPost:
      type: object
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 1000 }
        photos: { $ref: "#/components/schemas/PhotoIDs" }
        fromClub: { type: boolean, description: "Speak for the community (admins only)" }

    NewPost:
      type: object
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 1000 }
        photos: { $ref: "#/components/schemas/PhotoIDs" }

    PhotoIDs:
      description: IDs from `POST /api/v1/me/photos`, yours, in the order shown
      type: array
      maxItems: 10
      uniqueItems: true
      items: { type: string, format: uuid }

    Post:
      type: object
      required: [id, author, wall, text, photos, createdAt, likes, liked, comments, reposts, repost, editedAt, editableUntil, pinned, fromWall, mine]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        wall:
          description: The owner of the wall when it is not the author's own; null otherwise
          oneOf:
            - $ref: "#/components/schemas/Author"
            - type: "null"
        text: { type: string, description: "Plain text with \\n line breaks; never HTML; empty when the post is photos only or a repost without a word" }
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string, format: date-time }
        likes: { type: integer }
        liked: { type: boolean, description: "You like the post; false without a token" }
        comments: { type: integer }
        reposts: { type: integer, description: "How many times the post was shared" }
        repost:
          description: The shared post when this is a repost; null otherwise
          oneOf:
            - $ref: "#/components/schemas/SharedPost"
            - type: "null"
        editedAt:
          description: When the author last edited the post; null if never ("ред.")
          oneOf:
            - { type: string, format: date-time }
            - type: "null"
        editableUntil: { type: string, format: date-time, description: "Until when the author may edit it" }
        pinned: { type: boolean, description: "Shown first on its wall (\"закреплено\")" }
        fromWall:
          type: boolean
          description: "The post speaks for its wall, a community (\"От имени сообщества\"): `author` is the community, `wall` null, who wrote it is not told"
        mine: { type: boolean, description: "You wrote it and may edit it; false without a token" }

    SharedPost:
      type: object
      description: |
        The post a repost shares, without counters. When it or its author is
        gone, only id and deleted: true are set ("Запись удалена"). repostOf
        is set when the shared post is itself a repost: link to it.
      required: [id, deleted, author, wall, text, photos, createdAt, repostOf]
      properties:
        id: { type: string, format: uuid }
        deleted: { type: boolean }
        author:
          oneOf:
            - $ref: "#/components/schemas/Author"
            - type: "null"
        wall:
          description: The owner of the wall when not the author's own; null otherwise
          oneOf:
            - $ref: "#/components/schemas/Author"
            - type: "null"
        text: { type: string }
        photos:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string }
        repostOf: { type: string, description: "Empty unless the shared post is itself a repost" }

    Photo:
      type: object
      required: [id, large, small]
      properties:
        id: { type: string, format: uuid }
        large: { type: string, description: "URL, up to 1280 on the longer side" }
        small: { type: string, description: "URL, up to 640 on the longer side" }

    Comment:
      type: object
      required: [id, postId, author, text, photos, createdAt, replyTo, likes, liked]
      properties:
        id: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        text: { type: string, description: "Plain text with \\n line breaks; never HTML; empty when photos only" }
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string, format: date-time }
        replyTo:
          description: The comment this one answers ("в ответ"); null for none, and once it is deleted
          oneOf:
            - { type: string, format: uuid }
            - type: "null"
        likes: { type: integer }
        liked: { type: boolean, description: "You like the comment; false without a token" }

    CommentPage:
      type: object
      required: [comments, nextCursor, total]
      properties:
        comments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        nextCursor: { type: string, description: "Empty on the last page" }
        total: { type: integer, description: "All comments of the post" }

    Notification:
      type: object
      required: [id, type, createdAt, actor, post, comment]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [like, comment, follow, wall_post, repost, comment_reply, comment_like]
          description: "wall_post: the actor wrote on your wall; repost: the actor shared your post, post is the repost; comment_reply: the actor answered your comment under post, comment is the answer; comment_like: the actor liked your comment"
        createdAt: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/Author" }
        post:
          description: The liked, commented or written post, or the repost; null for follows
          nullable: true
          type: object
          required: [id, createdAt, text]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            text: { type: string, description: "What the post says; empty when photos only" }
        comment:
          description: Only for comments
          nullable: true
          type: object
          required: [id, text]
          properties:
            id: { type: string, format: uuid }
            text: { type: string }

    NotificationPage:
      type: object
      required: [notifications, nextCursor, newestId]
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        nextCursor: { type: string, description: "Empty on the last page" }
        newestId:
          type: string
          description: "The newest notification of the page, shown or not; empty on an empty page"

    Message:
      type: object
      required: [id, text, photos, createdAt, out, read, deletableUntil]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, description: "Plain text with \\n line breaks; never HTML; empty when photos only" }
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string, format: date-time }
        out: { type: boolean, description: "You sent it" }
        read: { type: boolean, description: "Its recipient has read it" }
        deletableUntil:
          type: string
          description: "Until when you may delete your message (date-time); empty for the peer's"

    Dialog:
      type: object
      required: [peer, lastMessage, unread]
      properties:
        peer: { $ref: "#/components/schemas/Author" }
        lastMessage: { $ref: "#/components/schemas/Message" }
        unread: { type: boolean, description: "The peer wrote something you have not read" }

    DialogPage:
      type: object
      required: [dialogs, nextCursor]
      properties:
        dialogs:
          type: array
          items: { $ref: "#/components/schemas/Dialog" }
        nextCursor: { type: string, description: "Empty on the last page" }

    MessagePage:
      type: object
      required: [peer, messages, nextCursor, peerReadUpTo, canWrite]
      properties:
        peer: { $ref: "#/components/schemas/Author" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        nextCursor: { type: string, description: "Older messages remain; empty when none, always with after" }
        peerReadUpTo:
          type: string
          description: "The newest of your messages the peer has read, to update shown ones; empty if none"
        canWrite:
          type: boolean
          description: "You may write to the peer; told on the first page, false on older pages and with after"

    Relation:
      type: object
      required: [blockedByMe, blockedMe]
      properties:
        blockedByMe: { type: boolean, description: "You blacklisted the user; false without a token" }
        blockedMe: { type: boolean, description: "The user blacklisted you; false without a token" }

    FollowStats:
      type: object
      required: [followersCount, followingCount, isFollowing]
      properties:
        followersCount: { type: integer }
        followingCount: { type: integer }
        isFollowing: { type: boolean, description: "You follow the user; false without a token" }

    UserPage:
      type: object
      required: [users, nextCursor, total]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/PublicProfile" }
        nextCursor: { type: string, description: "Empty on the last page" }
        total: { type: integer }

    PostPage:
      type: object
      required: [posts, nextCursor, total]
      properties:
        posts:
          type: array
          items: { $ref: "#/components/schemas/Post" }
        nextCursor: { type: string, description: "Empty on the last page" }
        total: { type: integer, description: "All posts on the wall" }
        canPost:
          type: boolean
          description: "On a wall's first page: you may write on it; false without a token and in the news feed"

    PublicProfile:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          required: [id, avatar, deactivated]
          properties:
            id: { type: string, format: uuid }
            avatar: { $ref: "#/components/schemas/Avatar" }
            deactivated:
              type: boolean
              description: "The owner deleted the page: only the names and the photo are left"
