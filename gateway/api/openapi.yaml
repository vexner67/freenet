      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BankSettings" }
      responses:
        "204": { description: Set }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/mine/settings:
    get:
