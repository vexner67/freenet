        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Rename an album ("Редактировать альбом")
      description: Its owner or the admins of the community that owns it.
      security: [{ bearer: [] }]
      requestBody: { $ref: "#/components/requestBodies/Album" }
      responses:
