              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/albums/{id}/photos:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: The photos of an album, oldest first
      description: Photos of people whose pages are deleted are left out, but counted in `total`.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: One page of photos
          content:
            application/json:
              schema:
                type: object
                required: [photos, nextCursor, total]
                properties:
                  photos:
                    type: array
                    items: { $ref: "#/components/schemas/AlbumPhoto" }
                  nextCursor: { type: string, description: "Empty on the last page" }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Add photos to an album ("Завершить загрузку")
      description: |
        Up to 10 photos you uploaded with `POST /api/v1/me/photos`, each with
        its description; a photo is in one album at most. The owner of the
        album or the admins of the community that owns it; your profile
        must be filled in first.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string, format: uuid }
                      description: { type: string, maxLength: 255 }
      responses:
        "201":
          description: The photos added
          content:
            application/json:
              schema:
                type: object
                required: [photos]
                properties:
                  photos:
                    type: array
                    items: { $ref: "#/components/schemas/AlbumPhoto" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Neither the owner of the album nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "The site keeps the album (`kind` \"avatars\"): `this album is kept by the site`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

