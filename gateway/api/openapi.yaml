  /api/v1/album-photos/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: The comments under a photo, oldest first
      description: Text only. Those of deleted pages are left out, still counted. With a token each tells whether you like it.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of comments
          content:
            application/json:
              schema:
                type: object
                required: [comments, nextCursor, total]
                properties:
                  comments:
                    type: array
                    items: { $ref: "#/components/schemas/PhotoComment" }
                  nextCursor: { type: string }
                  total: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Comment a photo
      description: Your profile must be filled in first; not between you and who uploaded the photo when one blacklisted the other.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 60000 }
                replyTo:
                  type: string
                  description: "The comment under the same photo this one answers (\"Ответить\"); empty for none. `comment not found` when it is gone, 400 when it is under another photo"
      responses:
        "201":
          description: The comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoComment" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`you cannot comment on this photo`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/photo-comments/{id}/text:
