  /api/v1/me/guests:
    get:
      summary: Your guests
      description: '"Гости": who visited your page in the last 30 days, the last visit first, people of deleted pages left out. The first page marks them seen: `new` tells those who came since you looked before (`seenAt`, null for never), and `newGuests` of GET /api/v1/me counts them.'
      security: [{ bearer: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200":
          description: The guests
          content:
            application/json:
              schema:
                type: object
                properties:
                  guests:
                    type: array
                    items:
                      type: object
                      properties:
                        user: { $ref: "#/components/schemas/PublicProfile" }
                        visitedAt: { type: string, format: date-time }
                        new: { type: boolean }
                  seenAt: { type: string, format: date-time, nullable: true }
                  nextCursor: { type: string }
        "400": { $ref: "#/components/responses/InvalidArgument" }
