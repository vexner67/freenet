      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Neither its owner nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
