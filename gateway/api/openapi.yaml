  /api/v1/chats/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: The messages of a chat, oldest first
      description: >-
        The newest page, older ones with `cursor`, what came after a
        message with `after`, or the part around a message with `around`
        (about half of `limit` before it and half after, as a found
        message opens; 404 if you are not shown it there). Long texts come
        cut (`textCut`). Who is not in the chat anymore reads it up to the
        moment they went.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: after
          in: query
          schema: { type: string, format: uuid }
        - name: around
          in: query
          description: Not with `cursor` or `after`
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessagePage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Write to a chat
      description: >-
        Text, photos (yours, from POST /me/photos, up to 10), a shared post
        (`post`), messages of your chats to carry on (`forward`, at most 20
        counting those they carry themselves) or some of them; or a photo
        of an album you are shown (`albumPhoto`), with text alone. What is
        not there for you answers 400 `post not found`, `photo not found`,
        `forwarded message not found`. Messages of chats are not
        encrypted: `sealed` answers 400 `messages of chats are not
        encrypted`, and a message of a dialog, which is, cannot be carried
        into a chat (400 `encrypted messages cannot be forwarded into a
        chat`).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 60000 }
                photos:
                  type: array
                  maxItems: 10
                  items: { type: string, format: uuid }
                post: { type: string, format: uuid }
                albumPhoto: { type: string, format: uuid }
                documents: { $ref: "#/components/schemas/DocumentIDs" }
                sticker: { type: string, description: "A sticker of a pack among your stickers (GET /stickers); it goes alone, with nothing else" }
                forward:
                  type: array
                  maxItems: 20
                  items: { type: string, format: uuid }
                replyTo: { type: string, format: uuid, description: "A message of this conversation to answer (\"Ответить\"): one you see, not an action; 400 `replied message not found` otherwise" }
      responses:
        "201":
          description: The message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`you are not in this chat`" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/chats/{id}/read:
    post:
      summary: Read a chat up to one of its messages
      description: The mark never moves back.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upTo]
              properties:
                upTo: { type: string, format: uuid }
      responses:
        "204": { description: Read }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/chats/{id}/typing:
    post:
      summary: Tell the others in a chat that you are writing there
      description: >-
        They hear a `typing` event; nothing is kept. Send it every few
        seconds while typing.
      security: [{ bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Told }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: You are not in the chat anymore (`you are not in this chat`)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/chat-messages/{id}/reaction:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Put your reaction on a message of your chat
      description: >-
        One reaction a person, as in VK: a new one takes the place of
        yours. Everyone in the chat hears the message as it is now (`chat_edit` event).
        Not on a message taken back or an action.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reaction]
              properties:
                reaction: { type: string, enum: [heart, like, laugh, wow, sad, fire] }
      responses:
        "204": { description: Put }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Take your reaction away
      security: [{ bearer: [] }]
      responses:
        "204": { description: Taken away, or there was none }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/chat-messages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: A message of a chat with its whole text
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Edit your message, within a day
      description: >-
        What it says and its photos, as `PATCH /api/v1/messages/{id}`: the
        request names the changes — `removePhotos` are deleted, `addPhotos`
        (your uploads that nothing shows yet) come after the photos kept.
        The post it shares and the messages it forwards stay. Everyone in
        the chat gets a `chat_edit` event.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 60000, description: "May be empty only when the message has photos, shares a post or forwards messages" }
                baseText: { type: string, maxLength: 60000, description: "The whole text the edit started from: with it the edit is refused (409 `the message was changed`) when the message says something else by now" }
                addPhotos:
                  type: array
                  maxItems: 10
                  items: { type: string, format: uuid }
                removePhotos:
                  type: array
                  maxItems: 10
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: The message as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "Not yours to do: `permission denied`" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The day in which it could be done has passed (`the message can no longer be edited`), or the message no longer says `baseText` (`the message was changed`)" }
    delete:
      summary: Take your message back from everyone, within a day
      description: It stays in its place saying nothing ("Сообщение удалено").
      security: [{ bearer: [] }]
      responses:
        "204": { description: Taken back }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "Not yours to do: `permission denied`" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The day in which it could be done has passed" }

  /api/v1/dialogs/unread-count:
    get:
      summary: How many dialogs and chats have unread messages, at most 100
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The number for the menu counter
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer, maximum: 100 }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/dialogs/{nickname}/messages:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Your dialog with a user, oldest first
      description: |
        Without parameters, the newest messages. `cursor` = `nextCursor`
        pages back in time; `after` = the newest message you have returns
        what came since, for polling; `around` = a message of the dialog
        returns the part around it, about half of `limit` before and half
        after, as a found message opens (404 if the dialog does not have
        it): page back with `nextCursor` and on with `after`. One of them.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: after
          in: query
          schema: { type: string, format: uuid }
        - name: around
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A run of messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Write to a user
      description: |
        Your profile must be filled in first; you cannot write to yourself.
        The user's privacy (`messagesWrite`) and blacklists decide whether
        you may; whoever wrote to you may always be answered, unless one of
        you blacklisted the other. What it says goes sealed (`sealed`, as
        in `Message`, for the keys of both of you as they are now: 409 `the
        encryption keys changed` otherwise, and the user must have a key —
        `GET /api/v1/users/{nickname}/message-key`); plain `text` answers
        400 `messages are end-to-end encrypted`. Photos, a post shared into the
        dialog ("Поделиться" "в переписку"), messages of your dialogs to
        carry on ("Переслать") or some of them; photos are IDs from
        `POST /api/v1/me/photos` and must be yours, the post must be there
        (`post not found` otherwise). `albumPhoto` shares a photo of an
        album you can see ("Поделиться" under a photo; `photo not found`
        otherwise), with words alone. `forward`: at most 20 messages,
        counting those they carry themselves; they go oldest first, as
        copies of what they are now, with their photos, their words sealed
        in `sealed` with the message's own; one that you do not have or
        that was taken back fails with `forwarded message not found`.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sealed: { type: string, format: byte }
                photos: { $ref: "#/components/schemas/PhotoIDs" }
                post: { type: string, format: uuid }
                albumPhoto: { type: string, format: uuid }
                documents: { $ref: "#/components/schemas/DocumentIDs" }
                sticker: { type: string, description: "A sticker of a pack among your stickers (GET /stickers); it goes alone, with nothing else" }
                forward:
                  type: array
                  maxItems: 20
                  items: { type: string, format: uuid }
                price: { type: integer, minimum: 0, description: "The votes a message to the user costs, as the dialog's `messagePrice` tells: you agree to pay them. 409 `the price of messages changed` when the price is another; given back when the message is not sent" }
                replyTo: { type: string, format: uuid, description: "A message of this conversation to answer (\"Ответить\"): one you see, not an action; 400 `replied message not found` otherwise" }
      responses:
        "201":
          description: The sent message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "The user's privacy or a blacklist does not let you write; `only people with freenet prime can write to this user` when they let in only people with Freenet Prime"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`the encryption keys changed`: the message is sealed for keys that are not yours or the user's anymore, or the user has none; `the price of messages changed`; `not enough votes` to pay for it"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/message-key:
    get:
      summary: Your key for messages, as the server has it
      description: |
        The public key (X25519) messages of your dialogs are sealed with;
        the private one lives in your browsers only. A browser whose key is
        not this one cannot open new messages: move the key to it from the
        one that has it, or set up a new one. Null before any.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageKey" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      summary: Set up your key for messages
      description: |
        A key your browser made becomes the one your messages are sealed
        with from now on. What was sealed with the one before stays so: a
        browser without it cannot open those messages.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicKey]
              properties:
                publicKey: { type: string, format: byte, description: "32 bytes" }
      responses:
        "204": { description: Set }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/users/{nickname}/message-key:
    get:
      summary: The key messages to a user are sealed with
      description: Null for a user who has not set one up yet; nobody can write to them until they do.
      security: [{ bearer: [] }]
      parameters:
        - name: nickname
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageKey" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/dialogs/{nickname}/read:
    post:
      summary: Read your dialog with a user up to one of their messages
      description: The mark never moves back; `upTo` must be a message from that user to you.
      security: [{ bearer: [] }]
      parameters:
        - name: nickname
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upTo]
              properties:
                upTo: { type: string, format: uuid }
      responses:
        "204": { description: Read }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/dialogs/{nickname}/typing:
    post:
      summary: Tell a user that you are writing to them
      description: >-
        They hear a `typing` event; nothing is kept. Only to someone you may
        write to; send it every few seconds while typing.
      security: [{ bearer: [] }]
      parameters:
        - name: nickname
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Told }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You may not write to the user (`you cannot write to this user`)
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/users/{nickname}/follow:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Follow the user
      description: Idempotent. Your profile must be filled in first.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/FollowStats" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: One of you blacklisted the other
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Unfollow the user
      description: Idempotent.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/FollowStats" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{nickname}/invitation:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Accept the invitation of the user
      description: |
        "Пригласить" of openvk: you signed up by the user's invitation link
        (`/?invite=<nickname>`), so you follow them, and they are notified
        of the invitation (`invite`) instead of a follow. Once per page,
        and only within a week of signing up; your profile must be filled
        in first. Limited as follows are.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/FollowStats" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: One of you blacklisted the other, or their page is deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`an invitation is accepted already` or `only new pages accept invitations`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/users/{nickname}/followers:
    get:
      summary: Who follows the user, newest follow first
      description: |
        No token needed; whether you may see the follows, either way, is
        the user's `friendsRead`.
      parameters: &followListParams
        - name: nickname
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses: &followListResponses
        "200":
          description: One page of people
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "403":
          description: "`this page is deleted`, `this page is hidden` or `this user's follows are hidden`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{nickname}/following:
    get:
      summary: Whom the user follows, newest follow first
      description: |
        With `online=true` only those online now, openvk's "Друзья онлайн";
        with `common=true` (a token required) only whom you follow too, its
        "Общие друзья"; `total` then counts them.
      parameters:
        - name: nickname
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: online
          in: query
          schema: { type: boolean, default: false }
        - name: common
          in: query
          schema: { type: boolean, default: false }
      responses: *followListResponses

  /api/v1/users/{nickname}/clubs:
    get:
      summary: The communities of a user, the newest joined first
      description: |
        The block "Группы" of a page. No token needed; whether you may see
        them is the user's `clubsRead`, and those of a deleted page or of a
        page hidden from you are hidden. With a token each comes with your
        `role` in it, to join or leave it from the list.
      parameters: *followListParams
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [clubs, nextCursor, total]
                properties:
                  clubs:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ClubInfo"
                        - type: object
                          required: [role]
                          properties:
                            role:
                              type: string
                              enum: ["", member, admin, owner]
                              description: What you are in it; empty for none and without a token
                  nextCursor: { type: string, description: "Empty on the last page" }
                  total: { type: integer, description: "How many on all pages" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "403":
          description: "`this page is deleted`, `this page is hidden` or `this user's clubs are hidden`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/feed:
    get:
      summary: Your news feed
      description: |
        Posts of the people you follow and your own, on any wall, and every
        post on their walls, on yours and on the walls of your clubs,
        newest first, each with its author. Page with `cursor` = `nextCursor`; `total` is always 0.
        A new follow or club shows in the feed a moment later: the posts
        service hears of it after the fact.
        Posts marked as adult are left out when your `interface.nsfw` is
        `hide`. What the people in your blacklist wrote is left out
        too, on any wall and with `type=all` as well, unless one wrote in
        the name of a community. A post on the wall of a community you run
        comes with `moderated`: you may delete, pin and put it away.

        With `type=all` it is "Все новости" of openvk instead: the posts of
        every wall, whomever you follow.

        "Настройки ленты" of openvk come with the request and are not
        kept by the server. The walls you ignore
        (`/api/v1/me/feed/ignored`) are left out of both feeds, whoever
        wrote there, and an ignored person is not followed to the walls of
        others either; `ignored=true` brings them back. `alien=false`
        leaves only what a wall says itself: people on their own walls,
        communities in their name.
      security: [{ bearer: [] }]
      parameters:
        - name: type
          in: query
          description: "`all` for the posts of everyone; anything else but nothing is 400 `invalid feed type`"
          schema: { type: string, enum: [all] }
        - name: alien
          in: query
          description: "`false` leaves out what people wrote on the walls of others (\"Показывать посты на чужих стенах\" taken off)"
          schema: { type: boolean, default: true }
        - name: ignored
          in: query
          description: "`true` shows the walls you ignore too (\"Показывать игнорируемые источники\")"
          schema: { type: boolean, default: false }
        - name: comments
          in: query
          description: "`last` brings each post with `lastComments`, its three newest comments (\"Микроблог\")"
          schema: { type: string, enum: [last] }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of the feed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /healthz:
    get:
      summary: Liveness of the gateway
      responses:
        "200": { description: Up }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  requestBodies:
    TwoFactorCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            additionalProperties: false
            properties:
              code: { type: string, example: "123456" }
    Album:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, maxLength: 36 }
              description: { type: string, maxLength: 255 }
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refreshToken]
            additionalProperties: false
            properties:
              refreshToken: { type: string }

  parameters:
    ArchiveYear:
      name: year
      in: query
      description: The year (UTC) whose posts to move; none for the posts of every year
      schema: { type: integer, minimum: 1970, maximum: 9999 }
    ClubRef:
      name: ref
      in: path
      required: true
      description: A community's address (whatever the case) or, without one, its ID
      schema: { type: string }

  responses:
    HoldemSeat:
      description: The table after your buy-in or payout and your balance; `table` is null when it closed as you left.
      content:
        application/json:
          schema:
            type: object
            required: [table, balance]
            properties:
              table:
                nullable: true
                allOf: [{ $ref: "#/components/schemas/HoldemTable" }]
              balance: { type: integer, format: int64 }
    ClubList:
      description: Communities
      content:
        application/json:
          schema:
            type: object
            required: [clubs, nextCursor]
            properties:
              clubs:
                type: array
                items: { $ref: "#/components/schemas/ClubInfo" }
              nextCursor: { type: string, description: "Empty on the last page or with no paging" }
    Club:
      description: The community as you see it
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/ClubInfo" }
              - type: object
                required: [role, owner, canStartTopic]
                properties:
                  role: { type: string, enum: ["", member, admin, owner], description: "What you are in it; empty without a token or membership" }
                  canStartTopic: { type: boolean, description: "You may start a topic in its discussions (\"Создать тему\")" }
                  ignoredByMe: { type: boolean, description: "Your news leave this wall out; told by `GET /api/v1/clubs/{ref}` alone, with a token" }
                  requested: { type: boolean, description: "You asked to join this closed group and wait for an answer (\"Отменить заявку\" is `DELETE .../membership`)" }
                  requests: { type: integer, description: "How many people wait to be let in; told to those who run the group" }
                  owner:
                    description: Its creator; null when the page is deleted or erased, or when the community hides its owner from you
                    oneOf:
                      - { $ref: "#/components/schemas/Author" }
                      - { type: "null" }
                  ownerTitle: { type: string, description: "What the owner does in the community; empty for none or without `owner`" }
    AlbumList:
      description: One page of albums with whom they belong to
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/AlbumOwner" }
              - type: object
                required: [albums, nextCursor, total]
                properties:
                  albums:
                    type: array
                    items: { $ref: "#/components/schemas/Album" }
                  nextCursor: { type: string, description: "Empty on the last page" }
                  total: { type: integer }
    AlbumPage:
      description: An album with whom it belongs to
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/AlbumOwner" }
              - type: object
                required: [album]
                properties:
                  album: { $ref: "#/components/schemas/Album" }
    AlbumPhotoPage:
      description: A photo with who uploaded it and its album
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/AlbumOwner" }
              - type: object
                required: [photo, author, album]
                properties:
                  photo: { $ref: "#/components/schemas/AlbumPhoto" }
                  author: { $ref: "#/components/schemas/Author" }
                  album: { $ref: "#/components/schemas/Album" }
    TopicPage:
      description: A topic with its community; role is what you are in it
      content:
        application/json:
          schema:
            type: object
            required: [topic, club, role]
            properties:
              topic: { $ref: "#/components/schemas/Topic" }
              club: { $ref: "#/components/schemas/Author" }
              role: { type: string, enum: ["", member, admin, owner] }
    Like:
      description: How many likes the post has now
      content:
        application/json:
          schema:
            type: object
            required: [likes, liked]
            properties:
              likes: { type: integer }
              liked: { type: boolean, description: "You like the post now" }
    Tokens:
      description: Token pair
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, refreshToken]
            properties:
              accessToken: { type: string }
              refreshToken: { type: string }
    RecoveryCodes:
      description: Recovery codes, each good once
      content:
        application/json:
          schema:
            type: object
            required: [recoveryCodes]
            properties:
              recoveryCodes:
                type: array
                items: { type: string, example: "abcde-fghij" }
    User:
      description: The caller's account
      content:
        application/json:
          schema: { $ref: "#/components/schemas/User" }
    FollowStats:
      description: Fresh follow counters of the user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FollowStats" }
    InvalidArgument:
      description: Invalid input; the message says what
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: Missing, invalid or expired token or code
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PermissionDenied:
      description: Not allowed, as for anyone but the administrators
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The state does not allow it; the message says why
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited (sign-in codes, or spam protection of posts, comments, likes, messages, uploads, follows and communities); try again later
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    BetEvent:
      type: object
      description: 'An event of "Ставки": a question the administrators ask, with the votes staked on each outcome'
      required: [id, question, outcomes, state, open, closesAt, winner, createdAt, staked, people, payout]
      properties:
        id: { type: string }
        question: { type: string }
        outcomes:
          type: array
          items:
            type: object
            required: [name, odds, staked, bettors, mine, potential]
            properties:
              name: { type: string }
              odds: { type: integer, description: 'Its odds now, in hundredths: 250 — ×2.5; 0 for an event that shares the stakes' }
              staked: { type: integer, format: int64, description: The votes on it }
              bettors: { type: integer, description: How many people staked on it }
              mine: { type: integer, format: int64, description: Your votes on it; 0 for a guest }
              potential: { type: integer, format: int64, description: What your stakes on it pay if it wins, each at the odds it was made at }
        state: { type: string, enum: [open, closed, resolved, cancelled] }
        open: { type: boolean, description: Whether it takes stakes now }
        closesAt: { type: string, format: date-time, nullable: true, description: When the stakes close by themselves; null for when the administrators close them }
        winner: { type: integer, description: The index of the winning outcome; -1 unless resolved }
        createdAt: { type: string, format: date-time }
        staked: { type: integer, format: int64, description: The votes on all the outcomes }
        people: { type: integer, description: How many people staked }
        payout: { type: integer, format: int64, description: What your stakes paid back once it was over }
    Ban:
      type: object
      description: 'A block of a page by the administrators of the site'
      required: [reason, bannedAt, until]
      properties:
        reason: { type: string, description: 'openvk''s "Комментарий модератора"' }
        bannedAt: { type: string, format: date-time }
        until:
          description: When the block ends; null for good
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
    Session:
      type: object
      required: [id, createdAt, lastUsedAt, ip, userAgent, current]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time, description: The sign-in }
        lastUsedAt:
          type: string
          format: date-time
          description: When its tokens were last issued, at the sign-in or a refresh
        ip: { type: string, description: 'Where from, "" when unknown' }
        userAgent: { type: string, description: 'What the browser called itself, "" when unknown' }
        current: { type: boolean, description: The session of the access token that asks }
    StickerPacks:
      type: object
      required: [packs]
      properties:
        packs:
          type: array
          items: { $ref: "#/components/schemas/StickerPack" }

    StickerPack:
      type: object
      required: [id, price, stickers, bought, added, author, published]
      properties:
        id: { type: string, description: "The name of the pack: `cats`, or 32 hex digits for one a person made" }
        price: { type: integer, minimum: 0, description: "What it costs once, in votes; 0 is free" }
        stickers:
          type: array
          items: { type: string, description: "The name of a sticker: 32 hex digits of the photo it is" }
        bought: { type: boolean, description: "You have taken it, free or for votes" }
        added: { type: boolean, description: "It is among your stickers: you can send them" }
        author:
          description: Who made it of their photos; null for a pack of the site (and of a deleted page)
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Author" }]
        name: { type: string, description: "Of a pack a person made" }
        about: { type: string, description: "Of a pack a person made" }
        published: { type: boolean, description: "The shop shows it; a pack of the site always" }
        holders: { type: integer, description: "How many people have taken it, its author left out — the shop sorts its \"Популярные\" by it" }

    StickerPackRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64, description: "One line" }
        about: { type: string, maxLength: 500 }
        price: { type: integer, minimum: 0, description: "In votes, 0 for a free pack" }
        published: { type: boolean, description: "Show it in the shop" }
        photos:
          type: array
          maxItems: 10
          items: { type: string }
          description: Of a new pack
        addPhotos:
          type: array
          maxItems: 10
          items: { type: string }
          description: Of an edit
        removePhotos:
          type: array
          items: { type: string }
          description: Of an edit

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_argument, unauthenticated, permission_denied, not_found,
                     conflict, too_many_requests, unavailable, method_not_allowed, internal]
            message: { type: string }

    Profile:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        surname: { type: string, maxLength: 100 }
        nickname:
          type: string
          maxLength: 32
          pattern: "^[A-Za-z](?:[A-Za-z0-9_]*[A-Za-z0-9])?$"
        status: { type: string, maxLength: 200 }
        gender: { type: string, enum: ["", male, female, neutral], description: "openvk's \"Местоимения\": neutral is \"они/их\"" }
        relationship:
          type: string
          enum: ["", single, dating, engaged, married, civil_union, in_love, complicated, looking]
        hometown: { type: string, maxLength: 64 }
        hideBirthYear: { type: boolean, description: "Show only the day and the month of the birthday" }
        worldview:
          type: string
          enum: ["", islam, orthodox, catholicism, judaism, protestantism, buddhism,
                 confucianism, secular_humanism]
        politicalViews:
          type: string
          enum: ["", communist, socialist, liberal, conservative, monarchist,
                 ultraconservative, indifferent, libertarian, moderate_islamism,
                 radical_islamism]
        birthday:
          type: [string, "null"]
          example: "1990-05-17"
          description: "YYYY-MM-DD, or --MM-DD in a public profile whose owner shows only the day and the month"

    Contacts:
      type: object
      description: openvk's "Контактная информация"
      properties:
        email: { type: string, maxLength: 254, description: "To show on the page, not the one to sign in with" }
        telegram: { type: string, description: "A username, without @" }
        website: { type: string, maxLength: 256 }
        city: { type: string, maxLength: 64 }
        address: { type: string, maxLength: 255 }

    Interests:
      type: object
      description: openvk's "Личная информация"; each up to 1000 characters
      properties:
        interests: { type: string }
        music: { type: string }
        films: { type: string }
        shows: { type: string }
        books: { type: string }
        quotes: { type: string }
        games: { type: string }
        about: { type: string, description: "\"О себе\"" }

    ExtraField:
      type: object
      required: [name, text, place]
      properties:
        name: { type: string, maxLength: 50 }
        text: { type: string, maxLength: 60000 }
        place: { type: string, enum: [contacts, interests], description: Where it shows }

    About:
      type: object
      description: The rest of the page, public
      required: [contacts, interests, fields, registeredAt, partner]
      properties:
        contacts: { $ref: "#/components/schemas/Contacts" }
        interests: { $ref: "#/components/schemas/Interests" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/ExtraField" }
        registeredAt: { type: string, format: date-time, description: "\"Дата регистрации\"" }
        partner:
          description: Whom the relationship names; null for nobody, when it is hidden and when that page is deleted
          oneOf:
            - { $ref: "#/components/schemas/Author" }
            - { type: "null" }

    Privacy:
      type: object
      additionalProperties: false
      properties:
        showBirthday: { type: boolean }
        showRelationship: { type: boolean }
        showWorldview: { type: boolean }
        showPoliticalViews: { type: boolean }
        wallWrite:
          type: string
          enum: [everyone, following, only_me]
          description: "Who may write on your wall besides you; following: the people you follow"
        messagesWrite:
          type: string
          enum: [everyone, following, nobody]
          description: "Who may write private messages to you; whoever you wrote to may answer anyway"
        clubsRead:
          type: string
          enum: [everyone, users, following, only_me]
          description: "Who sees your communities on your page (\"Кому видно мои группы\"); the communities show their members anyway"
        pageRead:
          type: string
          enum: [everyone, users]
          description: "Who sees your page at all (\"Кому в интернете видно мою страницу\"): anyone or signed-in people; to the others it shows only the names and the photo"
        infoRead:
          type: string
          enum: [everyone, users, following, only_me]
          description: "Who sees the information of your page (\"Кому видно основную информацию моей страницы\"): all but the names, the photo, the status and the pronouns; the search filters by it find you only with everyone"
        photosRead:
          type: string
          enum: [everyone, users, following, only_me]
          description: "Who sees your photo albums (\"Кому видно мои фотографии\")"
        friendsRead:
          type: string
          enum: [everyone, users, following, only_me]
          description: "Who sees whom you follow and who follows you (\"Кому видно моих друзей\")"
        onlineRead:
          type: string
          enum: [everyone, users, following, only_me]
          description: "Who sees when you were last online after a long absence (\"Кто видит мою неактивность\"); a shorter one anyone sees, as on openvk"
        giftsRead:
          type: string
          enum: [everyone, users, following, only_me]
          description: "Who sees the gifts sent to you (\"Кому видны мои подарки\"); everyone when left out"
        chatsInvite:
          type: string
          enum: [everyone, following, nobody]
          description: "Who may add you to chats (\"Кто может добавлять меня в чаты\"): `following` are the people you follow, the default, also when left out"
        closed:
          type: boolean
          description: "A closed profile (\"Тип профиля: закрытый\"): only the people you follow see anything of the page but the names and the photo, whatever the other settings say; false when left out"
        messagesPrime: { type: boolean, description: "Only people with Freenet Prime write to you (\"Писать мне могут только подписчики Freenet Prime\"); those you wrote to first answer all the same" }
        messagePrice: { type: integer, minimum: 0, maximum: 1000000, description: "What a message to you costs, in votes; 0 for free, also when left out. You get them less the tax of sticker packs; those you wrote to first answer freely" }

    User:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - $ref: "#/components/schemas/About"
        - type: object
          required: [id, avatar, email, profileCompleted, privacy, deactivated]
          properties:
            id: { type: string, format: uuid }
            avatar: { $ref: "#/components/schemas/Avatar" }
            email: { type: string, format: email }
            profileCompleted: { type: boolean }
            privacy: { $ref: "#/components/schemas/Privacy" }
            backdrop: { $ref: "#/components/schemas/Backdrop" }
            completeness:
              type: integer
              description: '"Заполненность страницы" in percent, as openvk weighs it: interests, the e-mail and the city of the contacts 20 each, Telegram and the status 15 each, 10 always, and the rating vouchers gave on top, so it may pass 100'
            votes:
              type: integer
              description: '"Баланс": the votes you have, told by GET /api/v1/me; vouchers and transfers give them, paid gifts and transfers take them'
            rating:
              type: integer
              description: The rating you have, in percent, up to 1000 bought; vouchers and "Повысить рейтинг" give it
            admin:
              type: boolean
              description: You are an administrator of the site and make the vouchers
            verified:
              type: boolean
              description: The administrators confirmed your page (a checkmark by the name)
            prime:
              type: boolean
              description: You have Freenet Prime now
            primeUntil:
              type: string
              format: date-time
              description: Until when you have Freenet Prime; absent without it
            primeInvisible:
              type: boolean
              description: «Невидимка» of Freenet Prime is on
            primeStyle:
              $ref: "#/components/schemas/PrimeStyle"
            alert:
              type: string
              description: The label the administrators put on your page (an orange one above the name), "" for none
            ban:
              description: "The administrators blocked your page: then the token lets you only read your account (and sign out), everything else answers 403"
              oneOf:
                - { $ref: "#/components/schemas/Ban" }
                - { type: "null" }
            unfilled:
              type: array
              items: { type: string, enum: [interests, email, telegram, status, city] }
              description: What is missing, for openvk's hints under the gauge
            interface: { $ref: "#/components/schemas/Interface" }
            pinnedClubs:
              type: array
              items: { $ref: "#/components/schemas/Club" }
              description: 'The clubs in your left menu ("Добавить в левое меню"), told by GET /api/v1/me alone; absent when there are none'
            newGuests:
              type: integer
              description: '"Гости": who came since you last looked, at most 100; told by GET /api/v1/me alone'
            deactivated:
              type: boolean
              description: "You deleted the page; see POST /api/v1/me/deactivate"
            purgeAt:
              type: string
              format: date-time
              description: "Only for a deleted page: when it can no longer be restored and its data is erased"

    Avatar:
      type: [object, "null"]
      description: URLs of the profile photo; null without one
      required: [large, small]
      properties:
        large: { type: string, example: "/media/avatars/<user>/<avatar>/large.jpg" }
        small: { type: string, example: "/media/avatars/<user>/<avatar>/small.jpg" }

    Author:
      type: object
      required: [id, nickname, name, surname, gender]
      properties:
        id: { type: string, format: uuid }
        avatar: { $ref: "#/components/schemas/Avatar" }
        nickname: { type: string }
        name: { type: string }
        surname: { type: string }
        gender: { type: string, enum: ["", male, female] }
        deactivated:
          type: boolean
          description: "Only in dialogs: the person deleted the page. Elsewhere such people and what they wrote are left out"
        club:
          type: boolean
          description: "A community, as the owner of a wall or the voice of a post: only `id`, `name` and `address` are set, its page is /club/<address or id>"
        address: { type: string, description: "A community's address; empty for none" }
        online: { type: boolean, description: "The person is on the site now (\"Онлайн\"); told only of a page open to everyone, absent otherwise" }
        verified: { type: boolean, description: "The page or the community is confirmed by the administrators (\"Подтверждённая страница\"): a checkmark by the name; absent otherwise" }
        prime: { type: boolean, description: "The person has Freenet Prime: its badge by the name; absent otherwise" }
        primeStyle:
          allOf: [{ $ref: "#/components/schemas/PrimeStyle" }]
          description: "How the person with Freenet Prime dressed their page: the site colours the name and lays the pattern behind their posts and messages; absent without Prime"

    Interface:
      type: object
      description: How the site looks to its owner ("Интерфейс" of the settings)
      required: [avatarStyle, mainPage]
      properties:
        avatarStyle: { type: string, enum: [square, round], description: "How photos of people are shown; square by default" }
        mainPage: { type: string, enum: [page, feed], description: "Where the site opens: your page (the default) or the news" }
        hiddenMenu:
          type: array
          description: The links taken out of the left menu; none by default
          items: { type: string, enum: [photos, messages, groups, feed, notifications] }
        theme: { type: string, enum: [default, blue, dark, gold], description: "The look of the whole site (\"Стиль\"); default when left out; `gold` is chosen only with Freenet Prime (`this is for freenet prime only`, 409) and stays after it ends" }
        hideRating: { type: boolean, description: "Takes \"Заполненность страницы\" off the pages its owner reads (\"Рейтинг\")" }
        nsfw: { type: string, enum: [blur, hide, show], description: "Posts marked as adult: blurred until clicked (the default), blurred and left out of the news, or shown as any other" }
        postView: { type: string, enum: [old, microblog], description: "How posts are laid out (\"Вид постов\"); old by default" }
        timezone:
          type: [integer, "null"]
          description: The clock dates are shown by, minutes east of UTC (-720..840 in steps of 15); null for the browser's own

    AdminsDisplay:
      type: string
      enum: [creator, all, none]
      description: "What the page shows of those who run the community: only its creator (\"Создатель\"), all the admins (\"Администраторы\") or nothing"

    ClubInfo:
      type: object
      required: [id, name, description, address, website, wall, adminsDisplay, members, createdAt, openTopics, topicsAboveWall, backdrop]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, description: "Plain text with \\n line breaks" }
        address: { type: string, description: "Empty for none: the page is then /club/<id>" }
        website: { type: string, description: "An http or https link (\"Сайт\"); empty for none" }
        wall: { type: string, enum: [open, suggest, closed], description: "Who may write on the wall: everyone, only its admins with posts suggested by others (\"Предложка\"), or only its admins" }
        adminsDisplay: { $ref: "#/components/schemas/AdminsDisplay" }
        members: { type: integer }
        createdAt: { type: string, format: date-time }
        avatar: { $ref: "#/components/schemas/Avatar" }
        openTopics: { type: boolean, description: "Anyone starts topics in its discussions, not only its admins (\"Все могут создавать темы\")" }
        topicsAboveWall: { type: boolean, description: "Its page lists the topics above the wall (\"Отображать список тем над стеной\")" }
        backdrop: { $ref: "#/components/schemas/Backdrop" }
        closed: { type: boolean, description: "A closed group (\"Закрытая группа\"): joining it (`PUT .../membership`) only asks to, and its wall, members, topics and albums answer 403 `this club is closed` (topics and albums by ID - 404) to those who are not members" }

    Topic:
      type: object
      description: A discussion of a community ("Обсуждения")
      required: [id, author, title, fromWall, closed, pinned, restricted, createdAt, updatedAt, messages, lastMessage, mine]
      properties:
        id: { type: string, format: uuid }
        author: { description: "Who started it, or the community for a topic of the community", allOf: [{ $ref: "#/components/schemas/Author" }] }
        title: { type: string, maxLength: 127 }
        fromWall: { type: boolean, description: "Started for the community, shown as its author" }
        closed: { type: boolean, description: "Nobody writes in it (\"Закрыть тему\")" }
        pinned: { type: boolean, description: "On top of the list (\"Закрепить тему\")" }
        restricted: { type: boolean, description: "Only the admins write in it (\"Комментировать могут только администраторы\")" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: "The newest message, or createdAt without one" }
        messages: { type: integer }
        lastMessage:
          description: Who answered last and when ("ответил"); only in lists, null without a message
          oneOf:
            - type: object
              required: [author, createdAt]
              properties:
                author: { $ref: "#/components/schemas/Author" }
                createdAt: { type: string, format: date-time }
            - type: "null"
        mine: { type: boolean, description: "You started it; false without a token" }

    TopicMessage:
      type: object
      description: What someone wrote in a topic, shaped as a comment
      required: [id, author, text, photos, createdAt, fromWall, mine, likes, liked]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        text: { type: string, description: "Plain text with \\n line breaks; empty when photos only" }
        textCut:
          type: boolean
          description: "`text` is only its beginning (1000 characters): lists carry no more. GET /api/v1/topic-messages/{id}/text tells it whole. Absent when the text is whole"
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string, format: date-time }
        fromWall: { type: boolean, description: "It speaks for the community, shown as its author" }
        mine: { type: boolean, description: "You wrote it; false without a token" }
        likes: { type: integer, description: "Its hearts" }
        liked: { type: boolean, description: "You put one; false without a token, and in the answer to writing a message" }

    NewClubPost:
      type: object
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 60000 }
        photos: { $ref: "#/components/schemas/PhotoIDs" }
        fromClub: { type: boolean, description: "Speak for the community (admins only; always on a closed wall)" }
        signed: { type: boolean, description: "With fromClub: name yourself under the post (\"Подпись автора\")" }
        nsfw: { type: boolean, description: "Marks the post as adult (\"Содержит NSFW-контент\")" }
        poll: { $ref: "#/components/schemas/NewPoll" }
        documents: { $ref: "#/components/schemas/DocumentIDs" }

    NewPost:
      type: object
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 60000 }
        photos: { $ref: "#/components/schemas/PhotoIDs" }
        documents:
          description: "Documents of yours to attach (GET /me/documents). Only when writing: an edit that carries them is refused (400)"
          allOf:
            - { $ref: "#/components/schemas/DocumentIDs" }
        nsfw: { type: boolean, description: "Marks the post as adult (\"Содержит NSFW-контент\"); an edit that leaves it out keeps the mark" }
        poll:
          description: "The poll a new post asks; with it `text` and `photos` may be empty. Only when writing: the poll of a post stays as asked, and an edit that carries one is refused (400)"
          allOf:
            - { $ref: "#/components/schemas/NewPoll" }
        price: { type: integer, minimum: 0, maximum: 1000000, description: "Only for a new post on your own wall with photos or documents, not a repost: others see them for so many votes (POST /posts/{id}/purchase), which go to you less the tax of sticker packs. 400 otherwise; an edit keeps it" }

    NewPoll:
      type: object
      description: 'A poll for a new post ("Новый опрос")'
      additionalProperties: false
      required: [title, options]
      properties:
        title: { type: string, minLength: 1, maxLength: 128, description: "What is asked (\"Тема опроса\"), one line" }
        options:
          description: The answers, in the order shown, each one line
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 128 }
        anonymous: { type: boolean, description: "Who voted is not told (\"Анонимный опрос\")" }
        multiple: { type: boolean, description: "Several options may be chosen (\"Множественный выбор\")" }
        locked: { type: boolean, description: "A vote cannot be taken back (\"Запретить отменять свой голос\")" }
        days: { type: integer, minimum: 0, maximum: 31, description: "How many days the poll takes votes (\"Голосование истекает через\"); 0 or absent: for ever" }

    Poll:
      type: object
      description: The poll of a post, as you see it
      required: [title, options, voters, anonymous, multiple, locked, endsAt, ended, voted]
      properties:
        title: { type: string }
        options:
          type: array
          items:
            type: object
            required: [name, votes]
            properties:
              name: { type: string }
              votes: { type: integer, description: How many people chose it }
        voters: { type: integer, description: "How many people voted; with `multiple` less than the sum of `votes`" }
        anonymous: { type: boolean, description: "Who voted is not told: no list of voters" }
        multiple: { type: boolean, description: Several options may be chosen }
        locked: { type: boolean, description: A vote cannot be taken back }
        endsAt:
          description: Until when it takes votes; null for a poll that never ends
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        ended: { type: boolean, description: "`endsAt` has passed: no votes are cast or taken back" }
        voted:
          description: The places (from 0) of the options you chose; empty when you have not voted, and without a token
          type: array
          items: { type: integer }

    DocumentIDs:
      description: IDs of your documents (GET /api/v1/me/documents), in the order shown
      type: array
      maxItems: 10
      uniqueItems: true
      items: { type: string, format: uuid }

    Story:
      type: object
      description: A photo with a few words shown for a day
      required: [id, photo, text, createdAt, expiresAt, viewed, views, liked, likes, comments]
      properties:
        id: { type: string, format: uuid }
        photo: { $ref: "#/components/schemas/Photo" }
        text: { type: string, description: "Up to 200 characters; may be empty" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: "A day after createdAt" }
        viewed: { type: boolean, description: "You viewed it" }
        mine: { type: boolean, description: "You told it" }
        views: { type: integer, description: "Of yours: how many others viewed it; 0 otherwise" }
        liked: { type: boolean, description: "You liked it" }
        likes: { type: integer, description: "How many liked it, deleted pages aside" }
        comments: { type: integer, description: "How many comments it has, deleted pages aside" }

    StoryComment:
      type: object
      description: A few words under a story
      required: [id, author, text, createdAt, mine]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        mine: { type: boolean, description: "You wrote it" }

    StoryList:
      type: object
      required: [authors]
      properties:
        authors:
          type: array
          items:
            type: object
            required: [author, stories, viewed]
            properties:
              author: { $ref: "#/components/schemas/Author" }
              stories:
                type: array
                items: { $ref: "#/components/schemas/Story" }
              viewed: { type: boolean, description: "You viewed them all" }

    Document:
      type: object
      description: A document ("Мои Документы")
      required: [id, name, ext, size, url, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: "Its name, up to 128 characters" }
        ext: { type: string, description: "Its format, the end of the file name in lower case, as `pdf`" }
        size: { type: integer, description: "In bytes, up to 10 MB" }
        url: { type: string, description: "Where it is downloaded: /media/documents/{id}" }
        createdAt: { type: string, format: date-time }

    PhotoIDs:
      description: IDs from `POST /api/v1/me/photos`, yours, in the order shown
      type: array
      maxItems: 10
      uniqueItems: true
      items: { type: string, format: uuid }

    Post:
      type: object
      required: [id, author, wall, text, photos, createdAt, likes, liked, comments, reposts, repost, editedAt, editableUntil, pinned, fromWall, mine, signer]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        wall:
          description: The owner of the wall when it is not the author's own; null otherwise
          oneOf:
            - $ref: "#/components/schemas/Author"
            - type: "null"
        text: { type: string, description: "Plain text with \\n line breaks; never HTML; empty when the post is photos only or a repost without a word" }
        textCut:
          type: boolean
          description: "`text` is only its beginning (1000 characters): lists carry no more. GET /api/v1/posts/{id} tells the post whole. Absent when the text is whole"
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string, format: date-time }
        likes: { type: integer }
        liked: { type: boolean, description: "You like the post; false without a token" }
        comments: { type: integer }
        reposts: { type: integer, description: "How many times the post was shared" }
        sharedPhoto:
          description: 'A photo of an album the post shares ("Поделиться" under a photo); null otherwise. A deleted photo leaves only its ID'
          oneOf:
            - $ref: "#/components/schemas/SharedPhoto"
            - type: "null"
        repost:
          description: The shared post when this is a repost; null otherwise
          oneOf:
            - $ref: "#/components/schemas/SharedPost"
            - type: "null"
        documents:
          type: array
          description: The documents it attaches that are still there; absent for none
          items: { $ref: "#/components/schemas/Document" }
        poll:
          description: The poll the post asks; null for a post without one
          oneOf:
            - $ref: "#/components/schemas/Poll"
            - type: "null"
        link:
          description: "The card of the first web address in the text of a new post, as the page told it then; null for none. Edits keep it"
          oneOf:
            - $ref: "#/components/schemas/LinkCard"
            - type: "null"
        editedAt:
          description: When the author last edited the post; null if never ("ред.")
          oneOf:
            - { type: string, format: date-time }
            - type: "null"
        editableUntil: { type: string, format: date-time, description: "Until when the author may edit it" }
        pinned: { type: boolean, description: "Shown first on its wall (\"закреплено\")" }
        archived: { type: boolean, description: "Put away in the archive of its wall (\"Архив записей\"): only the owner of the wall, or the admins of the community, see it" }
        commentsClosed: { type: boolean, description: "It takes no new comments: the owner of the wall closed them" }
        nsfw: { type: boolean, description: "Its author marked it as adult (\"Содержит NSFW-контент\"): the site blurs it until clicked, as the reader's settings say" }
        price: { type: integer, description: "What its photos and documents cost to see, in votes; absent for a free post" }
        locked: { type: boolean, description: "You have not paid for a paid post: `photos` and `documents` are none, `lockedPhotos` and `lockedDocuments` tell how many. Absent otherwise; the author sees them always" }
        lockedPhotos: { type: integer }
        lockedDocuments: { type: integer }
        fromWall:
          type: boolean
          description: "The post speaks for its wall, a community (\"От имени сообщества\"): `author` is the community, `wall` null, who wrote it is not told"
        mine: { type: boolean, description: "You wrote it and may edit it; false without a token, and for a post you suggested that a community published, which is the community's" }
        moderated: { type: boolean, description: "Only in the feed: the post is on the wall of a community you run" }
        signer:
          description: "Who wrote a post for a community that names its author (\"Автор: ...\"); null otherwise"
          oneOf:
            - { $ref: "#/components/schemas/Author" }
            - { type: "null" }
        lastComments:
          description: "Its three newest comments, oldest first; only in a list asked for with `comments=last`, and left out when there are none. Those of archived posts are not told"
          type: array
          items: { $ref: "#/components/schemas/Comment" }

    SharedPost:
      type: object
      description: |
        The post a repost shares, without counters. When it or its author is
        gone, only id and deleted: true are set ("Запись удалена"). repostOf
        is set when the shared post is itself a repost: link to it.
      required: [id, deleted, author, wall, text, photos, createdAt, repostOf]
      properties:
        id: { type: string, format: uuid }
        deleted: { type: boolean }
        nsfw: { type: boolean, description: "Its author marked it as adult, as Post's nsfw" }
        price: { type: integer, description: "As Post's price: what its photos and documents cost to see, in votes; absent for a free post" }
        locked: { type: boolean, description: "You have not paid for a paid post: `photos` and `documents` are none, `lockedPhotos` and `lockedDocuments` tell how many. Absent otherwise; the author sees them always" }
        lockedPhotos: { type: integer }
        lockedDocuments: { type: integer }
        textCut: { type: boolean, description: "`text` is only its beginning, as Post's textCut" }
        author:
          oneOf:
            - $ref: "#/components/schemas/Author"
            - type: "null"
        wall:
          description: The owner of the wall when not the author's own; null otherwise
          oneOf:
            - $ref: "#/components/schemas/Author"
            - type: "null"
        text: { type: string }
        photos:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string }
        repostOf: { type: string, description: "Empty unless the shared post is itself a repost" }
        documents:
          type: array
          description: The documents it attaches that are still there; absent for none
          items: { $ref: "#/components/schemas/Document" }
        poll:
          description: "The poll the shared post asks, as Post's poll; in a message and in live events without `voted`"
          oneOf:
            - $ref: "#/components/schemas/Poll"
            - type: "null"
        link:
          description: "The card of the shared post, as Post's link"
          oneOf:
            - $ref: "#/components/schemas/LinkCard"
            - type: "null"

    LinkCard:
      type: object
      description: |
        What a page a post links to said of itself (Open Graph, else its
        <title> and description) when the post was written. The gateway reads
        the page itself, only at public addresses on ports 80 and 443, within
        LINK_PREVIEW_TIMEOUT; a page that tells nothing makes no card.
      required: [url, title, description, site, photo]
      properties:
        url: { type: string, description: "The address as the text says it" }
        title: { type: string, description: "Up to 256 characters, one line" }
        description: { type: string, description: "Up to 512 characters; may be empty" }
        site: { type: string, description: "Its og:site_name, else the host" }
        photo:
          description: "Its picture, kept as a photo of the post's author; null for none"
          oneOf:
            - $ref: "#/components/schemas/Photo"
            - type: "null"

    Photo:
      type: object
      required: [id, large, small]
      properties:
        id: { type: string, format: uuid }
        large: { type: string, description: "URL, up to 1280 on the longer side" }
        small: { type: string, description: "URL, up to 640 on the longer side" }

    Album:
      type: object
      required: [id, name, description, photos, createdAt, updatedAt, cover]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        photos: { type: integer, description: How many photos it has }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: "Renamed, photos added or deleted (\"Обновлён\")" }
        cover:
          description: The photo chosen to show it, else its first; null while it has none
          oneOf:
            - { $ref: "#/components/schemas/Photo" }
            - { type: "null" }
        kind:
          type: string
          enum: ["", avatars, wall]
          description: '"" for an album people make; "avatars" is "Фотографии со страницы", which the site keeps with every new photo of the page, and "wall" is "Фотографии со стены", where it keeps a copy of every photo of the posts a person writes on their own wall: nobody renames, deletes or fills them by hand, their photos may be deleted and moved to other albums'

    AlbumPhoto:
      allOf:
        - { $ref: "#/components/schemas/Photo" }
        - type: object
          required: [description, createdAt, mine]
          properties:
            description: { type: string }
            createdAt: { type: string, format: date-time }
            mine: { type: boolean, description: You uploaded it }
            likes: { type: integer }
            comments: { type: integer }
            liked: { type: boolean, description: You like it }
            nsfw: { type: boolean, description: "It came from a post marked as adult: blurred as the reader's settings say" }

    AlbumOwner:
      type: object
      required: [owner, role]
      properties:
        owner: { $ref: "#/components/schemas/Author" }
        role: { type: string, enum: ["", member, admin, owner], description: "What you are in the community that owns it; empty for a person" }

    Comment:
      type: object
      required: [id, postId, author, text, photos, createdAt, replyTo, likes, liked, fromWall, mine]
      properties:
        id: { type: string, format: uuid }
        postId: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        text: { type: string, description: "Plain text with \\n line breaks; never HTML; empty when photos only" }
        textCut:
          type: boolean
          description: "`text` is only its beginning (1000 characters): lists carry no more. GET /api/v1/comments/{id}/text tells it whole. Absent when the text is whole"
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string, format: date-time }
        replyTo:
          description: The comment this one answers ("в ответ"); null for none, and once it is deleted
          oneOf:
            - { type: string, format: uuid }
            - type: "null"
        likes: { type: integer }
        liked: { type: boolean, description: "You like the comment; false without a token" }
        fromWall: { type: boolean, description: "It speaks for the community, which is its author; who wrote it is not told" }
        mine: { type: boolean, description: "You wrote it; false without a token" }

    CommentPage:
      type: object
      required: [comments, nextCursor, total]
      properties:
        comments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        nextCursor: { type: string, description: "Empty on the last page" }
        total: { type: integer, description: "All comments of the post" }

    Notification:
      type: object
      required: [id, type, createdAt, actor, post, comment]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [like, comment, follow, wall_post, repost, comment_reply, comment_like, post_accepted, suggested_post, club_admin, topic_message, post_mention, comment_mention, topic_mention, topic_message_like, photo_like, photo_comment, photo_mention, gift, votes, prime, invite, verified, club_verified, story_like, story_comment]
          description: "wall_post: the actor wrote on your wall; repost: the actor shared your post, post is the repost; comment_reply: the actor answered your comment under post, comment is the answer; comment_like: the actor liked your comment; post_accepted: the actor, a community, published the post you suggested; suggested_post: someone suggested a post for the actor, a community you run (until it is published, declined or withdrawn); club_admin: you were made an admin of the actor, a community (until you are dismissed); topic_message: the actor, a person or the community, wrote in the topic you started, named by `topic` (until the message or the topic is deleted); post_mention, comment_mention, topic_mention: the actor named you (\"@nickname\" or \"[nickname|Name]\") in post, in comment under post, or in a message of topic; topic_message_like: the actor liked your message in topic (until the like is taken back or the message deleted); photo_like, photo_comment: the actor liked or commented the photo you put into an album, named by `photo`; photo_mention: the actor named you in comment under `photo`; gift: the actor sent you a gift (until you delete it); votes: the actor handed you votes; prime: the actor gave you Freenet Prime; invite: the actor signed up by your invitation link and follows you; verified: the actor, an administrator, gave your page the checkmark (until it is taken); club_verified: the actor, a community you own, got the checkmark (until it is taken); story_like, story_comment: the actor liked or commented your story (until the like is taken back, the comment deleted or the story gone)"
        createdAt: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/Author" }
        post:
          description: The liked, commented or written post, or the repost; null for follows, suggested posts, appointments and messages in topics
          nullable: true
          type: object
          required: [id, createdAt, text]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            text: { type: string, description: "What the post says; empty when photos only" }
        comment:
          description: "The comment, for the notifications about one: what it says, 1000 characters at most. Also the message of a topic (topic_message, topic_mention, topic_message_like) and the comment under a photo (photo_comment, photo_mention); null for the others and for a message of photos only"
          nullable: true
          type: object
          required: [id, text]
          properties:
            id: { type: string, format: uuid }
            text: { type: string }
        topic:
          description: Only for topic_message, topic_mention and topic_message_like; absent otherwise
          type: object
          required: [id, title]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
        photo:
          description: Only for photo_like, photo_comment and photo_mention; absent otherwise
          allOf: [{ $ref: "#/components/schemas/Photo" }]

    NotificationPage:
      type: object
      required: [notifications, nextCursor, newestId]
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        nextCursor: { type: string, description: "Empty on the last page" }
        newestId:
          type: string
          description: "The newest notification of the page, shown or not; empty on an empty page"

    MessageKey:
      type: object
      required: [publicKey]
      properties:
        publicKey: { type: ["string", "null"], format: byte, description: "32 bytes of X25519; null for none" }

    Message:
      type: object
      required: [id, sealed, photos, createdAt, out, read, deletableUntil, forwardedCount, deleted]
      properties:
        id: { type: string, format: uuid }
        sealed:
          type: ["string", "null"]
          format: byte
          description: >-
            What it says, end-to-end encrypted; null when it says nothing.
            The bytes: version 1, the X25519 public keys of the sender and
            of the recipient (32 each), a 12-byte IV and AES-256-GCM's
            ciphertext with its tag, the first 77 bytes its additional
            data. The AES key is HKDF-SHA256 of the X25519 shared secret,
            with no salt and the info "freenet message v1" followed by the
            two public keys, the smaller first. The plaintext is the JSON
            `{"t": text, "f": [the texts of the messages it carries on, in
            the order of all of them], "r": the beginning of the message it
            answers}`, plain text with \\n line breaks; `r` only in an
            answer: the server cannot quote the words of a dialog.
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string, format: date-time }
        out: { type: boolean, description: "You sent it" }
        read: { type: boolean, description: "Its recipient has read it" }
        deletableUntil:
          type: string
          description: "Until when you may delete your message from both sides (date-time); empty for the peer's"
        editableUntil:
          type: string
          description: "Until when you may edit your message (date-time); empty for the peer's"
        editedAt:
          type: [string, "null"]
          format: date-time
          description: When its sender edited it; null if never
        post: { type: string, description: "A post shared in it; empty for none" }
        repost:
          description: The shared post, as inside a repost; absent in the list of dialogs and without one
          $ref: "#/components/schemas/SharedPost"
        albumPhoto: { type: string, description: "A photo of an album shared in it; empty for none" }
        sharedPhoto:
          description: The shared photo, as in a post that shares one; absent in the list of dialogs and without one
          $ref: "#/components/schemas/SharedPhoto"
        sticker: { type: string, description: "The sticker the message is, alone; empty for none" }
        documentCount: { type: integer, description: "How many documents it attached" }
        documents:
          type: array
          description: The documents it attaches that are still there; absent in the list of dialogs and without any
          items: { $ref: "#/components/schemas/Document" }
        forwardedCount: { type: integer, description: "How many messages it carries on from dialogs and chats" }
        forwarded:
          type: array
          description: The messages it carries on, oldest first, as a tree written parent first (depth), without those whose authors' pages are gone and what they carried on; absent in the list of dialogs and without any
          items: { $ref: "#/components/schemas/ForwardedMessage" }
        deleted:
          type: boolean
          description: "Its sender took it back from both sides: it says nothing (\"Сообщение удалено\") and can be neither edited nor taken back again, only deleted for yourself"
        replyTo:
          description: What it shows of the message it answers ("Ответить"); absent when it answers none
          $ref: "#/components/schemas/Reply"
        reactions:
          type: array
          description: The reactions to it, one per person, the oldest first; empty for a message taken back
          items: { $ref: "#/components/schemas/Reaction" }

    Reply:
      type: object
      description: >-
        The message an answer answers, in short. `author` is null, and the
        rest says nothing, when it is gone for good or the page of who
        wrote it is gone.
      required: [id, author, text, textCut, photoCount, forwardedCount, documentCount, sticker, post, albumPhoto, deleted]
      properties:
        id: { type: string, format: uuid, description: "Open the conversation around it with `?around=`" }
        author:
          oneOf: [{ $ref: "#/components/schemas/Author" }, { type: "null" }]
        text: { type: string, description: "The beginning of a chat's message, 200 characters; empty in a dialog, whose answer quotes the words sealed itself (`r`)" }
        textCut: { type: boolean }
        photoCount: { type: integer }
        forwardedCount: { type: integer }
        documentCount: { type: integer }
        sticker: { type: string }
        post: { type: boolean, description: It shares a post }
        albumPhoto: { type: boolean, description: It shares a photo of an album }
        deleted: { type: boolean, description: Its sender took it back }

    Reaction:
      type: object
      required: [userId, reaction]
      properties:
        userId: { type: string, format: uuid }
        reaction: { type: string, enum: [heart, like, laugh, wow, sad, fire] }

    ForwardedMessage:
      type: object
      description: A message carried on from a dialog or a chat, a copy of what its author wrote then; one that carried on others itself is followed by them, one level deeper, and may say nothing of its own
      required: [index, depth, author, text, photos, createdAt, post]
      properties:
        index: { type: integer, description: "Its place among all the messages carried on, those not shown too: in a dialog its text is the `f[index]` of the sealed message" }
        depth: { type: integer, description: "How deep it is carried: 0 for a message forwarded itself, 1 for one that message carried on, and so on" }
        author: { $ref: "#/components/schemas/Author" }
        text: { type: string, description: "Empty in a dialog: the text is sealed in the message" }
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string, format: date-time, description: "When it was written" }
        post: { type: string, description: "A post shared in it; empty for none" }
        repost: { $ref: "#/components/schemas/SharedPost" }
        albumPhoto: { type: string, description: "A photo of an album shared in it; empty for none" }
        sharedPhoto: { $ref: "#/components/schemas/SharedPhoto" }
        sticker: { type: string, description: "The sticker it is; empty for none" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/Document" }

    SharedPhoto:
      type: object
      description: A photo of an album shared in a post or a message; a deleted photo leaves only its ID
      required: [id, deleted, photo, albumId]
      properties:
        id: { type: string, format: uuid }
        deleted: { type: boolean }
        photo: { oneOf: [{ $ref: "#/components/schemas/Photo" }, { type: "null" }] }
        albumId: { type: string }
        nsfw: { type: boolean, description: The photo came from a post marked as adult }

    Dialog:
      type: object
      description: A dialog (`peer` and `lastMessage`) or a chat of several people (`chat`).
      required: [unread]
      properties:
        peer: { $ref: "#/components/schemas/Author" }
        lastMessage: { $ref: "#/components/schemas/Message" }
        chat: { $ref: "#/components/schemas/Chat" }
        unread: { type: boolean, description: "Someone wrote something you have not read" }

    Chat:
      type: object
      description: A chat of several people ("беседа") as you have it.
      required: [id, title, ownerId, createdAt, memberCount, state, unread, lastMessage]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 64, description: "May be empty: the chat has no name of its own" }
        ownerId: { type: string, format: uuid, description: "Who created it (\"создатель\"): only they remove people" }
        createdAt: { type: string, format: date-time }
        memberCount: { type: integer, description: How many people are in it now }
        state:
          type: string
          enum: [active, left, kicked]
          description: >-
            `left`: you left and may come back; `kicked`: the creator
            removed you. Either way the chat stays as it was at that moment.
        unread: { type: boolean }
        lastMessage:
          oneOf: [{ $ref: "#/components/schemas/ChatMessage" }, { type: "null" }]
          description: The last message you are shown; null when the page of who wrote it is gone
        members:
          type: array
          description: Who is in it, who joined first first; told by the chat itself, not by lists, and only to those in it
          items: { $ref: "#/components/schemas/Author" }
        photo:
          oneOf: [{ $ref: "#/components/schemas/Avatar" }, { type: "null" }]
          description: The photo of the chat; null for none
        pinned:
          description: >-
            The message pinned above the chat, whole; told by the chat
            itself, absent when nothing is pinned, its sender took it back
            or you went before it was written
          $ref: "#/components/schemas/ChatMessage"

    ChatMessage:
      type: object
      required: [id, chatId, author, out, text, photos, action, createdAt, editedAt, deleted, deletableUntil, editableUntil, unread, post, albumPhoto, forwardedCount]
      properties:
        id: { type: string, format: uuid }
        chatId: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        out: { type: boolean, description: Your own }
        text: { type: string, maxLength: 60000, description: "Of an action, the title it tells of" }
        textCut: { type: boolean, description: "`text`, or the text of a message it carries on, is only the beginning; GET /chat-messages/{id} has them whole" }
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        action:
          type: string
          enum: ["", create, title, invite, kick, leave, return, pin, unpin, photo, photo_remove]
          description: >-
            Not empty: the message tells what `author` did instead of
            saying something — created the chat, renamed it (`text`),
            added or removed `target`, left, came back, pinned a message or
            took it down, set the photo of the chat or removed it.
        target: { $ref: "#/components/schemas/Author" }
        createdAt: { type: string, format: date-time }
        editedAt: { type: [string, "null"], format: date-time }
        deleted: { type: boolean, description: "Its sender took it back: it says nothing (\"Сообщение удалено\")" }
        deletableUntil: { type: string, description: "Until when you may take your message back, a day; \"\" for others' and for actions" }
        editableUntil: { type: string, description: "Until when you may edit your message, a day" }
        unread: { type: boolean, description: "Someone else's, which you have not read" }
        post: { type: string, description: "A post shared in it; empty for none" }
        repost:
          description: The shared post, as inside a repost; absent in the list of dialogs and without one
          $ref: "#/components/schemas/SharedPost"
        albumPhoto: { type: string, description: "A photo of an album shared in it; empty for none" }
        sharedPhoto:
          description: The shared photo; absent in the list of dialogs and without one
          $ref: "#/components/schemas/SharedPhoto"
        sticker: { type: string, description: "The sticker the message is, alone; empty for none" }
        documentCount: { type: integer, description: "How many documents it attached" }
        documents:
          type: array
          description: The documents it attaches that are still there; absent in the list of dialogs and without any
          items: { $ref: "#/components/schemas/Document" }
        forwardedCount: { type: integer, description: "How many messages it carries on from dialogs and chats" }
        forwarded:
          type: array
          description: The messages it carries on, as in Message; absent in the list of dialogs and without any
          items: { $ref: "#/components/schemas/ForwardedMessage" }
        replyTo:
          description: What it shows of the message it answers ("Ответить"); absent when it answers none
          $ref: "#/components/schemas/Reply"
        reactions:
          type: array
          description: The reactions to it, one per person, the oldest first; empty for a message taken back
          items: { $ref: "#/components/schemas/Reaction" }

    ChatMessagePage:
      type: object
      required: [messages, nextCursor]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
        nextCursor: { type: string, description: "Older messages remain; empty when there are none, and always with `after`" }

    DialogPage:
      type: object
      required: [dialogs, nextCursor]
      properties:
        dialogs:
          type: array
          items: { $ref: "#/components/schemas/Dialog" }
        nextCursor: { type: string, description: "Empty on the last page" }

    MessagePage:
      type: object
      required: [peer, messages, nextCursor, peerReadUpTo, canWrite]
      properties:
        peer: { $ref: "#/components/schemas/Author" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        nextCursor: { type: string, description: "Older messages remain; empty when none, always with after" }
        peerReadUpTo:
          type: string
          description: "The newest of your messages the peer has read, to update shown ones; empty if none"
        canWrite:
          type: boolean
          description: "You may write to the peer; told on the first page, false on older pages and with after"
        primeOnly: { type: boolean, description: "The peer lets in only people with Freenet Prime, which you have not; told with canWrite" }
        messagePrice: { type: integer, description: "What a message to the peer costs, in votes, 0 for free; told with canWrite. Nothing for answering one who wrote to you first" }

    Relation:
      type: object
      required: [blockedByMe, blockedMe]
      properties:
        blockedByMe: { type: boolean, description: "You blacklisted the user; false without a token" }
        blockedMe: { type: boolean, description: "The user blacklisted you; false without a token" }

    FollowStats:
      type: object
      required: [followersCount, followingCount, isFollowing]
      properties:
        followersCount: { type: integer }
        followingCount: { type: integer }
        isFollowing: { type: boolean, description: "You follow the user; false without a token" }

    UserPage:
      type: object
      required: [users, nextCursor, total]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/PublicProfile" }
        nextCursor: { type: string, description: "Empty on the last page" }
        total: { type: integer }

    ArchivedWall:
      type: object
      required: [changed]
      properties:
        changed: { type: integer, description: "How many posts went to the archive or came back" }

    PostPage:
      type: object
      required: [posts, nextCursor, total]
      properties:
        posts:
          type: array
          items: { $ref: "#/components/schemas/Post" }
        nextCursor: { type: string, description: "Empty on the last page" }
        total: { type: integer, description: "All posts on the wall" }
        canPost:
          type: boolean
          description: "On a wall's first page: you may write on it; false without a token and in the news feed"
        canSuggest:
          type: boolean
          description: "On a community's wall, as canPost: you may suggest a post for it instead"
        years:
          type: array
          items: { type: integer }
          description: "On the first page of the archive (`type=archive`): the years (UTC) the posts of the wall were written in, archived or not, the latest first"

    NewPostponed:
      type: object
      required: [publishAt]
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 60000 }
        photos:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }
          description: IDs from POST /api/v1/me/photos
        nsfw: { type: boolean }
        signed: { type: boolean, description: "For a community: name you under the post (\"Подпись автора\")" }
        publishAt: { type: string, format: date-time, description: "Ahead of now, within a year" }

    Postponed:
      type: object
      required: [id, author, text, photos, publishAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        text: { type: string }
        textCut:
          type: boolean
          description: "`text` is only its beginning (1000 characters), as the list carries it; GET /api/v1/postponed/{id} tells it whole"
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        nsfw: { type: boolean }
        fromClub: { type: boolean, description: "It will speak for the community" }
        signed: { type: boolean }
        publishAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    PostponedPosts:
      type: object
      required: [postponed]
      properties:
        postponed:
          type: array
          items: { $ref: "#/components/schemas/Postponed" }

    Suggestion:
      type: object
      required: [id, author, text, photos, createdAt]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        text: { type: string }
        textCut:
          type: boolean
          description: "`text` is only its beginning (1000 characters): lists carry no more. GET /api/v1/suggestions/{id}/text tells it whole. Absent when the text is whole"
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
        createdAt: { type: string, format: date-time }

    PrimePrices:
      type: object
      additionalProperties: false
      required: [month, quarter, year]
      properties:
        month: { type: integer, format: int64, minimum: 1 }
        quarter: { type: integer, format: int64, minimum: 1 }
        year: { type: integer, format: int64, minimum: 1 }

    PrimeOrder:
      type: object
      additionalProperties: false
      required: [period]
      properties:
        period: { type: string, enum: [month, quarter, year] }

    PrimePurchase:
      type: object
      required: [until, balance]
      properties:
        until: { type: string, format: date-time, description: Until when the recipient has Freenet Prime now }
        balance: { type: integer, format: int64, description: The votes you have left }

    PrimeStyle:
      type: object
      description: How a member of Freenet Prime dresses their page, as pages of the 2000s were
      required: [name, frame, background, mood]
      properties:
        name:
          type: string
          enum: [amethyst, ruby, emerald, sapphire, gold, rainbow]
          description: The colour of the name
        frame:
          type: string
          enum: [amethyst, gold, silver, glitter, hearts, stars]
          description: The frame of the photo
        background:
          type: string
          enum: ["", stars, hearts, checks, clouds, flowers, sparkles]
          description: The pattern behind the page, "" for none
        mood:
          type: string
          enum: ["", happy, love, cool, wink, sad, angry, sleepy]
          description: The smiley by the status ("настроение"), "" for none

    PublicProfile:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          required: [id, avatar, deactivated]
          properties:
            id: { type: string, format: uuid }
            avatar: { $ref: "#/components/schemas/Avatar" }
            deactivated:
              type: boolean
              description: "The owner deleted the page: only the names and the photo are left"
            pageHidden:
              type: boolean
              description: "The owner hid the page from you (`pageRead`, or a closed profile whose owner does not follow you): only the names and the photo are left"
            closed:
              type: boolean
              description: "A closed profile (\"Закрытая страница\")"
            verified:
              type: boolean
              description: "The administrators confirmed the page (\"Подтверждённая страница\"): a checkmark by the name, told on a hidden page too and never on a deleted one"
            prime:
              type: boolean
              description: "The person has Freenet Prime: its badge by the name, a golden frame of the photo and a golden name"
            primeStyle:
              description: "How the page is dressed with Freenet Prime: only on the page itself (not in lists), while Prime lasts; null otherwise"
              oneOf:
                - { $ref: "#/components/schemas/PrimeStyle" }
                - { type: "null" }
            alert:
              type: string
              description: "The label the administrators put on the page: openvk's orange \"user-alert\" above the name, \"\" for none; told on a hidden page too and never on a deleted one, and in lists too"
            ban:
              description: "The administrators blocked the page: only the names and the photo are left besides; null otherwise"
              oneOf:
                - { $ref: "#/components/schemas/Ban" }
                - { type: "null" }
            infoHidden:
              type: boolean
              description: "The owner hid the information of the page from you (`infoRead`): only the names, the photo, the status and the pronouns are left"
            lastSeenAt:
              description: "When the user last visited the site (\"был в сети\"); null if never, when hidden (`onlineRead`) and in lists"
              oneOf:
                - { type: string, format: date-time }
                - { type: "null" }
            online:
              type: boolean
              description: "The user is on the site now (\"Онлайн\"). A list tells it too, but only of a page open to everyone (`pageRead`), as it does not know who looks"
            backdrop: { $ref: "#/components/schemas/Backdrop" }
            completeness:
              type: integer
              description: '"Заполненность страницы" in percent; only on the page itself, absent on a deleted or hidden one'

    Access:
      type: object
      description: Which blocks of a page you may see, as its owner's privacy allows
      required: [photos, friends, clubs, gifts]
      properties:
        photos: { type: boolean, description: "The albums (`photosRead`)" }
        friends: { type: boolean, description: "The follows, either way (`friendsRead`)" }
        clubs: { type: boolean, description: "The communities (`clubsRead`)" }
        gifts: { type: boolean, description: "The gifts (`giftsRead`)" }

    Gift:
      type: object
      description: 'A gift sent to a page ("Подарки"), as you see it'
      required: [id, gift, caption, anonymous, sentAt, sender]
      properties:
        id: { type: string, format: uuid }
        gift: { type: string, description: "Its name in the catalogue, as `rose`" }
        caption: { type: string, description: "What the sender said with it; empty for none and when you are not told (an anonymous gift)" }
        anonymous: { type: boolean, description: "Sent anonymously; told to those who are told the sender" }
        sentAt: { type: string, format: date-time }
        sender:
          oneOf:
            - $ref: "#/components/schemas/Author"
            - type: "null"
          description: "Who sent it; null when you are not told (an anonymous gift) and when the page of the sender is deleted"
        number: { type: integer, description: "The number of a collectible among those of its kind; absent for a plain gift" }
        model: { type: string, description: The model of a collectible }
        backdrop: { type: string, description: The backdrop of a collectible }
        symbol: { type: string, description: The symbol of its pattern }
        salePrice: { type: integer, format: int64, description: Its price on the market; absent when not on sale }
        auctioned: { type: boolean, description: It is at an auction }

    GiftTrait:
      type: object
      required: [name, weight]
      properties:
        name: { type: string }
        weight: { type: integer, description: Its chance, in tenths of a percent }

    Balance:
      type: object
      required: [balance]
      properties:
        balance: { type: integer, format: int64, description: Your votes after }

    CollectiblePage:
      type: object
      required: [collectibles, nextCursor]
      properties:
        collectibles: { type: array, items: { $ref: "#/components/schemas/Collectible" } }
        nextCursor: { type: string, description: Empty on the last page }

    Collectible:
      type: object
      required: [gift, owner, site, mine, auction, history]
      properties:
        gift: { $ref: "#/components/schemas/Gift" }
        owner:
          oneOf:
            - $ref: "#/components/schemas/Author"
            - type: "null"
        site: { type: boolean, description: The site holds it (an edition at its auction) }
        mine: { type: boolean, description: It is yours }
        auction:
          oneOf:
            - $ref: "#/components/schemas/GiftAuction"
            - type: "null"
        history:
          type: array
          description: Newest first; only with one gift
          items:
            type: object
            required: [kind, at, price, from, to]
            properties:
              kind: { type: string, enum: [upgrade, mint, transfer, sale, auction] }
              at: { type: string, format: date-time }
              price: { type: integer, format: int64 }
              from: { oneOf: [{ $ref: "#/components/schemas/Author" }, { type: "null" }], description: null — the site or a page that is gone }
              to: { oneOf: [{ $ref: "#/components/schemas/Author" }, { type: "null" }] }

    GiftAuction:
      type: object
      required: [start, topBid, minBid, bids, endsAt, site, seller, bidder, mine]
      properties:
        start: { type: integer, format: int64 }
        topBid: { type: integer, format: int64, description: 0 — no bids }
        minBid: { type: integer, format: int64, description: The least the next bid may be }
        bids: { type: integer }
        endsAt: { type: string, format: date-time }
        site: { type: boolean, description: The site sells it }
        seller: { oneOf: [{ $ref: "#/components/schemas/Author" }, { type: "null" }] }
        bidder: { oneOf: [{ $ref: "#/components/schemas/Author" }, { type: "null" }], description: The top bidder }
        mine: { type: boolean, description: You are the top bidder }

    VoteRate:
      type: object
      required: [kopecks]
      properties:
        kopecks: { type: integer, format: int64, minimum: 1, description: What one vote is worth, in kopecks }

    Treasury:
      type: object
      required: [votes, outstanding, bonus, held, transferFee, stickerTax, primeStickerTax]
      properties:
        votes: { type: integer, format: int64, description: What the treasury has taken more than paid; below zero when it has paid more }
        outstanding: { type: integer, format: int64, description: What the vouchers promise }
        bonus: { type: integer, format: int64, description: The daily bonus }
        held: { type: integer, format: int64, description: The votes on the accounts of the pages }
        transferFee: { type: integer, description: The fee of a transfer of votes, in percent; none with Prime }
        stickerTax: { type: integer, description: The tax the author of a sticker pack pays on its sale, in percent }
        primeStickerTax: { type: integer, description: The same tax for an author with Prime }

    Economy:
      type: object
      required: [bonus, transferFee, stickerTax, primeStickerTax]
      properties:
        bonus: { type: integer, format: int64, minimum: 1, description: The daily bonus }
        transferFee: { type: integer, minimum: 0, maximum: 100 }
        stickerTax: { type: integer, minimum: 0, maximum: 100 }
        primeStickerTax: { type: integer, minimum: 0, maximum: 100 }

    Bonus:
      type: object
      required: [votes, taken, eligible]
      properties:
        votes: { type: integer, format: int64, description: What the bonus gives now }
        taken: { type: boolean, description: The caller took it today }
        eligible: { type: boolean, description: The caller may take it }

    Decor:
      type: object
      required: [mode, festive]
      properties:
        mode: { type: string, enum: [auto, "on", "off"], description: 'What the administrators set; `auto` follows the calendar' }
        festive: { type: boolean, description: Whether the site wears the decoration now }

    Casino:
      type: object
      required: [price, prizes, bets, rocket, jackpot]
      properties:
        price: { type: integer, format: int64, description: What a spin costs, in votes }
        jackpot: { type: integer, format: int64, description: The win the site celebrates over the whole screen }
        prizes:
          type: array
          description: The votes of each prize, in order; 0 is nothing
          items: { type: integer, format: int64 }
        bets: { $ref: "#/components/schemas/CasinoBets" }
        rocket: { $ref: "#/components/schemas/CasinoRocket" }

    CasinoRocket:
      type: object
      description: '"Ракетка": the limits of a bet, the top multiplier and, for the administrators, the return'
      required: [least, most, top]
      properties:
        least: { type: integer, format: int64, minimum: 1 }
        most: { type: integer, format: int64 }
        return: { type: integer, minimum: 1, maximum: 10000, description: 'What the rocket gives back on average, in hundredths of a percent: 9500 — 95%. Only for the administrators' }
        top: { type: integer, minimum: 200, maximum: 1000000, description: 'The top multiplier, in hundredths: 100000 — ×1000' }

    OreVein:
      type: object
      properties:
        ore: { type: string, enum: [stone, coal, iron, gold, diamond, crystal] }
        experience: { type: integer, format: int64, description: The experience the ore opens with }
        least: { type: integer, format: int64, description: The fewest units a dig gives }
        most: { type: integer, format: int64, description: The most units a dig gives }
        price: { type: integer, format: int64, description: Hundredths of a vote a unit sells for }
        gain: { type: integer, format: int64, description: The experience a dig gives }
        energy: { type: integer, description: The energy a dig takes }
    BankSettings:
      type: object
      properties:
        depositRate: { type: integer, description: Hundredths of a percent a day }
        depositMost: { type: integer, format: int64, description: The most a deposit grows to, in votes }
        loanRate: { type: integer }
        loanMost: { type: integer, format: int64 }
        loanDays: { type: integer }
        penaltyRate: { type: integer, description: The rate of a loan past its term }
    Bank:
      type: object
      properties:
        settings: { $ref: "#/components/schemas/BankSettings" }
        account:
          type: object
          properties:
            deposit: { type: integer, format: int64, description: Hundredths of a vote }
            debt: { type: integer, format: int64, description: Hundredths of a vote }
            borrowed: { type: integer, format: int64 }
            dueAt: { type: string, format: date-time, nullable: true }
            overdue: { type: boolean }
    FirmSettings:
      type: object
      properties:
        plans:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [farm, mine, oilrig, forestry, mill, steelworks, chemworks, sawmill, bakery, joinery, electroplant, shop] }
              price: { type: integer, format: int64, description: The votes it costs to found }
              upgrade: { type: integer, format: int64, description: The votes of the next level, times the level, from its cash }
              levels: { type: integer }
              staff: { type: integer, description: The workers a level seats }
              upkeep: { type: integer, format: int64, description: Hundredths of a vote a level costs an hour }
        goods:
          type: array
          items:
            type: object
            properties:
              good: { type: string, enum: [grain, ore, oil, wood, flour, metal, plastic, boards, bread, furniture, electronics] }
              base: { type: integer, format: int64, description: The base price in hundredths a unit }
              norm: { type: integer, format: int64, description: The units a day that halve what the state and the city pay }
        wage: { type: integer, format: int64, description: The standard wage, hundredths an hour }
        fee: { type: integer, description: The percent of a sale on the exchange and of shares }
        floor: { type: integer, description: What the state pays, percent of the base }
        ceiling: { type: integer, description: What the state asks, percent of the base }
        retail: { type: integer, description: What the city pays the shops, percent of the base }
        storage: { type: integer, description: The hours of full work the storage holds }
        capital: { type: integer, description: The percent of its price a new enterprise has in cash }
    Firm:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: string }
        director: { allOf: [{ $ref: "#/components/schemas/PublicProfile" }], nullable: true }
        foundedAt: { type: string, format: date-time }
        level: { type: integer }
        workers: { type: integer }
        wage: { type: integer, format: int64 }
        cash: { type: integer, format: int64, description: Hundredths of a vote }
        escrow: { type: integer, format: int64, description: Hundredths its buying orders keep }
        productivity: { type: number, description: What a worker paid the wage makes against the standard }
        seats: { type: integer }
        upgradeCost: { type: integer, format: int64, description: Votes; 0 at the top level }
        upkeep: { type: integer, format: int64, description: Hundredths an hour }
        profit: { type: integer, format: int64, description: Hundredths earned in the last 24 hours }
        shares: { type: integer, format: int64 }
        sharePrice: { type: integer, format: int64, description: Votes a share last went for; 0 before any deal }
        worth: { type: integer, format: int64, description: Hundredths it is worth closed }
        stock:
          type: array
          items:
            type: object
            properties:
              good: { type: string }
              units: { type: integer, format: int64 }
              capacity: { type: integer, format: int64 }
              incoming: { type: integer, format: int64 }
              autoBuy: { type: boolean }
              buyMax: { type: integer, format: int64 }
              autoSell: { type: boolean }
              sellMin: { type: integer, format: int64 }
        hours:
          type: array
          items:
            type: object
            properties:
              hour: { type: string, format: date-time }
              made: { type: integer, format: int64 }
              bought: { type: integer, format: int64 }
              sold: { type: integer, format: int64 }
              income: { type: integer, format: int64 }
              purchases: { type: integer, format: int64 }
              wages: { type: integer, format: int64 }
              upkeep: { type: integer, format: int64 }
              fees: { type: integer, format: int64 }
        holders:
          type: array
          items:
            type: object
            properties:
              user: { $ref: "#/components/schemas/PublicProfile" }
              shares: { type: integer, format: int64 }
    Firms:
      type: object
      properties:
        settings: { $ref: "#/components/schemas/FirmSettings" }
        catalog:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              tier: { type: integer }
              output: { type: string, description: Empty for a shop }
              inputs:
                type: array
                items:
                  type: object
                  properties:
                    good: { type: string }
                    units: { type: integer, format: int64 }
              sells: { type: array, items: { type: string } }
              rate: { type: object, additionalProperties: { type: number }, description: Units of a good a worker makes or sells an hour }
        quotes:
          type: array
          items:
            type: object
            description: Hundredths a unit; 0 — no such order
            properties:
              good: { type: string }
              stateBid: { type: integer, format: int64 }
              stateAsk: { type: integer, format: int64 }
              cityPrice: { type: integer, format: int64 }
              bestBid: { type: integer, format: int64 }
              bestAsk: { type: integer, format: int64 }
              last: { type: integer, format: int64 }
              volume: { type: integer, format: int64, description: Units traded on the exchange in a day }
        firms: { type: array, items: { $ref: "#/components/schemas/Firm" } }
        orders:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              firmId: { type: string }
              good: { type: string }
              buy: { type: boolean }
              price: { type: integer, format: int64 }
              units: { type: integer, format: int64 }
              placedAt: { type: string, format: date-time }
        offers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              firmId: { type: string }
              seller: { allOf: [{ $ref: "#/components/schemas/PublicProfile" }], nullable: true, description: None — new shares of the enterprise }
              shares: { type: integer, format: int64 }
              price: { type: integer, format: int64, description: Votes a share }
              placedAt: { type: string, format: date-time }
        nextHour: { type: string, format: date-time }
    FirmDone:
      type: object
      properties:
        spent: { type: integer, format: int64 }
        got: { type: integer, format: int64 }
        balance: { type: integer, format: int64, description: The balance after the votes moved; 0 when none did }
        firm: { type: string, description: The enterprise founded }
        deals:
          type: array
          items:
            type: object
            properties:
              good: { type: string }
              units: { type: integer, format: int64 }
              price: { type: integer, format: int64 }
        firms: { $ref: "#/components/schemas/Firms" }
    MineSettings:
      type: object
      properties:
        veins: { type: array, items: { $ref: "#/components/schemas/OreVein" } }
        energy: { type: integer, description: The most energy a miner holds }
        regenSeconds: { type: integer, description: The seconds a point of energy takes to come back }
        events:
          type: object
          description: The chances of the events of a dig, in hundredths of a percent
          properties:
            nugget: { type: integer }
            nuggetTimes: { type: integer, description: How many times the ore a nugget gives }
            chest: { type: integer }
            chestLeast: { type: integer, format: int64 }
            chestMost: { type: integer, format: int64 }
            collapse: { type: integer }
            drink: { type: integer }
            drinkEnergy: { type: integer, description: The energy a drink gives back }
    PetShop:
      type: object
      description: What pets cost — the price of each kind, a meal; the votes a won fight brings and the fights of a day.
      properties:
        prices:
          type: object
          additionalProperties: { type: integer, format: int64 }
        meal: { type: integer, format: int64 }
        win: { type: integer, format: int64 }
        fights: { type: integer }
    Title:
      type: object
      description: An award the administrators gave a page.
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: string, enum: [crown, cup, star, laurel, shield, flame, diamond, lightning] }
        grantedAt: { type: string, format: date-time }
    Pet:
      type: object
      description: 'A pet as it is now: satiety and joy from 0 to 100 (they fall by themselves), the level with the experience of it and of the next (0 at the last), how it fights.'
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [cat, dog, hamster, dragon] }
        name: { type: string }
        bornAt: { type: string, format: date-time }
        satiety: { type: integer }
        joy: { type: integer }
        playAt: { type: string, format: date-time, nullable: true, description: When it may play again, null — now }
        experience: { type: integer, format: int64 }
        level: { type: integer }
        levelExperience: { type: integer, format: int64 }
        nextLevelExperience: { type: integer, format: int64 }
        rating: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        fights: { type: integer, description: The fights of today }
        attack: { type: integer }
        defense: { type: integer }
        health: { type: integer }
        speed: { type: integer, description: The chance in a hundred to dodge }
        crit: { type: integer, description: The chance in a hundred to hit twice as hard }
    PetCare:
      type: object
      properties:
        pet: { $ref: "#/components/schemas/Pet" }
        balance: { type: integer, format: int64, description: Your votes after a payment, 0 when nothing was paid }
    PetFighter:
      type: object
      properties:
        user: { allOf: [{ $ref: "#/components/schemas/Author" }], nullable: true }
        kind: { type: string }
        name: { type: string }
        level: { type: integer }
        health: { type: integer }
    PetFight:
      type: object
      description: 'A fight: the hits in turn and whether the attacker won, with the rating it won (above zero) or lost.'
      properties:
        id: { type: string }
        foughtAt: { type: string, format: date-time }
        attacker: { $ref: "#/components/schemas/PetFighter" }
        defender: { $ref: "#/components/schemas/PetFighter" }
        hits:
          type: array
          items:
            type: object
            properties:
              byAttacker: { type: boolean }
              dodged: { type: boolean }
              crit: { type: boolean }
              damage: { type: integer }
              attackerHealth: { type: integer }
              defenderHealth: { type: integer }
        won: { type: boolean }
        rating: { type: integer }
    MineState:
      type: object
      properties:
        settings: { $ref: "#/components/schemas/MineSettings" }
        miner:
          type: object
          properties:
            energy: { type: integer }
            nextEnergySeconds: { type: integer }
            experience: { type: integer, format: int64 }
            backpack: { type: object, additionalProperties: { type: integer, format: int64 }, description: The units of each ore }
            digs: { type: integer, format: int64 }
            earned: { type: integer, format: int64, description: The votes the ore sold for }
    Poker:
      type: object
      required: [least, most, pays]
      properties:
        least: { type: integer, format: int64 }
        most: { type: integer, format: int64 }
        pays:
          type: array
          items: { type: integer }
          minItems: 6
          maxItems: 6

    HoldemSeat:
      type: object
      description: A seat; `player` is null on a free one. `cards` are yours and those shown at the showdown, `hand` and `best` — the best hand of them.
      required: [player, stack, bet, cards, hasCards, folded, allIn, away, leaving, last, won, hand, best]
      properties:
        player:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Author" }]
        stack: { type: integer, format: int64 }
        bet: { type: integer, format: int64 }
        cards: { type: array, items: { type: string } }
        hasCards: { type: boolean }
        folded: { type: boolean }
        allIn: { type: boolean }
        away: { type: boolean }
        leaving: { type: boolean }
        last: { type: string, enum: ["", fold, check, call, raise, allin, small_blind, big_blind] }
        won: { type: integer, format: int64 }
        hand: { type: string }
        best: { type: array, items: { type: string } }
    HoldemTable:
      type: object
      description: 'A poker table as the viewer sees it. `you` — your seat, -1 for none; `turn` — the seat to act, -1 for none; `turnMs` — till the turn passes or the next hand. `toCall`, `raiseLeast` and `raiseMost` are yours (0 — no raise).'
      required: [id, name, private, owner, bigBlind, smallBlind, minBuyIn, maxBuyIn, street, hand, button, turn, turnMs, board, pot, currentBet, version, seats, players, you, toCall, raiseLeast, raiseMost, invited]
      properties:
        id: { type: string }
        name: { type: string }
        private: { type: boolean }
        owner:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Author" }]
        bigBlind: { type: integer, format: int64 }
        smallBlind: { type: integer, format: int64 }
        minBuyIn: { type: integer, format: int64 }
        maxBuyIn: { type: integer, format: int64 }
        street: { type: string, enum: [waiting, preflop, flop, turn, river, showdown] }
        hand: { type: integer, format: int64 }
        button: { type: integer }
        turn: { type: integer }
        turnMs: { type: integer, format: int64 }
        board: { type: array, items: { type: string } }
        pot: { type: integer, format: int64 }
        currentBet: { type: integer, format: int64 }
        version: { type: integer, format: int64 }
        seats: { type: array, items: { $ref: "#/components/schemas/HoldemSeat" } }
        players: { type: integer }
        you: { type: integer }
        toCall: { type: integer, format: int64 }
        raiseLeast: { type: integer, format: int64 }
        raiseMost: { type: integer, format: int64 }
        invited: { type: boolean }
    PokerHand:
      type: object
      required: [id, ante, state, player, board, dealer, payout, playerHand, dealerHand, playerBest, dealerBest, balance]
      properties:
        id: { type: string }
        ante: { type: integer, format: int64 }
        state: { type: string, enum: [dealt, folded, won, lost, tied, unqualified] }
        player:
          type: array
          description: 'Cards: the rank of 23456789TJQKA and the suit of shdc, "As", "Td".'
          items: { type: string }
        board:
          type: array
          description: The flop until the call, all five after.
          items: { type: string }
        dealer:
          type: array
          description: Empty until the call.
          items: { type: string }
        payout: { type: integer, format: int64, description: 'What the hand paid back, the bets included.' }
        playerHand: { type: string, enum: [high_card, pair, two_pair, three, straight, flush, full_house, four, straight_flush, royal_flush] }
        dealerHand: { type: string, description: 'As playerHand; empty until the call.' }
        playerBest: { type: array, items: { type: string } }
        dealerBest: { type: array, items: { type: string } }
        balance: { type: integer, format: int64, description: 'The balance after the deal, the call or the fold; 0 in the table.' }

    RocketRound:
      type: object
      required: [id, amount, auto, state, cashed, payout, crash, elapsedMs, balance]
      properties:
        id: { type: string }
        amount: { type: integer, format: int64 }
        auto: { type: integer, description: 'The multiplier it cashes at by itself, in hundredths; 0 — by hand' }
        state: { type: string, enum: [flying, cashed, crashed] }
        cashed: { type: integer, description: 'The multiplier it was cashed at, in hundredths; 0 — it was not' }
        payout: { type: integer, format: int64, description: The votes it paid }
        crash: { type: integer, description: 'Where it explodes, in hundredths, once it is over; 0 while it flies' }
        elapsedMs: { type: integer, format: int64, description: How long it has flown, by the clock of the server }
        balance: { type: integer, format: int64, description: Your votes after the launch or the cash; 0 when only read }

    CasinoBets:
      type: object
      description: 'The bets of the casino: from least to most votes on one of the multipliers, each winning with its chance'
      required: [least, most, multipliers]
      properties:
        least: { type: integer, format: int64 }
        most: { type: integer, format: int64 }
        multipliers:
          type: array
          description: Smallest first
          items: { $ref: "#/components/schemas/AimMultiplier" }

    AimMultiplier:
      type: object
      required: [multiplier, chance]
      properties:
        multiplier: { type: integer, minimum: 101, maximum: 100000, description: 'What a bet multiplies into, in hundredths: 150 — ×1.5' }
        chance: { type: integer, minimum: 1, maximum: 9999, description: 'The chance it wins, of 10000: 4750 — 47.5%' }

    CasinoPrize:
      type: object
      required: [votes, weight]
      properties:
        votes: { type: integer, format: int64, minimum: 0 }
        weight: { type: integer, minimum: 0, maximum: 1000000000, description: How likely the prize is among the weights of all prizes }

    VoteOperation:
      type: object
      description: A line of the statement of votes
      required: [id, kind, amount, balance, peer, note, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [transfer, voucher, gift, stickers, casino, aim, stake, rocket] }
        amount: { type: integer, format: int64, description: What came in (above zero) or went out (below) }
        balance: { type: integer, format: int64, description: The votes after it }
        peer:
          description: The other person of a transfer, a gift or a sticker pack; null for none or a page that is gone
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Author" }]
        note:
          type: string
          description: |
            The message of a transfer, the gift (`rose`), the sticker pack (its
            ID for a pack of the site, its name for one of a person) or the
            question of an event.
        createdAt: { type: string, format: date-time }
    Voucher:
      type: object
      description: 'A voucher ("Ваучер"), as the administrators see it'
      required: [id, code, votes, rating, usagesLeft, activations]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: "The serial number: 24 capital letters and digits" }
        votes: { type: integer, description: The votes it gives }
        rating: { type: integer, description: The percent of rating it gives }
        usagesLeft: { type: integer, description: "How many more accounts may use it; -1 for any number, 0 when it has run out" }
        activations: { type: integer, description: How many accounts have used it }

    Ad:
      type: object
      description: An ad of the global feed, a promoted post
      required: [id, url, title, text, site, photo, active]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, description: Where it leads, http or https }
        title: { type: string }
        text: { type: string }
        site: { type: string, description: 'The host of the link, without "www."' }
        photo: { oneOf: [{ $ref: "#/components/schemas/Photo" }, { type: "null" }], description: The cover }
        active: { type: boolean, description: Shown in the feed }
        stats:
          type: object
          description: How the ad does; only with ?all=true, for the administrators
          required: [views, viewers, clicks, clickers]
          properties:
            views: { type: integer, description: How often it was seen in the feed }
            viewers: { type: integer, description: By how many people }
            clicks: { type: integer, description: How often its link was followed }
            clickers: { type: integer, description: By how many people }

    Backdrop:
      description: '"Фон страницы": the photos on the left and on the right of a page, of a person or a community; null for none'
      oneOf:
        - type: object
          required: [left, right]
          properties:
            left: { oneOf: [{ $ref: "#/components/schemas/Photo" }, { type: "null" }] }
            right: { oneOf: [{ $ref: "#/components/schemas/Photo" }, { type: "null" }] }
        - type: "null"

    PhotoComment:
      type: object
      required: [id, author, text, createdAt, mine, replyTo, likes, liked]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/Author" }
        text: { type: string, description: "Plain text with \\n line breaks; never HTML" }
        textCut:
          type: boolean
          description: "`text` is only its beginning (1000 characters): lists carry no more. GET /api/v1/photo-comments/{id}/text tells it whole. Absent when the text is whole"
        createdAt: { type: string, format: date-time }
        mine: { type: boolean, description: You wrote it }
        replyTo:
          type: [string, "null"]
          format: uuid
          description: The comment under the same photo it answers; null for none or when that comment is deleted
        likes: { type: integer }
        liked: { type: boolean, description: "You like it; false without a token" }
