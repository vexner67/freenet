            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/album-photos/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: The comments under a photo, oldest first
      description: Text only. Those of deleted pages are left out, still counted. With a token each tells whether you like it.
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of comments
