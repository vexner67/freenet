    delete:
      summary: Delete an album with its photos ("удалить альбом")
      description: As renaming it.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Neither its owner nor an admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "The site keeps the album (`kind` \"avatars\"): `this album is kept by the site`"
          content:
