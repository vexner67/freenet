              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/me/albums:
    post:
      summary: Create an album of your own ("Создать альбом")
      description: Your profile must be filled in first.
      security: [{ bearer: [] }]
      requestBody: { $ref: "#/components/requestBodies/Album" }
      responses:
        "201":
          description: The album
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
