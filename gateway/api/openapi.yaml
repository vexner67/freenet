    put:
      summary: Like a photo of an album, as a post
      description: Idempotent. The photo must be one you may see.
      security: [{ bearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Like" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
