      requestBody: { $ref: "#/components/requestBodies/Album" }
      responses:
        "201":
          description: The album
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
