      security: [{ bearer: [] }]
      parameters:
        - { name: nickname, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, icon]
              properties:
                name: { type: string, maxLength: 40 }
                icon: { type: string, enum: [crown, cup, star, laurel, shield, flame, diamond, lightning] }
      responses:
        "201":
          description: The title given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Title" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/titles/{id}:
    delete:
      summary: Take a title away
      description: Only for the administrators of the site.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Taken away }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/pet/settings:
    get:
      summary: The pets for the administrators
      description: 'Only for the administrators of the site: the shop and how the pets do — pets, fights, votes spent on them and won by them.'
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  shop: { $ref: "#/components/schemas/PetShop" }
                  pets: { type: integer, format: int64 }
                  fights: { type: integer, format: int64 }
                  spent: { type: integer, format: int64 }
                  won: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
    put:
      summary: Set the pet shop
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PetShop" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }

  /api/v1/bets:
    get:
      summary: The events to stake on
      description: 'Public: "Ставки" of the casino. The administrators ask a question with outcomes and the odds of each, people stake votes on them, and once it is resolved a stake on the winner pays its votes times the odds it was made at (rounded down), the rest nothing; a cancelled event gives everyone their stakes back. Events made before the odds (`odds` 0) share all the stakes among those who guessed by their stakes, and give them back when nobody guessed. At most 100 events: those not over first, then the newest; `section=popular` — only those taking stakes, the most staked on first. With a token, each outcome tells your stake (`mine`) and what it pays if the outcome wins (`potential`), and an event over what it paid you (`payout`).'
      security: [{}, { bearer: [] }]
      parameters:
        - name: section
          in: query
          schema: { type: string, enum: [popular] }
      responses:
        "200":
          description: The events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/BetEvent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      summary: Ask a new question
      description: 'Only for the administrators: a question in one line up to 200 characters with 2–10 different outcomes up to 64 characters, the odds of each, and the time the stakes close by themselves — within a year, or none for when the administrators close them.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, outcomes, odds]
              properties:
                question: { type: string }
                outcomes: { type: array, items: { type: string } }
                odds:
                  type: array
                  description: 'The odds of each outcome, in hundredths: 250 — ×2.5'
                  items: { type: integer, minimum: 101, maximum: 100000 }
                closesAt: { type: string, format: date-time, description: RFC 3339; empty or left out for none }
      responses:
        "201":
          description: The event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetEvent" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }

  /api/v1/bets/{id}/stakes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Stake votes on an outcome
      description: 'Takes your votes (1–100000000) and puts them on the outcome, added to what you staked on it before; you may stake on several outcomes. 409 when the event takes no stakes or your votes are short. Rate limited, with the casino''s limit counted apart.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, amount]
              properties:
                outcome: { type: integer, description: The index of the outcome }
                amount: { type: integer, format: int64 }
      responses:
        "200":
          description: Staked
          content:
            application/json:
              schema:
                type: object
                required: [balance]
                properties:
                  balance: { type: integer, format: int64, description: Your votes after the stake }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/bets/{id}/close:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Close the stakes of an event
      description: Only for the administrators; 409 for an event that is over.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Closed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/bets/{id}/resolve:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Name the winning outcome
      description: Only for the administrators. Pays the stakes at once, in one transaction; 409 for an event that is over.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [winner]
              properties:
                winner: { type: integer, description: The index of the winning outcome }
      responses:
        "204": { description: Resolved and paid }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/bets/{id}/odds:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Change the odds of an event
      description: Only for the administrators. The new odds of each outcome are for the stakes made from now on — those made keep theirs; 409 for an event that is over or has no odds.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [odds]
              properties:
                odds: { type: array, items: { type: integer, minimum: 101, maximum: 100000 } }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/bets/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Call an event off
      description: Only for the administrators. Gives everyone their stakes back; 409 for an event that is over.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Cancelled }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/bets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: Delete an event
      description: Only for the administrators, and only an event that is over (409 otherwise) — the stakes of the others are not paid yet.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/PermissionDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/users/{nickname}/verification:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Give a page the checkmark
      description: 'Only for the administrators: openvk''s "Верификация". The page wears a checkmark by its name ("Подтверждённая страница") wherever the name is shown, and its owner hears of it (`verified`). Idempotent.'
      security: [{ bearer: [] }]
      responses:
        "204": { description: Given }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Take the checkmark from a page
      description: Only for the administrators. Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Taken }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{nickname}/alert:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Put a label on a page
      description: 'Only for the administrators: the page wears the orange label of openvk ("user-alert") above its name with these words (up to 20 lines and 1000 characters; for example the marking of a foreign agent). It replaces the label the page had. Nobody is notified.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alert]
              properties:
                alert: { type: string, maxLength: 1000, description: 'The words of the label; "" takes it' }
      responses:
        "204": { description: Put }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Take the label from a page
      description: Only for the administrators. Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Taken }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{nickname}/ban:
    parameters:
      - name: nickname
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Block a page
      description: 'Only for the administrators: openvk''s "Заблокировать пользователя", for a while or for good. The page shows others only the names, the photo and the reason; its owner can do nothing but read why, from their next refresh of the tokens (up to 15 minutes). An administrator cannot be blocked, nor block themselves (409). Blocking again replaces the block.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 255, description: '"Причина блокировки", which the owner and others read' }
                until: { type: string, format: date-time, description: "When the block ends; absent or empty for good" }
      responses:
        "204": { description: Blocked }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The page is an administrator's, or yours
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Lift the block of a page
      description: Only for the administrators. Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Lifted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/clubs/{ref}/verification:
    parameters:
      - name: ref
        in: path
        required: true
        description: The address of the community or its ID
        schema: { type: string }
    put:
      summary: Give a community the checkmark
      description: 'Only for the administrators of the site, as for a page; the owner of the community hears of it (`club_verified`). Idempotent.'
      security: [{ bearer: [] }]
      responses:
        "204": { description: Given }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Take the checkmark from a community
      description: Only for the administrators. Idempotent; takes the owner's notification back.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Taken }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You are not an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/gifts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Delete a gift from your page
      description: Only the one a gift was sent to deletes it; the notification about it goes too.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: The gift was sent to someone else
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: A collectible gift ("Коллекционный подарок")
      description: |
        No token needed. Who has it (`owner`, null when the site does —
        `site` — or the page is gone), its sale or auction and its
        history, newest first. A gift that is not collectible, or whose
        owner hides their gifts from you, is not found.
      responses:
        "200":
          description: The gift
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collectible" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/gifts/{id}/upgrade:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Make your gift collectible ("Улучшить")
      description: |
        For `upgradePrice` votes, which go to the treasury, the gift gets
        the next number of its kind and three traits rolled by rarity.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The gift, collectible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Gift" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: The gift is not yours, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: 'Collectible already, or not enough votes', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/gifts/{id}/transfer:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Give your collectible away ("Передать")
      description: |
        For `transferPrice` votes to the treasury it goes to `nickname`,
        as a gift from you would: a filled-in profile is needed, and not
        through a blacklist or to a page that does not take gifts from you.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname: { type: string }
      responses:
        "204": { description: Given }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Not yours, or you cannot send gifts to them, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: 'On sale, not collectible, yours already or not enough votes', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/gifts/{id}/sale:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Put your collectible on the market ("Продать")
      description: For `price` votes, from 1 to 1 000 000; putting it up again changes the price.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price: { type: integer, format: int64, minimum: 1 }
      responses:
        "200": { description: The gift, content: { application/json: { schema: { $ref: "#/components/schemas/Gift" } } } }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: The gift is not yours, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Not collectible, or at an auction, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      summary: Take your collectible off the market
      security: [{ bearer: [] }]
      responses:
        "200": { description: The gift, content: { application/json: { schema: { $ref: "#/components/schemas/Gift" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: The gift is not yours, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/gifts/{id}/purchase:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Buy a collectible on the market
      description: |
        `price` is the price you were shown: another one —
        `the price of the gift changed` (409). The seller gets it less a
        fee to the treasury of 5% (2.5% for a seller with Freenet Prime),
        rounded up.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price: { type: integer, format: int64 }
      responses:
        "200": { description: Your balance after, content: { application/json: { schema: { $ref: "#/components/schemas/Balance" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: 'Not on sale, the price changed, yours or not enough votes', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/gifts/{id}/auction:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Auction your collectible ("Аукцион")
      description: |
        Bids start at `start` votes and run `hours`, from 1 to 168. Each
        bid beats the last by 5%, and a bid in the last 5 minutes moves
        the end 5 minutes on. At the end the top bidder gets the gift and
        you the bid less the fee; without bids it stays yours.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start, hours]
              properties:
                start: { type: integer, format: int64, minimum: 1 }
                hours: { type: integer, minimum: 1, maximum: 168 }
      responses:
        "204": { description: Started }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: The gift is not yours, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Not collectible, or on sale, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      summary: Cancel the auction of your collectible
      description: Only while nobody has bid.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Cancelled }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: The gift is not yours, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Somebody has bid, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/gifts/{id}/bids:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Bid at an auction
      description: |
        At least `minBid`. Your votes are held until someone bids more —
        then they come back — or you win.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, format: int64, minimum: 1 }
      responses:
        "200": { description: Your balance after, content: { application/json: { schema: { $ref: "#/components/schemas/Balance" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: 'Too low, over, yours or not enough votes', content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/market:
    get:
      summary: The market of collectibles ("Маркет")
      description: |
        No token needed. The collectibles on sale, of owners whose pages
        are neither deleted nor banned, filtered by gift and traits.
      parameters:
        - { name: gift, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: backdrop, in: query, schema: { type: string } }
        - { name: symbol, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [price, price_desc, number] }, description: Cheapest first by default }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: A page, content: { application/json: { schema: { $ref: "#/components/schemas/CollectiblePage" } } } }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/auctions:
    get:
      summary: The running auctions ("Аукционы"), ending soonest first
      description: No token needed.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: A page, content: { application/json: { schema: { $ref: "#/components/schemas/CollectiblePage" } } } }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      summary: Auction a rare edition of the site
      description: |
        For the administrators of the site: a new collectible of `gift`
        with the traits chosen, auctioned by the site; the winning bid goes
        to the treasury. Without bids the edition is gone.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gift, model, backdrop, symbol, start, hours]
              properties:
                gift: { type: string }
                model: { type: string }
                backdrop: { type: string }
                symbol: { type: string }
                start: { type: integer, format: int64, minimum: 1 }
                hours: { type: integer, minimum: 1, maximum: 168 }
      responses:
        "201":
          description: The new gift
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: You are not an administrator of the site, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: The gift is sold out, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/stickers:
    get:
      summary: The sticker shop ("Магазин стикеров")
      description: |
        No token needed; with one, each pack says whether it is yours. The
        packs of the site come first: their pictures are the site's, which
        knows a sticker by its name. Then the packs people made of their
        photos in the "Студия стикеров", newest first, with `author`:
        those `published` (not of deleted pages), and, with a token, your
        own and those you have taken. Their stickers are at
        `/media/stickers/{sticker}`. A pack costs `price` votes
        ("голоса") once, 0 for a free one; the votes for a pack a person
        made go to its author.
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StickerPacks" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/me/sticker-packs:
    get:
      summary: The packs you made ("Студия стикеров"), newest first
      description: Each with `holders`, how many others have taken it.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Your packs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StickerPacks" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      summary: Make a pack of your photos ("Сохранить набор")
      description: |
        The profile must be filled in first: a pack is signed with your
        name. `photos` are your uploads from `POST /api/v1/me/photos`, up
        to 10 at once (more are added by edits, up to 40 in a pack), not
        attached anywhere yet; each becomes a sticker, in this order. At
        most 20 packs per person. The pack is among your stickers at once;
        with `published` the shop shows it to everyone.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StickerPackRequest" }
      responses:
        "201":
          description: The new pack
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StickerPack" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: You have made 20 packs (`too many sticker packs`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/sticker-packs/{pack}:
    parameters:
      - name: pack
        in: path
        required: true
        schema: { type: string }
    patch:
      summary: Change a pack you made
      description: |
        Name, description, price and `published` are set as given.
        `addPhotos` (up to 10 uploads of yours) go after the stickers,
        `removePhotos` (stickers by their photos) are taken out and their
        files deleted — not from a pack others have taken (409). Those who
        took the pack keep it, whatever its price or `published` becomes.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StickerPackRequest" }
      responses:
        "200":
          description: The pack
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StickerPack" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "Not your pack", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409":
          description: Others have taken the pack (`the sticker pack is taken by others`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Delete a pack you made ("Удалить набор")
      description: With its photos; a pack others have taken stays (409).
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "Not your pack", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409":
          description: Others have taken the pack
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/stickers/{pack}:
    parameters:
      - name: pack
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Add a pack to your stickers ("Добавить бесплатно", "Купить")
      description: A pack with a price takes it from your votes the first time; added again after it was put away, it is free. Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Added }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: You have fewer votes than the pack costs (`not enough votes`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Put a pack away ("Убрать набор")
      description: Its stickers can no longer be sent; a bought pack stays bought. Idempotent.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Put away }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/album-photos/{id}/reposts:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Share a photo of an album ("Поделиться" under a photo)
      description: As sharing a post, the same body; the post shows the photo (`sharedPhoto`).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text: { type: string, maxLength: 60000 }
                club: { type: string }
                fromClub: { type: boolean }
                signed: { type: boolean }
      responses:
        "201":
          description: The post sharing it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: You cannot post on that community's wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/album-photos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: A photo of an album, for its page
      description: With who uploaded it (`author`) and its album with whom that belongs to; the photos of a deleted page are not found.
      responses:
        "200": { $ref: "#/components/responses/AlbumPhotoPage" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Change the description of a photo
      description: Who uploaded it only.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string, maxLength: 255 }
      responses:
        "200": { $ref: "#/components/responses/AlbumPhotoPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not who uploaded it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Delete a photo of an album
      description: Who uploaded it, the owner of the album or the admins of the community that owns it; the image goes too.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: None of them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/album-photos/{id}/album:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Move a photo to another album
      description: To an album of the same owner that people fill by hand; the owner of the albums or the admins of the community that owns them. The photo no longer shows the album it leaves.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [albumId]
              properties:
                albumId: { type: string, format: uuid }
      responses:
        "204": { description: Moved }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not who may edit the albums
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The album is kept by the site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/albums/{id}/cover:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Choose the photo that shows an album
      description: '"Обложка альбома": a photo of the album instead of its first one, until it is deleted or moved away; the owner of the album or the admins of the community that owns it.'
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoId]
              properties:
                photoId: { type: string, format: uuid }
      responses:
        "204": { description: Chosen }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not who may edit the album
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/clubs/{ref}/posts:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    get:
      summary: A community's wall, newest first
      description: As a user's wall; `canPost` says whether you may write there on your own behalf, `canSuggest` whether you may suggest a post instead.
      parameters:
        - name: type
          in: query
          description: 'The tab of openvk''s wall: none for all posts ("Все записи", the pinned one first), `owner` for the wall''s own — by its owner, or for the community whose wall it is ("Записи Анны", "Записи сообщества") — `others` for the rest ("Чужие записи") and `archive` for the posts put away ("Архив записей"), which the other tabs leave out and only the owner of the wall or the admins of the community read (403); `total` counts the tab'
          schema: { type: string, enum: [owner, others, archive] }
        - name: q
          in: query
          description: '"Поиск" of the wall: the posts of the tab that say this, in any case; the pinned post is then in its place'
          schema: { type: string, maxLength: 100 }
        - name: year
          in: query
          description: 'The posts written in this year (UTC) only, as the years of openvk''s "Архив записей"; the pinned post is then in its place. The first page of the archive tells in `years` which there are'
          schema: { type: integer, minimum: 1970, maximum: 9999 }
        - name: comments
          in: query
          description: "`last` brings each post with `lastComments`, its three newest comments (\"Микроблог\")"
          schema: { type: string, enum: [last] }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of the wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Write on a community's wall
      description: |
        On an open wall anyone may, on any other only its admins, and then
        for the community; with `fromClub` the post speaks for the
        community ("От имени сообщества"), admins only. Your profile must be filled in first.
        Nobody is notified of posts here, nor the writer of a post for the
        community of its likes, comments and reposts.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewClubPost" }
      responses:
        "201":
          description: The new post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`you cannot post on this wall`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/clubs/{ref}/posts/archive:
    parameters:
      - $ref: "#/components/parameters/ClubRef"
    put:
      summary: Put the posts of a community's wall away in its archive
      description: |
        "Архивировать все записи за 2025" of openvk with `year`, without it
        "Архивировать все записи целиком": every post of the wall written
        in the year (UTC), whoever wrote it, goes to the archive, the
        pinned one too. The admins of the community only. Idempotent.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ArchiveYear"
      responses:
        "200":
          description: How many posts went to the archive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchivedWall" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      summary: Return the posts of a community's wall from its archive
      description: |
        "Разархивировать все записи за 2025" of openvk with `year`; without
        it every archived post of the wall returns. Idempotent.
      security: [{ bearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ArchiveYear"
      responses:
        "200":
          description: How many posts came back
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchivedWall" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Not your wall
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/events:
    get:
      summary: Live events of a page (WebSocket)
      description: |
        A WebSocket: upgrade, then send `{"token": "<access token>"}` as the
        first message within 10 s (the token is not put in the URL, which
        would land in logs). Then the server sends JSON events, told apart
        by `type`:

        - `ready` — connected; `messages` and `notifications` are the menu
          counters (unread dialogs and notifications).
        - `counters` — a counter changed; only the changed one is set.
        - `message` — a new message of your dialogs, sent or received:
          `peer` (Author) and `message` (Message).
        - `read` — the dialog with `peer` was read up to `upTo`, by you on
          another page (`byMe`) or by the peer.
        - `delete` — message `id` of the dialog with `peer` is gone from it:
          deleted by you for yourself on another page.
        - `edit` — a message of the dialog with `peer` says something else
          now, or nothing: its sender, you or the peer, edited it or took
          it back from both sides (`deleted`): `peer` and `message`
          (Message; `read` is not told).
        - `chat_message` — a new message of a chat you are in, yours or
          someone's, or what happened there: `chat` (its ID) and `message`
          (ChatMessage; `unread` is not told).
        - `chat_edit` — a message of chat `chat` says something else now,
          or nothing: its sender edited it or took it back (`deleted`).
        - `chat_read` — you have read chat `chat` up to `upTo` on another
          page.
        - `typing` — `user` (Author) is writing to you: in chat `chat` or,
          without it, in your dialog. Show it for a few seconds ("печатает...")
          unless told again, and no more once their message comes.
        - `notification` — `change` is `new`, `gone` or `read`.

        While it is open, you are on the site ("Онлайн" on your page).

        The connection lives until the access token expires: then it is
        closed with code 4001 — refresh the token and connect again. 1001:
        the server stops; 1013: connect again a bit later. After any gap,
        catch up with the usual requests: events are not replayed. Browser
        origins other than the API's need `CORS_ALLOWED_ORIGINS`.
      responses:
        "101": { description: Switching to the WebSocket protocol }
        "403": { description: The origin is not allowed }

  /api/v1/dialogs:
    get:
      summary: Your dialogs and chats, the most recently written first
      description: >-
        One list of both: a row is the dialog with `peer` or, with `chat`,
        a chat of several people. Dialogs with accounts that are gone are
        left out, so a page may be shorter than asked.
      security: [{ bearer: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: One page of dialogs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DialogPage" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /api/v1/chats:
    post:
      summary: Start a chat of several people ("Создать беседу")
      description: >-
        You and at least two others, at most 50 in all. Each of them must
        let you add them (`chatsInvite` of their privacy, no blacklist
        either way). Your profile must be filled in first.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members]
              properties:
                title: { type: string, maxLength: 64 }
                members:
                  type: array
                  minItems: 2
                  maxItems: 49
                  items: { type: string, description: A nickname }
      responses:
        "201":
          description: The chat with who is in it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "`you cannot add this user to a chat`" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`the chat is full`" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/v1/chats/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: A chat you are or were in, with who is in it
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Rename a chat ("Обновить название"); anyone in it may
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 64 }
      responses:
        "200":
          description: The chat as it is now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/InvalidArgument" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`you are not in this chat`" }
    delete:
      summary: Delete a chat for everyone in it ("Удалить беседу")
      description: >-
        Only its creator may. The chat goes with all its messages, their
        photos and the chat's photo; the others are not told, the chat is
        just gone from their list.
      security: [{ bearer: [] }]
      responses:
        "204": { description: The chat is deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: "Only the creator deletes a chat: `permission denied`" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/chats/{id}/pin:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Pin a message above a chat ("Закрепить"); anyone in it may
      description: >-
        One message at a time: it takes the place of the pinned one. A
        message someone wrote in the chat and has not taken back; the
        chat hears of it (`pin`).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageId]
              properties:
