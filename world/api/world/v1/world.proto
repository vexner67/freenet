syntax = "proto3";

package world.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vexner67/freenet/world/api/world/v1;worldv1";

// WorldService is «Мир»: worlds made of a seed by the administrators and
// their maps.
service WorldService {
  // Public: the world open now. NotFound "no world is open".
  rpc GetWorld(GetWorldRequest) returns (GetWorldResponse);
  // Public: the provinces of the map of a world, the same for its life.
  rpc GetAtlas(GetAtlasRequest) returns (GetAtlasResponse);
  // Public: the province of every cell of the grid, gzipped little-endian
  // uint16, row by row.
  rpc GetRaster(GetRasterRequest) returns (GetRasterResponse);
  // Public: a picture of the map, 256×256 PNG; NotFound "tile not found".
  rpc GetTile(GetTileRequest) returns (GetTileResponse);

  // Internal (gateway, which asks the user service first whether its
  // caller is an administrator of the site): the worlds.
  rpc ListWorlds(google.protobuf.Empty) returns (ListWorldsResponse);
  // The map is made in the background; the world is ready to open then.
  rpc CreateWorld(CreateWorldRequest) returns (CreateWorldResponse);
  // Opens a ready world and ends the one open before it.
  rpc OpenWorld(OpenWorldRequest) returns (google.protobuf.Empty);
  rpc EndWorld(google.protobuf.Empty) returns (google.protobuf.Empty);
}

enum WorldStatus {
  WORLD_STATUS_UNSPECIFIED = 0;
  WORLD_STATUS_GENERATING = 1;
  WORLD_STATUS_READY = 2;
  WORLD_STATUS_OPEN = 3;
  WORLD_STATUS_ENDED = 4;
  WORLD_STATUS_FAILED = 5;
}

message World {
  string id = 1;
  uint64 seed = 2;
  int32 grid = 3;
  WorldStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp opened_at = 6;
  google.protobuf.Timestamp ended_at = 7;
}

message GetWorldRequest {}

message GetWorldResponse {
  World world = 1;
  // The states of people were removed from «Мир».
  reserved 2 to 7;
  reserved "rules", "hour", "states", "owners", "colonies", "viewer";
}

message GetAtlasRequest {
  string world_id = 1;
}

message Link {
  int32 to = 1;
  bool river = 2;
  bool sea = 3;
}

message Province {
  int32 id = 1;
  bool sea = 2;
  string name = 3;
  // sea, plains, hills, mountains, forest, desert, swamp, tundra.
  string terrain = 4;
  string biome = 5;
  // grain, wood, ore, oil, gold, horses.
  repeated string resources = 6;
  int32 center_x = 7;
  int32 center_y = 8;
  int32 area = 9;
  bool coastal = 10;
  int32 culture = 11;
  int32 population = 12;
  bool free_city = 13;
  repeated Link links = 14;
}

message GetAtlasResponse {
  // The grid of cells.
  int32 width = 1;
  int32 height = 2;
  repeated Province provinces = 3;
  // How many zooms of tiles there are, from 0.
  int32 zooms = 4;
}

message GetRasterRequest {
  string world_id = 1;
}

message GetRasterResponse {
  bytes raster = 1;
}

message GetTileRequest {
  string world_id = 1;
  int32 z = 2;
  int32 x = 3;
  int32 y = 4;
}

message GetTileResponse {
  bytes png = 1;
}

message ListWorldsResponse {
  repeated World worlds = 1;
}

message CreateWorldRequest {
  // 0: a random seed.
  uint64 seed = 1;
  // 1024, 2048 or 4096 cells wide.
  int32 grid = 2;
}

message CreateWorldResponse {
  World world = 1;
}

message OpenWorldRequest {
  string world_id = 1;
}
