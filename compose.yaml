# Infrastructure (PostgreSQL per service, Redis) starts by default: it is
# what `make dev-persistent` runs the services against. The services
# themselves are in the "app" profile, built from Dockerfile, with mTLS
# between them (`make certs`) and the same databases, and Prometheus
# collecting their metrics: `make stack`. The images check their own
# health (HEALTHCHECK in Dockerfile), so a service waits for those it
# calls.

# Every line of a log says which service wrote it, for Fluent Bit
# (monitoring/fluent-bit.yaml) to collect them in one place; the files
# rotate here, since options of a container replace those of the daemon.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"
    labels: com.docker.compose.service

x-service: &service
  profiles: [app]
  restart: unless-stopped
  logging: *logging
  # `make stack` runs them as you, so they can read the keys in certs/
  # (mode 600) and write .data/media.
  user: "${FREENET_UID:-65532}:${FREENET_GID:-65532}"
  volumes:
    - ./certs:/certs:ro

# Metrics of a database for Prometheus (monitoring/prometheus.yml): one
# small exporter a database, since each has its own user and password.
# Their ports are not published.
x-postgres-exporter: &postgres-exporter
  profiles: [app]
  image: prometheuscommunity/postgres-exporter:v0.20.1
  restart: unless-stopped

x-env: &env
  LOG_LEVEL: info
  LOG_FORMAT: json
  TLS_CA_PATH: /certs/ca.pem
  JWT_PUBLIC_KEY_PATH: /certs/jwt-public.pem
  JWT_ISSUER: freenet-auth
  NOTIFY_TIMEOUT: 2s
  # Spans of every call go to Jaeger; a service does not wait for it.
  TRACING_ENDPOINT: jaeger:4317

services:
  auth-postgres:
    image: postgres:18
    logging: *logging
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
    ports:
      - "${AUTH_POSTGRES_PORT}:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql
    # Checked every second while starting (dependants start soon), then
    # twice a minute: every check starts a process in the container, and
    # a small server has no processor to spare for a dozen of them.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${AUTH_POSTGRES_USER} -d $${AUTH_POSTGRES_DB}"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      timeout: 5s
      retries: 5

  user-postgres:
    image: postgres:18
    logging: *logging
    environment:
      POSTGRES_USER: ${USER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${USER_POSTGRES_DB}
    ports:
      - "${USER_POSTGRES_PORT}:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${USER_POSTGRES_USER} -d $${USER_POSTGRES_DB}" ]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      timeout: 5s
      retries: 5

  post-postgres:
    image: postgres:18
    logging: *logging
    environment:
      POSTGRES_USER: ${POST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${POST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${POST_POSTGRES_DB}
    ports:
      - "${POST_POSTGRES_PORT}:5432"
    volumes:
      - post_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POST_POSTGRES_USER} -d $${POST_POSTGRES_DB}"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      timeout: 5s
      retries: 5

  notification-postgres:
    image: postgres:18
    logging: *logging
    environment:
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB}
    ports:
      - "${NOTIFICATION_POSTGRES_PORT}:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${NOTIFICATION_POSTGRES_USER} -d $${NOTIFICATION_POSTGRES_DB}"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      timeout: 5s
      retries: 5

  message-postgres:
    image: postgres:18
    logging: *logging
    environment:
      POSTGRES_USER: ${MESSAGE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MESSAGE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${MESSAGE_POSTGRES_DB}
    ports:
      - "${MESSAGE_POSTGRES_PORT}:5432"
    volumes:
      - message_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${MESSAGE_POSTGRES_USER} -d $${MESSAGE_POSTGRES_DB}"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      timeout: 5s
      retries: 5

  club-postgres:
    image: postgres:18
    logging: *logging
    environment:
      POSTGRES_USER: ${CLUB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CLUB_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CLUB_POSTGRES_DB}
    ports:
      - "${CLUB_POSTGRES_PORT}:5432"
    volumes:
      - club_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${CLUB_POSTGRES_USER} -d $${CLUB_POSTGRES_DB}"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      timeout: 5s
      retries: 5

  world-postgres:
    image: postgres:18
    logging: *logging
    environment:
      POSTGRES_USER: ${WORLD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${WORLD_POSTGRES_PASSWORD}
      POSTGRES_DB: ${WORLD_POSTGRES_DB}
    ports:
      - "${WORLD_POSTGRES_PORT}:5432"
    volumes:
      - world_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${WORLD_POSTGRES_USER} -d $${WORLD_POSTGRES_DB}"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    logging: *logging
    # Everything in it expires by itself (sign-in codes, rate limit
    # counters); at the limit what expires soonest goes first instead of
    # the server running out of memory.
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, volatile-ttl]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      timeout: 5s
      retries: 5

  notification:
    <<: *service
    image: freenet-notification
    build: { context: ., args: { SERVICE: notification } }
    environment:
      <<: *env
      GRPC_PORT: 7055
      METRICS_PORT: 9055
      TLS_CERT_PATH: /certs/notification.pem
      TLS_KEY_PATH: /certs/notification-key.pem
      STORAGE: persistent
      DATABASE_URL: postgres://${NOTIFICATION_POSTGRES_USER}:${NOTIFICATION_POSTGRES_PASSWORD}@notification-postgres:5432/${NOTIFICATION_POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      # Push notifications to browsers: the key deploy/certs.sh makes once.
      PUSH_KEY_PATH: /certs/push-key.pem
      PUSH_SUBJECT: ${PUSH_SUBJECT:-https://github.com/vexner67/freenet}
      # Who did what a push tells of. Not in depends_on: both wait for
      # notification; until they are up, pushes name nobody.
      USER_SERVICE_ADDR: user:7052
      CLUB_SERVICE_ADDR: club:7057
    depends_on:
      notification-postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  message:
    <<: *service
    image: freenet-message
    build: { context: ., args: { SERVICE: message } }
    environment:
      <<: *env
      GRPC_PORT: 7056
      METRICS_PORT: 9056
      TLS_CERT_PATH: /certs/message.pem
      TLS_KEY_PATH: /certs/message-key.pem
      STORAGE: persistent
      DATABASE_URL: postgres://${MESSAGE_POSTGRES_USER}:${MESSAGE_POSTGRES_PASSWORD}@message-postgres:5432/${MESSAGE_POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      MEDIA_SERVICE_ADDR: media:7054
      NOTIFICATION_SERVICE_ADDR: notification:7055
    depends_on:
      message-postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      media: { condition: service_healthy }
      notification: { condition: service_healthy }

  club:
    <<: *service
    image: freenet-club
    build: { context: ., args: { SERVICE: club } }
    environment:
      <<: *env
      GRPC_PORT: 7057
      METRICS_PORT: 9057
      TLS_CERT_PATH: /certs/club.pem
      TLS_KEY_PATH: /certs/club-key.pem
      STORAGE: persistent
      DATABASE_URL: postgres://${CLUB_POSTGRES_USER}:${CLUB_POSTGRES_PASSWORD}@club-postgres:5432/${CLUB_POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      NOTIFICATION_SERVICE_ADDR: notification:7055
      # Not in depends_on: post waits for club, and the outbox retries
      # until post is up.
      POST_SERVICE_ADDR: post:7053
    depends_on:
      club-postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      notification: { condition: service_healthy }

  world:
    <<: *service
    image: freenet-world
    build: { context: ., args: { SERVICE: world } }
    environment:
      <<: *env
      GRPC_PORT: 7058
      METRICS_PORT: 9058
      TLS_CERT_PATH: /certs/world.pem
      TLS_KEY_PATH: /certs/world-key.pem
      STORAGE: persistent
      DATABASE_URL: postgres://${WORLD_POSTGRES_USER}:${WORLD_POSTGRES_PASSWORD}@world-postgres:5432/${WORLD_POSTGRES_DB}?sslmode=disable
    depends_on:
      world-postgres: { condition: service_healthy }

  user:
    <<: *service
    image: freenet-user
    build: { context: ., args: { SERVICE: user } }
    environment:
      <<: *env
      GRPC_PORT: 7052
      METRICS_PORT: 9052
      TLS_CERT_PATH: /certs/user.pem
      TLS_KEY_PATH: /certs/user-key.pem
      STORAGE: persistent
      DATABASE_URL: postgres://${USER_POSTGRES_USER}:${USER_POSTGRES_PASSWORD}@user-postgres:5432/${USER_POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      NOTIFICATION_SERVICE_ADDR: notification:7055
      POST_SERVICE_ADDR: post:7053
      MEDIA_SERVICE_ADDR: media:7054
      MESSAGE_SERVICE_ADDR: message:7056
      CLUB_SERVICE_ADDR: club:7057
      # Shorter in tests: how long a deleted page can be restored.
      ACCOUNT_RETENTION: ${ACCOUNT_RETENTION:-5040h}
      # Who makes the vouchers ("Ваучеры"): emails, comma-separated.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on:
      user-postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      notification: { condition: service_healthy }

  post:
    <<: *service
    image: freenet-post
    build: { context: ., args: { SERVICE: post } }
    environment:
      <<: *env
      GRPC_PORT: 7053
      METRICS_PORT: 9053
      TLS_CERT_PATH: /certs/post.pem
      TLS_KEY_PATH: /certs/post-key.pem
      STORAGE: persistent
      DATABASE_URL: postgres://${POST_POSTGRES_USER}:${POST_POSTGRES_PASSWORD}@post-postgres:5432/${POST_POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      NOTIFICATION_SERVICE_ADDR: notification:7055
      MEDIA_SERVICE_ADDR: media:7054
      CLUB_SERVICE_ADDR: club:7057
    depends_on:
      post-postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      notification: { condition: service_healthy }
      media: { condition: service_healthy }
      club: { condition: service_healthy }

  media:
    <<: *service
    image: freenet-media
    build: { context: ., args: { SERVICE: media } }
    environment:
      <<: *env
      GRPC_PORT: 7054
      METRICS_PORT: 9054
      TLS_CERT_PATH: /certs/media.pem
      TLS_KEY_PATH: /certs/media-key.pem
      # persistent keeps the files in MEDIA_DIR, on this node; s3 keeps
      # them in the bucket the S3_* name, for several replicas of media.
      STORAGE: ${MEDIA_STORAGE:-persistent}
      MEDIA_DIR: /data/media
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_INSECURE: ${S3_INSECURE:-false}
      REDIS_ADDR: redis:6379
      UNPUBLISHED_PHOTO_TTL: ${UNPUBLISHED_PHOTO_TTL:-24h}
      RETIRED_PHOTO_TTL: ${RETIRED_PHOTO_TTL:-720h}
    volumes:
      - ./certs:/certs:ro
      - ./.data/media:/data/media
    depends_on:
      redis: { condition: service_healthy }

  auth:
    <<: *service
    image: freenet-auth
    build: { context: ., args: { SERVICE: auth } }
    environment:
      <<: *env
      GRPC_PORT: 7051
      METRICS_PORT: 9051
      TLS_CERT_PATH: /certs/auth.pem
      TLS_KEY_PATH: /certs/auth-key.pem
      STORAGE: persistent
      DATABASE_URL: postgres://${AUTH_POSTGRES_USER}:${AUTH_POSTGRES_PASSWORD}@auth-postgres:5432/${AUTH_POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      USER_SERVICE_ADDR: user:7052
      # Codes go to `docker compose logs auth`; no SMTP in development.
      MAILER: console
      HASH_SECRET: ${HASH_SECRET:-}
      JWT_PRIVATE_KEY_PATH: /certs/jwt-private.pem
      ISSUER: freenet-auth
    depends_on:
      auth-postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      user: { condition: service_healthy }

  gateway:
    <<: *service
    image: freenet-gateway
    build: { context: ., target: gateway, args: { SERVICE: gateway } }
    environment:
      LOG_LEVEL: info
      LOG_FORMAT: json
      HTTP_PORT: 8080
      METRICS_PORT: 9080
      TLS_CA_PATH: /certs/ca.pem
      TLS_CERT_PATH: /certs/gateway.pem
      TLS_KEY_PATH: /certs/gateway-key.pem
      TRACING_ENDPOINT: jaeger:4317
      AUTH_SERVICE_ADDR: auth:7051
      USER_SERVICE_ADDR: user:7052
      POST_SERVICE_ADDR: post:7053
      MEDIA_SERVICE_ADDR: media:7054
      NOTIFICATION_SERVICE_ADDR: notification:7055
      MESSAGE_SERVICE_ADDR: message:7056
      CLUB_SERVICE_ADDR: club:7057
      WORLD_SERVICE_ADDR: world:7058
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth: { condition: service_healthy }
      user: { condition: service_healthy }
      post: { condition: service_healthy }
      media: { condition: service_healthy }
      notification: { condition: service_healthy }
      message: { condition: service_healthy }
      club: { condition: service_healthy }
      world: { condition: service_healthy }

  auth-postgres-exporter:
    <<: *postgres-exporter
    environment:
      DATA_SOURCE_URI: auth-postgres:5432/${AUTH_POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${AUTH_POSTGRES_USER}
      DATA_SOURCE_PASS: ${AUTH_POSTGRES_PASSWORD}
    depends_on:
      auth-postgres: { condition: service_healthy }

  user-postgres-exporter:
    <<: *postgres-exporter
    environment:
      DATA_SOURCE_URI: user-postgres:5432/${USER_POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${USER_POSTGRES_USER}
      DATA_SOURCE_PASS: ${USER_POSTGRES_PASSWORD}
    depends_on:
      user-postgres: { condition: service_healthy }

  post-postgres-exporter:
    <<: *postgres-exporter
    environment:
      DATA_SOURCE_URI: post-postgres:5432/${POST_POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POST_POSTGRES_USER}
      DATA_SOURCE_PASS: ${POST_POSTGRES_PASSWORD}
    depends_on:
      post-postgres: { condition: service_healthy }

  notification-postgres-exporter:
    <<: *postgres-exporter
    environment:
      DATA_SOURCE_URI: notification-postgres:5432/${NOTIFICATION_POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${NOTIFICATION_POSTGRES_USER}
      DATA_SOURCE_PASS: ${NOTIFICATION_POSTGRES_PASSWORD}
    depends_on:
      notification-postgres: { condition: service_healthy }

  message-postgres-exporter:
    <<: *postgres-exporter
    environment:
      DATA_SOURCE_URI: message-postgres:5432/${MESSAGE_POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${MESSAGE_POSTGRES_USER}
      DATA_SOURCE_PASS: ${MESSAGE_POSTGRES_PASSWORD}
    depends_on:
      message-postgres: { condition: service_healthy }

  club-postgres-exporter:
    <<: *postgres-exporter
    environment:
      DATA_SOURCE_URI: club-postgres:5432/${CLUB_POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${CLUB_POSTGRES_USER}
      DATA_SOURCE_PASS: ${CLUB_POSTGRES_PASSWORD}
    depends_on:
      club-postgres: { condition: service_healthy }

  world-postgres-exporter:
    <<: *postgres-exporter
    environment:
      DATA_SOURCE_URI: world-postgres:5432/${WORLD_POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${WORLD_POSTGRES_USER}
      DATA_SOURCE_PASS: ${WORLD_POSTGRES_PASSWORD}
    depends_on:
      world-postgres: { condition: service_healthy }

  redis-exporter:
    profiles: [app]
    image: oliver006/redis_exporter:v1.93.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }

  # The machine itself for Prometheus: processor, memory and the disk of
  # the host, read through its root mounted read-only, and what files in
  # .data/node say (deploy/certs.sh: when the mTLS certificates end). Only
  # the collectors the alerts and the dashboard use.
  node-exporter:
    profiles: [app]
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.loadavg
      - --collector.textfile
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro
      - ./.data/node:/textfile:ro

  # Metrics of every service, database, Redis and the machine and the
  # alerts on them
  # (monitoring/alerts.yml): http://localhost:9090 (PROMETHEUS_PORT). The
  # metrics ports are not published.
  prometheus:
    profiles: [app]
    image: prom/prometheus:v3.13.4
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      timeout: 3s
      retries: 20

  # The logs of every service in one place, kept two weeks or half a
  # gigabyte: http://localhost:9428/select/vmui (VICTORIALOGS_PORT), e.g.
  # request_id:"..." for one request through all the services.
  victorialogs:
    profiles: [app]
    image: victoriametrics/victoria-logs:v1.53.0
    restart: unless-stopped
    command:
      - -storageDataPath=/data
      - -retentionPeriod=14d
      - -retention.maxDiskSpaceUsageBytes=512MiB
    volumes:
      - victorialogs_data:/data
    ports:
      - "127.0.0.1:${VICTORIALOGS_PORT:-9428}:9428"

  # Reads the log files of Docker, which only root can, and sends the
  # lines of the services to VictoriaLogs (monitoring/fluent-bit.yaml).
  fluent-bit:
    profiles: [app]
    image: fluent/fluent-bit:5.1.3
    restart: unless-stopped
    user: "0"
    command: [-c, /fluent-bit/etc/fluent-bit.yaml]
    volumes:
      - ./monitoring/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent_bit_data:/state
    depends_on:
      - victorialogs

  # The traces of requests through the services, the last few thousand,
  # in memory (monitoring/jaeger.yml): http://localhost:16686
  # (JAEGER_PORT); the tag request_id finds the trace of a log line.
  jaeger:
    profiles: [app]
    image: jaegertracing/jaeger:2.22.0
    restart: unless-stopped
    command: [--config, /etc/jaeger/config.yml]
    volumes:
      - ./monitoring/jaeger.yml:/etc/jaeger/config.yml:ro
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/status"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      timeout: 3s
      retries: 20

  # Groups and silences the alerts Prometheus sends: http://localhost:9093
  # (ALERTMANAGER_PORT); who is notified is monitoring/alertmanager.yml.
  alertmanager:
    profiles: [app]
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      timeout: 3s
      retries: 20

  # The Freenet dashboard and the alerts: http://localhost:3001
  # (GRAFANA_PORT), open to look at without signing in; admin signs in with
  # GRAFANA_ADMIN_PASSWORD. Data sources and dashboards come from
  # monitoring/grafana, not from clicks in Grafana.
  grafana:
    profiles: [app]
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/freenet.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      start_period: 60s
      start_interval: 1s
      timeout: 3s
      retries: 30
    depends_on:
