syntax = "proto3";

package auth.v1;

option go_package = "github.com/vexner67/freenet/auth/api/auth/v1;authv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service AuthService {
  // NewCaptcha gives the picture RequestCode asks to read, when it does.
  rpc NewCaptcha(NewCaptchaRequest) returns (NewCaptchaResponse);
  rpc RequestCode(RequestCodeRequest) returns (google.protobuf.Empty);
  rpc VerifyCode(VerifyCodeRequest) returns (TokenPair);
  rpc RefreshToken(RefreshTokenRequest) returns (TokenPair);
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty);

  // The caller's sessions, by the access token: where they are signed in.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // EndSession signs the caller out of one of their sessions.
  rpc EndSession(EndSessionRequest) returns (google.protobuf.Empty);
  // EndOtherSessions signs the caller out everywhere but in the session
  // of the access token.
  rpc EndOtherSessions(EndOtherSessionsRequest) returns (EndOtherSessionsResponse);

  // VerifyTwoFactor finishes a sign-in that VerifyCode answered with a
  // ticket: a code of the authenticator app or a recovery code.
  rpc VerifyTwoFactor(VerifyTwoFactorRequest) returns (TokenPair);
  // The second step of the caller, by the access token: whether it is on.
  rpc GetTwoFactor(GetTwoFactorRequest) returns (GetTwoFactorResponse);
  // SetUpTwoFactor makes a new secret of the app, waiting for its first
  // code; FailedPrecondition when the second step is already on.
  rpc SetUpTwoFactor(SetUpTwoFactorRequest) returns (SetUpTwoFactorResponse);
  // EnableTwoFactor turns it on with the first code of the app and gives
  // the recovery codes, this once.
  rpc EnableTwoFactor(EnableTwoFactorRequest) returns (EnableTwoFactorResponse);
  // DisableTwoFactor turns it off for a code of either kind.
  rpc DisableTwoFactor(DisableTwoFactorRequest) returns (google.protobuf.Empty);
  // RenewRecoveryCodes replaces the recovery codes for a code of the app.
  rpc RenewRecoveryCodes(RenewRecoveryCodesRequest) returns (RenewRecoveryCodesResponse);
}

message NewCaptchaRequest {}

message NewCaptchaResponse {
  // False: signing in asks for no picture, and the rest is empty.
  bool required = 1;
  string id = 2;
  // An SVG.
  string image = 3;
}

message RequestCodeRequest {
  string email = 1;
  string captcha_id = 2;
  string captcha_answer = 3;
}

message VerifyCodeRequest {
  string email = 1;
  string code = 2;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  // Of VerifyCode only: the page has the second step on, so instead of
  // the tokens comes the ticket that VerifyTwoFactor takes with its code.
  string two_factor_ticket = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message Session {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  // When its tokens were last issued: at the sign-in or the last refresh.
  google.protobuf.Timestamp last_used_at = 3;
  // Where from they were issued then, as the client said; "" is unknown.
  string ip = 4;
  string user_agent = 5;
  // The session of the access token of the call.
  bool current = 6;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  // The latest used first, at most 100.
  repeated Session sessions = 1;
}

message EndSessionRequest {
  string session_id = 1;
}

message EndOtherSessionsRequest {}

message EndOtherSessionsResponse {
  int32 ended = 1;
}

message VerifyTwoFactorRequest {
  string ticket = 1;
  string code = 2;
}

message GetTwoFactorRequest {}

message GetTwoFactorResponse {
  bool enabled = 1;
  // How many recovery codes are still unused.
  int32 recovery_left = 2;
}

message SetUpTwoFactorRequest {
  // Names the page in the app's list, under the site.
  string account = 1;
}

message SetUpTwoFactorResponse {
  // The key typed into the app by hand, in groups of four.
  string secret = 1;
  // The otpauth:// address of the QR code.
  string uri = 2;
}

message EnableTwoFactorRequest {
  string code = 1;
}

message EnableTwoFactorResponse {
  repeated string recovery_codes = 1;
}

message DisableTwoFactorRequest {
  string code = 1;
}

message RenewRecoveryCodesRequest {
  string code = 1;
}

message RenewRecoveryCodesResponse {
  repeated string recovery_codes = 1;
}
