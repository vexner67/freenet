}

message ListAlbumPhotoLikersResponse {
  repeated string user_ids = 1;
  string next_cursor = 2;
  int32 total = 3;
}

// PhotoComment is a comment under a photo of an album.
message PhotoComment {
  string id = 1;
  string photo_id = 2;
  string author_id = 3;
  string text = 4;
  google.protobuf.Timestamp created_at = 5;
  // The caller wrote it.
  bool mine = 6;
  // text is only its beginning: the request set text_limit.
  bool text_cut = 7;
  // The comment of the same photo this one answers; empty for none, and
  // once that one is deleted.
  string reply_to_id = 8;
  int32 like_count = 9;
  // The caller likes it; false without a token.
  bool liked = 10;
}

message CreatePhotoCommentRequest {
  string photo_id = 1;
  string text = 2;
  // The comment under the same photo this one answers; empty for none.
  string reply_to_id = 3;
  // The people the text names, as in CreatePostRequest.
  repeated string mentioned_ids = 4;
}

message GetPhotoCommentsRequest {
  // At most 100.
  repeated string ids = 1;
  // The texts are cut to this many characters and say so (text_cut); 0
  // for whole texts.
  int32 text_limit = 2;
}

message GetPhotoCommentsResponse {
  repeated PhotoComment comments = 1;
}

message LikePhotoCommentRequest {
  string id = 1;
}

message LikePhotoCommentResponse {
  int32 like_count = 1;
}

message UnlikePhotoCommentRequest {
  string id = 1;
}

message UnlikePhotoCommentResponse {
  int32 like_count = 1;
}

message ListPhotoCommentLikersRequest {
  string id = 1;
  string cursor = 2;
  int32 limit = 3;
}

message ListPhotoCommentLikersResponse {
  repeated string user_ids = 1;
  string next_cursor = 2;
  int32 total = 3;
}

message CreatePhotoCommentResponse {
  PhotoComment comment = 1;
}

message DeletePhotoCommentRequest {
  string id = 1;
}

message ListPhotoCommentsRequest {
  string photo_id = 1;
  // Empty for the oldest, else next_cursor of the previous page.
  string cursor = 2;
  int32 limit = 3;
  // The texts are cut to this many characters and say so (text_cut);
  // 0 for whole texts.
  int32 text_limit = 4;
}

message ListPhotoCommentsResponse {
  repeated PhotoComment comments = 1;
  string next_cursor = 2;
  int32 total = 3;
}

message GetSuggestionRequest {
  string id = 1;
}

