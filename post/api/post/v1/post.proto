  bool from_wall = 6;
  google.protobuf.Timestamp created_at = 7;
  // The caller wrote it.
  bool mine = 8;
  int32 like_count = 9;
  // The caller likes it; set by ListTopicMessages only.
  bool liked = 10;
  // text is only its beginning: the request set text_limit.
  bool text_cut = 11;
}

