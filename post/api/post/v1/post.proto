message CreatePostRequest {
  // Text, photos or both. The caller has checked with the media service
  // that the photos are the author's.
  string text = 1;
  // At most 10.
  repeated string photo_ids = 2;
  // The owner of the wall to write on; empty for the caller's own wall.
  // The caller has checked that the owner's privacy lets the author write
  // there: post does not know users.
  string wall_id = 3;
  // The wall is a community's, as the caller knows: nobody owns it to be
  // notified of the post.
  bool club_wall = 4;
  // The post speaks for the community: the caller has checked with the
  // club service that the author may.
  bool from_wall = 5;
  // With from_wall: the post names its author ("Подпись автора").
  bool signed = 6;
  // The post of a new photo of a page, no longer written.
  reserved 7;
  reserved "avatar_update";
  // The post is marked as adult.
  bool nsfw = 8;
  // The people the text names ("@nickname"), at most 10, who hear of it:
  // the caller has asked the user service who they are.
  repeated string mentioned_ids = 9;
  // The poll the post asks, if any: with it the text and the photos may
  // be none.
  PollDraft poll = 10;
  // Documents of the author, at most 10, as the caller has checked: with
  // them the text and the photos may be none.
  repeated string document_ids = 11;
  // The card of the page the text links to, as the caller read it; its
  // picture is a photo of the author the caller has published already.
  // An edit keeps it.
  Link link = 12;
  // Votes others pay to see its photos and documents, 0 for free: only
  // on the author's own wall, with photos or documents.
  int64 price = 13;
}

// PollDraft is a poll as its author asks it.
message PollDraft {
  // One line, up to 128 characters.
  string title = 1;
  // 1 to 10, each one line of up to 128 characters.
  repeated string options = 2;
  // Nobody is shown who chose what.
  bool anonymous = 3;
  // Several options may be chosen at once.
  bool multiple = 4;
  // A vote cannot be taken back.
  bool locked = 5;
  // For how long the poll is open, 1 to 31 days; 0 for good.
  int32 days = 6;
}

// Poll is the poll of a post as the caller sees it.
message Poll {
  string post_id = 1;
  string title = 2;
  repeated PollOption options = 3;
  // How many people voted: with several choices fewer than the votes.
  int32 voter_count = 4;
  bool anonymous = 5;
  bool multiple = 6;
  bool locked = 7;
  // Unset for a poll open for good.
  google.protobuf.Timestamp ends_at = 8;
  // The poll takes no votes anymore.
  bool ended = 9;
  // The places of the options the caller chose, from 0; empty for one
  // who has not voted.
  repeated int32 chosen = 10;
}

message PollOption {
  string name = 1;
  int32 vote_count = 2;
}

message GetPollsRequest {
  repeated string post_ids = 1;
}

message GetPollsResponse {
  repeated Poll polls = 1;
}

message VotePollRequest {
  string post_id = 1;
  // The places of the options chosen, from 0: one, or several where the
  // poll lets.
  repeated int32 options = 2;
}

