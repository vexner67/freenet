  repeated Post posts = 1;
  // Empty on the last page.
  string next_cursor = 2;
  // All posts on the wall, for "N записей".
  int32 total = 3;
}

message ListFeedRequest {
  // author_ids and wall_ids: whom the caller reads the service knows
  // itself now (FollowSource), so the feed has no limit on them.
  reserved 1, 4;
  reserved "author_ids", "wall_ids";
  // Empty for the newest posts, else next_cursor of the previous page.
  string cursor = 2;
  // 1-50; anything else means 20.
  int32 limit = 3;
  // Leaves the posts marked as adult out, as the reader's settings say.
  bool hide_nsfw = 5;
  // "Все новости" of openvk: the posts of every wall, whomever the
  // caller reads. Without it the news are the caller's: what they and
  // the people they follow wrote, and every post on their walls and on
  // the walls of the caller's communities.
  bool everyone = 6;
  // The texts are cut to this many characters and say so (text_cut);
  // 0 for whole texts. Lists ask for the beginning: a page of whole texts
  // of 60 000 characters is megabytes.
  int32 text_limit = 7;
  // At most 1000: the people the reader blacklisted. What they wrote is
  // left out, on any wall, except what one wrote in the name of a
  // community.
  repeated string hidden_author_ids = 8;
  // Leaves only what a wall says itself: its owner on their wall, a
  // community in its name. openvk's "Показывать посты на чужих стенах"
  // taken off.
  bool own_only = 9;
  // At most 50: the walls the reader ignores ("Игнорируемые источники"
  // of openvk). Their posts are left out, whoever wrote them.
  repeated string ignored_wall_ids = 10;
  // "Сначала интересные": the posts of the last week by how interesting
  // they are to the caller (likes, comments, reposts, photos and the
  // caller's likes and comments of the same source, against the age),
  // then the older ones newest first. Asked on the first page; the
  // cursors it gives go on in the same order by themselves.
  bool ranked = 11;
}

