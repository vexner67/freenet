}

message ListAlbumPhotosRequest {
  string album_id = 1;
  string cursor = 2;
  int32 limit = 3;
}

message ListAlbumPhotosResponse {
  repeated AlbumPhoto photos = 1;
  // Empty on the last page.
  string next_cursor = 2;
  int32 total = 3;
}

message GetAlbumPhotoRequest {
  string id = 1;
}

message GetAlbumPhotoResponse {
  AlbumPhoto photo = 1;
  Album album = 2;
}

message EditAlbumPhotoRequest {
  string id = 1;
  string description = 2;
}

message EditAlbumPhotoResponse {
  AlbumPhoto photo = 1;
}

message DeleteAlbumPhotoRequest {
  string id = 1;
}

message SetAlbumCoverRequest {
  string album_id = 1;
  string photo_id = 2;
}

message MoveAlbumPhotoRequest {
  string photo_id = 1;
  // The album it goes to.
  string album_id = 2;
}

message LikeAlbumPhotoRequest {
