syntax = "proto3";

package post.v1;

option go_package = "github.com/vexner67/freenet/post/api/post/v1;postv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service PostService {
  // Require an access token; the author is the caller. A post is deleted
  // by its author or by the owner of its wall; on a community's wall by
  // its admins too, whom post asks the club service about.
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  rpc DeletePost(DeletePostRequest) returns (google.protobuf.Empty);
  // Requires an access token: shares a post on the caller's own wall. A
  // repost without text of a repost without text shares its original.
  rpc RepostPost(RepostPostRequest) returns (RepostPostResponse);
  // Requires an access token: the author changes the text and photos of
  // their post within a week of posting (editable_until); a repost keeps
  // what it shares and takes no photos.
  rpc EditPost(EditPostRequest) returns (EditPostResponse);
  // Require an access token: the owner of the wall (the admins of a
  // community) shows the post first on it, instead of the one pinned
  // before, or stops. Both idempotent.
  rpc PinPost(PinPostRequest) returns (google.protobuf.Empty);
  rpc UnpinPost(UnpinPostRequest) returns (google.protobuf.Empty);
  // Require an access token; the owner of the wall, or the admins of the
  // community it is. An archived post ("Архив записей" of openvk) is shown
  // to them only: no wall, feed or other post shows it, and it is no
  // longer pinned. A post with closed comments takes no new ones
  // (FailedPrecondition); those written before stay.
  rpc ArchivePost(ArchivePostRequest) returns (google.protobuf.Empty);
  rpc UnarchivePost(UnarchivePostRequest) returns (google.protobuf.Empty);
  // Requires an access token: puts away every post of a wall written in a
  // year, or puts them back ("Архивировать все записи за 2025" and
  // "Разархивировать все записи за 2025" of openvk); every year without
  // one ("Архивировать все записи целиком"). The owner of the wall or the
  // admins of its community only (PermissionDenied).
  rpc ArchiveWall(ArchiveWallRequest) returns (ArchiveWallResponse);
  // Requires an access token: the years the posts of a wall were written
  // in, archived or not, the latest first — the years of openvk's
  // archive. For those who keep the archive only (PermissionDenied).
  rpc ListWallYears(ListWallYearsRequest) returns (ListWallYearsResponse);
  rpc CloseComments(CloseCommentsRequest) returns (google.protobuf.Empty);
  rpc OpenComments(OpenCommentsRequest) returns (google.protobuf.Empty);

  // Public: one post.
  rpc GetPost(GetPostRequest) returns (GetPostResponse);
  // Public: at most 50 posts by ID, for the notifications page; posts that
  // are gone are left out, the order is not kept.
  rpc GetPosts(GetPostsRequest) returns (GetPostsResponse);
  // Public: how many posts there are on all walls, for the page "о сайте".
  rpc CountPosts(CountPostsRequest) returns (CountPostsResponse);
  // Public: a user's wall, newest first, whoever wrote the posts.
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);
  // Public: the posts written by several authors on any walls, but for
  // those that speak for a community, and every post on several walls,
  // newest first, for a news feed.
  rpc ListFeed(ListFeedRequest) returns (ListFeedResponse);

  // Require an access token; the caller likes the post. Both are
  // idempotent and return how many likes the post has now.
  rpc LikePost(LikePostRequest) returns (LikePostResponse);
  rpc UnlikePost(UnlikePostRequest) returns (UnlikePostResponse);
  // Public: who like the post or the comment, newest first ("Понравилось
  // N людям" of openvk); total is its like counter.
  rpc ListPostLikers(ListPostLikersRequest) returns (ListPostLikersResponse);
  // Public: the posts that share a post (who shared it), newest first,
  // without the archived ones; NotFound for a missing or an archived post.
  rpc ListReposts(ListRepostsRequest) returns (ListRepostsResponse);
  rpc ListCommentLikers(ListCommentLikersRequest) returns (ListCommentLikersResponse);

  // openvk's "Закладки": what the caller likes, newest like first, for
  // them alone — posts, comments under posts and photos of albums. What
  // sits on an archived post is left out and not counted.
  rpc ListLikedPosts(ListLikedPostsRequest) returns (ListLikedPostsResponse);
  rpc ListLikedComments(ListLikedCommentsRequest) returns (ListLikedCommentsResponse);
  rpc ListLikedAlbumPhotos(ListLikedAlbumPhotosRequest) returns (ListLikedAlbumPhotosResponse);
  // What the caller wrote, on their wall and on others', newest first
  // ("Написанные мной записи" of openvk): not what was archived on the
  // wall of another, nor what they suggested for a community.
  rpc ListOwnPosts(ListOwnPostsRequest) returns (ListOwnPostsResponse);
  // The posts of every wall a query finds, newest first ("Поиск
  // записей" of openvk): one tag ("#поход") finds the posts that say it,
  // any other text the posts that say it as a part of theirs, in any
  // case. What "Все новости" (ListFeed with everyone) shows the caller,
  // and nothing for an empty query.
  rpc SearchPosts(SearchPostsRequest) returns (SearchPostsResponse);

  // Public: the polls of the posts that ask one ("Опрос" of openvk), at
  // most 100 posts, in no particular order; with an access token each
  // says what the caller chose. The poll of an archived post is given to
  // those who keep the archive only.
  rpc GetPolls(GetPollsRequest) returns (GetPollsResponse);
  // Require an access token: the caller's vote in the poll of a post,
  // cast once and changed by taking it back first. NotFound for a post
  // without a poll or archived away from the caller; FailedPrecondition
  // when the poll has ended, the caller has voted already (VotePoll), has
  // not, or the poll does not let a vote be taken back (RetractPollVote).
  rpc VotePoll(VotePollRequest) returns (VotePollResponse);
  rpc RetractPollVote(RetractPollVoteRequest) returns (RetractPollVoteResponse);
  // Public: who chose an option of a poll, newest first ("Список
  // проголосовавших" of openvk); FailedPrecondition for an anonymous poll.
  rpc ListPollVoters(ListPollVotersRequest) returns (ListPollVotersResponse);

  // Require an access token; the author is the caller. A comment is
  // deleted by its author, by the author of the post or by the owner of
  // the wall, the admins of a community.
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (google.protobuf.Empty);
  // Require an access token; the caller likes the comment. Both are
  // idempotent and return how many likes the comment has now.
  rpc LikeComment(LikeCommentRequest) returns (LikeCommentResponse);
  rpc UnlikeComment(UnlikeCommentRequest) returns (UnlikeCommentResponse);
  // Public: the comments of a post, oldest first.
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  // Public: at most 50 comments by ID, like GetPosts.
  rpc GetComments(GetCommentsRequest) returns (GetCommentsResponse);
  // Public: the three newest comments of each of at most 50 posts, oldest
  // first, as "Микроблог" shows them under the posts of a wall. Archived
  // posts tell none.
  rpc ListLastComments(ListLastCommentsRequest) returns (ListLastCommentsResponse);

  // Require an access token: posts suggested for a community's wall
  // ("Предложка" of openvk), seen only by their authors and the
  // community's admins, whom post asks the club service about. The caller
  // of SuggestPost has checked that the author may suggest there and that
  // the photos are theirs.
  rpc SuggestPost(SuggestPostRequest) returns (SuggestPostResponse);
  // The caller's own suggestions with mine; all of them for the admins.
  rpc ListSuggestions(ListSuggestionsRequest) returns (ListSuggestionsResponse);
  // One suggestion, whole: for its author and the admins.
  rpc GetSuggestion(GetSuggestionRequest) returns (GetSuggestionResponse);
  // An admin publishes a suggestion as a new post for the community.
  rpc PublishSuggestion(PublishSuggestionRequest) returns (PublishSuggestionResponse);
  // The author withdraws a suggestion, or an admin declines it.
  rpc DeleteSuggestion(DeleteSuggestionRequest) returns (google.protobuf.Empty);

  // Require an access token: posts that wait for their time ("отложенные
  // записи" of VK), seen only by their authors and, on a community's
  // wall, the community's admins, whom post asks the club service about.
  // A post waits for the caller's own wall or speaks for a community: the
  // caller of PostponePost has checked that the author may and that the
  // photos are theirs. When its time comes, post publishes it as a new
  // post, dated then.
  rpc PostponePost(PostponePostRequest) returns (PostponePostResponse);
  // All the posts that wait for a wall, the soonest first: for the owner
  // of a user's wall and the admins of a community.
  rpc ListPostponed(ListPostponedRequest) returns (ListPostponedResponse);
  // One postponed post, whole: for those who list it and its author.
  rpc GetPostponed(GetPostponedRequest) returns (GetPostponedResponse);
  // The author, or an admin of the community it speaks for, changes what
  // it says and when it comes out.
  rpc EditPostponed(EditPostponedRequest) returns (EditPostponedResponse);
  // The same publish it at once ("Опубликовать сейчас").
  rpc PublishPostponed(PublishPostponedRequest) returns (PublishPostponedResponse);
  // The author takes it back, or an admin deletes it, with its photos.
  rpc DeletePostponed(DeletePostponedRequest) returns (google.protobuf.Empty);

  // Require an access token: stories ("истории" of VK; openvk has none),
  // a photo with a few words a person shows for a day to those who read
  // them. The caller of CreateStory has checked with the media service
  // that the photo is theirs; post keeps it for good at once and deletes
  // it with the story when the day is over.
  rpc CreateStory(CreateStoryRequest) returns (CreateStoryResponse);
  // The stories above the caller's news: theirs and of the people they
  // follow, grouped by author — the caller first, then those with a story
  // the caller has not viewed, then the rest; each one's stories the
  // oldest first. A deleted page and a closed one keep theirs to
  // themselves, as their walls.
  rpc ListFeedStories(ListFeedStoriesRequest) returns (ListFeedStoriesResponse);
  // The live stories of one person the caller sees, the oldest first.
  rpc ListUserStories(ListUserStoriesRequest) returns (ListUserStoriesResponse);
  // A live story the caller sees.
  rpc GetStory(GetStoryRequest) returns (GetStoryResponse);
  // The caller viewed a story they see; once is enough. Their own is not
  // counted.
  rpc ViewStory(ViewStoryRequest) returns (google.protobuf.Empty);
  // Who viewed a story, the latest first: for its author alone.
  rpc ListStoryViewers(ListStoryViewersRequest) returns (ListStoryViewersResponse);
  // The author deletes a story with its photo.
  rpc DeleteStory(DeleteStoryRequest) returns (google.protobuf.Empty);
  // The caller likes a story they see, or takes the like back; both are
  // idempotent. Its author hears of the like.
  rpc LikeStory(LikeStoryRequest) returns (google.protobuf.Empty);
  rpc UnlikeStory(UnlikeStoryRequest) returns (google.protobuf.Empty);
  // The caller comments a story they see, in text only; its author hears
  // of it. The caller of CreateStoryComment has checked the blacklist.
  rpc CreateStoryComment(CreateStoryCommentRequest) returns (CreateStoryCommentResponse);
  // The comments of a story the caller sees, the oldest first.
  rpc ListStoryComments(ListStoryCommentsRequest) returns (ListStoryCommentsResponse);
  // The author of a comment or of its story deletes it.
  rpc DeleteStoryComment(DeleteStoryCommentRequest) returns (google.protobuf.Empty);

  // The discussions of communities ("Обсуждения" of openvk). The caller
  // of CreateTopic has checked with the club service that the author may
  // start a topic there and, with from_wall, speak for the community, and
  // that the photos are theirs; the rest post asks the club service about.
  rpc CreateTopic(CreateTopicRequest) returns (CreateTopicResponse);
  // Public.
  rpc GetTopic(GetTopicRequest) returns (GetTopicResponse);
  // Public: the topics of a club, pinned first, then the most recently
  // active.
  rpc ListTopics(ListTopicsRequest) returns (ListTopicsResponse);
  // The author or an admin renames and closes a topic; only an admin pins
  // and restricts it.
  rpc EditTopic(EditTopicRequest) returns (EditTopicResponse);
  rpc DeleteTopic(DeleteTopicRequest) returns (google.protobuf.Empty);
  // Nobody writes in a closed topic, only the admins in a restricted one.
  // The caller has checked from_wall and the photos, as for CreateTopic.
  rpc CreateTopicMessage(CreateTopicMessageRequest) returns (CreateTopicMessageResponse);
  // Public: oldest first.
  rpc ListTopicMessages(ListTopicMessagesRequest) returns (ListTopicMessagesResponse);
  // Public: one message, whole; liked is not told.
  rpc GetTopicMessage(GetTopicMessageRequest) returns (GetTopicMessageResponse);
  // Its author or an admin.
  rpc DeleteTopicMessage(DeleteTopicMessageRequest) returns (google.protobuf.Empty);
  // A heart on a message of a topic, as on a comment; idempotent, nobody
  // is notified.
  rpc LikeTopicMessage(LikeTopicMessageRequest) returns (LikeTopicMessageResponse);
  rpc UnlikeTopicMessage(UnlikeTopicMessageRequest) returns (UnlikeTopicMessageResponse);
  // Who put a heart on a message of a topic, newest first ("Понравилось N
  // людям"). Public.
  rpc ListTopicMessageLikers(ListTopicMessageLikersRequest) returns (ListTopicMessageLikersResponse);
  // The messages of topics with these IDs that exist, in no order: a
  // notification quotes them. Public.
  rpc GetTopicMessages(GetTopicMessagesRequest) returns (GetTopicMessagesResponse);

  // Photo albums of people and communities ("Альбомы" of openvk). An
  // album of the caller, without club_id, or of a community its admins
  // create, whom post asks the club service about.
  rpc CreateAlbum(CreateAlbumRequest) returns (CreateAlbumResponse);
  // Public.
  rpc GetAlbum(GetAlbumRequest) returns (GetAlbumResponse);
  // Public: the albums of a person or a community, newest first.
  rpc ListAlbums(ListAlbumsRequest) returns (ListAlbumsResponse);
  // Its owner or the admins of the community that owns it.
  rpc EditAlbum(EditAlbumRequest) returns (EditAlbumResponse);
  // With its photos; as EditAlbum.
  rpc DeleteAlbum(DeleteAlbumRequest) returns (google.protobuf.Empty);
  // Up to 10 photos the caller uploaded, which the caller of
  // AddAlbumPhotos has checked with the media service; as EditAlbum.
  rpc AddAlbumPhotos(AddAlbumPhotosRequest) returns (AddAlbumPhotosResponse);
  // A new photo of a page, which the caller uploaded and the caller of
  // AddAvatarPhoto has checked with the media service, goes into its
  // "Фотографии со страницы", made with the first one: the caller's page
  // or of a community they run.
  rpc AddAvatarPhoto(AddAvatarPhotoRequest) returns (AddAvatarPhotoResponse);
  // Public: oldest first.
  rpc ListAlbumPhotos(ListAlbumPhotosRequest) returns (ListAlbumPhotosResponse);
  // Public: a photo with its album.
  rpc GetAlbumPhoto(GetAlbumPhotoRequest) returns (GetAlbumPhotoResponse);
  // Who uploaded the photo only.
  rpc EditAlbumPhoto(EditAlbumPhotoRequest) returns (EditAlbumPhotoResponse);
  // Who uploaded it or whoever may edit its album.
  rpc DeleteAlbumPhoto(DeleteAlbumPhotoRequest) returns (google.protobuf.Empty);
  // Require an access token; whoever may edit the album. SetAlbumCover
  // makes a photo of the album show it ("Обложка альбома") instead of its
  // first one. MoveAlbumPhoto puts a photo in another album of the same
  // owner, one made by people (FailedPrecondition for one the site keeps).
  rpc SetAlbumCover(SetAlbumCoverRequest) returns (google.protobuf.Empty);
  rpc MoveAlbumPhoto(MoveAlbumPhotoRequest) returns (google.protobuf.Empty);
  // Require an access token: the heart under a photo, as under a post.
  rpc LikeAlbumPhoto(LikeAlbumPhotoRequest) returns (LikeAlbumPhotoResponse);
  rpc UnlikeAlbumPhoto(UnlikeAlbumPhotoRequest) returns (UnlikeAlbumPhotoResponse);
  // Public: who like the photo, newest first, as ListPostLikers.
  rpc ListAlbumPhotoLikers(ListAlbumPhotoLikersRequest) returns (ListAlbumPhotoLikersResponse);
  // Requires an access token: a comment under a photo, text only; the
  // caller of CreatePhotoComment has checked the blacklists.
  rpc CreatePhotoComment(CreatePhotoCommentRequest) returns (CreatePhotoCommentResponse);
  // Requires an access token: its author, who uploaded the photo, the
  // owner of the album or the admins of its community.
  rpc DeletePhotoComment(DeletePhotoCommentRequest) returns (google.protobuf.Empty);
  // Public: the comments of a photo, oldest first.
  rpc ListPhotoComments(ListPhotoCommentsRequest) returns (ListPhotoCommentsResponse);
  // Public: one comment, whole.
  rpc GetPhotoComment(GetPhotoCommentRequest) returns (GetPhotoCommentResponse);
  // The comments of photos with these IDs that exist, in no order: a
  // notification quotes them. Public.
  rpc GetPhotoComments(GetPhotoCommentsRequest) returns (GetPhotoCommentsResponse);
  // A heart on a comment of a photo, as on a comment of a post:
  // idempotent, the response counts them.
  rpc LikePhotoComment(LikePhotoCommentRequest) returns (LikePhotoCommentResponse);
  rpc UnlikePhotoComment(UnlikePhotoCommentRequest) returns (UnlikePhotoCommentResponse);
  // Who put a heart on a comment of a photo, newest first. Public.
  rpc ListPhotoCommentLikers(ListPhotoCommentLikersRequest) returns (ListPhotoCommentLikersResponse);

  // Documents ("Мои Документы" of openvk): files of a person whose bytes
  // the media service keeps under the same ID; posts and messages attach
  // them. Only the owner lists, renames and deletes them.
  rpc AddDocument(AddDocumentRequest) returns (AddDocumentResponse);
  // The caller's documents, newest first.
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  // Public: the documents with these IDs that exist, in no particular
  // order, for what attaches them.
  rpc GetDocuments(GetDocumentsRequest) returns (GetDocumentsResponse);
  rpc RenameDocument(RenameDocumentRequest) returns (RenameDocumentResponse);
  // The media service deletes the bytes after; what attached the
  // document loses it.
  rpc DeleteDocument(DeleteDocumentRequest) returns (google.protobuf.Empty);

  // Internal, for user: the user's page was deleted and not restored in
  // time. Their posts and the posts on their wall go, with all their likes
  // and comments, and their likes and comments on others' posts. Idempotent.
  rpc PurgeUser(PurgeUserRequest) returns (google.protobuf.Empty);
  // Internal, for club: the community is gone. The posts on its wall go,
  // with their likes and comments, and so do what was suggested and
  // postponed for it, its topics and its albums. Idempotent.
  rpc PurgeClub(PurgeClubRequest) returns (google.protobuf.Empty);
  // Internal, for user: the user deleted their page. Their likes and
  // their votes in polls leave the counts and the lists of who liked,
  // kept aside until the page is restored or erased. Idempotent.
  rpc HoldUserReactions(HoldUserReactionsRequest) returns (google.protobuf.Empty);
  // Internal, for user: the user restored their page. What was kept
  // aside is counted again, but for what was deleted meanwhile.
  // Idempotent.
  rpc ReleaseUserReactions(ReleaseUserReactionsRequest) returns (google.protobuf.Empty);
  // Internal, for user and club: the reader follows a person or joined a
  // community, whose posts are in the reader's news (ListFeed) from now
  // on. Idempotent.
  rpc FollowSource(FollowSourceRequest) returns (google.protobuf.Empty);
  // Internal, for user and club: the reader no longer follows the person
  // or left the community. Idempotent.
  rpc UnfollowSource(UnfollowSourceRequest) returns (google.protobuf.Empty);
  // Internal, for user and club: a stretch of whom the reader follows, or
  // of who is in the community, as the service has it now. What the news
  // keep within the stretch becomes exactly that: told now and then, it
  // mends whatever a lost FollowSource or UnfollowSource left behind.
  // Idempotent.
  rpc SyncSources(SyncSourcesRequest) returns (google.protobuf.Empty);
  // Internal, for user and club: the wall is closed — of a person whose
  // profile is closed, read by the owner and those the owner follows, or
  // of a closed community, read by its members. The others do not find
  // its posts, in the news or by ID. Idempotent.
  rpc CloseWall(CloseWallRequest) returns (google.protobuf.Empty);
  // Internal, for user and club: everyone reads the wall again.
  // Idempotent.
  rpc OpenWall(OpenWallRequest) returns (google.protobuf.Empty);
}

// Public methods that return posts fill liked when the caller sends an
// access token.
message Post {
  string id = 1;
  string author_id = 2;
  // Empty when the post has photos only.
  string text = 3;
  google.protobuf.Timestamp created_at = 4;
  int32 like_count = 5;
  int32 comment_count = 6;
  // The caller likes the post; false without an access token.
  bool liked = 7;
  // Photos of the author in the media service, in the order shown.
  repeated string photo_ids = 8;
  // The owner of the wall the post is on: author_id on the author's own wall.
  string wall_id = 9;
  // The shared post when this is a repost, else empty. It may be gone:
  // a repost outlives it.
  string repost_of = 10;
  int32 repost_count = 11;
  // Unset for a post never edited.
  google.protobuf.Timestamp edited_at = 12;
  // Shown first on its wall; ListPosts puts it on top of the first page.
  bool pinned = 13;
  // Until when the author may edit the post.
  google.protobuf.Timestamp editable_until = 14;
  // The post speaks for its wall, a community, rather than for its
  // author, whom readers are not shown.
  bool from_wall = 15;
  // The caller wrote the post and still has it, to edit and delete; false
  // without an access token, and for a post suggested and published for
  // a community, which is the community's. Tells the author a post that
  // speaks for a community, whose author_id the gateway does not show.
  bool mine = 16;
  // A post that speaks for a community names its author, author_id, as
  // "Автор: ..." under it.
  bool signed = 17;
  // The post of a new photo of a page, no longer written.
  reserved 18;
  reserved "avatar_update";
  // A photo of an album the post shares ("Поделиться" under a photo);
  // empty for none. A deleted photo leaves the post.
  string shared_photo_id = 19;
  // The post is in the archive of its wall.
  bool archived = 20;
  // Nobody comments the post anymore.
  bool comments_closed = 21;
  // The author marked the post as adult ("Содержит NSFW-контент").
  bool nsfw = 22;
  // text is only its beginning: the request set text_limit, and the post
  // says more.
  bool text_cut = 23;
  // The post asks a poll: GetPolls gives it.
  bool polled = 24;
  // Documents the post attaches, in the order shown; GetDocuments tells
  // what they are, and a deleted one is gone.
  repeated string document_ids = 25;
  // The card of the page the text links to; unset for none.
  Link link = 26;
  // Votes others pay to see its photos and documents, 0 for free; the
  // caller hides them from those who have not paid.
  int64 price = 27;
}

// Link is the card of a page a post links to, as the page tells it.
message Link {
  // An http or https address, up to 2048 bytes.
  string url = 1;
  // One line, up to 256 characters; never empty.
  string title = 2;
  // One line, up to 512 characters.
  string description = 3;
  // The name of the site, one line, up to 128 characters.
  string site = 4;
  // The picture: a published photo of the post's author in media, which
  // goes with the post; empty for none.
  string photo_id = 5;
}

message Comment {
  string id = 1;
  string post_id = 2;
  string author_id = 3;
  // Empty when the comment has photos only.
  string text = 4;
  google.protobuf.Timestamp created_at = 5;
  // Photos of the author in the media service, in the order shown.
  repeated string photo_ids = 6;
  // The comment this one answers; empty for none, and once it is deleted.
  string reply_to_id = 7;
  int32 like_count = 8;
  // The caller likes the comment; false without an access token.
  bool liked = 9;
  // The comment speaks for the community whose wall its post is on
  // ("От имени сообщества"); readers are not told author_id.
  bool from_wall = 10;
  // The caller wrote the comment; false without an access token. Tells
  // the author a comment that speaks for a community.
  bool mine = 11;
  // text is only its beginning: the request set text_limit, and the
  // comment says more.
  bool text_cut = 12;
}

// Suggestion is a post suggested for a community's wall.
message Suggestion {
  string id = 1;
  // The community.
  string wall_id = 2;
  string author_id = 3;
  string text = 4;
  repeated string photo_ids = 5;
  google.protobuf.Timestamp created_at = 6;
  // text is only its beginning: the request set text_limit.
  bool text_cut = 7;
}

message SuggestPostRequest {
  // The community.
  string wall_id = 1;
  // Text, photos or both.
  string text = 2;
  // At most 10.
  repeated string photo_ids = 3;
}

message SuggestPostResponse {
  Suggestion suggestion = 1;
}

message ListSuggestionsRequest {
  string wall_id = 1;
  // Only the caller's.
  bool mine = 2;
  // Empty for the newest, else next_cursor of the previous page.
  string cursor = 3;
  // 1-50; anything else means 20.
  int32 limit = 4;
  // The texts are cut to this many characters and say so (text_cut);
  // 0 for whole texts.
  int32 text_limit = 5;
}

message ListSuggestionsResponse {
  repeated Suggestion suggestions = 1;
  // Empty on the last page.
  string next_cursor = 2;
  // How many there are on all pages.
  int32 total = 3;
}

message PublishSuggestionRequest {
  string id = 1;
  // What the post says, as the admin may have changed it; it keeps the
  // suggested photos.
  string text = 2;
  // The post names its author ("Подпись автора").
  bool signed = 3;
}

message PublishSuggestionResponse {
  Post post = 1;
}

message DeleteSuggestionRequest {
  string id = 1;
}

// PostponedPost is a post that waits for its time.
message PostponedPost {
  string id = 1;
  // The author's own wall, or the community the post speaks for.
  string wall_id = 2;
  string author_id = 3;
  string text = 4;
  repeated string photo_ids = 5;
  bool from_wall = 6;
  // With from_wall: the post will name its author ("Подпись автора").
  bool signed = 7;
  bool nsfw = 8;
  // The people the text names, who will hear of the post.
  repeated string mentioned_ids = 9;
  google.protobuf.Timestamp publish_at = 10;
  google.protobuf.Timestamp created_at = 11;
  // text is only its beginning: the request set text_limit.
  bool text_cut = 12;
}

message PostponePostRequest {
  // Text, photos or both; never a repost or a poll. The caller has
  // checked with the media service that the photos are the author's.
  string text = 1;
  // At most 10.
  repeated string photo_ids = 2;
  // A community's wall, for from_wall; empty for the caller's own.
  string wall_id = 3;
  // The post speaks for the community: the caller has checked with the
  // club service that the author may.
  bool from_wall = 4;
  bool signed = 5;
  bool nsfw = 6;
  // As in CreatePostRequest: they hear of the post when it comes out.
  repeated string mentioned_ids = 7;
  // When to publish it: ahead of now, within a year.
  google.protobuf.Timestamp publish_at = 8;
}

