  PhotoComment comment = 1;
}

message CountPostsRequest {}

message CountPostsResponse {
  int32 count = 1;
}

// A file of "Мои Документы".
message Document {
  string id = 1;
  string owner_id = 2;
  string name = 3;
  // The extension of the file in lower case: "pdf".
  string ext = 4;
  // Bytes.
  int64 size = 5;
  google.protobuf.Timestamp created_at = 6;
}

message AddDocumentRequest {
  // The ID the media service gave the caller's file.
  string id = 1;
  // The name of the file: its extension is the format of the document.
  string file_name = 2;
  int64 size = 3;
}

message AddDocumentResponse {
  Document document = 1;
}

message ListDocumentsRequest {
  // Empty for the newest, else next_cursor of the previous page.
  string cursor = 1;
  int32 limit = 2;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
  string next_cursor = 2;
  // The caller's documents on all pages.
  int32 total = 3;
}

message GetDocumentsRequest {
  // At most 50.
  repeated string ids = 1;
}

message GetDocumentsResponse {
  repeated Document documents = 1;
}

message RenameDocumentRequest {
  string id = 1;
  string name = 2;
}

message RenameDocumentResponse {
  Document document = 1;
}

message DeleteDocumentRequest {
  string id = 1;
}

// Story is a photo with a few words shown for a day.
message Story {
  string id = 1;
  string author_id = 2;
  string photo_id = 3;
  // Up to 200 characters; may be empty.
  string text = 4;
  google.protobuf.Timestamp created_at = 5;
  // A day after created_at, when it is gone.
  google.protobuf.Timestamp expires_at = 6;
  // The caller viewed it.
  bool viewed = 7;
  // The caller told it.
  bool mine = 8;
  // Of the caller's own: how many others viewed it.
  int32 views = 9;
  // The caller liked it.
  bool liked = 10;
  // How many liked and commented it, deleted pages aside.
  int32 like_count = 11;
  int32 comment_count = 12;
}

message CreateStoryRequest {
  // A photo of the caller's, uploaded to the media service.
  string photo_id = 1;
  string text = 2;
}

message CreateStoryResponse {
  Story story = 1;
}

message ListFeedStoriesRequest {
  // As in ListFeedRequest: the people the caller blacklisted, at most
  // 1000, and the sources they ignore, at most 50.
  repeated string hidden_author_ids = 1;
  repeated string ignored_wall_ids = 2;
}

message ListFeedStoriesResponse {
  repeated Story stories = 1;
}

message ListUserStoriesRequest {
  string user_id = 1;
  // As in ListFeedRequest.
  repeated string hidden_author_ids = 2;
}

message ListUserStoriesResponse {
  repeated Story stories = 1;
}

message GetStoryRequest {
  string id = 1;
}

message GetStoryResponse {
  Story story = 1;
}

message ViewStoryRequest {
  string id = 1;
  // The viewer has Freenet Prime and watches unseen: the story is viewed
  // for them, but its author is not told.
  bool hidden = 2;
}

message ListStoryViewersRequest {
  string id = 1;
  // Empty for the latest viewers, else next_cursor of the previous page.
  string cursor = 2;
  // 1-50; anything else means 20.
  int32 limit = 3;
}

// StoryViewer is someone who viewed a story.
message StoryViewer {
  string user_id = 1;
  google.protobuf.Timestamp viewed_at = 2;
}

message ListStoryViewersResponse {
  repeated StoryViewer viewers = 1;
  // Empty on the last page.
  string next_cursor = 2;
  // How many viewed it.
  int32 total = 3;
}

message DeleteStoryRequest {
  string id = 1;
}

message LikeStoryRequest {
  string id = 1;
}

message UnlikeStoryRequest {
  string id = 1;
}

// StoryComment is a few words under a story.
message StoryComment {
  string id = 1;
  string story_id = 2;
  string author_id = 3;
  string text = 4;
  google.protobuf.Timestamp created_at = 5;
  // The caller wrote it.
  bool mine = 6;
}

message CreateStoryCommentRequest {
  string story_id = 1;
  // 1-1000 characters.
  string text = 2;
}

message CreateStoryCommentResponse {
  StoryComment comment = 1;
}

message ListStoryCommentsRequest {
  string story_id = 1;
  // Empty for the oldest comments, else next_cursor of the previous page.
  string cursor = 2;
  // 1-50; anything else means 20.
  int32 limit = 3;
}

message ListStoryCommentsResponse {
  repeated StoryComment comments = 1;
  // Empty on the last page.
  string next_cursor = 2;
  // How many comments it has.
  int32 total = 3;
}

message DeleteStoryCommentRequest {
  string id = 1;
}
