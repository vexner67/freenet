syntax = "proto3";

package post.v1;

option go_package = "github.com/vexner67/freenet/post/api/post/v1;postv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service PostService {
  // Require an access token; the author is the caller. A post is deleted
  // by its author or by the owner of its wall.
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  rpc DeletePost(DeletePostRequest) returns (google.protobuf.Empty);
  // Requires an access token: shares a post on the caller's own wall. A
  // repost without text of a repost without text shares its original.
  rpc RepostPost(RepostPostRequest) returns (RepostPostResponse);
  // Requires an access token: the author changes the text and photos of
  // their post within a week of posting (editable_until); a repost keeps
  // what it shares and takes no photos.
  rpc EditPost(EditPostRequest) returns (EditPostResponse);
  // Require an access token: the owner of the wall shows the post first
  // on it, instead of the one pinned before, or stops. Both idempotent.
  rpc PinPost(PinPostRequest) returns (google.protobuf.Empty);
  rpc UnpinPost(UnpinPostRequest) returns (google.protobuf.Empty);

  // Public: one post.
  rpc GetPost(GetPostRequest) returns (GetPostResponse);
  // Public: at most 50 posts by ID, for the notifications page; posts that
  // are gone are left out, the order is not kept.
  rpc GetPosts(GetPostsRequest) returns (GetPostsResponse);
  // Public: a user's wall, newest first, whoever wrote the posts.
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);
  // Public: the posts written by several authors on any walls, newest
  // first, for a news feed.
  rpc ListFeed(ListFeedRequest) returns (ListFeedResponse);

  // Require an access token; the caller likes the post. Both are
  // idempotent and return how many likes the post has now.
  rpc LikePost(LikePostRequest) returns (LikePostResponse);
  rpc UnlikePost(UnlikePostRequest) returns (UnlikePostResponse);

  // Require an access token; the author is the caller. A comment is
  // deleted by its author or by the author of the post.
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (google.protobuf.Empty);
  // Require an access token; the caller likes the comment. Both are
  // idempotent and return how many likes the comment has now.
  rpc LikeComment(LikeCommentRequest) returns (LikeCommentResponse);
  rpc UnlikeComment(UnlikeCommentRequest) returns (UnlikeCommentResponse);
  // Public: the comments of a post, oldest first.
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  // Public: at most 50 comments by ID, like GetPosts.
  rpc GetComments(GetCommentsRequest) returns (GetCommentsResponse);

  // Internal, for user: the user's page was deleted and not restored in
  // time. Their posts and the posts on their wall go, with all their likes
  // and comments, and their likes and comments on others' posts. Idempotent.
  rpc PurgeUser(PurgeUserRequest) returns (google.protobuf.Empty);
}

// Public methods that return posts fill liked when the caller sends an
// access token.
message Post {
  string id = 1;
  string author_id = 2;
  // Empty when the post has photos only.
  string text = 3;
  google.protobuf.Timestamp created_at = 4;
  int32 like_count = 5;
  int32 comment_count = 6;
  // The caller likes the post; false without an access token.
  bool liked = 7;
  // Photos of the author in the media service, in the order shown.
  repeated string photo_ids = 8;
  // The owner of the wall the post is on: author_id on the author's own wall.
  string wall_id = 9;
  // The shared post when this is a repost, else empty. It may be gone:
  // a repost outlives it.
  string repost_of = 10;
  int32 repost_count = 11;
  // Unset for a post never edited.
  google.protobuf.Timestamp edited_at = 12;
  // Shown first on its wall; ListPosts puts it on top of the first page.
  bool pinned = 13;
  // Until when the author may edit the post.
  google.protobuf.Timestamp editable_until = 14;
}

message Comment {
  string id = 1;
  string post_id = 2;
  string author_id = 3;
  // Empty when the comment has photos only.
  string text = 4;
  google.protobuf.Timestamp created_at = 5;
  // Photos of the author in the media service, in the order shown.
  repeated string photo_ids = 6;
  // The comment this one answers; empty for none, and once it is deleted.
  string reply_to_id = 7;
  int32 like_count = 8;
  // The caller likes the comment; false without an access token.
  bool liked = 9;
}

message CreatePostRequest {
  // Text, photos or both. The caller has checked with the media service
  // that the photos are the author's.
  string text = 1;
  // At most 10.
  repeated string photo_ids = 2;
  // The owner of the wall to write on; empty for the caller's own wall.
  // The caller has checked that the owner's privacy lets the author write
  // there: post does not know users.
  string wall_id = 3;
}

message CreatePostResponse {
  Post post = 1;
}

message RepostPostRequest {
  string post_id = 1;
  // What the caller says about it; may be empty.
  string text = 2;
}

message RepostPostResponse {
  Post post = 1;
}

message DeletePostRequest {
  string id = 1;
}

message EditPostRequest {
  string id = 1;
  // Text, photos or both, as in CreatePostRequest; the caller has checked
  // that the photos are the author's.
  string text = 2;
  repeated string photo_ids = 3;
}

message EditPostResponse {
  Post post = 1;
}

message PinPostRequest {
  string id = 1;
}

message UnpinPostRequest {
  string id = 1;
}

message GetPostRequest {
  string id = 1;
}

message GetPostResponse {
  Post post = 1;
}

message GetPostsRequest {
  repeated string ids = 1;
}

message GetPostsResponse {
  repeated Post posts = 1;
}

message ListPostsRequest {
  // The owner of the wall (author_id before posts on others' walls).
  string wall_id = 1;
  // Empty for the newest posts, else next_cursor of the previous page.
  string cursor = 2;
  // 1-50; anything else means 20.
  int32 limit = 3;
}

message ListPostsResponse {
  repeated Post posts = 1;
  // Empty on the last page.
  string next_cursor = 2;
  // All posts on the wall, for "N записей".
  int32 total = 3;
}

message ListFeedRequest {
  // At most 1001: the people a user follows and the user.
  repeated string author_ids = 1;
  // Empty for the newest posts, else next_cursor of the previous page.
  string cursor = 2;
  // 1-50; anything else means 20.
  int32 limit = 3;
}

message ListFeedResponse {
  repeated Post posts = 1;
  // Empty on the last page.
  string next_cursor = 2;
}

message LikePostRequest {
  string post_id = 1;
}

message LikePostResponse {
  int32 like_count = 1;
}

message UnlikePostRequest {
  string post_id = 1;
}

message UnlikePostResponse {
  int32 like_count = 1;
}

message CreateCommentRequest {
  string post_id = 1;
  // Text, photos or both. The caller has checked with the media service
  // that the photos are the author's.
  string text = 2;
  repeated string photo_ids = 3;
  // The comment under the same post this one answers; empty for none.
  string reply_to_id = 4;
}

message CreateCommentResponse {
  Comment comment = 1;
}

message DeleteCommentRequest {
  string id = 1;
}

message LikeCommentRequest {
  string comment_id = 1;
}

message LikeCommentResponse {
  int32 like_count = 1;
}

message UnlikeCommentRequest {
  string comment_id = 1;
}

message UnlikeCommentResponse {
  int32 like_count = 1;
}

message ListCommentsRequest {
  string post_id = 1;
  // Empty for the first comments, else next_cursor of the previous page.
  string cursor = 2;
  // 1-50; anything else means 20.
  int32 limit = 3;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
  // Empty on the last page.
  string next_cursor = 2;
  // All comments of the post, for "Комментарии (N)".
  int32 total = 3;
}

message GetCommentsRequest {
  repeated string ids = 1;
}

message GetCommentsResponse {
  repeated Comment comments = 1;
}

message PurgeUserRequest {
  string user_id = 1;
}
