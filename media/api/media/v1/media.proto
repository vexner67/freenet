syntax = "proto3";

package media.v1;

option go_package = "github.com/vexner67/freenet/media/api/media/v1;mediav1";

import "google/protobuf/empty.proto";

service MediaService {
  // Require an access token; the avatar belongs to the caller. A new avatar
  // does not replace the old one by itself: point the profile to it, then
  // DeleteAvatars keeping it.
  rpc UploadAvatar(UploadAvatarRequest) returns (UploadAvatarResponse);
  rpc DeleteAvatars(DeleteAvatarsRequest) returns (google.protobuf.Empty);

  // Public: an avatar as JPEG.
  rpc GetAvatar(GetAvatarRequest) returns (GetAvatarResponse);

  // Require an access token; the photos belong to the caller. A photo is
  // uploaded before the post that shows it; ListOwnPhotos tells which of
  // the given ones the caller has, DeletePhotos removes them with the post.
  rpc UploadPhoto(UploadPhotoRequest) returns (UploadPhotoResponse);
  rpc ListOwnPhotos(ListOwnPhotosRequest) returns (ListOwnPhotosResponse);
  rpc DeletePhotos(DeletePhotosRequest) returns (google.protobuf.Empty);

  // Public: a photo as JPEG.
  rpc GetPhoto(GetPhotoRequest) returns (GetPhotoResponse);
}

message UploadAvatarRequest {
  // JPEG, PNG, GIF or WebP, at most 8 MB, at least 50x50.
  bytes image = 1;
}

message UploadAvatarResponse {
  string avatar_id = 1;
}

message DeleteAvatarsRequest {
  // The avatar to keep; empty deletes them all.
  string keep_avatar_id = 1;
}

enum AvatarSize {
  AVATAR_SIZE_UNSPECIFIED = 0;
  // 400x400, the profile photo.
  AVATAR_SIZE_LARGE = 1;
  // 100x100, next to posts and in lists.
  AVATAR_SIZE_SMALL = 2;
}

message GetAvatarRequest {
  string user_id = 1;
  string avatar_id = 2;
  AvatarSize size = 3;
}

message GetAvatarResponse {
  bytes image = 1;
}

message UploadPhotoRequest {
  // JPEG, PNG, GIF or WebP, at most 8 MB.
  bytes image = 1;
}

message UploadPhotoResponse {
  string photo_id = 1;
}

message ListOwnPhotosRequest {
  // At most 10.
  repeated string photo_ids = 1;
}

message ListOwnPhotosResponse {
  // Those of photo_ids the caller has.
  repeated string photo_ids = 1;
}

message DeletePhotosRequest {
  // At most 10; missing ones are fine.
  repeated string photo_ids = 1;
}

enum PhotoSize {
  PHOTO_SIZE_UNSPECIFIED = 0;
  // Up to 1280 on the longer side, opened on its own.
  PHOTO_SIZE_LARGE = 1;
  // Up to 640 on the longer side, in the post.
  PHOTO_SIZE_SMALL = 2;
}

message GetPhotoRequest {
  string user_id = 1;
  string photo_id = 2;
  PhotoSize size = 3;
}

message GetPhotoResponse {
  bytes image = 1;
}
