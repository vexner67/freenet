syntax = "proto3";

package media.v1;

option go_package = "github.com/vexner67/freenet/media/api/media/v1;mediav1";

import "google/protobuf/empty.proto";

service MediaService {
  // Require an access token; the avatar belongs to the caller. A new avatar
  // does not replace the old one by itself: point the profile to it, then
  // DeleteAvatars keeping it.
  rpc UploadAvatar(UploadAvatarRequest) returns (UploadAvatarResponse);
  rpc DeleteAvatars(DeleteAvatarsRequest) returns (google.protobuf.Empty);

  // Public: an avatar as JPEG.
  rpc GetAvatar(GetAvatarRequest) returns (GetAvatarResponse);

  // Internal, for the gateway, which has checked that the caller (whose
  // access token comes along) runs the club: the avatars of a community,
  // filed under its ID and served by GetAvatar as a user's.
  rpc UploadClubAvatar(UploadClubAvatarRequest) returns (UploadAvatarResponse);
  rpc DeleteClubAvatars(DeleteClubAvatarsRequest) returns (google.protobuf.Empty);
  // Internal, for the gateway, as UploadClubAvatar: photos of a community,
  // its backdrop ("Фон страницы"), filed under its ID, kept for good at
  // once and served by GetPhoto; DeleteClubPhotos removes those it no
  // longer shows.
  rpc UploadClubPhoto(UploadClubPhotoRequest) returns (UploadPhotoResponse);
  rpc DeleteClubPhotos(DeleteClubPhotosRequest) returns (google.protobuf.Empty);

  // Require an access token; the photos belong to the caller. A photo is
  // uploaded before the post that shows it, and a photo that no post
  // publishes is deleted after a while.
  rpc UploadPhoto(UploadPhotoRequest) returns (UploadPhotoResponse);
  // ClaimPhotos takes uploads of the caller for the one post, comment or
  // message that is about to show them, all or none: a photo that is not
  // the caller's, is published or was claimed already refuses them all,
  // so that two posts never share a file that either deletes. Whoever
  // asks first gets a photo. ReleasePhotos gives claimed uploads back
  // when the post was refused; published and missing ones are fine.
  rpc ClaimPhotos(ClaimPhotosRequest) returns (ClaimPhotosResponse);
  rpc ReleasePhotos(ReleasePhotosRequest) returns (google.protobuf.Empty);

  // Public: a photo as JPEG.
  rpc GetPhoto(GetPhotoRequest) returns (GetPhotoResponse);

  // Internal, for post and message, and for the gateway (the backdrop
  // of a person, "Фон страницы"): a post, comment or message with these
  // photos of owner_id was published (they are kept for good) or deleted
  // (they go). Idempotent; missing photos are fine.
  rpc PublishPhotos(PublishPhotosRequest) returns (google.protobuf.Empty);
  rpc DeletePublishedPhotos(DeletePublishedPhotosRequest) returns (google.protobuf.Empty);
  // Internal, for post and message: published photos of owner_id are kept
  // once more under new IDs, as the photos of a post in "Фотографии со
  // стены" or of a forwarded message, so that the copy outlives the post
  // or the message. Idempotent; missing photos are fine.
  rpc CopyPhotos(CopyPhotosRequest) returns (google.protobuf.Empty);

  // Require an access token; the document belongs to the caller. It is
  // kept for good at once: the gateway adds it to the caller's documents
  // in the post service ("Мои Документы"), which knows its name, and
  // deletes it here when that fails.
  rpc UploadDocument(UploadDocumentRequest) returns (UploadDocumentResponse);
  // Public: a document as it was uploaded.
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  // Internal, for post (documents deleted from "Мои Документы") and the
  // gateway (an upload the post service refused): the documents of
  // owner_id go. Idempotent; missing documents are fine.
  rpc DeleteDocuments(DeleteDocumentsRequest) returns (google.protobuf.Empty);

  // Internal, for user: the user's page was deleted and not restored in
  // time; all their avatars, photos and documents go. Idempotent.
  rpc PurgeUser(PurgeUserRequest) returns (google.protobuf.Empty);
}

message UploadAvatarRequest {
  // JPEG, PNG, GIF or WebP, at most 8 MB, at least 50x50.
  bytes image = 1;
}

message UploadAvatarResponse {
  string avatar_id = 1;
}

message UploadClubAvatarRequest {
  string club_id = 1;
  // JPEG, PNG, GIF or WebP, at most 8 MB, at least 50x50.
  bytes image = 2;
}

message DeleteClubAvatarsRequest {
  string club_id = 1;
  // The avatar to keep; empty deletes them all.
  string keep_avatar_id = 2;
}

message UploadClubPhotoRequest {
  string club_id = 1;
  // JPEG, PNG, GIF or WebP, at most 8 MB.
  bytes image = 2;
}

message DeleteClubPhotosRequest {
  string club_id = 1;
  // The photos to keep, at most 10; none deletes them all.
  repeated string keep_photo_ids = 2;
}

message DeleteAvatarsRequest {
  // The avatar to keep; empty deletes them all.
  string keep_avatar_id = 1;
}

enum AvatarSize {
  AVATAR_SIZE_UNSPECIFIED = 0;
  // 400x400, the profile photo.
  AVATAR_SIZE_LARGE = 1;
  // 100x100, next to posts and in lists.
  AVATAR_SIZE_SMALL = 2;
}

message GetAvatarRequest {
  string user_id = 1;
  string avatar_id = 2;
  AvatarSize size = 3;
}

message GetAvatarResponse {
  bytes image = 1;
}

message UploadPhotoRequest {
  // JPEG, PNG, GIF or WebP, at most 8 MB.
  bytes image = 1;
}

message UploadPhotoResponse {
  string photo_id = 1;
}

message ClaimPhotosRequest {
  // At most 10.
  repeated string photo_ids = 1;
}

message ClaimPhotosResponse {
  // Whether the photos are the post's now: all of them or none.
  bool claimed = 1;
}

message ReleasePhotosRequest {
  // At most 10.
  repeated string photo_ids = 1;
}

message PublishPhotosRequest {
  string owner_id = 1;
  // At most 10.
  repeated string photo_ids = 2;
}

message DeletePublishedPhotosRequest {
  string owner_id = 1;
  // At most 10.
  repeated string photo_ids = 2;
}

message CopyPhotosRequest {
  string owner_id = 1;
  // At most 10.
  repeated PhotoCopy copies = 2;
}

message PhotoCopy {
  string from_id = 1;
  // A new UUIDv7.
  string to_id = 2;
}

enum PhotoSize {
  PHOTO_SIZE_UNSPECIFIED = 0;
  // Up to 1280 on the longer side, opened on its own.
  PHOTO_SIZE_LARGE = 1;
  // Up to 640 on the longer side, in the post.
  PHOTO_SIZE_SMALL = 2;
}

message GetPhotoRequest {
  string user_id = 1;
  string photo_id = 2;
  PhotoSize size = 3;
}

message GetPhotoResponse {
  bytes image = 1;
}

message PurgeUserRequest {
  string user_id = 1;
}

message UploadDocumentRequest {
  // Any file of at most 10 MB.
  bytes data = 1;
}

message UploadDocumentResponse {
  string document_id = 1;
}

message GetDocumentRequest {
  string owner_id = 1;
  string document_id = 2;
}

message GetDocumentResponse {
  bytes data = 1;
}

message DeleteDocumentsRequest {
  string owner_id = 1;
  repeated string document_ids = 2;
}
