syntax = "proto3";

package message.v1;

option go_package = "github.com/vexner67/freenet/message/api/message/v1;messagev1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Every RPC requires an access token: the caller is one side of a dialog.
service MessageService {
  // The caller writes to recipient_id; the gateway has checked that the
  // recipient exists.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  // The caller's dialogs, the most recently written first.
  rpc ListDialogs(ListDialogsRequest) returns (ListDialogsResponse);
  // How many dialogs and chats have unread messages, at most 100.
  rpc CountUnreadDialogs(CountUnreadDialogsRequest) returns (CountUnreadDialogsResponse);
  // Messages of the dialog with peer_id, oldest first.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  // The caller has read the dialog up to a message from the peer.
  rpc MarkDialogRead(MarkDialogReadRequest) returns (google.protobuf.Empty);
  // The caller takes their message back from both sides of the dialog,
  // within a day of sending (deletable_until): it stays there saying
  // nothing (deleted_at) until each side deletes it for themselves; media
  // deletes its photos.
  rpc DeleteMessage(DeleteMessageRequest) returns (google.protobuf.Empty);
  // The caller deletes a message of their dialog for themselves alone
  // ("Удалить у себя"), their own or the peer's: the other side keeps it.
  rpc HideMessage(HideMessageRequest) returns (google.protobuf.Empty);
  // The caller deletes several messages of their dialogs at once, all or
  // none of them: for everyone, as DeleteMessage does, or for themselves,
  // as HideMessage does.
  rpc DeleteMessages(DeleteMessagesRequest) returns (google.protobuf.Empty);
  // The caller changes what their message says and the photos it shows,
  // within a day of sending (editable_until); the post it shares and the
  // messages it carries on stay.
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse);
  // The caller's messages that say the query, in any case, newest first:
  // in the dialog with peer_id or, without it, in all their dialogs.
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
  // Requires an access token: whether the peer has ever written to the
  // caller, who may then answer whatever the peer's privacy.
  rpc HasMessagesFrom(HasMessagesFromRequest) returns (HasMessagesFromResponse);

  // Chats of several people ("беседы"). The caller starts one with
  // member_ids, two others at least and 49 at most; the gateway has checked
  // that they exist and may be added. Everyone in it writes, adds people
  // and renames it; only who created it removes others.
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse);
  // A chat of the caller with who is in it now; NotFound for someone who
  // was never in it. Who has left or was removed still reads what was said
  // before, and is told of no members.
  rpc GetChat(GetChatRequest) returns (GetChatResponse);
  // The caller's chats, the most recently written first: the cursors are
  // those of ListDialogs, so the two lists merge into one.
  rpc ListChats(ListChatsRequest) returns (ListChatsResponse);
  rpc RenameChat(RenameChatRequest) returns (google.protobuf.Empty);
  // Adds people while there is room (50 with the caller); who is in the
  // chat already stays, who left on their own fails with
  // FailedPrecondition "the user has left the chat".
  rpc AddChatMembers(AddChatMembersRequest) returns (google.protobuf.Empty);
  // The creator removes someone else ("Исключить из беседы").
  rpc RemoveChatMember(RemoveChatMemberRequest) returns (google.protobuf.Empty);
  // The caller leaves ("Покинуть чат") and comes back ("Вернуться в
  // чат"); who was removed fails with FailedPrecondition.
  rpc LeaveChat(LeaveChatRequest) returns (google.protobuf.Empty);
  rpc ReturnToChat(ReturnToChatRequest) returns (google.protobuf.Empty);
  // Text, photos or both; the gateway has checked the photos are the
  // sender's. Who is not in the chat anymore fails with FailedPrecondition
  // "you are not in this chat".
  rpc SendChatMessage(SendChatMessageRequest) returns (SendChatMessageResponse);
  // Messages of a chat, oldest first.
  rpc ListChatMessages(ListChatMessagesRequest) returns (ListChatMessagesResponse);
  // A message of a chat of the caller, whole.
  rpc GetChatMessage(GetChatMessageRequest) returns (GetChatMessageResponse);
  // The sender changes what their message says, within a day of sending.
  rpc EditChatMessage(EditChatMessageRequest) returns (EditChatMessageResponse);
  // The sender takes their message back, within a day of sending: it
  // stays in the chat saying nothing (deleted_at).
  rpc DeleteChatMessage(DeleteChatMessageRequest) returns (google.protobuf.Empty);
  // The caller has read the chat up to a message of it.
  rpc MarkChatRead(MarkChatReadRequest) returns (google.protobuf.Empty);

  // Requires an access token: the caller's events as they happen — new
  // messages of their dialogs, sent or received, read marks that move,
  // messages deleted and messages edited, and the same of their chats.
  // Best effort: the stream ends with Unauthenticated when the token
  // expires and with ResourceExhausted when the caller falls behind; then
  // subscribe again and catch up with ListMessages and ListDialogs.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

  // Internal, for user: the user's page was deleted and not restored in
  // time; their dialogs go, with every message in them, from both sides,
  // and they leave every chat with what they wrote there. Idempotent.
  rpc PurgeUser(PurgeUserRequest) returns (google.protobuf.Empty);
}

message Message {
  string id = 1;
  string sender_id = 2;
  string recipient_id = 3;
  // Empty when the message has photos only.
  string text = 4;
  google.protobuf.Timestamp created_at = 5;
  // The recipient has read it.
  bool read = 6;
  // Photos of the sender in the media service, in the order shown.
  repeated string photo_ids = 7;
  // Until when the sender may delete it.
  google.protobuf.Timestamp deletable_until = 8;
  // A post of the post service shared into the dialog ("Поделиться" "в
  // переписку"); empty for none.
  string post_id = 9;
  // When the sender changed what it says; unset if never.
  google.protobuf.Timestamp edited_at = 10;
  // Until when the sender may edit it.
  google.protobuf.Timestamp editable_until = 11;
  // Messages it carries on from other dialogs ("Переслать"), oldest first.
  repeated ForwardedMessage forwarded = 12;
  // When the sender took it back from both sides; unset if never. Such a
  // message says nothing, and deletable_until and editable_until are unset.
  google.protobuf.Timestamp deleted_at = 13;
  // text and the texts it carries on are only their beginnings: the
  // request set text_limit, and they say more.
  bool text_cut = 14;
  // A photo of an album of the post service shared into the dialog
  // ("Поделиться" under a photo, "в переписку"); empty for none.
  string photo_id = 15;
}

// A message as another one carries it on: a copy of what it showed.
message ForwardedMessage {
  string sender_id = 1;
  string text = 2;
  // Photos of sender_id in the media service, kept for this copy.
  repeated string photo_ids = 3;
  // A post it shared; empty for none.
  string post_id = 4;
  google.protobuf.Timestamp created_at = 5;
  // A photo of an album it shared; empty for none.
  string photo_id = 6;
  // How deep it is carried: 0 for a message forwarded itself, 1 for one
  // that message carried on. The list is a tree written parent first.
  int32 depth = 7;
}

message Dialog {
  string peer_id = 1;
  Message last_message = 2;
  // The peer wrote something the caller has not read.
  bool unread = 3;
}

message SendMessageRequest {
  string recipient_id = 1;
  // Text, photos, a shared post, forwarded messages or some of them. The
  // caller has checked with the media service that the photos are the
  // sender's, and with the post service that the post exists.
  string text = 2;
  repeated string photo_ids = 3;
  string post_id = 4;
  // Messages of the caller's dialogs to carry on, at most 20 counting
  // those they carry themselves; one that is not there or was taken back
  // fails with InvalidArgument "forwarded message not found".
  repeated string forward_ids = 5;
  // A photo of an album to share, which the caller has checked the
  // sender may see; with text alone, anything else with it fails with
  // InvalidArgument.
  string photo_id = 6;
}

message SendMessageResponse {
  Message message = 1;
}

message ListDialogsRequest {
  // Empty for the most recent, else next_cursor of the previous page.
  string cursor = 1;
  // 1-50; anything else means 20.
  int32 limit = 2;
  // The last messages are cut to this many characters and say so
  // (text_cut); 0 for whole texts. A list shows one line of each.
  int32 text_limit = 3;
}

message ListDialogsResponse {
  repeated Dialog dialogs = 1;
  // Empty on the last page.
  string next_cursor = 2;
}

message CountUnreadDialogsRequest {}

message CountUnreadDialogsResponse {
  int32 count = 1;
}

message ListMessagesRequest {
  string peer_id = 1;
  // Older messages: empty for the newest, else next_cursor of the
  // previous page.
  string cursor = 2;
  // Newer messages instead: those after this one, for polling.
  string after = 3;
  // 1-50; anything else means 20.
  int32 limit = 4;
  // Instead of both: the part of the dialog around this message, about
  // half of limit before it and half after; NotFound if the dialog does
  // not have it.
  string around = 5;
  // The texts of the messages and of those they carry on are cut to this
  // many characters and say so (text_cut); 0 for whole texts.
  int32 text_limit = 6;
}

message ListMessagesResponse {
  repeated Message messages = 1;
  // Older messages remain; empty when there are none, and always with after.
  string next_cursor = 2;
  // The newest of the caller's messages the peer has read: lets a page
  // update messages it already shows. Empty if none.
  string peer_read_up_to = 3;
}

message MarkDialogReadRequest {
  string peer_id = 1;
  string up_to_id = 2;
}

message DeleteMessageRequest {
  string id = 1;
}

message HideMessageRequest {
  string id = 1;
}

message EditMessageRequest {
  string id = 1;
  // May be empty only when the message has photos, shares a post or
  // carries other messages on.
  string text = 2;
  // Once the whole list of photos, which two edits made at once
  // overwrote for each other.
  reserved 3, 4;
  reserved "photo_ids", "replace_photos";
  // The photos the message shows no more, and the caller's uploads it
  // shows from now on, after those it keeps; it may show 10. The edit
  // names changes, so two made at once both take effect; a photo to
  // remove that is gone and one to add that is there are fine. A message
  // that shares a photo of an album takes none.
  repeated string remove_photo_ids = 5;
  repeated string add_photo_ids = 6;
}

message DeleteMessagesRequest {
  // 1 to 100 messages the caller has in their dialogs.
  repeated string ids = 1;
  // true takes them back from both sides: the caller's own, within a day
  // of sending. false deletes them for the caller alone.
  bool for_everyone = 2;
}

message EditMessageResponse {
  Message message = 1;
}

message SearchMessagesRequest {
  // The dialog to search; empty for all the caller's dialogs.
  string peer_id = 1;
  // At most 100 characters, not empty.
  string query = 2;
  // Empty for the newest, else next_cursor of the previous page.
  string cursor = 3;
  // 1-50; anything else means 20.
  int32 limit = 4;
  // The texts of the messages are cut to this many characters and say so
  // (text_cut): the text of a message to where it says the query, those
  // it carries on to their beginnings; 0 for whole texts.
  int32 text_limit = 5;
}

message SearchMessagesResponse {
  // read is not told here.
  repeated Message messages = 1;
  // Empty on the last page.
  string next_cursor = 2;
}

message HasMessagesFromRequest {
  string peer_id = 1;
}

message HasMessagesFromResponse {
  bool has_messages = 1;
}

message SubscribeRequest {}

message SubscribeResponse {
  oneof event {
    Message message = 1;
    ReadMark read = 2;
    MessageDeleted deleted = 3;
    // The message as it is after its sender edited it or took it back
    // (deleted_at); read is not told.
    Message edited = 4;
    // A new message of a chat of the caller: written by someone in it, or
    // telling of what happened there (action).
    ChatMessage chat_message = 5;
    // A message of a chat as it is after its sender edited it or took it
    // back.
    ChatMessage chat_edited = 6;
    // The caller has read a chat, on another page.
    ChatRead chat_read = 7;
  }
}

// The caller has read chat_id up to up_to_id.
message ChatRead {
  string chat_id = 1;
  string up_to_id = 2;
}

// Message id of sender_id to recipient_id is gone from the dialog of
// whoever hears this, who deleted it for themselves.
message MessageDeleted {
  string id = 1;
  string sender_id = 2;
  string recipient_id = 3;
}

// reader_id has read the dialog with peer_id up to up_to_id.
message ReadMark {
  string reader_id = 1;
  string peer_id = 2;
  string up_to_id = 3;
}

message PurgeUserRequest {
  string user_id = 1;
}

// How the caller stands in a chat.
enum ChatMemberState {
  CHAT_MEMBER_STATE_UNSPECIFIED = 0;
  CHAT_MEMBER_STATE_ACTIVE = 1;
  // Left on their own: may come back.
  CHAT_MEMBER_STATE_LEFT = 2;
  // Removed by the creator.
  CHAT_MEMBER_STATE_KICKED = 3;
}

// What a message of a chat tells of instead of saying something.
enum ChatAction {
  CHAT_ACTION_NONE = 0;
  // The sender created the chat; text is its title, if it has one.
  CHAT_ACTION_CREATE = 1;
  // The sender renamed the chat; text is the new title.
  CHAT_ACTION_TITLE = 2;
  // The sender added target_id.
  CHAT_ACTION_INVITE = 3;
  // The sender removed target_id.
  CHAT_ACTION_KICK = 4;
  CHAT_ACTION_LEAVE = 5;
  CHAT_ACTION_RETURN = 6;
}

// A chat as the caller has it.
message Chat {
  string id = 1;
  // Empty: the chat is called by who is in it.
  string title = 2;
  // Who created it.
  string owner_id = 3;
  google.protobuf.Timestamp created_at = 4;
  // How many people are in it now.
  int32 member_count = 5;
  ChatMemberState state = 6;
  // The last message the caller is shown; unset if none is left.
  ChatMessage last_message = 7;
  // Others wrote something the caller has not read.
  bool unread = 8;
}

message ChatMember {
  string user_id = 1;
  google.protobuf.Timestamp joined_at = 2;
}

message ChatMessage {
  string id = 1;
  string chat_id = 2;
  string sender_id = 3;
  // Empty when the message has photos only; of an action, the title it
  // tells of.
  string text = 4;
  // Photos of the sender in the media service, in the order shown.
  repeated string photo_ids = 5;
  ChatAction action = 6;
  // Whom the action is about; empty for none.
  string target_id = 7;
  google.protobuf.Timestamp created_at = 8;
  // When the sender changed what it says; unset if never.
  google.protobuf.Timestamp edited_at = 9;
  // When the sender took it back; unset if never.
  google.protobuf.Timestamp deleted_at = 10;
  // Until when the sender may take it back and edit it; unset for an
  // action and for a message taken back.
  google.protobuf.Timestamp deletable_until = 11;
  google.protobuf.Timestamp editable_until = 12;
  // text is only its beginning: the request set text_limit.
  bool text_cut = 13;
  // Someone else's message the caller has not read; not told in events.
  bool unread = 14;
}

message CreateChatRequest {
  // At most 64 characters in one line; may be empty.
  string title = 1;
  repeated string member_ids = 2;
}

message CreateChatResponse {
  Chat chat = 1;
}

message GetChatRequest {
  string chat_id = 1;
}

message GetChatResponse {
  Chat chat = 1;
  // Who is in the chat, who joined first first; none for a caller who is
  // not in it anymore.
  repeated ChatMember members = 2;
}

message ListChatsRequest {
  // Empty for the most recent, else next_cursor of the previous page.
  string cursor = 1;
  // 1-50; anything else means 20.
  int32 limit = 2;
  // The last messages are cut to this many characters and say so
  // (text_cut); 0 for whole texts.
  int32 text_limit = 3;
}

message ListChatsResponse {
  repeated Chat chats = 1;
  // The last message of the last chat; empty on the last page.
  string next_cursor = 2;
}

message RenameChatRequest {
  string chat_id = 1;
  string title = 2;
}

message AddChatMembersRequest {
  string chat_id = 1;
  // At most 49.
  repeated string user_ids = 2;
}

message RemoveChatMemberRequest {
  string chat_id = 1;
  string user_id = 2;
}

message LeaveChatRequest {
  string chat_id = 1;
}

message ReturnToChatRequest {
  string chat_id = 1;
}

message SendChatMessageRequest {
  string chat_id = 1;
  string text = 2;
  repeated string photo_ids = 3;
}

message SendChatMessageResponse {
  ChatMessage message = 1;
}

message ListChatMessagesRequest {
  string chat_id = 1;
  // Older messages: empty for the newest, else next_cursor of the
  // previous page.
  string cursor = 2;
  // Newer messages instead: those after this one, for polling.
  string after = 3;
  // 1-50; anything else means 20.
  int32 limit = 4;
  // The texts are cut to this many characters and say so (text_cut); 0
  // for whole texts.
  int32 text_limit = 5;
}

message ListChatMessagesResponse {
  repeated ChatMessage messages = 1;
  // Older messages remain; empty when there are none, and always with after.
  string next_cursor = 2;
}

message GetChatMessageRequest {
  string id = 1;
}

message GetChatMessageResponse {
  ChatMessage message = 1;
}

message EditChatMessageRequest {
  string id = 1;
  // May be empty only when the message has photos.
  string text = 2;
}

message EditChatMessageResponse {
  ChatMessage message = 1;
}

message DeleteChatMessageRequest {
  string id = 1;
}

message MarkChatReadRequest {
  string chat_id = 1;
  string up_to_id = 2;
}
