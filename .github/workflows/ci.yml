# The checks of scripts/check.sh and the Docker stack with its smoke test,
# the same as locally: make check-integration, make stack, make smoke.
# On main the images are built first, once, with the build cache of
# GitHub Actions, and go to GHCR under the commit; the stack runs those
# very images, and a push that passes is deployed (deploy/deploy.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its checks. On main every run
# goes at once instead of waiting for the one before: the deployments
# still go one at a time, and an outdated one is skipped (deploy).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.13.2
  # The generators of scripts/check-proto.sh: the same versions there.
  PROTOC_VERSION: "34.1"
  PROTOC_SHA256: af27ea66cd26938fe48587804ca7d4817457a08350021a1c6e23a27ccc8c6904
  PROTOC_GEN_GO_VERSION: v1.36.12
  PROTOC_GEN_GO_GRPC_VERSION: v1.6.2

jobs:
  check:
    name: Go and website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"

      - name: Install protoc and its Go plugins
        run: |
          zip="protoc-$PROTOC_VERSION-linux-x86_64.zip"
          curl -sSfLO "https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/$zip"
          echo "$PROTOC_SHA256  $zip" | sha256sum -c -
          unzip -q "$zip" -d "$HOME/protoc"
          echo "$HOME/protoc/bin" >> "$GITHUB_PATH"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@$PROTOC_GEN_GO_VERSION"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@$PROTOC_GEN_GO_GRPC_VERSION"

      # gofmt, vet, golangci-lint and go test -race in every module, with
      # the PostgreSQL and Redis tests against throwaway containers; the
      # monitoring configs; the generated protobuf code against the .proto.
      - run: make check-integration

  stack:
    name: Docker stack
    # On main the images of the commit, on a pull request a local build.
    needs: images
    if: ${{ !cancelled() && needs.images.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Configure the stack
        run: |
          port=5433
          for db in AUTH USER POST NOTIFICATION MESSAGE CLUB FEDERATION; do
            echo "${db}_POSTGRES_USER=freenet"
            echo "${db}_POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "${db}_POSTGRES_DB=freenet"
            echo "${db}_POSTGRES_PORT=$port"
            port=$((port + 1))
          done > .env
          echo "REDIS_PORT=6379" >> .env
          echo "HASH_SECRET=$(openssl rand -hex 32)" >> .env
          make certs

      # Pulled side by side and named as compose names its own builds, so
      # make stack starts them without building anything.
      - name: Images of the commit
        if: needs.images.result == 'success'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          printf '%s\n' auth user post media notification message club federation gateway \
            | xargs -P 9 -I{} sh -c 'docker pull -q "ghcr.io/vexner67/freenet-{}:$GITHUB_SHA" >/dev/null && docker tag "ghcr.io/vexner67/freenet-{}:$GITHUB_SHA" "freenet-{}"'
          echo "STACK_BUILD=--no-build" >> "$GITHUB_ENV"

      - name: Start
        run: make stack

      - run: make smoke

      - name: Logs
        if: failure()
        run: docker compose --profile app logs

      - name: Stop
        if: always()
        run: make down

  images:
    name: Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth, user, post, media, notification, message, club, federation, gateway]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The gateway image carries the website, the federation one ffmpeg:
      # each has a target of its own.
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          target: ${{ contains(fromJSON('["gateway","federation"]'), matrix.service) && matrix.service || '' }}
          push: true
          # Only the commit: these images are not checked yet, and the
          # server runs a commit's images by its tag.
          tags: ghcr.io/vexner67/freenet-${{ matrix.service }}:${{ github.sha }}
          # Links the package to the repository, so the deploy job's token
          # may pull it.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, images, stack]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    # One deployment at a time, in the order of the pushes.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # Runs on main do not wait for each other, so a newer commit may be
      # deployed already or may come next: only the head of main goes out,
      # and the one checked here after taking the turn of the group.
      - name: Still the head of main
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at $head now: its own run deploys it"
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

      # DEPLOY_HOST, the deploy user's key and the server's host key, so
      # that nobody in the middle gets the token.
      - name: SSH
        if: steps.head.outputs.outdated != 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy the configuration
        if: steps.head.outputs.outdated != 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --delete-after -e "ssh -i ~/.ssh/deploy" \
            compose.yaml deploy monitoring "freenet@$HOST:/opt/freenet/"

      - name: Run the commit
        if: steps.head.outputs.outdated != 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy "freenet@$HOST" \
            "/opt/freenet/deploy/deploy.sh ${{ github.sha }} ${{ github.actor }}"

      - name: The website answers
        if: steps.head.outputs.outdated != 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$SITE_URL/healthz"
