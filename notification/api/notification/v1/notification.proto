syntax = "proto3";

package notification.v1;

option go_package = "github.com/vexner67/freenet/notification/api/notification/v1;notificationv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service NotificationService {
  // Internal, for post and user: an event happened or was undone. Notify
  // is idempotent, Retract of nothing is fine.
  rpc Notify(NotifyRequest) returns (google.protobuf.Empty);
  rpc Retract(RetractRequest) returns (google.protobuf.Empty);
  // Internal, for post: the post is deleted with its likes and comments.
  rpc ForgetPost(ForgetPostRequest) returns (google.protobuf.Empty);
  // Internal, for post: the comment is deleted; the notifications of it,
  // of the reply it was and of its likes go.
  rpc ForgetComment(ForgetCommentRequest) returns (google.protobuf.Empty);
  // Internal, for user: the user's page was deleted and not restored in
  // time; their notifications go, whether they got them or caused them,
  // and their read mark. Idempotent.
  rpc PurgeUser(PurgeUserRequest) returns (google.protobuf.Empty);

  // Require an access token: the caller's own notifications.
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc CountUnread(CountUnreadRequest) returns (CountUnreadResponse);
  rpc MarkRead(MarkReadRequest) returns (google.protobuf.Empty);

  // Requires an access token: what happens to the caller's notifications
  // as it happens, for the live counter. Best effort: the stream ends with
  // Unauthenticated when the token expires and with ResourceExhausted when
  // the caller falls behind; then subscribe again and count afresh.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

  // Public: the key browsers subscribe to pushes with (VAPID); empty when
  // pushes are off.
  rpc GetPushKey(GetPushKeyRequest) returns (GetPushKeyResponse);
  // Require an access token: the browser at endpoint gets the caller's
  // pushes, taken over from whoever had it; or stops, if it was the
  // caller's. Both idempotent. Subscribing while pushes are off is
  // FailedPrecondition.
  rpc SubscribePush(SubscribePushRequest) returns (google.protobuf.Empty);
  rpc UnsubscribePush(UnsubscribePushRequest) returns (google.protobuf.Empty);
  // Internal, for message: a new message, pushed to its recipients. Best
  // effort: it is queued and sent after the answer.
  rpc PushMessage(PushMessageRequest) returns (google.protobuf.Empty);
}

enum Kind {
  KIND_UNSPECIFIED = 0;
  // The actor liked the recipient's post.
  KIND_LIKE = 1;
  // The actor commented on the recipient's post.
  KIND_COMMENT = 2;
  // The actor followed the recipient.
  KIND_FOLLOW = 3;
  // The actor wrote a post on the recipient's wall.
  KIND_WALL_POST = 4;
  // The actor shared the recipient's post; post_id is the actor's repost.
  KIND_REPOST = 5;
  // The actor answered the recipient's comment; comment_id is the answer.
  KIND_COMMENT_REPLY = 6;
  // The actor liked the recipient's comment comment_id.
  KIND_COMMENT_LIKE = 7;
  // The actor, a community, published the post the recipient suggested
  // for its wall; post_id is the published post.
  KIND_POST_ACCEPTED = 8;
  // Someone suggested a post for the wall of the actor, a community the
  // recipient runs; post_id is the suggestion, not a post.
  KIND_SUGGESTED_POST = 9;
  // The recipient was made an admin of the actor, a community.
  KIND_CLUB_ADMIN = 10;
  // The actor wrote in the topic the recipient started; post_id is the
  // topic and comment_id the message.
  KIND_TOPIC_MESSAGE = 11;
  // The actor named the recipient in the post post_id.
  KIND_POST_MENTION = 12;
  // The actor named the recipient in the comment comment_id under the
  // post post_id.
  KIND_COMMENT_MENTION = 13;
  // The actor named the recipient in the message comment_id of the topic
  // post_id.
  KIND_TOPIC_MENTION = 14;
  // The actor liked the photo post_id of an album of the recipient.
  KIND_PHOTO_LIKE = 15;
  // The actor wrote comment_id under the recipient's photo post_id.
  KIND_PHOTO_COMMENT = 16;
  // The actor liked the recipient's message comment_id of topic post_id.
  KIND_TOPIC_MESSAGE_LIKE = 17;
  // The actor, an event the recipient comes to, starts soon.
  KIND_EVENT_REMINDER = 18;
  // The actor named the recipient in comment_id under the photo post_id.
  KIND_PHOTO_MENTION = 19;
  // The actor wrote comment_id under the recipient's note post_id.
  KIND_NOTE_COMMENT = 20;
  // The actor sent the recipient a gift; post_id is the sent gift, which
  // the user service keeps.
  KIND_GIFT = 21;
  // The actor transferred votes ("Перевод голосов") to the recipient;
  // post_id is the transfer, which the user service names.
  KIND_VOTES = 22;
}

// Event: post_id is set for all but follows, appointments and reminders
// (of a gift it is the sent gift, of votes the transfer),
// comment_id for comments, replies, comment likes, messages of topics
// and mentions in comments and topics.
message Event {
  Kind kind = 1;
  string recipient_id = 2;
  string actor_id = 3;
  string post_id = 4;
  string comment_id = 5;
}

message NotifyRequest {
  Event event = 1;
}

message RetractRequest {
  Event event = 1;
}

message ForgetPostRequest {
  string post_id = 1;
}

message ForgetCommentRequest {
  string comment_id = 1;
}

message PurgeUserRequest {
  string user_id = 1;
}

message Notification {
  string id = 1;
  Kind kind = 2;
  string actor_id = 3;
  // Empty when the kind has no post or comment.
  string post_id = 4;
  string comment_id = 5;
  google.protobuf.Timestamp created_at = 6;
}

enum Box {
  BOX_UNSPECIFIED = 0;
  // Newer than the read mark.
  BOX_UNREAD = 1;
  // The read mark and older.
  BOX_ARCHIVE = 2;
}

message ListNotificationsRequest {
  Box box = 1;
  // Empty for the newest, else next_cursor of the previous page.
  string cursor = 2;
  // 1-50; anything else means 20.
  int32 limit = 3;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  // Empty on the last page.
  string next_cursor = 2;
}

message CountUnreadRequest {}

message CountUnreadResponse {
  // At most 100.
  int32 count = 1;
}

message MarkReadRequest {
  // The newest notification read; it and older ones go to the archive.
  string notification_id = 1;
}

message SubscribeRequest {}

message SubscribeResponse {
  Change change = 1;
}

enum Change {
  CHANGE_UNSPECIFIED = 0;
  // A new notification.
  CHANGE_NEW = 1;
  // One was taken back.
  CHANGE_GONE = 2;
  // The caller read them, on another page.
  CHANGE_READ = 3;
}

message GetPushKeyRequest {}

message GetPushKeyResponse {
  // The application server key, base64url without padding.
  string public_key = 1;
}

message SubscribePushRequest {
  // As PushSubscription of the browser gives them: an https URL and the
  // keys in base64url.
  string endpoint = 1;
  string p256dh = 2;
  string auth = 3;
}

message UnsubscribePushRequest {
  string endpoint = 1;
}

message PushMessageRequest {
  string message_id = 1;
  string sender_id = 2;
  // At most 49; the sender among them is skipped.
  repeated string recipient_ids = 3;
  // Empty for a dialog.
  string chat_id = 4;
  // May be empty for a chat too.
  string chat_title = 5;
}
