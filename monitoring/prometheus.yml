# Prometheus of the Docker stack (`make stack`): every service serves its
# metrics on METRICS_PORT inside the compose network. alerts.yml says when
# something is wrong; Alertmanager takes it from there.
global:
  scrape_interval: 10s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: freenet
    static_configs:
      - targets: ["gateway:9080"]
        labels: { service: gateway }
      - targets: ["auth:9051"]
        labels: { service: auth }
      - targets: ["user:9052"]
        labels: { service: user }
      - targets: ["post:9053"]
        labels: { service: post }
      - targets: ["media:9054"]
        labels: { service: media }
      - targets: ["notification:9055"]
        labels: { service: notification }
      - targets: ["message:9056"]
        labels: { service: message }
      - targets: ["club:9057"]
        labels: { service: club }

  # The databases and Redis, through their exporters (compose.yaml): they
  # change slowly, and every scrape is a round of queries.
  - job_name: postgres
    scrape_interval: 30s
    static_configs:
      - targets: ["auth-postgres-exporter:9187"]
        labels: { db: auth }
      - targets: ["user-postgres-exporter:9187"]
        labels: { db: user }
      - targets: ["post-postgres-exporter:9187"]
        labels: { db: post }
      - targets: ["notification-postgres-exporter:9187"]
        labels: { db: notification }
      - targets: ["message-postgres-exporter:9187"]
        labels: { db: message }
      - targets: ["club-postgres-exporter:9187"]
        labels: { db: club }

  - job_name: redis
    scrape_interval: 30s
    static_configs:
      - targets: ["redis-exporter:9121"]
