# Alerting rules of the Docker stack's Prometheus (`make stack`), sent to
# Alertmanager (alertmanager.yml). Tested by promtool with alerts_test.yml
# (`make check-integration`). A ratio over no traffic is no number at all,
# so a quiet service raises no error alert.
groups:
  - name: availability
    rules:
      - alert: ServiceDown
        expr: up{job="freenet"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is down"
          description: "Prometheus has not reached {{ $labels.service }} for a minute: the service, or its metrics port, is not answering."

      # The exporter answers and says the database does not (pg_up), or the
      # exporter itself is gone: either way nobody is watching it.
      - alert: PostgresDown
        expr: pg_up == 0 or up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "The {{ $labels.db }} database is down"
          description: "The exporter of the {{ $labels.db }} database has not reached it, or Prometheus the exporter, for a minute. The {{ $labels.db }} service cannot work without it."

      # Every service pools a few connections; a database out of them
      # refuses the next one.
      - alert: PostgresConnectionsHigh
        expr: |
          sum by (db) (pg_stat_activity_count)
            / max by (db) (pg_settings_max_connections)
            > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The {{ $labels.db }} database uses {{ $value | humanizePercentage }} of its connections"
          description: "More than 80% of max_connections of the {{ $labels.db }} database have been taken for 5 minutes: look for a leak in the service or raise the limit (deploy/compose.prod.yaml)."

      # Without Redis there are no login codes, the rate limits count in
      # no shared place and live events stop.
      - alert: RedisDown
        expr: redis_up == 0 or up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "The Redis exporter has not reached Redis, or Prometheus the exporter, for a minute: login codes, rate limits and live events depend on it."

      # At the limit (compose.yaml) Redis drops what expires soonest:
      # sign-in codes and rate limit counters, before their time.
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / (redis_memory_max_bytes > 0) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis uses {{ $value | humanizePercentage }} of its memory"
          description: "Redis has been above 80% of maxmemory for 10 minutes; at the limit it drops the keys that expire soonest. Look at what fills it or raise the limit (compose.yaml)."

  # The machine everything runs on, through node-exporter.
  - name: host
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The machine is not watched"
          description: "Prometheus has not reached node-exporter for 5 minutes: nobody sees the disk, the memory and the certificates."

      # Databases, photos, images of the last deployments and logs share
      # one disk; a full one stops the databases.
      - alert: HostDiskLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/"}
            / node_filesystem_size_bytes{mountpoint="/"}
            < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} of the disk is left"
          description: "Less than 15% of the disk has been free for 10 minutes. See what takes it (`docker system df`, `du -sh /opt/freenet/.data`) and make room before the databases stop."

      - alert: HostDiskFull
        expr: |
          node_filesystem_avail_bytes{mountpoint="/"}
            / node_filesystem_size_bytes{mountpoint="/"}
            < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The disk is almost full: {{ $value | humanizePercentage }} left"
          description: "Less than 5% of the disk is free. PostgreSQL stops writing when it runs out: make room now."

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} of the memory is left"
          description: "Less than 10% of the memory has been available for 10 minutes: the machine swaps, and the kernel kills a container when there is none."

      # deploy/certs.sh renews a certificate two months before it ends, on
      # every deployment: one this close was not renewed, or it is the CA,
      # which is replaced by hand (scripts/gen-certs.sh).
      - alert: CertificateExpiring
        expr: freenet_certificate_not_after_seconds - time() < 30 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The mTLS certificate of {{ $labels.name }} ends in {{ $value | humanizeDuration }}"
          description: "The services stop talking to each other when it ends. Run deploy/certs.sh on the server; the CA is replaced with scripts/gen-certs.sh and a restart of everything."

  - name: errors
    rules:
      # Codes that mean the service failed, not the caller: Internal hides
      # a bug or a broken dependency (the log line has the request_id).
      - alert: GRPCServerErrors
        expr: |
          sum by (service) (rate(grpc_server_handled_total{grpc_code=~"Internal|Unknown|DataLoss"}[5m]))
            / sum by (service) (rate(grpc_server_handled_total[5m]))
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} fails {{ $value | humanizePercentage }} of its calls"
          description: "More than 5% of the gRPC calls of {{ $labels.service }} ended in Internal, Unknown or DataLoss over 5 minutes. Look for ERROR lines in its log."

      - alert: HTTPServerErrors
        expr: |
          sum (rate(http_requests_total{code=~"5.."}[5m]))
            / sum (rate(http_requests_total[5m]))
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The gateway answers {{ $value | humanizePercentage }} of requests with 5xx"
          description: "More than 5% of HTTP requests failed on the server side over 5 minutes; the routes are on the Freenet dashboard."

  - name: latency
    rules:
      - alert: HTTPSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "95% of HTTP requests take up to {{ $value | humanizeDuration }}"
          description: "The 95th percentile of gateway requests has been above a second for 10 minutes."

      - alert: GRPCSlow
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(grpc_server_handling_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "95% of the calls of {{ $labels.service }} take up to {{ $value | humanizeDuration }}"
          description: "The 95th percentile of the unary calls of {{ $labels.service }} has been above half a second for 10 minutes."

  # The outbox delivers what one service tells another: notifications,
  # erasures, which photos posts, comments and messages keep (pkg/outbox).
  - name: outbox
    rules:
      # A receiver that is down, or a message it keeps rejecting with a
      # temporary error, holds back its whole stream.
      - alert: OutboxLagging
        expr: outbox_lag_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} has not delivered to {{ $labels.stream }} for {{ $value | humanizeDuration }}"
          description: "The oldest undelivered message of the {{ $labels.stream }} stream of {{ $labels.service }} is older than 5 minutes. Is {{ $labels.stream }} up? Look for retries in the log of {{ $labels.service }}."

      # media sets aside photos unpublished after UNPUBLISHED_PHOTO_TTL (a
      # day by default): a media stream stuck that long shows broken
      # pictures until it delivers, and one stuck for RETIRED_PHOTO_TTL (30
      # days) loses the photos for good.
      - alert: OutboxStuck
        expr: outbox_lag_seconds > 3600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} has not delivered to {{ $labels.stream }} for {{ $value | humanizeDuration }}"
          description: "The {{ $labels.stream }} stream of {{ $labels.service }} has been stuck for over an hour. Photos of new posts, comments and messages are broken pictures once the media stream is a day late, until it delivers, and are lost for good after 30 days."

      - alert: OutboxDropped
        expr: increase(outbox_messages_total{result="dropped"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} dropped messages to {{ $labels.stream }}"
          description: "{{ $labels.stream }} rejected messages of {{ $labels.service }} with an error a retry cannot fix; they are lost. The ERROR lines in the log of {{ $labels.service }} say which."
