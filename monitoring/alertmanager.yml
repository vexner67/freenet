# Alertmanager of the Docker stack (`make stack`): Prometheus sends it the
# alerts of alerts.yml. It groups and silences them; they show at
# http://localhost:9093 and in Grafana (Alerting). Locally nobody is
# notified. On the server deploy/alertmanager.sh renders this file with a
# Telegram chat for the receiver (TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID of
# the server's .env, never in git) into /opt/freenet/alertmanager.yml.
route:
  receiver: team
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

# A service down explains its errors and latency: say only that.
inhibit_rules:
  - source_matchers: [alertname = ServiceDown]
    target_matchers: [alertname =~ "GRPCServerErrors|GRPCSlow"]
    equal: [service]

# Last in the file: deploy/alertmanager.sh appends the chat to the receiver.
receivers:
  - name: team
