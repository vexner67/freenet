syntax = "proto3";

package club.v1;

option go_package = "github.com/vexner67/freenet/club/api/club/v1;clubv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Communities, the "группы" of openvk: a page with a wall that people
// join. Every RPC requires an access token unless said otherwise.
service ClubService {
  // The caller creates a club and owns it.
  rpc CreateClub(CreateClubRequest) returns (CreateClubResponse);
  // The caller creates an event ("Создать встречу"), owns it and comes to
  // it for sure.
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse);
  // Public: a club by its ID or address, as the caller, if any, sees it.
  rpc GetClub(GetClubRequest) returns (GetClubResponse);
  // Public: the clubs found among ids, at most 100, in no particular
  // order: what a page of posts needs to name their walls.
  rpc GetClubs(GetClubsRequest) returns (GetClubsResponse);
  // Its admins change a club, everything at once as the settings form
  // sends it.
  rpc UpdateClub(UpdateClubRequest) returns (UpdateClubResponse);
  // Idempotent. With maybe the caller only might come to the event
  // ("Возможно приду"); a group, and an event that has started, are
  // joined for sure.
  rpc JoinClub(JoinClubRequest) returns (JoinClubResponse);
  // Idempotent; the owner cannot leave.
  rpc LeaveClub(LeaveClubRequest) returns (LeaveClubResponse);
  // Public: the members of a club as the caller, if any, sees them, the
  // newest first; with admins_only, only the owner and the admins. Those
  // the club hides are plain members to callers who do not run it.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // ListJoinRequests pages those who ask to join a closed club ("Заявки"),
  // the newest first, for those who run it.
  rpc ListJoinRequests(ListJoinRequestsRequest) returns (ListJoinRequestsResponse);
  // AcceptJoinRequest lets someone who asked into the club, and
  // RejectJoinRequest turns them down: the call of those who run it.
  // NOT_FOUND "join request not found" when there is none.
  rpc AcceptJoinRequest(AcceptJoinRequestRequest) returns (google.protobuf.Empty);
  rpc RejectJoinRequest(RejectJoinRequestRequest) returns (google.protobuf.Empty);
  // The owner makes a member an admin, or an admin a member again.
  rpc SetMemberRole(SetMemberRoleRequest) returns (google.protobuf.Empty);
  // Those who run a club give one of them a title, shown under the name
  // ("Изменить комментарий"), and hide or show them ("Скрыт"): a hidden
  // one is a plain member to everyone who does not run the club.
  rpc DescribeMember(DescribeMemberRequest) returns (google.protobuf.Empty);
  // The owner hands the club over to one of its admins and stays an
  // admin ("Назначить владельцем").
  rpc TransferClub(TransferClubRequest) returns (google.protobuf.Empty);
  // The caller's clubs ("Мои Группы", "Мои Встречи"), the newest joined
  // first; with managed only those they run ("Управление"), with kind
  // only groups or only events.
  rpc ListMyClubs(ListMyClubsRequest) returns (ListMyClubsResponse);
  // Public: the clubs of a user, the newest joined first, with kind only
  // groups or only events. Whether the
  // viewer may see them is the user's privacy setting, which the caller
  // checks.
  rpc ListUserClubs(ListUserClubsRequest) returns (ListUserClubsResponse);
  // Public: clubs whose name or address has every word of the query, the
  // newest first.
  rpc SearchClubs(SearchClubsRequest) returns (SearchClubsResponse);
  // Public: how many groups there are, events not counted, for the page
  // "о сайте".
  rpc CountClubs(CountClubsRequest) returns (CountClubsResponse);
  // Its admins show a photo as the club's, which the media service has
  // stored; an empty avatar_id takes it away.
  rpc SetClubAvatar(SetClubAvatarRequest) returns (SetClubAvatarResponse);
  // Its admins only: one side of "Фон страницы", a photo of the club in
  // the media service; an empty photo_id takes it away.
  rpc SetClubBackdrop(SetClubBackdropRequest) returns (SetClubBackdropResponse);
  // The caller puts a club they run in their left menu, at most 10, or
  // takes it out ("Добавить в левое меню").
  rpc PinClub(PinClubRequest) returns (google.protobuf.Empty);
  // The clubs in the caller's left menu that they still run.
  rpc ListPinnedClubs(ListPinnedClubsRequest) returns (ListPinnedClubsResponse);
  // What the caller is in each of up to 100 clubs; those they are not in
  // are left out.
  rpc ListMyRoles(ListMyRolesRequest) returns (ListMyRolesResponse);
  // The caller's newest 1000 clubs, whose walls their feed shows.
  rpc ListMyClubIDs(ListMyClubIDsRequest) returns (ListMyClubIDsResponse);
  // Whether the caller may write on the club's wall, on their own behalf
  // or, with from_club, on the club's, or else suggest a post.
  rpc CanPostOnWall(CanPostOnWallRequest) returns (CanPostOnWallResponse);

  // Internal, for post: whether user_id keeps the wall of wall_id clean,
  // deleting and pinning others' posts and comments there: the club's
  // admins do. False for any other wall, a user's.
  rpc CanModerateWall(CanModerateWallRequest) returns (CanModerateWallResponse);
  // Internal, for post: the users who keep the wall of wall_id clean, the
  // owner and admins of the club, to hear about posts suggested there; up
  // to 100, the newest appointed first. None for any other wall.
  rpc ListWallModerators(ListWallModeratorsRequest) returns (ListWallModeratorsResponse);
  // Internal, for user: the user's page was deleted and not restored in
  // time; they leave every club. Idempotent.
  rpc PurgeUser(PurgeUserRequest) returns (google.protobuf.Empty);
}

// Who may write on the wall: everyone, only the admins, or only the
// admins who publish what others suggest ("Предложка").
enum Wall {
  WALL_UNSPECIFIED = 0;
  WALL_OPEN = 1;
  WALL_CLOSED = 2;
  WALL_SUGGEST = 3;
}

// What the page of a club shows of those who run it, openvk's "Список
// админов".
enum AdminsDisplay {
  ADMINS_DISPLAY_UNSPECIFIED = 0;
  // Only the creator, the owner.
  ADMINS_DISPLAY_CREATOR = 1;
  ADMINS_DISPLAY_ALL = 2;
  ADMINS_DISPLAY_NONE = 3;
}

// What a club is: a group, or an event ("встреча") with the time it
// starts and people who come to it.
enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_GROUP = 1;
  KIND_EVENT = 2;
}

// Which events to list by their time: an event is past when it has ended
// or, having no end, begun.
enum Period {
  PERIOD_UNSPECIFIED = 0;
  PERIOD_UPCOMING = 1;
  PERIOD_PAST = 2;
}

// Which members of an event to list.
enum Going {
  // Everyone.
  GOING_UNSPECIFIED = 0;
  // "Точно придут".
  GOING_SURE = 1;
  // "Возможно придут".
  GOING_MAYBE = 2;
}

enum Role {
  // Not a member.
  ROLE_NONE = 0;
  ROLE_MEMBER = 1;
  ROLE_ADMIN = 2;
  ROLE_OWNER = 3;
}

message Club {
  string id = 1;
  string name = 2;
  // Plain text with \n line breaks; may be empty.
  string description = 3;
  // The short name of its page; empty for none.
  string address = 4;
  Wall wall = 5;
  int32 member_count = 6;
  google.protobuf.Timestamp created_at = 7;
  // The club's photo in the media service; empty for none.
  string avatar_id = 8;
  // An http or https link; empty for none.
  string website = 9;
  AdminsDisplay admins_display = 10;
  // Anyone starts topics in its discussions, not only the admins ("Все
  // могут создавать темы").
  bool open_topics = 11;
  // Its page lists the topics above the wall.
  bool topics_above_wall = 12;
  // "Фон страницы": photos of the club in the media service on the left
  // and on the right of its page; empty for none.
  string backdrop_left = 13;
  string backdrop_right = 14;
  Kind kind = 15;
  // When an event starts and, if set, ends; unset for a group.
  google.protobuf.Timestamp starts_at = 16;
  google.protobuf.Timestamp ends_at = 17;
  // How many of member_count only might come to the event.
  int32 maybe_count = 18;
  // "Тип группы: закрытая": one joins by a request its admins accept
  // (JoinClub makes it), and only the members see what is in the club.
  bool closed = 19;
}

// ClubView is a club as the caller sees it.
message ClubView {
  Club club = 1;
  // What the caller is in it; ROLE_NONE for an anonymous caller.
  Role role = 2;
  // Empty when its owner's page was erased, or when the club hides its
  // owner from the caller.
  string owner_id = 3;
  // The caller may start a topic in its discussions.
  bool can_start_topic = 4;
  // What the owner does in the club; empty for none.
  string owner_title = 5;
  // The caller only might come to the event.
  bool maybe = 6;
  // The caller asked to join the closed club and waits.
  bool requested = 7;
  // How many wait to be let in; told to those who run the club.
  int32 request_count = 8;
}

message CreateEventRequest {
  string name = 1;
  string description = 2;
  google.protobuf.Timestamp starts_at = 3;
  // Unset for an event with no end; else later than starts_at.
  google.protobuf.Timestamp ends_at = 4;
}

message CreateEventResponse {
  ClubView club = 1;
}

message CreateClubRequest {
  string name = 1;
  string description = 2;
}

message CreateClubResponse {
  ClubView club = 1;
}

message GetClubRequest {
  // The club's ID or its address.
  string ref = 1;
}

message GetClubResponse {
  ClubView club = 1;
}

message GetClubsRequest {
  repeated string ids = 1;
}

message GetClubsResponse {
  repeated Club clubs = 1;
}

message UpdateClubRequest {
  string club_id = 1;
  string name = 2;
  string description = 3;
  // Empty takes the address away.
  string address = 4;
  Wall wall = 5;
  // Empty for none; https:// is added when the scheme is left out.
  string website = 6;
  AdminsDisplay admins_display = 7;
  bool open_topics = 8;
  bool topics_above_wall = 9;
  // The schedule of an event, which must have a start; a group has none.
  google.protobuf.Timestamp starts_at = 10;
  google.protobuf.Timestamp ends_at = 11;
  // "Тип группы: закрытая"; an event is never closed.
  bool closed = 12;
}

message UpdateClubResponse {
  ClubView club = 1;
}

message JoinClubRequest {
  string club_id = 1;
  bool maybe = 2;
}

message JoinClubResponse {
  ClubView club = 1;
}

message LeaveClubRequest {
  string club_id = 1;
}

message LeaveClubResponse {
  ClubView club = 1;
}

message ListMembersRequest {
  string club_id = 1;
  // Empty for the newest, else next_cursor of the previous page.
  string cursor = 2;
  // 1-50; anything else means 20.
  int32 limit = 3;
  bool admins_only = 4;
  // Without admins_only: only those who come to the event for sure, or
  // only those who might.
  Going going = 5;
}

message Member {
  string user_id = 1;
  Role role = 2;
  // What an admin does in the club; empty for none.
  string title = 3;
  // The club hides that they run it; only those who run it are told.
  bool hidden = 4;
  // They only might come to the event.
  bool maybe = 5;
}

message ListMembersResponse {
  repeated Member members = 1;
  // Empty on the last page.
  string next_cursor = 2;
  // How many there are on all pages.
  int32 total = 3;
}

message ListJoinRequestsRequest {
  string club_id = 1;
  // Empty for the newest, else next_cursor of the previous page.
  string cursor = 2;
  // 1-50; anything else means 20.
  int32 limit = 3;
}

message ListJoinRequestsResponse {
  // Who asks to join.
  repeated string user_ids = 1;
  // Empty on the last page.
  string next_cursor = 2;
  // How many there are on all pages.
  int32 total = 3;
}

message AcceptJoinRequestRequest {
  string club_id = 1;
  string user_id = 2;
}

message RejectJoinRequestRequest {
  string club_id = 1;
  string user_id = 2;
}

message SetMemberRoleRequest {
  string club_id = 1;
  string user_id = 2;
  // ROLE_MEMBER or ROLE_ADMIN.
  Role role = 3;
}

message DescribeMemberRequest {
  string club_id = 1;
  // The owner or one of the admins.
  string user_id = 2;
  // At most 36 characters in one line; empty for none. What is not set
  // stays as it is, here and below.
  optional string title = 3;
  optional bool hidden = 4;
}

message TransferClubRequest {
  string club_id = 1;
  // The new owner, one of the admins.
  string user_id = 2;
}

message ListMyClubsRequest {
  // Empty for the newest, else next_cursor of the previous page.
  string cursor = 1;
  // 1-50; anything else means 20.
  int32 limit = 2;
  // Only the clubs the caller runs.
  bool managed = 3;
  // Only groups or only events; unspecified for both.
  Kind kind = 4;
  // Only the events ahead or only those over; unspecified for all clubs.
  Period period = 5;
}

message Membership {
  Club club = 1;
  Role role = 2;
  // In the caller's left menu.
  bool pinned = 3;
}

message ListMyClubsResponse {
  repeated Membership clubs = 1;
  // Empty on the last page.
  string next_cursor = 2;
  // How many there are on all pages.
  int32 total = 3;
}

message ListUserClubsRequest {
  string user_id = 1;
  // Empty for the newest, else next_cursor of the previous page.
  string cursor = 2;
  // 1-50; anything else means 20.
  int32 limit = 3;
  // Only groups or only events; unspecified for both.
  Kind kind = 4;
  // Only the events ahead or only those over; unspecified for all clubs.
  Period period = 5;
}

message ListUserClubsResponse {
  repeated Club clubs = 1;
  // Empty on the last page.
  string next_cursor = 2;
  // How many there are on all pages.
  int32 total = 3;
}

message SearchClubsRequest {
  string query = 1;
  // Empty for the newest, else next_cursor of the previous page.
  string cursor = 2;
  // 1-50; anything else means 20.
  int32 limit = 3;
}

message SearchClubsResponse {
  repeated Club clubs = 1;
  // Empty on the last page.
  string next_cursor = 2;
}

message SetClubAvatarRequest {
  string club_id = 1;
  string avatar_id = 2;
}

message SetClubAvatarResponse {
  ClubView club = 1;
}

enum BackdropSide {
  BACKDROP_SIDE_UNSPECIFIED = 0;
  BACKDROP_SIDE_LEFT = 1;
  BACKDROP_SIDE_RIGHT = 2;
}

message SetClubBackdropRequest {
  string club_id = 1;
  BackdropSide side = 2;
  string photo_id = 3;
}

message SetClubBackdropResponse {
  ClubView club = 1;
}

message PinClubRequest {
  string club_id = 1;
  bool pinned = 2;
}

message ListPinnedClubsRequest {}

message ListPinnedClubsResponse {
  repeated Club clubs = 1;
}

message ListMyRolesRequest {
  repeated string club_ids = 1;
}

message ListMyRolesResponse {
  repeated ClubRole roles = 1;
}

message ClubRole {
  string club_id = 1;
  Role role = 2;
}

message ListMyClubIDsRequest {}

message ListMyClubIDsResponse {
  repeated string club_ids = 1;
}

message CanPostOnWallRequest {
  string club_id = 1;
  bool from_club = 2;
}

message CanPostOnWallResponse {
  bool allowed = 1;
  // The caller may suggest a post for the admins to publish
  // ("Предложить новость"): the wall is a "Предложка" and the caller is
  // not one of its admins.
  bool suggest = 2;
}

message CanModerateWallRequest {
  string wall_id = 1;
  string user_id = 2;
}

message CanModerateWallResponse {
  bool allowed = 1;
}

message ListWallModeratorsRequest {
  string wall_id = 1;
}

message ListWallModeratorsResponse {
  repeated string user_ids = 1;
}

message PurgeUserRequest {
  string user_id = 1;
}

message CountClubsRequest {}

message CountClubsResponse {
  int32 count = 1;
}
