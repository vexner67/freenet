syntax = "proto3";

package federation.v1;

option go_package = "github.com/vexner67/freenet/federation/api/federation/v1;federationv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// FederationService opens pages to the Fediverse (ActivityPub): other
// servers read their documents and posts, follow them and get what they
// post. The documents are ActivityPub JSON, which the gateway passes on
// as it is.
service FederationService {
  // Require an access token: the caller's own page. Opening a page that
  // only some may see is FailedPrecondition.
  rpc GetFederation(GetFederationRequest) returns (GetFederationResponse);
  rpc OpenFederation(OpenFederationRequest) returns (OpenFederationResponse);
  rpc CloseFederation(CloseFederationRequest) returns (CloseFederationResponse);

  // Public: what other servers read. A page not open to the Fediverse,
  // or a post that does not go there, is NotFound.
  rpc Finger(FingerRequest) returns (FingerResponse);
  rpc GetActor(GetActorRequest) returns (GetActorResponse);
  rpc GetNote(GetNoteRequest) returns (GetNoteResponse);
  rpc GetFollowers(GetFollowersRequest) returns (GetFollowersResponse);
  rpc GetOutbox(GetOutboxRequest) returns (GetOutboxResponse);

  // Internal, for the gateway: a request another server made to an
  // inbox, as it came, for its signature to be checked. A request not
  // signed by whom it says is Unauthenticated.
  rpc Receive(ReceiveRequest) returns (google.protobuf.Empty);
  // Internal, for post: a post was published, edited or deleted.
  // Idempotent enough: the servers take an activity twice.
  rpc PostChanged(PostChangedRequest) returns (google.protobuf.Empty);

  // Public: the document of the site itself, which follows accounts of
  // other servers for the news.
  rpc GetSiteActor(GetSiteActorRequest) returns (GetSiteActorResponse);

  // Require an access token. An address that is not one is
  // InvalidArgument; an account its server does not give is NotFound.
  rpc LookupAccount(LookupAccountRequest) returns (LookupAccountResponse);
  // The accounts of other servers the caller reads; more than one may is
  // FailedPrecondition.
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
  rpc Unsubscribe(UnsubscribeRequest) returns (google.protobuf.Empty);
  // Remote posts for the news, newest first: of the accounts the caller
  // reads, or of those in the news of everyone.
  rpc ListNews(ListNewsRequest) returns (ListNewsResponse);
  // The hearts of people here on remote posts; their servers do not learn
  // of them. A post not kept is NotFound, too many likes at once
  // ResourceExhausted.
  rpc LikeNews(LikeNewsRequest) returns (LikeNewsResponse);
  rpc UnlikeNews(UnlikeNewsRequest) returns (UnlikeNewsResponse);
  // Who here like a remote post, the latest first.
  rpc ListNewsLikers(ListNewsLikersRequest) returns (ListNewsLikersResponse);
  // One remote post, as the caller sees it.
  rpc GetNewsPost(GetNewsPostRequest) returns (GetNewsPostResponse);
  // What people here write under remote posts; their servers do not
  // learn of it. Only its author deletes a comment.
  rpc CommentNews(CommentNewsRequest) returns (CommentNewsResponse);
  rpc ListNewsComments(ListNewsCommentsRequest) returns (ListNewsCommentsResponse);
  rpc DeleteNewsComment(DeleteNewsCommentRequest) returns (google.protobuf.Empty);

  // Internal, for the gateway, which lets only administrators call them:
  // the accounts in the news of everyone.
  rpc ListFeatured(ListFeaturedRequest) returns (ListFeaturedResponse);
  rpc Feature(FeatureRequest) returns (FeatureResponse);
  rpc Unfeature(UnfeatureRequest) returns (google.protobuf.Empty);
  // Internal, for the gateway: a picture of a remote post or the photo of
  // an account, read from its server for the site to show. Anything but
  // a picture is NotFound.
  rpc GetPicture(GetPictureRequest) returns (GetPictureResponse);
}

message FederationStatus {
  bool open = 1;
  // How many people of other servers follow the page.
  int32 followers = 2;
  // The domain the address of the page ends with: @nickname@domain.
  string domain = 3;
}

message GetFederationRequest {}

message GetFederationResponse {
  FederationStatus status = 1;
}

message OpenFederationRequest {}

message OpenFederationResponse {
  FederationStatus status = 1;
}

message CloseFederationRequest {}

message CloseFederationResponse {
  FederationStatus status = 1;
}

message FingerRequest {
  // acct:nickname@domain, or the address of the page.
  string resource = 1;
}

message FingerResponse {
  // JSON Resource Descriptor (application/jrd+json).
  bytes document = 1;
}

message GetActorRequest {
  string user_id = 1;
}

message GetActorResponse {
  // application/activity+json.
  bytes document = 1;
  // The page itself, for a browser.
  string page_url = 2;
}

message GetNoteRequest {
  string post_id = 1;
}

message GetNoteResponse {
  bytes document = 1;
  string page_url = 2;
}

message GetFollowersRequest {
  string user_id = 1;
}

message GetFollowersResponse {
  bytes document = 1;
}

message GetOutboxRequest {
  string user_id = 1;
}

message GetOutboxResponse {
  bytes document = 1;
}

message ReceiveRequest {
  string method = 1;
  // The path and query the request was made to.
  string path = 2;
  // The headers of the request, their names in lower case.
  map<string, string> headers = 3;
  bytes body = 4;
  // The page whose inbox it is; empty for the shared inbox.
  string user_id = 5;
}

// PostChange is what happened to a post.
enum PostChange {
  POST_CHANGE_UNSPECIFIED = 0;
  POST_CHANGE_PUBLISHED = 1;
  POST_CHANGE_EDITED = 2;
  POST_CHANGE_DELETED = 3;
}

message PostChangedRequest {
  PostChange change = 1;
  string post_id = 2;
  string author_id = 3;
}

message GetSiteActorRequest {}

message GetSiteActorResponse {
  bytes document = 1;
}

// Account is an account of another server.
message Account {
  // The address of its actor.
  string id = 1;
  // @username@host.
  string handle = 2;
  string name = 3;
  // Its page, for a browser.
  string page_url = 4;
  bool has_avatar = 5;
  // Its server took the follow of the site; until then its posts may not
  // come.
  bool accepted = 6;
  // A public channel of Telegram, read from its page t.me/s/<name>.
  bool telegram = 7;
}

message LookupAccountRequest {
  // @username@host, username@host or the https address of the account;
  // t.me/name or @name of a channel of Telegram.
  string address = 1;
}

message LookupAccountResponse {
  Account account = 1;
  // The caller reads it.
  bool subscribed = 2;
}

message ListSubscriptionsRequest {}

message ListSubscriptionsResponse {
  repeated Account accounts = 1;
}

message SubscribeRequest {
  string address = 1;
}

message SubscribeResponse {
  Account account = 1;
}

message UnsubscribeRequest {
  // The address of the actor.
  string id = 1;
}

// NewsScope is whose posts the news are of.
enum NewsScope {
  NEWS_SCOPE_UNSPECIFIED = 0;
  // The accounts the caller reads.
  NEWS_SCOPE_SUBSCRIBED = 1;
  // The accounts in the news of everyone.
  NEWS_SCOPE_FEATURED = 2;
}

message ListNewsRequest {
  NewsScope scope = 1;
  // Posts before this ID; empty for the newest. Remote posts have
  // UUIDv7 IDs by the time they were published, so one cursor pages them
  // together with the posts of the site.
  string before = 2;
  int32 limit = 3;
  bool hide_sensitive = 4;
}

message NewsImage {
  string description = 1;
}

// A video, shown as its cover, which opens the post on its server.
message NewsVideo {
  string description = 1;
  // A blurred cover, drawn until GetPicture reads the cover.
  string blurhash = 2;
  // Zero when the server did not tell.
  int32 width = 3;
  int32 height = 4;
  int32 duration_seconds = 5;
}

message NewsPost {
  string id = 1;
  // The address of the note.
  string url = 2;
  // The post itself, for a browser.
  string page_url = 3;
  Account author = 4;
  // Plain text, made from the HTML of the note.
  string text = 5;
  // The content warning; the post is sensitive with one.
  string summary = 6;
  bool sensitive = 7;
  // GetPicture reads them by their index.
  repeated NewsImage images = 8;
  string language = 9;
  google.protobuf.Timestamp published_at = 10;
  // Unset for a post never edited.
  google.protobuf.Timestamp updated_at = 11;
  // GetPicture reads their covers by their index.
  repeated NewsVideo videos = 12;
  // How many here like it, and whether the caller does.
  int32 likes = 13;
  bool liked = 14;
  // The card of the page it links to; unset for none.
  NewsLink link = 15;
  // How many comments people here wrote under it.
  int32 comments = 16;
}

// The card of a page a remote post links to, as its server tells it.
message NewsLink {
  string url = 1;
  string site = 2;
  string title = 3;
  string description = 4;
  // GetPicture reads it with link.
  bool has_image = 5;
}

message LikeNewsRequest {
  string post_id = 1;
}

message LikeNewsResponse {
  int32 likes = 1;
}

message UnlikeNewsRequest {
  string post_id = 1;
}

message UnlikeNewsResponse {
  int32 likes = 1;
}

message ListNewsLikersRequest {
  string post_id = 1;
  // The next_cursor of the page before; empty for the first.
  string cursor = 2;
  int32 limit = 3;
}

message ListNewsLikersResponse {
  repeated string user_ids = 1;
  // Empty after the last page.
  string next_cursor = 2;
  int32 total = 3;
}

message GetNewsPostRequest {
  string id = 1;
}

message GetNewsPostResponse {
  NewsPost post = 1;
}

message NewsComment {
  string id = 1;
  string post_id = 2;
  string author_id = 3;
  string text = 4;
  google.protobuf.Timestamp created_at = 5;
}

message CommentNewsRequest {
  string post_id = 1;
  string text = 2;
}

message CommentNewsResponse {
  NewsComment comment = 1;
}

message ListNewsCommentsRequest {
  string post_id = 1;
  // The next_cursor of the page before; empty for the first.
  string cursor = 2;
  int32 limit = 3;
}

message ListNewsCommentsResponse {
  // The oldest first.
  repeated NewsComment comments = 1;
  // Empty after the last page.
  string next_cursor = 2;
  int32 total = 3;
}

message DeleteNewsCommentRequest {
  string id = 1;
}

message ListNewsResponse {
  repeated NewsPost posts = 1;
}

message ListFeaturedRequest {}

message ListFeaturedResponse {
  repeated Account accounts = 1;
}

message FeatureRequest {
  string address = 1;
}

message FeatureResponse {
  Account account = 1;
}

message UnfeatureRequest {
  string id = 1;
}

message GetPictureRequest {
  // A picture of a remote post: its ID and the index of the image.
  string post_id = 1;
  int32 index = 2;
  // Or the photo of an account, by the address of its actor.
  string account_id = 3;
  // The cover of the video index of the post instead of the image.
  bool video = 4;
  // The picture of the card of the page the post links to instead.
  bool link = 5;
}

message GetPictureResponse {
  bytes body = 1;
  string content_type = 2;
}
