<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Новая тема | Freenet</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/topic-create.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-mark">f</span>freenet</a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Загрузка…</span></div>
      <div class="page-body">
        <div class="error" id="error" hidden></div>
        <form class="topic-form" id="form" hidden>
          <table class="form">
            <tr>
              <th><label for="topic-title">Заголовок</label></th>
              <td class="control"><input type="text" id="topic-title" maxlength="127" required></td>
            </tr>
            <tr>
              <th><label for="topic-text">Текст</label></th>
              <td class="control">
                <textarea id="topic-text" maxlength="60000"></textarea>
                <div class="attachments" id="topic-photos" hidden></div>
                <a class="attach-link" id="topic-attach">Прикрепить фотографию</a>
                <div class="post-options">
                  <label id="topic-from-club-label" hidden><input type="checkbox" id="topic-from-club"> От имени сообщества</label>
                </div>
                <input type="file" id="topic-file" accept="image/jpeg,image/png,image/gif,image/webp" multiple hidden>
              </td>
            </tr>
            <tr>
              <th></th>
              <td class="control"><button class="button" type="submit" id="submit">Создать тему</button></td>
            </tr>
          </table>
        </form>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/">о сайте</a><a href="/">правила</a><a href="/">помощь</a>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
