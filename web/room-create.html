<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=820">
  <title>Создать комнату | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/palette.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/room-create.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-word">freenet</span></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Создать комнату</span></div>
      <div class="page-body">
        <div class="error" id="error" hidden></div>
        <form class="container-gray" id="form">
          <h4>Основная информация</h4>
          <table class="form">
            <tr>
              <th><label class="required" for="name">Название:</label></th>
              <td class="control"><input type="text" id="name" maxlength="64" required></td>
            </tr>
            <tr>
              <th><label for="kind">Вид:</label></th>
              <td class="control">
                <select id="kind">
                  <option value="talk">разговор</option>
                  <option value="watch">кино</option>
                  <option value="listen">музыка</option>
                </select>
              </td>
            </tr>
            <tr>
              <th><label for="access">Кто может войти:</label></th>
              <td class="control">
                <select id="access">
                  <option value="everyone">все желающие</option>
                  <option value="friends">друзья</option>
                  <option value="link">по ссылке</option>
                </select>
              </td>
            </tr>
            <tr>
              <th><label for="control">Кто управляет экраном:</label></th>
              <td class="control">
                <select id="control">
                  <option value="owner">только создатель</option>
                  <option value="everyone">все участники</option>
                </select>
              </td>
            </tr>
            <tr>
              <th>Комната:</th>
              <td class="checks">
                <label><input type="checkbox" id="permanent"> Постоянная</label>
                <div class="hint">Постоянная комната не закрывается, когда из неё все вышли, и сохраняет адрес.</div>
              </td>
            </tr>
            <tr>
              <th></th>
              <td class="control"><button class="button" type="submit" id="submit">Создать</button></td>
            </tr>
          </table>
        </form>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p class="footer-languages"><a class="footer-language" href="/language?lg=ru" title="Русский"><img src="/static/flags/ru.gif" alt="Русский"></a><a class="footer-language" href="/language?lg=en" title="English"><img src="/static/flags/gb.gif" alt="English"></a><a href="/language">all languages &raquo;</a></p>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
