<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=820">
  <title>Новая статья | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/palette.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/article-edit.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-word">freenet</span></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Новая статья</span></div>
      <div class="page-body">
        <div class="error" id="error" hidden></div>
        <form class="article-editor" id="editor-form" hidden>
          <div class="article-cover editing" id="cover">
            <a class="article-cover-add" id="cover-add">Добавить обложку</a>
            <button type="button" class="article-cover-remove" id="cover-remove" title="Убрать обложку" hidden>×</button>
          </div>
          <input type="file" id="cover-file" accept="image/*" hidden>
          <textarea class="article-title-input" id="title-input" rows="1" maxlength="256" placeholder="Заголовок"></textarea>
          <div class="article-toolbar" id="toolbar" role="toolbar"></div>
          <input type="file" id="photo-file" accept="image/*" hidden>
          <div class="article-text article-body-input" id="body-input" contenteditable="true" role="textbox" aria-multiline="true"></div>
          <div class="article-actions">
            <button class="button" type="submit" id="publish">Опубликовать</button>
            <a class="article-cancel" id="cancel">Отмена</a>
            <label class="article-to-wall" id="to-wall-label"><input type="checkbox" id="to-wall" checked> Опубликовать на моей стене</label>
            <span class="article-counter" id="counter"></span>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p class="footer-languages"><a class="footer-language" href="/language?lg=ru" title="Русский"><img src="/static/flags/ru.gif" alt="Русский"></a><a class="footer-language" href="/language?lg=en" title="English"><img src="/static/flags/gb.gif" alt="English"></a><a href="/language">all languages &raquo;</a></p>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
