<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Мои Группы | Freenet</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/groups.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-mark">f</span>freenet</a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Мои Группы</span></div>
      <div class="page-body">
        <div class="tabs">
          <a id="tab-all" href="/groups">Группы</a>
          <a id="tab-managed" href="/groups?act=managed">Управляемые</a>
        </div>
        <div class="gray-bar">
          <form class="gray-bar-search" action="/search" method="get">
            <input type="hidden" name="section" value="groups">
            <input type="text" name="q" maxlength="64" placeholder="Поиск по группам" aria-label="Поиск по группам">
          </form>
          <a class="button" href="/groups/create">Создать группу</a>
        </div>
        <div class="summary-bar" id="summary"></div>
        <div class="error" id="error" hidden></div>
        <div id="clubs"></div>
        <a class="wall-more" id="more" hidden>Показать ещё</a>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/">о сайте</a><a href="/">правила</a><a href="/">помощь</a>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
