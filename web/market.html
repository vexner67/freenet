<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Маркет подарков | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/palette.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/mobile.css" media="(max-width: 800px)">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/market-page.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/" aria-label="Freenet"><svg class="logo-mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6"/><path d="M19.4 6.6h-1.8a4 4 0 0 0-4 4V23" stroke-width="4"/><path d="M8.4 13.5h10.6" stroke-width="3.6"/></svg><svg class="logo-word" viewBox="28 0 87 28" aria-hidden="true"><path d="M32.5 23v-7.6a4 4 0 0 1 4-4h1.8M52.9 16.25a4.85 4.85 0 1 0-1.25 3.25M69 16.25a4.85 4.85 0 1 0-1.25 3.25M75.4 9.5V23m0-6.75a4.85 4.85 0 0 1 9.7 0V23M101.2 16.25a4.85 4.85 0 1 0-1.25 3.25M107.6 6.6v10.5a4 4 0 0 0 4 4h1.8" stroke-width="3.8"/><path d="M41.3 16.25h13.5M57.4 16.25h13.5M89.6 16.25h13.5M104.1 11.2h9.3" stroke-width="3.4"/></svg></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Маркет подарков</span></div>
      <div class="page-body">
        <div class="tabs" id="tabs">
          <a id="tab-market" href="/market">Маркет</a>
          <a id="tab-auctions" href="/market?tab=auctions">Аукционы</a>
          <a class="tabs-side" id="tab-mine" href="/gifts" hidden>Мои подарки</a>
        </div>
        <p class="collectible-lead" id="lead"></p>
        <form class="market-filters" id="filters" method="get" action="/market" hidden>
          <select name="gift" id="filter-gift" aria-label="Подарок"><option value="">все подарки</option></select>
          <select name="model" id="filter-model" aria-label="Модель"><option value="">любая модель</option></select>
          <select name="backdrop" id="filter-backdrop" aria-label="Фон"><option value="">любой фон</option></select>
          <select name="symbol" id="filter-symbol" aria-label="Узор"><option value="">любой узор</option></select>
          <select name="sort" id="filter-sort" aria-label="Порядок"></select>
          <button class="button" type="submit">Показать</button>
        </form>
        <div class="error" id="error" hidden></div>
        <div class="collectible-grid" id="grid"></div>
        <p class="hint" id="empty" hidden>Тут ничего нет... Пока...</p>
        <a class="wall-more" id="more" hidden>Показать ещё</a>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p class="footer-languages"><a class="footer-language" href="/language?lg=ru" title="Русский"><img src="/static/flags/ru.gif" alt="Русский"></a><a class="footer-language" href="/language?lg=en" title="English"><img src="/static/flags/gb.gif" alt="English"></a><a href="/language">all languages &raquo;</a></p>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
