<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Альбом | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/album.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-mark">f</span>freenet</a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Загрузка…</span></div>
      <div class="page-body">
        <div class="error" id="error" hidden></div>
        <div id="content" hidden>
          <div class="album-head">
            <a id="count-link"><b id="count"></b></a><span id="links"></span>
          </div>
          <div class="gray-box album-grid" id="photos"></div>
          <p class="hint" id="empty" hidden>Тут ничего нет... Пока...</p>
          <a class="wall-more" id="more" hidden>Показать ещё</a>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
