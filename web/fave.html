<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=820">
  <title>Закладки | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/palette.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/fave.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-word">freenet</span></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Понравившиеся записи</span></div>
      <div class="page-body">
        <div class="tabs" id="tabs" hidden>
          <a id="tab-posts" href="/fave">Записи</a>
          <a id="tab-comments" href="/fave?section=comments">Комментарии</a>
        </div>
        <div class="summary-bar" id="summary" hidden><span id="summary-count"></span></div>
        <div class="error" id="error" hidden></div>
        <p class="hint" id="empty" hidden></p>
        <div id="posts"></div>
        <a class="wall-more" id="more" hidden>Показать ещё</a>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p class="footer-languages"><a class="footer-language" href="/language?lg=ru" title="Русский"><img src="/static/flags/ru.gif" alt="Русский"></a><a class="footer-language" href="/language?lg=en" title="English"><img src="/static/flags/gb.gif" alt="English"></a><a href="/language">all languages &raquo;</a></p>
    <p>Freenet © 2026</p>
  </div>
</div>

</html>
