<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=820">
  <title>Заработок | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/palette.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/mine-page.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/" aria-label="Freenet"><svg class="logo-mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6"/><path d="M19.4 6.6h-1.8a4 4 0 0 0-4 4V23" stroke-width="4"/><path d="M8.4 13.5h10.6" stroke-width="3.6"/></svg><svg class="logo-word" viewBox="28 0 87 28" aria-hidden="true"><path d="M32.5 23v-7.6a4 4 0 0 1 4-4h1.8M52.9 16.25a4.85 4.85 0 1 0-1.25 3.25M69 16.25a4.85 4.85 0 1 0-1.25 3.25M75.4 9.5V23m0-6.75a4.85 4.85 0 0 1 9.7 0V23M101.2 16.25a4.85 4.85 0 1 0-1.25 3.25M107.6 6.6v10.5a4 4 0 0 0 4 4h1.8" stroke-width="3.8"/><path d="M41.3 16.25h13.5M57.4 16.25h13.5M89.6 16.25h13.5M104.1 11.2h9.3" stroke-width="3.4"/></svg></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span>Заработок</span></div>
      <div class="page-body">
        <div class="tabs casino-tabs">
          <a class="active" href="/mine">Шахта</a>
          <a href="/business">Бизнес</a>
        </div>
        <div class="error" id="error" hidden></div>
        <div class="mine" id="mine" hidden>
          <div class="mine-main">
            <p class="hint" id="guest" hidden>Копать могут только вошедшие на сайт.</p>
            <div class="game-hud" id="status" hidden>
              <div class="game-hud-cell">
                <span class="game-hud-name"><img class="game-icon" src="/static/icons/game/energy.svg" alt="" width="16" height="16">Энергия</span>
                <span class="meter mine-meter"><span class="meter-fill good" id="energy-bar"></span><span class="meter-text" id="energy"></span></span>
                <span class="hint" id="energy-next"></span>
              </div>
              <div class="game-hud-cell">
                <span class="game-hud-name"><img class="game-icon" src="/static/icons/game/star.svg" alt="" width="16" height="16">Опыт: <b id="experience"></b></span>
                <span class="meter mine-meter"><span class="meter-fill" id="next-bar"></span><span class="meter-text" id="next-share"></span></span>
                <span class="hint" id="next-ore"></span>
              </div>
              <div class="game-hud-cell game-hud-money" id="balance" hidden>
                <span class="game-hud-name"><img class="game-icon" src="/static/icons/game/coins.svg" alt="" width="16" height="16">На счету</span>
                <b class="game-hud-sum" id="votes"></b>
                <span class="hint" id="votes-word"></span>
              </div>
            </div>
            <div class="game-window" id="face-block" hidden>
              <div class="game-window-title"><img src="/static/icons/game/pick.svg" alt="" width="16" height="16"><span>Забой</span><span id="mine-help"></span></div>
              <div class="game-window-body">
                <div class="mine-ores" id="ores"></div>
                <button class="mine-face" type="button" id="dig">
                  <span class="mine-series" id="series" hidden></span>
                  <span class="mine-face-ore" id="face-ore"></span>
                  <img class="mine-face-pick" id="face-pick" src="/static/icons/game/pick.svg" alt="" width="48" height="48">
                  <span class="mine-face-text" id="dig-text">Копать!</span>
                  <span class="mine-face-sub" id="dig-sub"></span>
                </button>
                <div class="mine-log" id="log" hidden></div>
              </div>
            </div>
            <div class="game-window" id="backpack-block" hidden>
              <div class="game-window-title"><img src="/static/icons/game/backpack.svg" alt="" width="16" height="16"><span>Рюкзак</span></div>
              <div class="game-window-body">
                <div class="mine-backpack" id="backpack"></div>
                <p class="hint" id="backpack-empty">Рюкзак пуст. Накопайте руды.</p>
                <button class="button game-go" type="button" id="sell-all" hidden></button>
                <p class="hint mine-totals" id="totals"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p class="footer-languages"><a class="footer-language" href="/language?lg=ru" title="Русский"><img src="/static/flags/ru.gif" alt="Русский"></a><a class="footer-language" href="/language?lg=en" title="English"><img src="/static/flags/gb.gif" alt="English"></a><a href="/language">all languages &raquo;</a></p>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
