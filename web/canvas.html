<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=820">
  <title>Холст | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/palette.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/canvas-page.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-word">freenet</span></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span>Холст</span></div>
      <div class="page-body">
        <div class="error" id="error" hidden></div>
        <div class="canvas-page" id="board" hidden>
          <div class="game-hud four" id="hud"></div>
          <div class="game-window">
            <div class="game-window-title"><img class="game-icon" src="/static/icons/game/palette.svg" alt="" width="16" height="16"><span>Холст</span><span id="canvas-help"></span></div>
            <div class="game-window-body">
              <div class="canvas-colors">
                <span class="canvas-current" id="current" title="Цвет в руке"></span>
                <div class="canvas-recent" id="recent"></div>
                <div class="canvas-palette" id="palette"></div>
              </div>
              <div class="canvas-status" id="status"></div>
              <div class="canvas-paint">
                <div class="canvas-toolbox" id="tools">
                  <button class="canvas-tool" type="button" id="tool-brush" title="Кисть (B)"><img src="/static/icons/game/brush.svg" alt="Кисть" width="20" height="20"></button>
                  <button class="canvas-tool" type="button" id="tool-eraser" title="Ластик (E)"><img src="/static/icons/game/eraser.svg" alt="Ластик" width="20" height="20"></button>
                  <button class="canvas-tool" type="button" id="tool-hand" title="Рука: двигать холст (H)"><img src="/static/icons/game/hand.svg" alt="Рука: двигать холст" width="20" height="20"></button>
                  <button class="canvas-tool" type="button" id="tool-pick" title="Пипетка: взять цвет (I)"><img src="/static/icons/game/pipette.svg" alt="Пипетка: взять цвет" width="20" height="20"></button>
                  <button class="canvas-tool" type="button" id="tool-look" title="Кто закрасил клетку? (W)"><img src="/static/icons/game/who.svg" alt="Кто закрасил клетку?" width="20" height="20"></button>
                  <button class="canvas-tool" type="button" id="undo" title="Отменить (Z)"><img src="/static/icons/game/undo.svg" alt="Отменить" width="20" height="20"></button>
                  <button class="canvas-tool" type="button" id="zoom-in" title="Увеличить (+)"><img src="/static/icons/game/zoom-in.svg" alt="Увеличить" width="20" height="20"></button>
                  <button class="canvas-tool" type="button" id="zoom-out" title="Уменьшить (−)"><img src="/static/icons/game/zoom-out.svg" alt="Уменьшить" width="20" height="20"></button>
                  <button class="canvas-tool" type="button" id="zoom-fit" title="Весь холст (0)"><img src="/static/icons/game/fit.svg" alt="Весь холст" width="20" height="20"></button>
                </div>
                <div class="canvas-frame" id="frame"><canvas class="canvas-board" id="canvas" width="100" height="100"></canvas></div>
              </div>
            </div>
          </div>
          <div class="canvas-tip" id="tip" hidden></div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p class="footer-languages"><a class="footer-language" href="/language?lg=ru" title="Русский"><img src="/static/flags/ru.gif" alt="Русский"></a><a class="footer-language" href="/language?lg=en" title="English"><img src="/static/flags/gb.gif" alt="English"></a><a href="/language">all languages &raquo;</a></p>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
