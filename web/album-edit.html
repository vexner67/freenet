<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Редактировать альбом | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/album-edit.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/" aria-label="Freenet"><svg class="logo-mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6"/><path d="M19.4 6.6h-1.8a4 4 0 0 0-4 4V23" stroke-width="4"/><path d="M8.4 13.5h10.6" stroke-width="3.6"/></svg><svg class="logo-word" viewBox="28 0 102 28" aria-hidden="true"><path d="M35.6 22V9M35.6 13.5a4.5 4.5 0 0 1 4.5-4.5h1.6M47.3 15.5h13a6.5 6.5 0 1 0-1.9 4.6M65.9 15.5h13a6.5 6.5 0 1 0-1.9 4.6M84.5 22V9M84.5 14a5 5 0 0 1 10 0V22M100.1 15.5h13a6.5 6.5 0 1 0-1.9 4.6M122 4.5V18a4 4 0 0 0 4 4h1.5M118.6 9h8"/></svg></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Загрузка…</span></div>
      <div class="page-body">
        <div id="content" hidden>
          <div class="tabs">
            <a class="active" id="tab-edit">Редактировать альбом</a>
            <a id="tab-upload">Добавить фотографии</a>
          </div>
          <div class="error" id="error" hidden></div>
          <div class="notice" id="notice" hidden></div>
          <div class="container-gray">
          <form id="form">
            <table class="form album-form">
              <tr>
                <th><label for="name">Название:</label></th>
                <td class="control"><input type="text" id="name" maxlength="36" required></td>
              </tr>
              <tr>
                <th><label for="description">Описание:</label></th>
                <td class="control"><textarea id="description" maxlength="255" rows="4"></textarea></td>
              </tr>
              <tr>
                <th></th>
                <td class="control"><button class="button" type="submit" id="save">Сохранить</button></td>
              </tr>
            </table>
          </form>
          <div class="settings-delete">Вы также можете <a id="delete">удалить альбом</a>.</div>
          </div>
        </div>
        <div class="error" id="load-error" hidden></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
