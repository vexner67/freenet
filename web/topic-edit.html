<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Редактирование темы | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/topic-edit.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/" aria-label="Freenet"><svg class="logo-mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6"/><path d="M19.4 6.6h-1.8a4 4 0 0 0-4 4V23" stroke-width="4"/><path d="M8.4 13.5h10.6" stroke-width="3.6"/></svg><svg class="logo-word" viewBox="28 0 87 28" aria-hidden="true"><path d="M32.5 23v-7.6a4 4 0 0 1 4-4h1.8M52.9 16.25a4.85 4.85 0 1 0-1.25 3.25M69 16.25a4.85 4.85 0 1 0-1.25 3.25M75.4 9.5V23m0-6.75a4.85 4.85 0 0 1 9.7 0V23M101.2 16.25a4.85 4.85 0 1 0-1.25 3.25M107.6 6.6v10.5a4 4 0 0 0 4 4h1.8" stroke-width="3.8"/><path d="M41.3 16.25h13.5M57.4 16.25h13.5M89.6 16.25h13.5M104.1 11.2h9.3" stroke-width="3.4"/></svg></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Загрузка…</span></div>
      <div class="page-body">
        <div class="error" id="error" hidden></div>
        <div class="notice" id="notice" hidden></div>

        <div id="content" hidden>
          <div class="topic-head">
            <div><b id="topic-title"></b><br><a id="topic-author"></a></div>
          </div>

          <form class="topic-form" id="form">
            <table class="form">
              <tr>
                <th><label for="title-input">Заголовок</label></th>
                <td class="control"><input type="text" id="title-input" maxlength="127" required></td>
              </tr>
              <tr>
                <th>Настройки темы</th>
                <td class="checks">
                  <label id="pinned-label" hidden><input type="checkbox" id="pinned"> Закрепить тему</label>
                  <label id="restricted-label" hidden><input type="checkbox" id="restricted"> Комментировать могут только администраторы</label>
                  <label><input type="checkbox" id="closed"> Закрыть тему</label>
                </td>
              </tr>
              <tr>
                <th><button class="button secondary" type="button" id="delete">Удалить тему</button></th>
                <td class="control"><button class="button" type="submit" id="save">Сохранить</button></td>
              </tr>
            </table>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
