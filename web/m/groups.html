<!doctype html>
<html lang="ru" class="m">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои Группы | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/palette.css">
  <link rel="stylesheet" href="/static/m.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/groups.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-word">freenet</span></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Мои Группы</span></div>
      <div class="page-body">
        <div class="tabs game-tabs" id="tabs" hidden>
          <a id="tab-all" href="/groups">Группы</a>
          <a id="tab-managed" href="/groups?act=managed">Управляемые</a>
        </div>
        <div class="gray-bar" id="gray-bar" hidden>
          <form class="gray-bar-search" action="/search" method="get">
            <input type="hidden" name="section" value="groups">
            <input type="text" name="q" id="search" maxlength="64" placeholder="Найти среди групп" aria-label="Поиск">
          </form>
          <a class="button game-go" id="create" href="/groups/create">Создать группу</a>
        </div>
        <div class="summary-bar" id="summary"></div>
        <div class="error" id="error" hidden></div>
        <div class="clubs-list" id="clubs"></div>
        <p class="hint" id="clubs-none" hidden>Среди показанных групп такой нет.</p>
        <a class="wall-more" id="more" hidden>Показать ещё</a>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p class="footer-languages"><a class="footer-language" href="/language?lg=ru" title="Русский"><img src="/static/flags/ru.gif" alt="Русский"></a><a class="footer-language" href="/language?lg=en" title="English"><img src="/static/flags/gb.gif" alt="English"></a><a href="/language">all languages &raquo;</a></p>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
