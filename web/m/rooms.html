<!doctype html>
<html lang="ru" class="m">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Комнаты | Freenet</title>
  <meta name="description" content="О социальной сети Freenet: для чего она, что в ней можно делать и сколько в ней людей, групп и записей.">
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/palette.css">
  <link rel="stylesheet" href="/static/m.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/rooms-page.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-word">freenet</span></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Комнаты</span></div>
      <div class="page-body">
        <div class="gray-bar"><button class="button" id="create-room" type="button">Создать комнату</button></div>
        <div class="error" id="error" hidden></div>
        <form id="create-room-form" class="container-gray room-form" hidden>
          <h4>Новая комната</h4>
          <label for="room-title">Название</label><input id="room-title" maxlength="64" required>
          <label for="room-kind">Вид</label><select id="room-kind"><option value="talk">разговор</option><option value="watch">кино</option><option value="listen">музыка</option></select>
          <label for="room-access">Кто может войти</label><select id="room-access"><option value="everyone">все желающие</option><option value="friends">друзья</option><option value="link">по ссылке</option></select>
          <label for="room-control">Кто управляет экраном</label><select id="room-control"><option value="owner">только я</option><option value="everyone">все участники</option></select>
          <label class="room-check"><input id="room-permanent" type="checkbox">Постоянная комната</label>
          <button class="button" id="create-submit" type="submit">Создать</button>
        </form>
        <div class="section-title">Сейчас в комнатах</div>
        <div id="rooms-list"></div><p class="hint" id="rooms-empty" hidden>Сейчас нет живых комнат. Создайте комнату и позовите друзей.</p>
        <a id="more" class="wall-more" hidden>Показать ещё</a>
        <section id="permanent-block" hidden><div class="section-title">Мои постоянные комнаты</div><div id="permanent-rooms"></div></section>
        <section id="friends-block" hidden><div class="section-title">Постоянные комнаты друзей</div><div id="friends-rooms"></div></section>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p class="footer-languages"><a class="footer-language" href="/language?lg=ru" title="Русский"><img src="/static/flags/ru.gif" alt="Русский"></a><a class="footer-language" href="/language?lg=en" title="English"><img src="/static/flags/gb.gif" alt="English"></a><a href="/language">all languages &raquo;</a></p>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
