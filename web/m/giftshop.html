<!doctype html>
<html lang="ru" class="m">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Магазин подарков | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/palette.css">
  <link rel="stylesheet" href="/static/m.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/giftshop-page.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-word">freenet</span></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Магазин подарков</span></div>
      <div class="page-body">
        <div class="tabs">
          <a class="active" href="/giftshop">Магазин подарков</a>
          <a id="tab-mine" href="/gifts">Мои подарки</a>
          <a href="/market">Маркет подарков</a>
        </div>
        <div class="error" id="error" hidden></div>
        <div class="shop" id="shop" hidden>
          <div class="shop-side">
            <div class="section-title">Мой баланс</div>
            <table class="info shop-info">
              <tbody>
                <tr><th>Баланс:</th><td><b id="balance"></b></td></tr>
                <tr id="rate-row" hidden><th>Курс:</th><td id="rate"></td></tr>
              </tbody>
            </table>
            <div class="section-title">Мои подарки</div>
            <div class="subtitle"><span id="mine-count"></span><a id="mine-all" href="/gifts">Все</a></div>
            <a class="shop-mine" id="mine" href="/gifts"></a>
          </div>
          <div class="shop-main" id="collections"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p class="footer-languages"><a class="footer-language" href="/language?lg=ru" title="Русский"><img src="/static/flags/ru.gif" alt="Русский"></a><a class="footer-language" href="/language?lg=en" title="English"><img src="/static/flags/gb.gif" alt="English"></a><a href="/language">all languages &raquo;</a></p>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
