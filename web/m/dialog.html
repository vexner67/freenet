<!doctype html>
<html lang="ru" class="m">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сообщения | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/palette.css">
  <link rel="stylesheet" href="/static/m.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/dialog.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/" aria-label="Freenet"><svg class="logo-mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6"/><path d="M19.4 6.6h-1.8a4 4 0 0 0-4 4V23" stroke-width="4"/><path d="M8.4 13.5h10.6" stroke-width="3.6"/></svg><svg class="logo-word" viewBox="28 0 87 28" aria-hidden="true"><path d="M32.5 23v-7.6a4 4 0 0 1 4-4h1.8M52.9 16.25a4.85 4.85 0 1 0-1.25 3.25M69 16.25a4.85 4.85 0 1 0-1.25 3.25M75.4 9.5V23m0-6.75a4.85 4.85 0 0 1 9.7 0V23M101.2 16.25a4.85 4.85 0 1 0-1.25 3.25M107.6 6.6v10.5a4 4 0 0 0 4 4h1.8" stroke-width="3.8"/><path d="M41.3 16.25h13.5M57.4 16.25h13.5M89.6 16.25h13.5M104.1 11.2h9.3" stroke-width="3.4"/></svg></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Мои Сообщения</span><span class="aside" id="dialog-links" hidden><a id="safety-link">Шифрование</a> | <a id="search-link">Поиск по переписке</a></span></div>
      <div class="page-body">
        <div class="error" id="error" hidden></div>
        <div class="notice" id="key-notice" hidden></div>

        <div class="messenger" id="messenger" hidden>
          <div class="im-selection" id="selection" hidden>
            <b id="selection-count"></b>
            <span><a id="selection-forward">Переслать</a> | <a id="selection-delete">Удалить</a> | <a id="selection-cancel">Отмена</a></span>
          </div>
          <div class="messenger-messages" id="messages">
            <p class="hint center" id="empty" hidden>Сообщений пока нет. Напишите первым!</p>
          </div>
          <div class="messenger-typing" id="typing" aria-live="polite"></div>
          <p class="messenger-price" id="price-note" hidden></p>
          <form class="messenger-input" id="form">
            <img class="messenger-avatar" id="my-avatar" src="/static/avatar.svg" alt="">
            <div class="messenger-box">
              <textarea id="text" maxlength="60000" placeholder="Сообщение..." aria-label="Сообщение" enterkeyhint="send"></textarea>
              <div class="reply-to" id="editing" hidden>Редактирование сообщения <a class="reply-cancel" id="editing-cancel" title="Не редактировать">×</a></div>
              <div class="reply-to" id="replying" hidden><span>Ответ на сообщение <b id="replying-name"></b>:</span><span id="replying-text"></span><a class="reply-cancel" id="replying-cancel" title="Не отвечать">×</a></div>
              <div class="attachments" id="photos" hidden></div>
              <div class="doc-attached" id="documents" hidden></div>
              <div class="messenger-buttons">
                <button class="button" type="submit" id="send">Отправить</button>
                <span class="attach-menu attach-up">
                  <a class="attach-toggle">Прикрепить</a>
                  <span class="attach-list">
                    <a class="attach-link attach-photo" id="attach">Фотография</a>
                    <a class="attach-link attach-graffiti" id="graffiti">Граффити</a>
                    <a class="attach-link attach-document" id="doc">Документ</a>
                  </span>
                </span>
                <a class="attach-link" id="stickers-link">Стикеры</a>
              </div>
              <div class="sticker-panel" id="stickers" hidden></div>
              <input type="file" id="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple hidden>
            </div>
            <img class="messenger-avatar" id="peer-avatar" src="/static/avatar.svg" alt="">
          </form>
          <p class="messenger-blocked" id="blocked" hidden></p>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p class="footer-languages"><a class="footer-language" href="/language?lg=ru" title="Русский"><img src="/static/flags/ru.gif" alt="Русский"></a><a class="footer-language" href="/language?lg=en" title="English"><img src="/static/flags/gb.gif" alt="English"></a><a href="/language">all languages &raquo;</a></p>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
