<!doctype html>
<html lang="ru" class="m">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Аудиозаписи | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/palette.css">
  <link rel="stylesheet" href="/static/m.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/audio-page.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-word">freenet</span></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Аудиозаписи</span></div>
      <div class="page-body audio-page">
        <div class="big-player" id="big-player"></div>
        <div class="audios-div">
          <div class="audios-main">
            <form class="audio-search" id="search-form" role="search">
              <input type="search" id="search" placeholder="Поиск аудиозаписей" aria-label="Поиск аудиозаписей">
            </form>
            <div class="error" id="error" hidden></div>
            <div class="playlist-block" id="playlist-head" hidden>
              <div class="playlist-block-cover">
                <img src="/static/song.jpg" alt="Обложка плейлиста">
                <div class="profile-links" id="playlist-tools" hidden>
                  <a class="profile-link" id="playlist-upload">Загрузить аудио</a>
                  <a class="profile-link" id="rename-playlist">Редактировать плейлист</a>
                  <a class="profile-link" id="delete-playlist">Удалить плейлист</a>
                </div>
              </div>
              <div class="playlist-block-info" id="playlist-info">
                <h4 id="playlist-name"></h4>
                <div class="playlist-block-meta" id="playlist-meta"></div>
                <hr>
              </div>
            </div>
            <div class="audio-list audio-page-list" id="audios"></div>
            <div class="playlist-list" id="playlists" hidden></div>
            <div class="content-error" id="empty" hidden><span id="empty-text">Здесь пока нет аудиозаписей.</span></div>
            <a class="wall-more" id="more" hidden>Показать ещё</a>
          </div>
          <div class="audio-tabs" id="tabs">
            <div id="my-links">
              <a id="tab-mine" href="/audio">Моя музыка</a>
              <a id="upload">Загрузить аудио</a>
              <a id="add-link">Добавить по ссылке</a>
              <a id="tab-new" href="/audio?section=new">Новое</a>
              <hr>
              <a id="tab-playlists" href="/audio?section=playlists">Мои плейлисты</a>
              <a id="new-playlist">Новый плейлист</a>
            </div>
            <div id="owner-links" hidden>
              <hr id="owner-line">
              <a id="tab-owner">Музыка пользователя</a>
              <a id="tab-owner-playlists">Плейлисты пользователя</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p class="footer-languages"><a class="footer-language" href="/language?lg=ru" title="Русский"><img src="/static/flags/ru.gif" alt="Русский"></a><a class="footer-language" href="/language?lg=en" title="English"><img src="/static/flags/gb.gif" alt="English"></a><a href="/language">all languages &raquo;</a></p>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
