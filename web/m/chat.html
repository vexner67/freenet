<!doctype html>
<html lang="ru" class="m">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сообщения | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/emoji/emoji.css">
  <link rel="stylesheet" href="/static/palette.css">
  <link rel="stylesheet" href="/static/m.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/chat.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-word">freenet</span></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page im-page">
      <div class="page-title"><span id="title">Сообщения</span></div>
      <div class="page-body">
        <div class="tabs im-tabs">
          <a href="/im">Диалоги</a>
          <a class="active" id="tab-dialog">Просмотр диалогов</a>
          <a id="tab-contact" hidden>Контакт</a>
          <span class="tabs-side"><a id="contact-link">О чате</a> | <a href="/friends">К списку друзей</a></span>
        </div>
        <div class="im-peer-tabs" id="peer-tabs" hidden></div>
        <div class="error" id="error" hidden></div>
        <div class="messenger" id="messenger" hidden>
          <div class="im-actions" id="selection" hidden>
            <span class="im-actions-tabs">
              <a class="im-actions-tab im-actions-count" id="selection-count" title="Снять выделение"></a>
              <a class="im-actions-tab" id="selection-delete">Удалить</a>
              <a class="im-actions-tab" id="selection-reply">Ответить</a>
              <a class="im-actions-tab" id="selection-forward">Переслать</a>
            </span>
          </div>
          <div class="chat-pinned" id="pinned" hidden></div>
          <div class="messenger-messages" id="messages">
            <p class="hint center" id="empty" hidden>Здесь пока нет сообщений.</p>
          </div>
          <div class="messenger-typing" id="typing" aria-live="polite"></div>
          <form class="messenger-input" id="form">
            <img class="messenger-avatar" id="my-avatar" src="/static/avatar.svg" alt="">
            <div class="messenger-box">
              <div class="messenger-field">
                <textarea id="text" maxlength="60000" placeholder="Введите сообщение" aria-label="Сообщение" enterkeyhint="send"></textarea>
                <a class="emoji-entry" id="smileys-link" title="Смайлы"></a>
                <div class="emoji-picker-wrap" id="smileys" hidden>
                  <div class="emoji-picker-scroll"><div class="emoji-picker-groups"></div><div class="sticker-panel" id="stickers" hidden></div></div>
                  <div class="emoji-picker-footer">
                    <a class="emoji-main-tab active" title="Смайлы"><span class="emoji-icon"></span></a>
                    <div class="emoji-tabs-nav"><div class="emoji-category-nav"></div></div>
                    <span class="emoji-tabs-divider"></span>
                    <a class="s-tab" id="stickers-link" title="Стикеры"><span class="sticker-tab-icon"></span></a>
                  </div>
                </div>
              </div>
              <div class="reply-to" id="editing" hidden>Редактирование сообщения <a class="reply-cancel" id="editing-cancel" title="Не редактировать">×</a></div>
              <div class="reply-to" id="replying" hidden><span>Ответ на сообщение <b id="replying-name"></b>:</span><span id="replying-text"></span><a class="reply-cancel" id="replying-cancel" title="Не отвечать">×</a></div>
              <div class="attachments" id="photos" hidden></div>
              <div class="doc-attached" id="documents" hidden></div>
              <div class="audio-list audio-attached" id="audios" hidden></div>
              <div class="messenger-buttons">
                <span class="messenger-buttons-left">
                  <button class="button" type="submit" id="send">Отправить</button>
                  <span class="im-recent-smiles-bar" id="recent-smiles"></span>
                </span>
                <span class="attach-menu attach-up">
                  <a class="attach-toggle">Прикрепить</a>
                  <span class="attach-list">
                    <a class="attach-link attach-photo" id="attach">Фотография</a>
                    <a class="attach-link attach-graffiti" id="graffiti">Граффити</a>
                    <a class="attach-link attach-document" id="doc">Документ</a>
                    <a class="attach-link attach-audio" id="audio">Аудиозапись</a>
                  </span>
                </span>
              </div>
              <input type="file" id="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple hidden>
            </div>
            <img class="messenger-avatar peer-toggler" id="chat-avatar" src="/static/chat.svg" alt="" title="О чате">
          </form>
          <p class="messenger-blocked" id="blocked" hidden></p>
        </div>
        <div class="peer-window" id="contact" hidden></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p class="footer-languages"><a class="footer-language" href="/language?lg=ru" title="Русский"><img src="/static/flags/ru.gif" alt="Русский"></a><a class="footer-language" href="/language?lg=en" title="English"><img src="/static/flags/gb.gif" alt="English"></a><a href="/language">all languages &raquo;</a></p>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
