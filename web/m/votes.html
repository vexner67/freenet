<!doctype html>
<html lang="ru" class="m">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Голоса | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/palette.css">
  <link rel="stylesheet" href="/static/m.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/votes.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-word">freenet</span></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title">Голоса</div>
      <div class="page-body">
        <nav class="tabs" aria-label="Голоса">
          <a id="tab-summary" href="/votes">Голоса</a>
          <a id="tab-transfer" href="/votes?act=transfer">Перевод</a>
          <a id="tab-top-up" href="/votes?act=top-up">Пополнение</a>
        </nav>
        <p id="loading">Загрузка…</p>
        <div class="error" id="error" hidden></div>
        <table class="info" id="summary" hidden>
          <tr><th scope="row">Баланс:</th><td id="votes"></td></tr>
          <tr><th scope="row">Курс:</th><td id="vote-rate"></td></tr>
          <tr><th scope="row">Поступило за 30 дней:</th><td id="income"></td></tr>
          <tr><th scope="row">Списано за 30 дней:</th><td id="expense"></td></tr>
        </table>
        <form class="container-gray votes-form" id="transfer" hidden>
          <table class="info">
            <tr><th scope="row">Баланс:</th><td id="transfer-balance"></td></tr>
            <tr>
              <th scope="row"><label for="transfer-to">Кому:</label></th>
              <td class="recipient-field">
                <input class="text" id="transfer-to" autocomplete="off" required>
                <div class="recipient-options" id="transfer-people" hidden></div>
                <div class="votes-recipient"><div id="transfer-recipient" aria-live="polite"></div></div>
              </td>
            </tr>
            <tr>
              <th scope="row"><label for="transfer-votes">Сколько:</label></th>
              <td>
                <input class="text" id="transfer-votes" type="number" min="1" max="1000000000000000" step="1" inputmode="numeric" required>
                <div class="hint votes-feedback" id="transfer-fee" aria-live="polite"></div>
              </td>
            </tr>
            <tr>
              <th scope="row"><label for="transfer-note">Сообщение:</label></th>
              <td><input class="text" id="transfer-note" maxlength="140"></td>
            </tr>
            <tr><td></td><td><button class="button" type="submit">Перевести</button></td></tr>
          </table>
        </form>
        <form class="container-gray votes-form" id="top-up" hidden>
          <table class="info">
            <tr><th scope="row">Баланс:</th><td id="top-up-balance"></td></tr>
            <tr>
              <th scope="row"><label for="voucher-code">Номер ваучера:</label></th>
              <td>
                <input class="text" id="voucher-code" spellcheck="false" autocomplete="off" aria-describedby="voucher-hint" required>
                <p class="hint" id="voucher-hint">Если у вас есть ваучер, введите его номер</p>
              </td>
            </tr>
            <tr><td></td><td><button class="button" type="submit">Активировать</button></td></tr>
          </table>
        </form>
        <div class="votes-feedback" id="votes-result" role="status" hidden><p class="notice" id="votes-notice" hidden></p></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p class="footer-languages"><a class="footer-language" href="/language?lg=ru" title="Русский"><img src="/static/flags/ru.gif" alt="Русский"></a><a class="footer-language" href="/language?lg=en" title="English"><img src="/static/flags/gb.gif" alt="English"></a><a href="/language">all languages &raquo;</a></p>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
