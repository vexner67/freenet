<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Запись | Freenet</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/post.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-mark">f</span>freenet</a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Загрузка…</span></div>
      <div class="page-body">
        <div class="error" id="error" hidden></div>

        <div id="content" hidden>
          <div id="post"></div>

          <div class="section-title">Комментарии<span class="count" id="comments-count"></span></div>
          <div class="error" id="comments-error" hidden></div>
          <div id="comments"></div>
          <p class="hint" id="comments-empty" hidden>Комментариев пока нет.</p>
          <a class="wall-more" id="comments-more" hidden>Показать следующие комментарии</a>
          <p class="hint" id="comments-closed" hidden>Комментарии к этой записи закрыты.</p>

          <form class="wall-form comment-form" id="comment-form" hidden>
            <textarea id="comment-text" maxlength="60000" placeholder="Ваш комментарий..." aria-label="Новый комментарий"></textarea>
            <div class="reply-to" id="comment-reply-to" hidden>Ответ на комментарий <a class="reply-cancel" id="comment-reply-cancel" title="Не отвечать">×</a></div>
            <div class="attachments" id="comment-photos" hidden></div>
            <div class="row">
              <span>
                <a class="attach-link" id="comment-attach">Прикрепить фотографию</a>
                <span class="hint" id="comment-counter"></span>
              </span>
              <button class="button" type="submit" id="comment-submit">Отправить</button>
            </div>
            <div class="post-options">
              <label id="comment-from-club-label" hidden><input type="checkbox" id="comment-from-club"> От имени сообщества</label>
            </div>
            <input type="file" id="comment-file" accept="image/jpeg,image/png,image/gif,image/webp" multiple hidden>
          </form>
          <p class="hint comment-hint" id="comment-hint" hidden></p>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/">о сайте</a><a href="/">правила</a><a href="/">помощь</a>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
