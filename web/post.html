<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Запись | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/post.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/" aria-label="Freenet"><svg class="logo-mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6"/><path d="M19.4 6.6h-1.8a4 4 0 0 0-4 4V23" stroke-width="4"/><path d="M8.4 13.5h10.6" stroke-width="3.6"/></svg><svg class="logo-word" viewBox="28 0 102 28" aria-hidden="true"><path d="M35.6 22V9M35.6 13.5a4.5 4.5 0 0 1 4.5-4.5h1.6M47.3 15.5h13a6.5 6.5 0 1 0-1.9 4.6M65.9 15.5h13a6.5 6.5 0 1 0-1.9 4.6M84.5 22V9M84.5 14a5 5 0 0 1 10 0V22M100.1 15.5h13a6.5 6.5 0 1 0-1.9 4.6M122 4.5V18a4 4 0 0 0 4 4h1.5M118.6 9h8"/></svg></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Загрузка…</span></div>
      <div class="page-body">
        <div class="error" id="error" hidden></div>

        <div id="content" hidden>
          <div id="post"></div>

          <div class="section-title">Комментарии<span class="count" id="comments-count"></span></div>
          <div class="error" id="comments-error" hidden></div>
          <p class="hint" id="comments-closed" hidden>Комментарии к этой записи закрыты.</p>

          <form class="wall-form comment-form" id="comment-form" hidden>
            <textarea id="comment-text" maxlength="60000" placeholder="Ваш комментарий..." aria-label="Новый комментарий"></textarea>
            <div class="reply-to" id="comment-reply-to" hidden>Ответ на комментарий <a class="reply-cancel" id="comment-reply-cancel" title="Не отвечать">×</a></div>
            <div class="attachments" id="comment-photos" hidden></div>
            <div class="row">
              <span>
                <span class="attach-menu">
                  <a class="attach-toggle">Прикрепить</a>
                  <span class="attach-list">
                    <a class="attach-link attach-photo" id="comment-attach">Фотография</a>
                    <a class="attach-link attach-graffiti" id="comment-graffiti">Граффити</a>
                  </span>
                </span>
                <span class="hint" id="comment-counter"></span>
              </span>
              <button class="button" type="submit" id="comment-submit">Отправить</button>
            </div>
            <div class="post-options">
              <label id="comment-from-club-label" hidden><input type="checkbox" id="comment-from-club"> От имени сообщества</label>
            </div>
            <input type="file" id="comment-file" accept="image/jpeg,image/png,image/gif,image/webp" multiple hidden>
          </form>
          <p class="hint comment-hint" id="comment-hint" hidden></p>
          <div id="comments"></div>
          <p class="hint" id="comments-empty" hidden>Комментариев пока нет.</p>
          <a class="wall-more" id="comments-more" hidden>Показать следующие комментарии</a>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
