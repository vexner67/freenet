<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои Сообщения | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/im.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-mark">f</span>freenet</a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span>Мои Сообщения</span><a class="aside" id="new-chat">Новая беседа</a></div>
      <div class="page-body">
        <div class="tabs">
          <a class="active" id="tab-all" href="/im">Все сообщения</a>
          <a id="tab-search" hidden>Поиск</a>
        </div>
        <form class="search-form" id="search" method="get" action="/im">
          <input type="hidden" name="peer" id="search-peer" disabled>
          <input type="hidden" name="chat" id="search-chat" disabled>
          <input type="text" name="q" id="search-text" maxlength="100" autocomplete="off" placeholder="Поиск по сообщениям" aria-label="Поиск по сообщениям">
          <button class="button" type="submit">Поиск</button>
        </form>
        <div class="error" id="error" hidden></div>
        <p class="hint" id="search-hint" hidden>Найдены сообщения бесед. Сообщения диалогов зашифрованы, и сервер их не читает: искать в диалоге можно со страницы диалога — «Поиск по переписке».</p>
        <div class="dialogs" id="dialogs"></div>
        <p class="hint center" id="empty" hidden>Никто Вам не писал, пока что.</p>
        <a class="wall-more" id="more" hidden>Показать ещё</a>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
