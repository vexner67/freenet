<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Фотография | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/mobile.css" media="(max-width: 800px)">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/photo-page.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/" aria-label="Freenet"><svg class="logo-mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6"/><path d="M19.4 6.6h-1.8a4 4 0 0 0-4 4V23" stroke-width="4"/><path d="M8.4 13.5h10.6" stroke-width="3.6"/></svg><svg class="logo-word" viewBox="28 0 87 28" aria-hidden="true"><path d="M32.5 23v-7.6a4 4 0 0 1 4-4h1.8M52.9 16.25a4.85 4.85 0 1 0-1.25 3.25M69 16.25a4.85 4.85 0 1 0-1.25 3.25M75.4 9.5V23m0-6.75a4.85 4.85 0 0 1 9.7 0V23M101.2 16.25a4.85 4.85 0 1 0-1.25 3.25M107.6 6.6v10.5a4 4 0 0 0 4 4h1.8" stroke-width="3.8"/><path d="M41.3 16.25h13.5M57.4 16.25h13.5M89.6 16.25h13.5M104.1 11.2h9.3" stroke-width="3.4"/></svg></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Загрузка…</span></div>
      <div class="page-body">
        <div class="error" id="error" hidden></div>
        <div class="photo-page" id="content" hidden>
          <div class="photo-page-image"><img id="image" alt=""></div>
          <div class="photo-page-details">
            <div class="photo-page-description">
              <p class="photo-page-text" id="description" hidden></p>
              <div class="hint photo-page-meta">Дата загрузки: <span id="uploaded-at"></span><span id="photo-like"></span></div>
            </div>
            <hr>
            <div class="photo-page-columns">
              <div class="photo-page-main">
                <div class="section-title" id="comments-title">Комментарии</div>
                <div class="error" id="comments-error" hidden></div>
                <form class="wall-form comment-form" id="comment-form" hidden>
                  <textarea id="comment-text" maxlength="60000" placeholder="Ваш комментарий..." aria-label="Комментарий"></textarea>
                  <div class="reply-to" id="comment-reply-to" hidden>Ответ на комментарий <a class="reply-cancel" id="comment-reply-cancel" title="Не отвечать">×</a></div>
                  <div class="row"><span></span><button class="button" type="submit">Отправить</button></div>
                </form>
                <div id="comments"></div>
                <a class="wall-more" id="comments-more" hidden>Показать ещё</a>
              </div>
              <div class="photo-page-actions">
                <a class="photo-page-author" id="author"><img id="author-avatar" alt=""><b id="author-name"></b></a>
                <a class="profile-link" id="edit" hidden>Редактировать</a>
                <a class="profile-link" id="delete" hidden>Удалить</a>
                <a class="profile-link" id="cover" hidden>Сделать обложкой альбома</a>
                <a class="profile-link" id="move" hidden>Перенести в альбом</a>
                <a class="profile-link" id="original" target="_blank" rel="noopener">Открыть оригинал</a>
                <a class="profile-link" id="share" hidden>Поделиться</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p class="footer-languages"><a class="footer-language" href="/language?lg=ru" title="Русский"><img src="/static/flags/ru.gif" alt="Русский"></a><a class="footer-language" href="/language?lg=en" title="English"><img src="/static/flags/gb.gif" alt="English"></a><a href="/language">all languages &raquo;</a></p>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
