<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Создать встречу | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/event-create.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-mark">f</span>freenet</a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Создать встречу</span></div>
      <div class="page-body">
        <form id="form">
          <div class="error" id="error" hidden></div>
          <div class="section-title">Создать встречу</div>
          <table class="form">
            <tr>
              <th><label class="required" for="name">Название</label></th>
              <td class="control"><input type="text" id="name" maxlength="64" required></td>
            </tr>
            <tr>
              <th><label for="description">Описание</label></th>
              <td class="control"><textarea id="description" maxlength="1000" rows="5"></textarea></td>
            </tr>
            <tr>
              <th><label class="required" for="start-date">Начало</label></th>
              <td class="control">
                <input type="date" class="half" id="start-date" required aria-label="Дата начала">
                <input type="time" class="half" id="start-time" required aria-label="Время начала">
              </td>
            </tr>
            <tr>
              <th><label for="has-end">Окончание</label></th>
              <td class="control">
                <label><input type="checkbox" id="has-end"> Указать дату окончания</label>
                <div id="end" hidden>
                  <input type="date" class="half" id="end-date" aria-label="Дата окончания">
                  <input type="time" class="half" id="end-time" aria-label="Время окончания">
                </div>
              </td>
            </tr>
            <tr>
              <th></th>
              <td class="control"><button class="button" type="submit" id="submit">Создать</button></td>
            </tr>
          </table>
        </form>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
