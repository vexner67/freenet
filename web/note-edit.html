<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Заметка | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/note-edit.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-mark">f</span>freenet</a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Загрузка…</span></div>
      <div class="page-body">
        <div class="error" id="error" hidden></div>
        <form class="note-form" id="form" hidden>
          <table class="form">
            <tr>
              <th><label for="note-title">Название</label></th>
              <td class="control"><input type="text" id="note-title" maxlength="256" required></td>
            </tr>
            <tr>
              <th><label for="note-text">Содержание</label></th>
              <td class="control"><textarea id="note-text" maxlength="60000" required></textarea></td>
            </tr>
            <tr>
              <th></th>
              <td class="control">
                <button class="button" type="submit" id="submit">Сохранить</button>
                <a class="button secondary" id="cancel" hidden>Отмена</a>
              </td>
            </tr>
          </table>
        </form>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
