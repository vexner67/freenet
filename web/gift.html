<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=820">
  <title>Подарок | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#3e3e3e">
  <link rel="stylesheet" href="/static/palette.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <script type="module" src="/static/gift-page.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-word">freenet</span></a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span id="title">Загрузка…</span></div>
      <div class="page-body">
        <div class="tabs" id="tabs" hidden>
          <a id="tab-owner" hidden></a>
          <a href="/market">Маркет</a>
          <a href="/market?tab=auctions">Аукционы</a>
        </div>
        <div class="error" id="error" hidden></div>
        <div class="notice" id="notice" hidden></div>
        <div class="collectible-page" id="gift" hidden>
          <div class="collectible-side" id="card"></div>
          <div class="collectible-info">
            <h2 class="collectible-title" id="name"></h2>
            <table class="collectible-traits"><tbody id="traits"></tbody></table>
            <div id="deal"></div>
          </div>
        </div>
        <div id="actions" hidden>
          <div class="section-title">Ваш подарок</div>
          <div class="container-gray collectible-actions" id="action-forms"></div>
        </div>
        <div class="section-title" id="history-title" hidden>История</div>
        <div id="history"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p class="footer-languages"><a class="footer-language" href="/language?lg=ru" title="Русский"><img src="/static/flags/ru.gif" alt="Русский"></a><a class="footer-language" href="/language?lg=en" title="English"><img src="/static/flags/gb.gif" alt="English"></a><a href="/language">all languages &raquo;</a></p>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
