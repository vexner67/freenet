<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Новости | Freenet</title>
  <link rel="icon" href="/static/favicon.png" sizes="32x32">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/feed.js"></script>
</head>
<body>
<div class="layout">
  <div class="header">
    <a class="logo" href="/"><span class="logo-mark">f</span>freenet</a>
    <nav class="header-links" id="header-links"></nav>
  </div>

  <div class="columns">
    <div class="sidebar">
      <nav class="menu" id="menu"></nav>
    </div>

    <div class="page">
      <div class="page-title"><span>Новости</span></div>
      <div class="page-body">
        <div class="tabs">
          <a id="tab-mine" href="/feed">Мои новости</a>
          <a id="tab-all" href="/feed/all">Все новости</a>
        </div>
        <div class="error" id="error" hidden></div>
        <div id="posts"></div>
        <p class="hint" id="empty-all" hidden>Тут ничего нет... Пока...</p>
        <div class="notice" id="empty" hidden>
          <b>Здесь пока пусто.</b> В новостях появляются записи тех, на кого вы подписаны, и ваши.
          Откройте страницу друга по адресу <b id="example-url"></b> и нажмите «Подписаться».
        </div>
        <a class="wall-more" id="more" hidden>Показать предыдущие записи</a>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/about">о сайте</a><a href="/terms">правила</a><a href="/help">помощь</a>
    <p>Freenet © 2026</p>
  </div>
</div>
</body>
</html>
