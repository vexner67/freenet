# Production on top of compose.yaml (the server's .env sets COMPOSE_FILE to
# both and COMPOSE_PROFILES=app, so a plain `docker compose` there means
# this):
#
# - the services run the images CI built and pushed to GHCR, tagged with
#   the commit (FREENET_TAG, which deploy/deploy.sh sets), not local builds;
# - nothing but Caddy is published: Docker writes its own iptables rules
#   past ufw, so a published database port would be open to the internet.
#   Prometheus, Alertmanager and Grafana stay on 127.0.0.1, for an SSH
#   tunnel;
# - Caddy terminates HTTP(S) in front of the gateway: SITE_ADDRESS is the
#   domain once there is one (Caddy then gets and renews its certificate
#   itself), ":80" until then; REDIRECT_ADDRESS (www.<domain>) leads there.

# Eight databases share a small server: a few connections each (a service
# pools at most a handful) and small buffers.
x-postgres: &postgres
  ports: !reset []
  command: [postgres, -c, shared_buffers=32MB, -c, max_connections=30, -c, work_mem=2MB, -c, maintenance_work_mem=16MB]

services:
  auth-postgres: *postgres
  user-postgres: *postgres
  post-postgres: *postgres
  notification-postgres: *postgres
  message-postgres: *postgres
  club-postgres: *postgres
  federation-postgres: *postgres
  redis: { ports: !reset [] }

  notification:
    image: ghcr.io/vexner67/freenet-notification:${FREENET_TAG:?set FREENET_TAG}
    build: !reset null
  message:
    image: ghcr.io/vexner67/freenet-message:${FREENET_TAG:?set FREENET_TAG}
    build: !reset null
    environment:
      TURN_URLS: stun:${TURN_HOST:-localhost}:3478,turn:${TURN_HOST:-localhost}:3478?transport=udp,turn:${TURN_HOST:-localhost}:3478?transport=tcp
  club:
    image: ghcr.io/vexner67/freenet-club:${FREENET_TAG:?set FREENET_TAG}
    build: !reset null
  federation:
    image: ghcr.io/vexner67/freenet-federation:${FREENET_TAG:?set FREENET_TAG}
    build: !reset null
    environment:
      PUBLIC_URL: https://${SITE_ADDRESS}
  user:
    image: ghcr.io/vexner67/freenet-user:${FREENET_TAG:?set FREENET_TAG}
    build: !reset null
  post:
    image: ghcr.io/vexner67/freenet-post:${FREENET_TAG:?set FREENET_TAG}
    build: !reset null
  media:
    image: ghcr.io/vexner67/freenet-media:${FREENET_TAG:?set FREENET_TAG}
    build: !reset null
  auth:
    image: ghcr.io/vexner67/freenet-auth:${FREENET_TAG:?set FREENET_TAG}
    build: !reset null
    environment:
      # Codes go to `docker compose logs auth` (console), to the Telegram
      # chat of the alerts (telegram, with TELEGRAM_* of the server's
      # .env) or by mail (smtp, with SMTP_*): MAILER in the server's .env.
      MAILER: ${MAILER:-console}
      CAPTCHA_REQUIRED: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

  gateway:
    image: ghcr.io/vexner67/freenet-gateway:${FREENET_TAG:?set FREENET_TAG}
    build: !reset null
    ports: !reset []
    environment:
      # Caddy sets X-Forwarded-For and X-Request-ID.
      TRUST_FORWARDED_FOR: "true"

  grafana:
    environment:
      # Never the default: deploy/deploy.sh writes one into .env.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}

  # Who is notified comes from the server's .env (deploy/alertmanager.sh).
  alertmanager:
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  caddy:
    profiles: [app]
    image: caddy:2.10.2
    restart: unless-stopped
    # As the services in compose.yaml: its lines say they are Caddy's.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
        labels: com.docker.compose.service
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      REDIRECT_ADDRESS: ${REDIRECT_ADDRESS:-:8081}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway: { condition: service_healthy }

  # TURN relays a call only when two browsers cannot reach each other. It
  # carries packets already encrypted between them. It sits on a network of
  # its own and refuses private addresses, so a relay never reaches inside.
  #
  # When both browsers relay, one relay sends to the other at the public
  # address of this server. From inside Docker's bridge that packet comes
  # back through Docker's proxy with the bridge's address as its sender, and
  # the other relay, which lets in only the public one, drops it: the call
  # rings, is answered and never connects. So coturn has a fixed address on
  # its network, and external-ip maps the public address to it: a relay
  # sends to the other one straight inside the container. That one private
  # address is the only one let in.
  coturn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    networks:
      calls: { ipv4_address: 172.31.250.10 }
    command:
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-}
      - --realm=freenet
      - --listening-ip=172.31.250.10
      - --relay-ip=172.31.250.10
      - --external-ip=${TURN_HOST:-127.0.0.1}/172.31.250.10
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49260
      - --no-tls
      - --no-dtls
      - --no-cli
      - --no-tcp-relay
      - --no-multicast-peers
      - --no-software-attribute
      - --user-quota=12
      - --total-quota=400
      - --allowed-peer-ip=172.31.250.10
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49260:49160-49260/udp"

networks:
  # A network of its own with a fixed range for the fixed address above;
  # the range is the last of those Docker gives out by itself, so no other
  # network of this server is likely to have taken it.
  calls:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  caddy_data:
  caddy_config:
